<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>(function(){var e=false;try{e=window.top!==window}catch(x){e=true}if(e)document.documentElement.classList.add("embedded")})()</script><style>html.embedded nav.switch{display:none!important}</style>
<title>Luyện ISTQB CTFL 4.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cùng bộ với "Luyện SQL qua ticket QC" — mục lục chương bên trái, nội dung học / làm bài ở giữa, cột đọc ~70 ký tự. */
:root{
  --bg:#f8f4f6; --surface:#ffffff; --sunken:#f1e9ed; --ink:#22161c; --muted:#6b5a63; --line:#e6d9df;
  --accent:#c2185b; --accent-ink:#ffffff; --accent-soft:#fce4ec;
  --pass:#1d7a46; --pass-soft:#e1f3e7; --fail:#b3261e; --fail-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fbf0d6;
  --code-bg:#fbf8f9; --kw:#ad1457; --str:#9a4b00; --num:#1d7a46; --cmt:#7c8296;
  --f-display:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151013; --surface:#1d161a; --sunken:#100c0e; --ink:#efe6ea; --muted:#ab99a2; --line:#352a30;
  --accent:#f48fb1; --accent-ink:#2a0a17; --accent-soft:#3d1a29;
  --pass:#5fd08e; --pass-soft:#163322; --fail:#ff8a80; --fail-soft:#3a1a18; --warn:#f0c35a; --warn-soft:#352a12;
  --code-bg:#171114; --kw:#f8a5c2; --str:#f0b070; --num:#5fd08e; --cmt:#767d8f; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151013; --surface:#1d161a; --sunken:#100c0e; --ink:#efe6ea; --muted:#ab99a2; --line:#352a30;
  --accent:#f48fb1; --accent-ink:#2a0a17; --accent-soft:#3d1a29;
  --pass:#5fd08e; --pass-soft:#163322; --fail:#ff8a80; --fail-soft:#3a1a18; --warn:#f0c35a; --warn-soft:#352a12;
  --code-bg:#171114; --kw:#f8a5c2; --str:#f0b070; --num:#5fd08e; --cmt:#767d8f; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6;display:flex;flex-direction:column}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
code,pre{font-family:var(--f-mono)}
code{font-size:.9em;background:var(--sunken);padding:1px 5px;border-radius:4px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.bar{width:120px;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.switch{display:flex;gap:2px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.sw{padding:4px 12px;border-radius:6px;font-size:12.5px;font-weight:500;text-decoration:none;color:var(--muted);white-space:nowrap}
a.sw:hover{background:var(--sunken);color:var(--ink)}
.sw.cur{background:var(--accent);color:var(--accent-ink)}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:4px 8px;font-size:12px}

.app{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr)}
.pane{min-height:0;overflow:auto}
.nav{border-right:1px solid var(--line);background:var(--surface);padding:12px 10px 24px;display:flex;flex-direction:column;gap:2px}
.nav h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.nitem{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:6px}
.nitem:hover{background:var(--sunken)}
.nitem[aria-current="true"]{background:var(--accent-soft)}
.nitem .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center}
.nitem .nm{font-size:13.5px;line-height:1.35}
.nitem .nm small{display:block;color:var(--muted);font-size:11.5px}
.nitem .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.nitem .cnt.full{color:var(--pass)}

.main{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:780px;margin:0 auto}
.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-bottom:4px}
.h-title{font-size:24px;font-weight:700;line-height:1.3;margin-bottom:4px}
.h-sub{color:var(--muted);margin:0 0 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 16px;font-weight:500;font-size:13.5px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:10px}
.th{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.th summary{cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}
.th summary::-webkit-details-marker{display:none}
.th summary::before{content:"▸";color:var(--muted);font-size:12px;transition:transform .15s}
.th[open] summary::before{transform:rotate(90deg)}
.th summary b{font-family:var(--f-display);font-weight:600;font-size:15px}
.th summary i{font-style:normal;color:var(--muted);font-size:12.5px}
.th summary .lo{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.th-body{padding:0 16px 14px 34px;display:flex;flex-direction:column;gap:10px}
.th-body p,.th-body ul,.th-body ol{margin:0}
.th-body ul,.th-body ol{padding-left:20px;display:flex;flex-direction:column;gap:3px}
.box{border-radius:8px;padding:9px 12px;font-size:13.5px}
.box b.lbl{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.box.ex{background:var(--accent-soft)} .box.ex b.lbl{color:var(--accent)}
.box.trap{background:var(--warn-soft)} .box.trap b.lbl{color:var(--warn)}

.term-search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:12px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.term-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.term-h b{font-family:var(--f-display);font-weight:600;font-size:15px}
.term-h i{font-style:normal;color:var(--accent);font-size:13px;font-weight:500}
.term-h .chip{margin-left:auto}
.term p{margin:0;font-size:13.5px}
.term-ex{color:var(--muted)}
.term .term-src{font-size:12px;color:var(--accent)}
.term-ex b{color:var(--ink);font-weight:600}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.qdot{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center}
.qdot.ok{background:var(--pass-soft);border-color:var(--pass);color:var(--pass)}
.qdot.no{background:var(--fail-soft);border-color:var(--fail);color:var(--fail)}
.qdot.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qdot.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.qdot[aria-current="true"]{outline:2px solid var(--ink);outline-offset:1px}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qtext{font-size:15.5px;line-height:1.6;margin-bottom:14px}
.qtext .tbl-wrap{margin:8px 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .L{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:12px;font-family:var(--f-mono)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--pass);background:var(--pass-soft)}
.opt.right .L{background:var(--pass);border-color:var(--pass);color:var(--surface)}
.opt.wrong{border-color:var(--fail);background:var(--fail-soft)}
.opt.wrong .L{background:var(--fail);border-color:var(--fail);color:var(--surface)}
.opt:disabled{cursor:default}
.opt .why{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.opt.right .why,.opt.wrong .why{color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 14px;font-weight:500;font-size:13.5px}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.spacer{flex:1}
.verdict{border-radius:8px;padding:10px 14px;margin-top:14px;font-weight:600}
.verdict.ok{background:var(--pass-soft);color:var(--pass)}
.verdict.no{background:var(--fail-soft);color:var(--fail)}
.reflink{font-size:13px;color:var(--muted);margin-top:8px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:13px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-width:100%}
table.res{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%}
table.res th,table.res td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
table.res th{background:var(--sunken);font-weight:600;font-size:12.5px}
table.res tr:last-child td{border-bottom:0}
table.res td.num{text-align:right;font-family:var(--f-mono)}
pre.syn{margin:8px 0;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;font-size:13px;line-height:1.55;white-space:pre}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12.5px}
.sec{margin-top:22px}
.sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:1100px){.sets{grid-template-columns:repeat(4,minmax(0,1fr))}}
.setcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.setcard:hover{border-color:var(--accent);background:var(--accent-soft)}
.setcard b{font-family:var(--f-display);font-size:15px}
.setcard span{color:var(--muted);font-size:12.5px}
.setcard .best{color:var(--pass);font-weight:600}
.sec h3{font-size:15px;margin-bottom:8px}
.doclist{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.doc a{font-weight:600}
.doc span{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:13px}
.timer{font-family:var(--f-mono);font-size:15px;font-weight:500;padding:4px 10px;border-radius:7px;background:var(--sunken)}
.timer.low{background:var(--fail-soft);color:var(--fail)}
.result-big{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.pass-tag{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:600;font-size:13px}
.pass-tag.ok{background:var(--pass-soft);color:var(--pass)} .pass-tag.no{background:var(--fail-soft);color:var(--fail)}
.meter{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--accent)}
.rv{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px}
.rv .qtext{font-size:14.5px;margin-bottom:8px}
.rv-ans{font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.rv-ans .u{color:var(--fail)} .rv-ans .c{color:var(--pass)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:13.5px}

@media (max-width:860px){
  html,body{height:auto}
  .app{display:block}
  .pane{overflow:visible}
  .nav{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;padding:8px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  .nav h2{display:none}
  .nitem{flex:0 0 auto;width:auto;grid-template-columns:auto auto;padding:6px 10px}
  .nitem .nm small,.nitem .cnt{display:none}
  .nitem .no{text-align:left}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .th-body{padding-left:16px}
  .bar{width:70px}
  .h-title{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ===================== Lý thuyết theo chương (viết lại theo syllabus CTFL 4.0) ===================== */
const CHAPTERS = [
{ ch:1, name:'Nền tảng kiểm thử', en:'Fundamentals of Testing', exam:8, time:'180 phút',
  theory:[
  { k:'Mục tiêu kiểm thử', en:'Test objectives', lo:'FL-1.1.1',
    d:`<p>Kiểm thử không chỉ để "tìm bug". Các mục tiêu điển hình:</p><ul><li>Đánh giá sản phẩm công việc: yêu cầu, user story, thiết kế, code.</li><li>Phát hiện các sự cố (failure) và tìm lỗi (defect).</li><li>Đạt độ bao phủ cần thiết của đối tượng kiểm thử.</li><li>Giảm rủi ro chất lượng kém.</li><li>Kiểm tra yêu cầu đã được đáp ứng; kiểm tra tuân thủ hợp đồng, pháp lý, quy định.</li><li>Cung cấp thông tin để các bên liên quan ra quyết định.</li><li>Xây dựng niềm tin vào chất lượng.</li><li>Thẩm định (validate) đối tượng hoàn chỉnh và chạy đúng như các bên mong đợi.</li></ul>`,
    ex:'Trước khi release, báo cáo "đã chạy 320/320 case, còn 2 bug Medium" là đang phục vụ mục tiêu cung cấp thông tin để PO quyết định có release hay không.',
    trap:'Đáp án "chứng minh phần mềm không còn lỗi" luôn sai, vì kiểm thử chỉ chứng minh được là có lỗi (nguyên tắc 1).' },
  { k:'Kiểm thử và gỡ lỗi', en:'Testing vs Debugging', lo:'FL-1.1.2',
    d:`<p><b>Kiểm thử</b> làm lộ ra sự cố (kiểm thử động) hoặc tìm thẳng lỗi (kiểm thử tĩnh).</p><p><b>Gỡ lỗi (debugging)</b> là việc của dev: tái hiện sự cố → chẩn đoán, tìm nguyên nhân → sửa.</p><p>Sau khi sửa, tester chạy <b>kiểm thử xác nhận</b> (confirmation testing), thường kèm <b>kiểm thử hồi quy</b> (regression testing).</p>`,
    ex:'QC báo "bấm Thanh toán ra lỗi 500" là kiểm thử. Dev đọc log, tìm ra null pointer và sửa là gỡ lỗi. QC chạy lại case đó là kiểm thử xác nhận.',
    trap:'Kiểm thử tĩnh (rà soát) tìm thẳng ra lỗi mà không cần gỡ lỗi để chẩn đoán.' },
  { k:'Sai sót, Lỗi, Sự cố, và Nguyên nhân gốc rễ', en:'Error, Defect, Failure, Root cause', lo:'FL-1.2.3',
    d:`<p>Con người mắc <b>sai sót (error / mistake)</b> → tạo ra <b>lỗi (defect / fault / bug)</b> trong code hoặc tài liệu → khi chạy, lỗi có thể gây ra <b>sự cố (failure)</b>: hệ thống làm sai điều cần làm.</p><p><b>Nguyên nhân gốc rễ (root cause)</b> là lý do cơ bản khiến vấn đề xảy ra, ví dụ spec mơ hồ hoặc thiếu đào tạo. Sửa nguyên nhân gốc rễ giúp tránh các lỗi tương tự về sau.</p><p>Sự cố cũng có thể đến từ điều kiện môi trường (bức xạ, từ trường), không chỉ từ lỗi.</p>`,
    ex:'Dev hiểu nhầm quy tắc làm tròn (sai sót) → viết sai hàm làm tròn (lỗi) → khách thấy tổng tiền lệch 100đ (sự cố). Nguyên nhân gốc rễ: spec không ghi quy tắc làm tròn.',
    trap:'Không phải lỗi nào cũng gây sự cố: đoạn code sai nằm trong nhánh không bao giờ chạy tới thì không gây sự cố.' },
  { k:'Kiểm thử và đảm bảo chất lượng', en:'Testing vs QA', lo:'FL-1.2.2',
    d:`<p><b>Kiểm thử</b> là một dạng <b>kiểm soát chất lượng (QC)</b>: hướng vào <b>sản phẩm</b>, mang tính <b>khắc phục</b> (tìm ra để sửa).</p><p><b>Đảm bảo chất lượng (QA)</b> hướng vào <b>quy trình</b>, mang tính <b>phòng ngừa</b>: quy trình tốt thì sản phẩm tốt. QA là trách nhiệm của mọi người trong dự án.</p><p>Kết quả kiểm thử được dùng cho cả hai: QC dùng để sửa lỗi, QA dùng để biết quy trình có hiệu quả không.</p>`,
    ex:'Viết thêm case cho module thanh toán là QC. Đưa quy định "mọi spec phải được rà soát trước khi code" vào quy trình là QA.',
    trap:'QA không phải "tên khác của tester". Đề thi hay gài đáp án coi QA và kiểm thử là một.' },
  { k:'Bảy nguyên tắc kiểm thử', en:'Seven testing principles', lo:'FL-1.3.1',
    d:`<ol><li><b>Kiểm thử cho thấy sự tồn tại của lỗi, chứ không phải sự vắng mặt của lỗi.</b></li><li><b>Kiểm thử vét cạn là không thể</b> (exhaustive testing): phải chọn lọc bằng kỹ thuật, ưu tiên, rủi ro.</li><li><b>Kiểm thử sớm giúp tiết kiệm thời gian và chi phí</b> (shift left).</li><li><b>Lỗi có xu hướng tập trung</b>: số ít module chứa phần lớn lỗi (nguyên lý Pareto).</li><li><b>Test case giảm hiệu quả theo thời gian</b> (tests wear out): lặp lại mãi một bộ test thì ngày càng ít tìm được lỗi mới.</li><li><b>Kiểm thử phụ thuộc vào ngữ cảnh</b>: app y tế khác app game.</li><li><b>Ngộ nhận về việc không có lỗi</b> (absence-of-defects fallacy): hết lỗi nhưng không đáp ứng nhu cầu người dùng thì vẫn thất bại.</li></ol>`,
    ex:'Bộ regression 6 tháng không bắt được lỗi mới nào trong khi khách vẫn báo bug: đó là nguyên tắc 5, cần cập nhật và bổ sung test.',
    trap:'Phân biệt 5 và 4: "test cũ không còn tìm ra lỗi" là nguyên tắc 5; "lỗi dồn vào một chỗ" là nguyên tắc 4.' },
  { k:'Các hoạt động kiểm thử', en:'Test activities', lo:'FL-1.4.1',
    d:`<ul><li><b>Lập kế hoạch</b> (planning): mục tiêu, cách tiếp cận.</li><li><b>Giám sát kiểm thử và kiểm soát kiểm thử</b> (monitoring &amp; control): so tiến độ với kế hoạch, điều chỉnh khi lệch.</li><li><b>Phân tích</b> (analysis): xác định <b>cần test cái gì</b>, tức khía cạnh kiểm thử (test conditions), từ cơ sở kiểm thử; tìm lỗi trong cơ sở kiểm thử.</li><li><b>Thiết kế</b> (design): xác định <b>test như thế nào</b>: test case, hạng mục bao phủ, dữ liệu test, môi trường.</li><li><b>Triển khai</b> (implementation): tạo sản phẩm kiểm thử cho thực thi: trình tự thực hiện kiểm thử, bộ test case, lịch thực thi, dữ liệu, môi trường.</li><li><b>Thực thi</b> (execution): chạy test, so kết quả thực tế với mong đợi, báo cáo lỗi.</li><li><b>Hoàn tất</b> (completion): lưu trữ sản phẩm kiểm thử, đóng môi trường, rút kinh nghiệm, viết báo cáo hoàn tất kiểm thử.</li></ul>`,
    ex:'"Kiểm tra luồng hoàn tiền" là khía cạnh kiểm thử (phân tích). "Hủy đơn đã trả 447.000đ → hoàn đúng 447.000đ" là test case (thiết kế). Gom các case thành bộ "Regression thanh toán" và xếp lịch chạy tối thứ Sáu là triển khai.',
    trap:'Câu hỏi "cần test cái gì" là phân tích; "test như thế nào" là thiết kế; "chuẩn bị mọi thứ để chạy" là triển khai.' },
  { k:'Sản phẩm kiểm thử và khả năng truy vết', en:'Testware & Traceability', lo:'FL-1.4.3, FL-1.4.4',
    d:`<p><b>Sản phẩm kiểm thử (sản phẩm kiểm thử)</b> là mọi sản phẩm của các hoạt động kiểm thử: kế hoạch, khía cạnh kiểm thử, test case, dữ liệu, script, báo cáo lỗi, báo cáo hoàn tất kiểm thử…</p><p><b>Khả năng truy vết (traceability)</b> là liên kết giữa cơ sở kiểm thử và sản phẩm kiểm thử (yêu cầu ↔ test case ↔ kết quả ↔ lỗi). Truy vết giúp đánh giá độ bao phủ, phân tích ảnh hưởng khi yêu cầu thay đổi, phục vụ kiểm toán và làm báo cáo dễ hiểu cho bên liên quan.</p>`,
    ex:'Cột "Requirement ID" trong file testcase giúp trả lời ngay "spec REQ-12 vừa đổi thì phải chạy lại những case nào".',
    trap:'Khả năng truy vết không làm tăng số lỗi tìm được; nó phục vụ đánh giá bao phủ và phân tích ảnh hưởng.' },
  { k:'Cách tiếp cận toàn đội ngũ', en:'Whole team approach', lo:'FL-1.5.2',
    d:'<p>Mọi thành viên có kỹ năng phù hợp đều có thể làm bất kỳ việc gì, và <b>cả nhóm cùng chịu trách nhiệm về chất lượng</b>. Tester làm việc cùng business để viết acceptance test, cùng dev thống nhất chiến lược và cách tự động hóa.</p>',
    ex:'Trong buổi refinement, QC cùng PO viết tiêu chí chấp nhận; dev cùng QC quyết định case nào tự động ở mức API.',
    trap:'Cách này không phù hợp mọi ngữ cảnh: hệ thống an toàn cao (safety-critical) vẫn cần mức độ độc lập kiểm thử cao.' },
  { k:'Tính độc lập của kiểm thử', en:'Independence of testing', lo:'FL-1.5.3',
    d:`<p>Các mức độc lập tăng dần: tác giả tự test → đồng nghiệp cùng team → tester ngoài team nhưng trong tổ chức → tester ngoài tổ chức.</p><p><b>Lợi ích</b>: tester độc lập có góc nhìn và thiên kiến khác tác giả nên tìm được loại lỗi khác; dám kiểm chứng và phản biện giả định của stakeholder.</p><p><b>Bất lợi</b>: bị tách khỏi team, thiếu hợp tác, giao tiếp kém; dev có thể giảm ý thức trách nhiệm về chất lượng; tester có thể bị coi là "nút thắt cổ chai" hoặc bị đổ lỗi.</p>`,
    ex:'Một công ty thuê đơn vị ngoài test bảo mật app ngân hàng: độc lập cao, nhưng đơn vị ngoài cần thời gian để hiểu nghiệp vụ.',
    trap:'Đề hay cho 4 phát biểu và hỏi "đâu là bất lợi". Câu "tìm được loại lỗi khác" là lợi ích, không phải bất lợi.' },
  ]},
{ ch:2, name:'Kiểm thử trong suốt vòng đời phát triển phần mềm', en:'Testing Throughout the SDLC', exam:6, time:'130 phút',
  theory:[
  { k:'Thực hành tốt cho mọi SDLC', en:'Good testing practices', lo:'FL-2.1.2',
    d:`<ul><li>Mỗi hoạt động phát triển có một hoạt động kiểm thử tương ứng.</li><li>Mỗi mức kiểm thử có mục tiêu riêng, tránh trùng lặp.</li><li>Phân tích và thiết kế test case cho một mức bắt đầu ngay trong giai đoạn phát triển tương ứng (kiểm thử sớm).</li><li>Tester tham gia rà soát sản phẩm công việc ngay từ bản nháp.</li></ul>`,
    ex:'Khi BA viết spec màn đặt hàng, QC đã bắt đầu viết khía cạnh kiểm thử và gửi câu hỏi Q&A thay vì chờ có build.',
    trap:'Đáp án "thiết kế test chỉ bắt đầu khi code đã xong" luôn là đáp án sai.' },
  { k:'Phát triển hướng kiểm thử: TDD, ATDD, BDD', en:'Test-first approaches', lo:'FL-2.1.3',
    d:`<ul><li><b>TDD</b>: dev viết unit test trước → chạy thấy fail → viết code cho pass → refactor. Định hướng code, mức component.</li><li><b>ATDD</b>: viết acceptance test từ acceptance criteria trước khi phát triển, do cả nhóm (business, dev, tester) cùng làm.</li><li><b>BDD</b>: mô tả hành vi mong muốn bằng ngôn ngữ tự nhiên, dạng <code>Given / When / Then</code>, để mọi người đều hiểu; sau đó có thể chuyển thành test tự động.</li></ul>`,
    ex:'Kịch bản "Given giỏ hàng 600.000đ, When áp mã SALE10, Then tổng còn 540.000đ" là BDD.',
    trap:'Cả ba đều là test-first. Phân biệt bằng: ai viết, mức nào, và có dùng Given/When/Then hay không.' },
  { k:'DevOps và shift left', en:'DevOps & Shift-left', lo:'FL-2.1.4, FL-2.1.5',
    d:`<p><b>DevOps</b>: CI/CD giúp phản hồi nhanh về chất lượng, khuyến khích test tự động, giảm rủi ro hồi quy. Nhưng phải đầu tư xây pipeline và bảo trì test tự động; vẫn cần test thủ công từ góc nhìn người dùng.</p><p><b>Shift left (kiểm thử sớm)</b>: kiểm thử sớm hơn trong SDLC, ví dụ: rà soát spec từ góc nhìn kiểm thử; viết test case trước khi code; dùng CI; chạy phân tích tĩnh trước kiểm thử động; làm kiểm thử phi chức năng sớm ở mức component.</p>`,
    ex:'Mỗi lần merge code, pipeline chạy unit test và quét SonarQube trong 5 phút: lỗi bị chặn trước khi tới tay QC.',
    trap:'Shift left có thể tốn thêm công sức và chi phí đào tạo lúc đầu, nhưng tiết kiệm về sau.' },
  { k:'Retrospective (họp rút kinh nghiệm)', en:'Retrospectives', lo:'FL-2.1.6',
    d:'<p>Thường diễn ra cuối iteration hoặc dự án: điều gì làm tốt, điều gì chưa, cải thiện thế nào. Lợi ích cho kiểm thử: tăng hiệu quả, chất lượng sản phẩm kiểm thử, gắn kết nhóm, cải thiện cơ sở kiểm thử, hợp tác dev–test tốt hơn.</p>',
    ex:'Retro phát hiện "spec thường thiếu quy tắc làm tròn" → thêm mục đó vào checklist rà soát spec.',
    trap:'Retro là để cải tiến quy trình, không phải để tìm người có lỗi.' },
  { k:'Các mức kiểm thử', en:'Test levels', lo:'FL-2.2.1',
    d:`<ul><li><b>Kiểm thử thành phần</b> (component / unit): từng thành phần riêng lẻ, thường do dev làm, có thể cần mô-đun giả (stub) / thành phần điều khiển kiểm thử (driver).</li><li><b>Kiểm thử tích hợp thành phần</b> (component integration): giao tiếp giữa các thành phần trong hệ thống.</li><li><b>Kiểm thử hệ thống</b> (system): hành vi tổng thể end-to-end, cả chức năng và phi chức năng.</li><li><b>Kiểm thử tích hợp hệ thống</b> (system integration): giao tiếp với hệ thống khác, dịch vụ bên ngoài.</li><li><b>Kiểm thử chấp nhận</b> (acceptance): xác nhận sẵn sàng triển khai và đáp ứng nhu cầu. Gồm: UAT; chấp nhận vận hành (OAT: sao lưu, khôi phục, cài đặt); theo hợp đồng / quy định; alpha (tại nơi phát triển); beta (tại nơi của người dùng). <i>Syllabus v4.0 chỉ liệt kê tên các hình thức này; phần mô tả trong ngoặc lấy từ syllabus v3.1.</i></li></ul>`,
    ex:'Test ShopDemo gọi cổng Momo nhận callback đúng là tích hợp hệ thống. Test hàm tinh_giam_gia() với stub DB là kiểm thử thành phần.',
    trap:'"Tích hợp" giữa các module nội bộ là tích hợp thành phần; với hệ thống bên ngoài là tích hợp hệ thống.' },
  { k:'Các loại kiểm thử', en:'Test types', lo:'FL-2.2.2',
    d:`<ul><li><b>Chức năng</b> (functional): hệ thống làm <b>gì</b>.</li><li><b>Phi chức năng</b> (non-functional): hệ thống làm <b>tốt đến đâu</b>, theo ISO 25010: hiệu năng hoạt động, khả năng tương thích, tính khả dụng, độ tin cậy, khả năng bảo trì, tính di động, tính an toàn.</li><li><b>Hộp đen</b> (black-box): dựa trên đặc tả, không nhìn vào cấu trúc bên trong.</li><li><b>Hộp trắng</b> (white-box): dựa trên cấu trúc bên trong (code, kiến trúc, luồng).</li></ul><p>Mọi loại kiểm thử đều áp dụng được ở mọi mức kiểm thử.</p>`,
    ex:'"API đặt hàng phản hồi dưới 2 giây với 500 người dùng đồng thời" là kiểm thử phi chức năng (hiệu năng).',
    trap:'Kiểm thử phi chức năng nên làm sớm, không phải đợi đến cuối dự án.' },
  { k:'Kiểm thử xác nhận và kiểm thử hồi quy', en:'Confirmation & Regression testing', lo:'FL-2.2.3',
    d:`<p><b>Kiểm thử xác nhận</b>: chạy lại case từng fail để xác nhận lỗi đã được sửa.</p><p><b>Kiểm thử hồi quy</b>: xác nhận thay đổi (kể cả bản sửa lỗi) không gây ảnh hưởng xấu tới phần khác. Nên làm phân tích ảnh hưởng (impact analysis) để chọn phạm vi. Bộ regression chạy lặp lại nhiều lần nên rất hợp để tự động hóa.</p>`,
    ex:'Dev sửa lỗi làm tròn → QC chạy lại case DH-2009 (xác nhận) và chạy cả bộ giỏ hàng, voucher, thanh toán (hồi quy).',
    trap:'Hồi quy không chỉ trong đối tượng vừa sửa mà cả các thành phần, hệ thống liên quan.' },
  { k:'Kiểm thử bảo trì', en:'Maintenance testing', lo:'FL-2.3.1',
    d:`<p>Thực hiện khi hệ thống đang vận hành bị thay đổi. Tác nhân (trigger):</p><ul><li><b>Sửa đổi</b>: nâng cấp theo kế hoạch, sửa lỗi, hotfix.</li><li><b>Nâng cấp hoặc chuyển đổi môi trường vận hành</b>: đổi nền tảng, chuyển dữ liệu (migration).</li><li><b>Ngừng sử dụng</b> (retirement): kiểm thử lưu trữ và khôi phục dữ liệu nếu cần giữ lâu dài.</li></ul><p>Phạm vi phụ thuộc mức rủi ro, kích thước hệ thống và độ lớn thay đổi; dựa trên phân tích ảnh hưởng.</p>`,
    ex:'ShopDemo chuyển DB từ MySQL sang PostgreSQL: cần test chuyển đổi dữ liệu và chạy regression trên môi trường mới.',
    trap:'Phát triển tính năng cho sản phẩm mới chưa phát hành thì không phải kiểm thử bảo trì.' },
  ]},
{ ch:3, name:'Kiểm thử tĩnh', en:'Static Testing', exam:4, time:'80 phút',
  theory:[
  { k:'Kiểm thử tĩnh là gì, giá trị', en:'Static testing basics & value', lo:'FL-3.1.1, FL-3.1.2',
    d:`<p>Kiểm thử mà <b>không chạy</b> phần mềm: rà soát (con người đọc) và phân tích tĩnh (công cụ). Gần như mọi sản phẩm công việc đều kiểm tra được: yêu cầu, user story, thiết kế, code, kế hoạch test, test case, hợp đồng…</p><p>Không nên áp dụng cho sản phẩm khó đọc với con người và không có công cụ phân tích, ví dụ mã thực thi của bên thứ ba vì lý do pháp lý.</p><p><b>Giá trị</b>: tìm lỗi từ rất sớm, khi sửa còn rẻ; tìm được lỗi mà kiểm thử động không thấy (code không bao giờ chạy tới, thiết kế không theo pattern, lỗi trong tài liệu không thực thi được); tăng hiểu biết chung giữa các bên.</p>`,
    ex:'QC rà soát spec màn đăng ký, phát hiện spec không nói email có phân biệt hoa thường không: sửa tốn 5 phút, thay vì sau release mới phát hiện khách có 2 tài khoản.',
    trap:'Kiểm thử tĩnh có chi phí (họp, chuẩn bị), nhưng tổng chi phí dự án thường giảm.' },
  { k:'Khác biệt tĩnh và động', en:'Static vs Dynamic', lo:'FL-3.1.3',
    d:`<ul><li>Cả hai đều giúp tìm lỗi, nhưng loại lỗi khác nhau.</li><li><b>Tĩnh tìm lỗi trực tiếp</b>; động làm lộ ra sự cố, rồi phải phân tích để tìm lỗi.</li><li>Tĩnh tìm được lỗi nằm ở nhánh code hiếm khi chạy.</li><li>Tĩnh áp dụng được cho sản phẩm không thực thi được (tài liệu).</li><li>Tĩnh đo được đặc tính không phụ thuộc lúc chạy (khả năng bảo trì); động đo đặc tính phụ thuộc lúc chạy (hiệu năng).</li></ul><p>Lỗi điển hình kiểm thử tĩnh tìm dễ hơn: lỗi yêu cầu (mâu thuẫn, mơ hồ), lỗi thiết kế, lỗi code (biến chưa khai báo, code không chạy tới), lệch chuẩn code, đặc tả giao diện sai, lỗ hổng bảo mật, thiếu truy vết.</p>`,
    ex:'Đo thời gian phản hồi API cần chạy thật (động). Phát hiện biến "tong_tien" dùng trước khi gán giá trị có thể làm bằng công cụ phân tích tĩnh.',
    trap:'"Kiểm thử tĩnh đo được hiệu năng" là sai.' },
  { k:'Quy trình rà soát', en:'Review process (ISO/IEC 20246)', lo:'FL-3.2.2',
    d:`<ol><li><b>Lập kế hoạch</b>: phạm vi, mục tiêu, đặc tính cần đánh giá, tiêu chí kết thúc, công sức, thời gian.</li><li><b>Khởi tạo rà soát</b>: đảm bảo mọi người và tài liệu sẵn sàng, người tham gia hiểu vai trò.</li><li><b>Rà soát cá nhân</b>: từng người tự đọc, ghi nhận bất thường, câu hỏi, đề xuất.</li><li><b>Trao đổi và phân tích</b>: thống nhất trạng thái, người phụ trách, hành động cho từng bất thường; thường qua họp rà soát.</li><li><b>Khắc phục và báo cáo</b>: tạo báo cáo lỗi, tác giả sửa, báo cáo kết quả; kiểm tra tiêu chí kết thúc.</li></ol>`,
    ex:'Trước buổi họp rà soát spec, mỗi QC tự đọc và ghi 10–15 câu hỏi vào sheet: đó là bước rà soát cá nhân.',
    trap:'Thứ tự thường bị gài: Lập kế hoạch → Khởi tạo rà soát → Rà soát cá nhân → Trao đổi và phân tích → Khắc phục và báo cáo.' },
  { k:'Vai trò và trách nhiệm trong rà soát', en:'Review roles', lo:'FL-3.2.3',
    d:`<ul><li><b>Quản lý</b>: quyết định rà soát cái gì, cung cấp nguồn lực (người, thời gian).</li><li><b>Tác giả (author)</b>: tạo và sửa sản phẩm được rà soát.</li><li><b>Điều phối viên (moderator / facilitator)</b>: đảm bảo buổi họp hiệu quả, hòa giải, quản lý thời gian, tạo môi trường an toàn.</li><li><b>Thư ký (scribe / recorder)</b>: ghi lại các bất thường và quyết định.</li><li><b>Người rà soát (rà soáter)</b>: thực hiện rà soát; có thể là chuyên gia, người dùng, người trong dự án…</li><li><b>Trưởng nhóm rà soát (review leader)</b>: chịu trách nhiệm chung về rà soát: ai tham gia, tổ chức khi nào, ở đâu.</li></ul>`,
    ex:'Buổi rà soát spec: BA (tác giả), QC lead điều phối, một QC ghi biên bản, 3 dev và 2 QC là người rà soát.',
    trap:'"Điều phối" (moderator) và "trưởng nhóm rà soát" (review leader) là hai vai trò khác nhau.' },
  { k:'Các loại rà soát', en:'Review types', lo:'FL-3.2.4',
    d:`<ul><li><b>Rà soát không chính thức</b> (informal): không quy trình cố định, không bắt buộc ghi lại; mục tiêu chính là phát hiện bất thường.</li><li><b>Rà soát có hướng dẫn</b> (walkthrough): do <b>tác giả dẫn dắt</b>; mục tiêu: đánh giá chất lượng, xây dựng niềm tin, giáo dục người tham gia, đạt đồng thuận, sinh ý tưởng, tìm bất thường. Rà soát cá nhân trước là không bắt buộc.</li><li><b>Rà soát kỹ thuật</b> (technical review): người rà soát có chuyên môn kỹ thuật, do điều phối viên dẫn dắt; mục tiêu: đạt đồng thuận, ra quyết định kỹ thuật, tìm bất thường, đánh giá chất lượng.</li><li><b>Đánh giá chuyên sâu</b> (inspection): <b>chính thức nhất</b>, theo quy trình chung đầy đủ; mục tiêu tìm tối đa bất thường; thu thập các chỉ số để cải tiến quy trình; tác giả <b>không được</b> làm trưởng nhóm rà soát hay thư ký.</li></ul>`,
    ex:'Dev lead trình bày thiết kế mới cho cả team để mọi người hiểu và góp ý: rà soát có hướng dẫn (walkthrough).',
    trap:'Từ khóa nhận diện: "tác giả dẫn dắt" là rà soát có hướng dẫn (walkthrough); "chỉ số, chính thức nhất" là đánh giá chuyên sâu (inspection); "quyết định kỹ thuật" là technical review.' },
  { k:'Các yếu tố thành công của rà soát', en:'Success factors', lo:'FL-3.2.5',
    d:'<ul><li>Mục tiêu rõ ràng, tiêu chí kết thúc đo được (không dùng việc đánh giá người tham gia làm mục tiêu).</li><li>Chọn loại rà soát phù hợp mục tiêu, sản phẩm, người tham gia.</li><li>Rà soát từng phần nhỏ để người rà soát không mất tập trung.</li><li>Phản hồi kết quả cho stakeholder và tác giả để cải tiến.</li><li>Đủ thời gian chuẩn bị.</li><li>Có sự ủng hộ của quản lý.</li><li>Rà soát là một phần văn hóa tổ chức, thúc đẩy học hỏi.</li><li>Đào tạo người tham gia; điều phối buổi họp tốt.</li></ul>',
    ex:'Thay vì rà soát spec 80 trang trong một buổi, chia thành 4 buổi theo từng màn hình.',
    trap:'Dùng kết quả rà soát để đánh giá năng lực tác giả là một yếu tố làm rà soát thất bại.' },
  ]},
{ ch:4, name:'Phân tích và thiết kế test case', en:'Test Analysis and Design', exam:11, time:'390 phút',
  theory:[
  { k:'3 nhóm kỹ thuật kiểm thử', en:'Test techniques overview', lo:'FL-4.1.1',
    d:'<ul><li><b>Hộp đen</b> (black-box / specification-based): dựa trên hành vi đặc tả, không cần biết cấu trúc bên trong; vẫn dùng được khi code thay đổi mà hành vi giữ nguyên.</li><li><b>Hộp trắng</b> (white-box / structure-based): dựa trên cấu trúc bên trong; chỉ thiết kế được sau khi có thiết kế hoặc code.</li><li><b>Dựa trên kinh nghiệm</b> (experience-based): dùng kiến thức và kinh nghiệm của tester; tìm được lỗi mà hai nhóm kia bỏ sót.</li></ul>',
    ex:'Phân vùng tuổi 18–60 từ spec là hộp đen; đảm bảo mọi nhánh if trong hàm tính phí ship được chạy là hộp trắng; thử bấm 2 lần nút Đặt hàng là kinh nghiệm.',
    trap:'Kỹ thuật hộp đen dựa trên đặc tả nên không phát hiện được code thừa (code làm điều spec không yêu cầu).' },
  { k:'Phân vùng tương đương', en:'Equivalence Partitioning (EP)', lo:'FL-4.2.1',
    d:`<p>Chia dữ liệu thành các <b>phân vùng</b>, mọi giá trị trong một vùng được xử lý giống nhau. Có vùng hợp lệ và không hợp lệ; mỗi giá trị chỉ thuộc đúng một vùng.</p><p><b>Bao phủ EP</b> = số vùng đã test / tổng số vùng × 100%.</p><p>Có nhiều tập phân vùng (nhiều trường) thì mức tối thiểu là <b>bao phủ Each Choice</b>: mỗi vùng của mỗi tập được test ít nhất một lần.</p>`,
    ex:'Tuổi hợp lệ 18–60 (số nguyên) → 3 vùng: &lt;18 (không hợp lệ), 18–60 (hợp lệ), &gt;60 (không hợp lệ). Tối thiểu 3 test: 10, 35, 70.',
    trap:'Vùng không hợp lệ nên test từng vùng một, không gộp nhiều giá trị sai vào một test (lỗi này có thể che lỗi kia).' },
  { k:'Phân tích giá trị biên', en:'Boundary Value Analysis (BVA)', lo:'FL-4.2.2',
    d:`<p>Chỉ áp dụng cho vùng <b>có thứ tự</b>. Biên là giá trị nhỏ nhất và lớn nhất của một vùng.</p><ul><li><b>BVA 2 giá trị</b>: mỗi biên lấy <b>biên + giá trị liền kề thuộc vùng bên cạnh</b>.</li><li><b>BVA 3 giá trị</b>: mỗi biên lấy <b>biên + cả hai giá trị liền kề</b>.</li></ul><p><b>Bao phủ BVA</b> = số giá trị biên (hạng mục bao phủ) đã test / tổng số × 100%.</p>`,
    ex:'Số lượng mua 1–10. BVA 2 giá trị: 0, 1, 10, 11 (4 giá trị). BVA 3 giá trị: 0, 1, 2, 9, 10, 11 (6 giá trị).',
    trap:'Đề hay hỏi số giá trị: 2 giá trị → 2 cho mỗi biên; 3 giá trị → 3 cho mỗi biên. Liệt kê ra trước rồi mới đếm, đừng nhẩm.' },
  { k:'Kiểm thử dựa vào bảng quyết định', en:'Decision Table Testing', lo:'FL-4.2.3',
    d:`<p>Dùng khi có <b>tổ hợp điều kiện</b> dẫn tới các hành động khác nhau. Dòng = điều kiện và hành động; <b>mỗi cột</b> là một tổ hợp điều kiện + hành động tương ứng.</p><p>Bảng đầy đủ với n điều kiện đúng/sai có <b>2ⁿ cột</b>. Có thể rút gọn bằng giá trị "–" (giá trị của điều kiện không ảnh hưởng đến kết quả hành động), và loại bỏ tổ hợp không thể xảy ra.</p><p><b>Bao phủ</b> = số cột khả thi đã test / tổng số cột khả thi × 100%.</p>`,
    ex:'Khách VIP? × Đơn ≥ 500k? → 4 cột: VIP+≥500k: giảm 20%; VIP+&lt;500k: giảm 10%; thường+≥500k: freeship; thường+&lt;500k: không ưu đãi.',
    trap:'Điểm mạnh: phát hiện tổ hợp bị spec bỏ sót. Điểm yếu: số cột tăng theo hàm mũ khi thêm điều kiện.' },
  { k:'Kiểm thử dựa vào chuyển đổi trạng thái', en:'State Transition Testing', lo:'FL-4.2.4',
    d:`<p>Mô hình hóa bằng <b>sơ đồ trạng thái</b> hoặc <b>bảng trạng thái</b>: trạng thái, sự kiện, chuyển đổi (có thể kèm điều kiện bảo vệ (guard condition) và hành động).</p><ul><li><b>Bao phủ tất cả trạng thái</b> (all states): mọi trạng thái được đi qua.</li><li><b>Bao phủ chuyển đổi trạng thái hợp lệ</b> (valid transitions, còn gọi 0-switch): mọi chuyển đổi hợp lệ được thực hiện. Đây là mức phổ biến nhất.</li><li><b>Bao phủ tất cả chuyển đổi trạng thái</b> (all transitions): mọi chuyển đổi hợp lệ + thử mọi chuyển đổi không hợp lệ (mỗi test chỉ một chuyển đổi không hợp lệ).</li></ul><p>100% chuyển đổi hợp lệ thì đảm bảo 100% trạng thái, nhưng ngược lại thì không.</p>`,
    ex:'Đơn: Chờ thanh toán → Đã thanh toán → Đang giao → Đã giao; Chờ thanh toán → Đã hủy; Đã thanh toán → Đã hủy. Thử "Hủy" khi đơn Đã giao là test chuyển đổi không hợp lệ.',
    trap:'Đếm số test tối thiểu: vẽ đường đi từ trạng thái bắt đầu, mỗi test là một đường không quay lại được thì phải tách test mới.' },
  { k:'Bao phủ câu lệnh và nhánh', en:'Statement & Branch coverage', lo:'FL-4.3.1, FL-4.3.2',
    d:`<p><b>Bao phủ câu lệnh</b> = số câu lệnh thực thi được chạy / tổng số × 100%.</p><p><b>Bao phủ nhánh</b> = số nhánh được chạy / tổng số nhánh × 100%. Nhánh là sự chuyển điều khiển giữa hai nút: có điều kiện (if: đúng / sai) hoặc vô điều kiện.</p><p><b>100% nhánh ⇒ 100% câu lệnh</b>, nhưng 100% câu lệnh <b>không</b> đảm bảo 100% nhánh (ví dụ if không có else: chỉ test nhánh đúng là đủ câu lệnh nhưng thiếu nhánh sai).</p>`,
    ex:'<code>if (tong &gt;= 500000) { ship = 0 }</code> rồi <code>tinh_tien()</code>. Một test với tổng 600.000: 100% câu lệnh, 2/3 ≈ 67% nhánh (3 nhánh: đúng, sai, và nhánh vô điều kiện từ ship = 0 tới tinh_tien()). Cần thêm test tổng 300.000 để đạt 100% nhánh.',
    trap:'Đạt 100% bao phủ không có nghĩa là hết lỗi: lỗi chỉ lộ ra với một số giá trị dữ liệu cụ thể vẫn có thể lọt.' },
  { k:'Giá trị của kiểm thử hộp trắng', en:'Value of white-box testing', lo:'FL-4.3.3',
    d:'<p>Điểm mạnh: xét toàn bộ phần đã cài đặt, nên tìm được lỗi ngay cả khi spec mơ hồ, lỗi thời hoặc không đầy đủ; đo được bao phủ một cách khách quan.</p><p>Điểm yếu: <b>không phát hiện được thiếu sót</b>. Yêu cầu chưa được cài đặt thì không có code để bao phủ.</p>',
    ex:'Spec yêu cầu chặn đặt hàng với tài khoản bị khóa nhưng dev quên viết: 100% bao phủ nhánh vẫn không lộ ra lỗi này.',
    trap:'Câu "kiểm thử hộp trắng phát hiện được yêu cầu bị bỏ sót" là sai.' },
  { k:'Kỹ thuật dựa trên kinh nghiệm', en:'Experience-based techniques', lo:'FL-4.4.1 – 4.4.3',
    d:`<ul><li><b>Đoán lỗi</b> (error guessing): dựa vào kinh nghiệm về lỗi thường gặp (dữ liệu sai, chia 0, bấm 2 lần, mất mạng…). Cách có hệ thống là <b>tấn công lỗi (fault attacks)</b>: lập danh sách lỗi có thể có rồi thiết kế test để tấn công.</li><li><b>Kiểm thử khám phá</b> (exploratory): vừa học, vừa thiết kế, vừa chạy test. Có thể theo <b>phiên (session-based)</b> với khung thời gian và <b>thẻ kiểm thử</b> (test charter). Hữu ích khi spec ít hoặc thiếu, thời gian gấp, hoặc bổ sung cho kỹ thuật chính thức.</li><li><b>Dựa trên checklist</b>: dùng danh sách kiểm tra xây từ kinh nghiệm, tiêu chuẩn, lỗi đã gặp. Checklist cần cập nhật thường xuyên.</li></ul>`,
    ex:'Thẻ kiểm thử (test charter): "Khám phá luồng hoàn tiền trong 60 phút để tìm rủi ro hoàn sai số tiền".',
    trap:'Kiểm thử khám phá vẫn có thể có cấu trúc (session, charter, ghi chép). "Khám phá = không có kế hoạch" là hiểu sai.' },
  { k:'User story, tiêu chí chấp nhận, ATDD', en:'Collaboration-based approaches', lo:'FL-4.5.1 – 4.5.3',
    d:`<p><b>User story</b> theo 3C: <b>Card</b> (thẻ mô tả), <b>Conversation</b> (trao đổi để hiểu cách dùng), <b>Confirmation</b> (tiêu chí chấp nhận). Story tốt theo <b>INVEST</b>: Độc lập, Thương lượng được, Có giá trị, Ước lượng được, Nhỏ, Kiểm thử được.</p><p><b>Tiêu chí chấp nhận</b> (acceptance criteria) có hai dạng: <b>hướng kịch bản</b> (Given/When/Then) và <b>hướng quy tắc</b> (danh sách gạch đầu dòng, bảng input–output).</p><p><b>ATDD</b>: cả nhóm viết test từ tiêu chí chấp nhận <b>trước khi</b> cài đặt; test case đầu tiên là luồng chính tích cực, sau đó tới luồng tiêu cực và phi chức năng.</p>`,
    ex:'Tiêu chí: "Given voucher VIP20 còn 0 lượt, When khách áp mã, Then hiển thị \'Mã đã hết lượt\'".',
    trap:'Tiêu chí chấp nhận là chữ C thứ ba: Confirmation.' },
  ]},
{ ch:5, name:'Quản lý các hoạt động kiểm thử', en:'Managing the Test Activities', exam:9, time:'335 phút',
  theory:[
  { k:'Kế hoạch kiểm thử', en:'Test plan', lo:'FL-5.1.1, FL-5.1.2',
    d:'<p>Mô tả mục tiêu, nguồn lực, quy trình. Nội dung điển hình: bối cảnh (phạm vi, mục tiêu, cơ sở kiểm thử), giả định và ràng buộc, các bên liên quan, giao tiếp, danh sách rủi ro, phương pháp tiếp cận kiểm thử (mức, loại, kỹ thuật, tiêu chí bắt đầu và tiêu chí kết thúc, mức độc lập, chỉ số, dữ liệu, môi trường), ngân sách và lịch.</p><p>Trong Agile, tester tham gia <b>lập kế hoạch release</b> (viết story kiểm thử được, phân tích rủi ro, ước lượng) và <b>lập kế hoạch iteration</b> (phân tích rủi ro chi tiết từng story, ước lượng công sức test, chia task).</p>',
    ex:'Kế hoạch test release 2.4: phạm vi gồm voucher mới; rủi ro: cổng Momo đổi API; tiêu chí kết thúc: không còn bug Critical mở.',
    trap:'Kế hoạch kiểm thử là tài liệu sống, được cập nhật khi dự án thay đổi.' },
  { k:'Tiêu chí bắt đầu và tiêu chí kết thúc', en:'Entry & Exit criteria', lo:'FL-5.1.3',
    d:'<p><b>Tiêu chí bắt đầu</b> (entry): điều kiện cần có trước khi bắt đầu một hoạt động, ví dụ môi trường sẵn sàng, build qua smoke test, có cơ sở kiểm thử. Trong Agile gọi là <b>Definition of Ready</b>.</p><p><b>Tiêu chí kết thúc</b> (exit): điều kiện để coi là xong, ví dụ đạt mức bao phủ, không còn bug nghiêm trọng mở, đã chạy hết case dự kiến. Trong Agile gọi là <b>Definition of Done</b>.</p><p>Hết thời gian hoặc ngân sách cũng có thể là lý do dừng, nếu các bên chấp nhận rủi ro.</p>',
    ex:'"Chỉ nhận build vào test khi pipeline xanh và có release note" là tiêu chí bắt đầu.',
    trap:'Đề hay đưa 4 tiêu chí và hỏi đâu là tiêu chí kết thúc. Từ khóa của tiêu chí kết thúc: bao phủ, mật độ lỗi còn lại, số lỗi chưa đóng.' },
  { k:'Kỹ thuật ước lượng', en:'Estimation techniques', lo:'FL-5.1.4',
    d:`<ul><li><b>Ước lượng dựa trên tỷ lệ</b>: dùng tỉ lệ từ dự án trước, ví dụ dev:test = 3:2.</li><li><b>Kỹ thuật ước lượng ngoại suy</b> (extrapolation): đo sớm trong dự án hiện tại rồi suy ra phần còn lại, ví dụ trung bình 3 iteration gần nhất.</li><li><b>Wideband Delphi</b>: chuyên gia ước lượng độc lập, thảo luận chênh lệch, lặp lại tới khi đồng thuận. <b>Planning poker</b> là một biến thể.</li><li><b>Ước lượng ba điểm</b>: a (lạc quan), m (khả dĩ nhất), b (bi quan). <b>E = (a + 4m + b) / 6</b>; độ lệch chuẩn <b>SD = (b − a) / 6</b>.</li></ul>`,
    ex:'a = 6, m = 9, b = 18 giờ → E = (6 + 36 + 18) / 6 = 10 giờ; SD = (18 − 6) / 6 = 2 → 10 ± 2 giờ.',
    trap:'Nhớ nhân 4 cho m, rồi chia 6. Hay bị nhầm với trung bình cộng (a + m + b) / 3.' },
  { k:'Ưu tiên hóa test case', en:'Test case prioritization', lo:'FL-5.1.5',
    d:'<p>Các chiến lược: <b>dựa vào rủi ro</b> (rủi ro cao chạy trước), <b>dựa vào độ bao phủ</b> (case bao phủ nhiều nhất chạy trước), <b>dựa vào yêu cầu</b> (theo độ ưu tiên yêu cầu của stakeholder).</p><p>Lý tưởng là chạy theo độ ưu tiên, nhưng phải tôn trọng <b>phụ thuộc</b>: case tiên quyết phải chạy trước, kể cả khi ưu tiên thấp hơn. Cũng cần tính tới tài nguyên sẵn có.</p>',
    ex:'Case "Thanh toán đơn" (ưu tiên 1) cần case "Tạo đơn" (ưu tiên 3) chạy trước.',
    trap:'Với bài sắp xếp: chọn case ưu tiên cao nhất mà đã đủ điều kiện chạy; nếu chưa đủ thì chạy case tiên quyết của nó trước.' },
  { k:'Tháp kiểm thử và các góc phần tư kiểm thử', en:'Test pyramid & Testing quadrants', lo:'FL-5.1.6, FL-5.1.7',
    d:`<p><b>Tháp kiểm thử</b>: tầng dưới (unit) nhiều test nhỏ, độc lập, nhanh; càng lên cao (API, UI end-to-end) càng ít test, phức tạp, chậm hơn.</p><p><b>Các góc phần tư kiểm thử</b> (Agile):</p><ul><li><b>Q1</b> – công nghệ, hỗ trợ nhóm: component test, component integration test (nên tự động, trong CI).</li><li><b>Q2</b> – nghiệp vụ, hỗ trợ nhóm: functional test, ví dụ, user story test, prototype, API test.</li><li><b>Q3</b> – nghiệp vụ, đánh giá sản phẩm: exploratory, usability, UAT (thường thủ công, hướng người dùng).</li><li><b>Q4</b> – công nghệ, đánh giá sản phẩm: smoke test, kiểm thử phi chức năng (trừ usability), thường tự động.</li></ul>`,
    ex:'Phiên khám phá 60 phút trên luồng hoàn tiền thuộc Q3. Load test 500 người dùng thuộc Q4.',
    trap:'Usability nằm ở Q3, không phải Q4 dù là phi chức năng.' },
  { k:'Rủi ro', en:'Risk management', lo:'FL-5.2.1 – 5.2.4',
    d:`<p><b>Mức rủi ro</b> = khả năng xảy ra × mức ảnh hưởng.</p><ul><li><b>Rủi ro dự án</b>: liên quan quản lý dự án, ví dụ thiếu người, trễ bàn giao, công cụ, nhà cung cấp, ước lượng sai. Ảnh hưởng tới lịch, ngân sách, phạm vi.</li><li><b>Rủi ro sản phẩm</b>: liên quan chất lượng sản phẩm, ví dụ tính sai tiền, chậm, lỗ hổng bảo mật, khó dùng.</li></ul><p><b>Phân tích rủi ro sản phẩm</b> = nhận diện + đánh giá; kết quả dùng để xác định phạm vi, mức, loại, kỹ thuật, độ sâu và thứ tự test.</p><p><b>Kiểm soát</b> = giảm thiểu + giám sát. Các phản ứng: giảm thiểu bằng kiểm thử, chấp nhận, chuyển giao, kế hoạch dự phòng.</p>`,
    ex:'Rủi ro A: khả năng 4 × ảnh hưởng 2 = 8; B: 2 × 5 = 10 → B được test kỹ hơn và sớm hơn.',
    trap:'"Tester chủ chốt nghỉ việc" là rủi ro dự án; "tính sai tổng tiền" là rủi ro sản phẩm.' },
  { k:'Giám sát kiểm thử, kiểm soát kiểm thử và kết thúc kiểm thử', en:'Monitoring, control, reporting', lo:'FL-5.3.1 – 5.3.3',
    d:'<p><b>Giám sát kiểm thử</b>: thu thập thông tin để đánh giá tiến độ, mức đạt tiêu chí kết thúc. <b>Kiểm soát kiểm thử</b>: hành động khi lệch kế hoạch (đổi ưu tiên, thêm nguồn lực…). <b>Kết thúc kiểm thử</b>: thu thập dữ liệu khi kết thúc để rút kinh nghiệm.</p><p>Nhóm chỉ số kiểm thử: tiến độ dự án, tiến độ test, chất lượng sản phẩm, lỗi, rủi ro, bao phủ, chi phí.</p><p><b>Báo cáo tiến độ kiểm thử</b> (định kỳ): kỳ báo cáo, tiến độ so với kế hoạch, trở ngại và cách xử lý, chỉ số, rủi ro mới, kế hoạch kỳ tới. <b>Báo cáo kết thúc kiểm thử</b> (cuối): tóm tắt, đánh giá chất lượng, sai lệch so với kế hoạch, rủi ro còn lại, bài học.</p>',
    ex:'Daily report: "Đã chạy 180/320 case, 12 fail, 3 bug Critical đang mở; trở ngại: môi trường staging chập chờn".',
    trap:'Cách giao tiếp phụ thuộc người nhận: quản lý cần tóm tắt, dev cần chi tiết kỹ thuật.' },
  { k:'Quản lý cấu hình', en:'Configuration management', lo:'FL-5.4.1',
    d:'<p>Xác định, quản lý phiên bản, theo dõi thay đổi của đối tượng kiểm thử và sản phẩm kiểm thử (kế hoạch, case, script, dữ liệu, môi trường) và quan hệ giữa chúng. Nhờ đó kết quả kiểm thử tái hiện được và truy vết được.</p>',
    ex:'Bug report ghi rõ "build 2.4.0-rc3, testcase v1.2, dữ liệu seed 2026-11-13": dev tái hiện được đúng điều kiện.',
    trap:'Trong DevOps, quản lý cấu hình thường được tự động hóa trong pipeline.' },
  { k:'Báo cáo lỗi', en:'Defect report', lo:'FL-5.5.1',
    d:'<p>Mục tiêu: đủ thông tin để xử lý và giải quyết; theo dõi chất lượng sản phẩm; gợi ý cải tiến quy trình.</p><p>Nội dung điển hình: ID duy nhất; tiêu đề tóm tắt; ngày, tổ chức, người báo; đối tượng và môi trường test; bối cảnh (test case, hoạt động, mức test); mô tả sự cố đủ để tái hiện (các bước, log, ảnh, video); <b>kết quả mong đợi và thực tế</b>; mức độ nghiêm trọng (severity); mức độ ưu tiên (priority); trạng thái; tham chiếu (test case liên quan).</p>',
    ex:'Tiêu đề "Hoàn tiền vượt số đã thu khi hủy đơn đã thanh toán (DH-2015: thu 447.000, hoàn 500.000)".',
    trap:'Thiếu "kết quả mong đợi" là lỗi hay gặp nhất: dev không biết thế nào mới là đúng.' },
  ]},
{ ch:6, name:'Công cụ kiểm thử', en:'Test Tools', exam:2, time:'20 phút',
  theory:[
  { k:'Các loại công cụ', en:'Tool support for testing', lo:'FL-6.1.1',
    d:'<ul><li><b>Công cụ quản lý kiểm thử</b>: quản lý vòng đời, yêu cầu, test, lỗi, cấu hình (Jira, TestRail…).</li><li><b>Kiểm thử tĩnh</b>: hỗ trợ rà soát và phân tích tĩnh.</li><li><b>Thiết kế và triển khai kiểm thử</b>: sinh test case, dữ liệu, trình tự thực hiện kiểm thử.</li><li><b>Thực thi kiểm thử và đo độ bao phủ</b>: chạy test tự động, đo coverage.</li><li><b>Kiểm thử phi chức năng</b>: hiệu năng, bảo mật… những việc khó làm thủ công.</li><li><b>DevOps</b>: pipeline, build tự động, CI/CD.</li><li><b>Cộng tác</b>: hỗ trợ giao tiếp.</li><li><b>Mở rộng và chuẩn hóa triển khai</b>: máy ảo, container.</li></ul>',
    ex:'Docker dựng môi trường test giống nhau cho cả team thuộc nhóm "mở rộng và chuẩn hóa triển khai".',
    trap:'Công cụ đo coverage khi chạy test thuộc nhóm "thực thi kiểm thử và đo độ bao phủ", không phải nhóm kiểm thử tĩnh.' },
  { k:'Lợi ích và rủi ro của tự động hóa', en:'Benefits & risks of test automation', lo:'FL-6.2.1',
    d:'<p><b>Lợi ích</b>: tiết kiệm thời gian cho việc thủ công lặp lại (regression, nhập lại dữ liệu); tránh lỗi con người; đánh giá khách quan và nhất quán hơn (coverage); dễ truy cập thông tin về kiểm thử; rút ngắn thời gian chạy, phản hồi sớm hơn; tester có thêm thời gian thiết kế test mới.</p><p><b>Rủi ro</b>: kỳ vọng phi thực tế về công cụ; ước lượng sai thời gian, chi phí, công sức để triển khai và bảo trì; dùng công cụ cho việc mà thủ công hợp hơn; phụ thuộc quá nhiều vào công cụ, bỏ qua tư duy phản biện; phụ thuộc nhà cung cấp (ngừng hỗ trợ, bán cho bên khác); dự án mã nguồn mở bị bỏ dở; không tương thích nền tảng; không đáp ứng yêu cầu quy định hoặc an toàn.</p>',
    ex:'Team mua công cụ record-and-playback và kỳ vọng "không cần tester nữa": đó là kỳ vọng phi thực tế.',
    trap:'Đề hay trộn lợi ích và rủi ro. "Giảm thời gian chạy regression" là lợi ích; "phụ thuộc nhà cung cấp" là rủi ro.' },
  ]},
];

/* ===================== Ngân hàng câu hỏi (tự biên soạn theo mục tiêu học tập CTFL 4.0) ===================== */
const QUESTIONS = [
/* ---------- Chương 1 ---------- */
{ id:'1-01', ch:1, lo:'FL-1.1.1', k:'K1', q:'Đâu <b>KHÔNG</b> phải là mục tiêu điển hình của kiểm thử?',
  o:['Đánh giá các sản phẩm công việc như yêu cầu, user story, thiết kế','Phát hiện các sự cố và tìm lỗi','Chứng minh phần mềm không còn lỗi nào','Cung cấp thông tin để các bên liên quan ra quyết định'], a:2,
  w:['Đây là mục tiêu điển hình: kiểm thử cả tài liệu chứ không chỉ code.','Đây là mục tiêu điển hình.','Đúng. Kiểm thử có thể cho thấy lỗi đang tồn tại nhưng không thể chứng minh đối tượng kiểm thử không có lỗi (nguyên tắc 1, mục 1.3).','Đây là mục tiêu điển hình, ví dụ báo cáo để PO quyết định release.'] },
{ id:'1-02', ch:1, lo:'FL-1.1.2', k:'K2', q:'QC phát hiện bấm "Thanh toán" bị lỗi 500. Dev đọc log, tìm ra biến bị null và sửa code. QC chạy lại case ban đầu thì pass. Hoạt động nào là <b>gỡ lỗi (debugging)</b>?',
  o:['QC chạy case và phát hiện lỗi 500','Dev tái hiện lỗi, tìm nguyên nhân trong code và sửa','QC chạy lại case ban đầu sau khi dev sửa','QC chạy lại bộ regression của module thanh toán'], a:1,
  w:['Đây là kiểm thử: làm lộ ra sự cố.','Đúng. Gỡ lỗi gồm tái hiện, chẩn đoán nguyên nhân và sửa.','Đây là kiểm thử xác nhận.','Đây là kiểm thử hồi quy.'] },
{ id:'1-03', ch:1, lo:'FL-1.2.3', k:'K2', q:'(1) Dev hiểu nhầm quy tắc làm tròn khi giảm giá. (2) Hàm tính giảm giá làm tròn sai. (3) Khách thấy tổng tiền lệch 100đ. Cách gọi đúng là:',
  o:['(1) lỗi, (2) sai sót, (3) sự cố','(1) sự cố, (2) lỗi, (3) sai sót','(1) sai sót, (2) sự cố, (3) lỗi','(1) sai sót, (2) lỗi, (3) sự cố'], a:3,
  w:['Sai: hiểu nhầm của con người là sai sót (error), không phải lỗi.','Sai thứ tự.','Sai: code sai là lỗi; điều người dùng thấy khi chạy là sự cố.','Đúng. Sai sót của con người → lỗi trong code → sự cố khi chạy.'] },
{ id:'1-04', ch:1, lo:'FL-1.2.3', k:'K2', q:'Tiếp câu trên: điều tra cho thấy spec không ghi quy tắc làm tròn và spec chưa từng được rà soát. Đâu là <b>nguyên nhân gốc rễ (root cause)</b>?',
  o:['Dòng code làm tròn sai trong hàm tính giảm giá','Spec không định nghĩa quy tắc làm tròn và không được rà soát','Tổng tiền hiển thị lệch 100đ','Khách phàn nàn với CSKH'], a:1,
  w:['Đây là lỗi, là hệ quả chứ không phải nguyên nhân gốc rễ.','Đúng. Sửa ở đây (thêm quy tắc, rà soát spec) mới ngăn được các lỗi tương tự.','Đây là sự cố.','Đây là hệ quả của sự cố.'] },
{ id:'1-05', ch:1, lo:'FL-1.2.2', k:'K2', q:'Phát biểu nào đúng về kiểm thử và đảm bảo chất lượng (QA)?',
  o:['Kiểm thử là một dạng kiểm soát chất lượng, hướng sản phẩm và mang tính khắc phục; QA hướng quy trình và mang tính phòng ngừa','QA và kiểm thử là hai tên gọi của cùng một hoạt động','QA chỉ do nhóm QA chịu trách nhiệm','Kiểm thử hướng vào quy trình, QA hướng vào sản phẩm'], a:0,
  w:['Đúng.','Sai: hai khái niệm khác nhau.','Sai: QA là trách nhiệm của mọi người trong dự án.','Sai: đảo ngược.'] },
{ id:'1-06', ch:1, lo:'FL-1.3.1', k:'K2', q:'Bộ regression của ShopDemo chạy 6 tháng nay không phát hiện lỗi mới, nhưng khách vẫn báo bug ở chính các chức năng đó. Nguyên tắc nào giải thích hiện tượng này?',
  o:['Lỗi có xu hướng tập trung','Kiểm thử vét cạn là không thể','Test case giảm hiệu quả theo thời gian','Ngộ nhận về việc không có lỗi'], a:2,
  w:['Nguyên tắc này nói lỗi dồn vào ít module.','Nguyên tắc này đúng (không thể kiểm thử mọi thứ) nhưng không giải thích vì sao bộ test cũ không còn phát hiện lỗi mới.','Đúng. Cùng một bộ test case lặp lại nhiều lần sẽ ngày càng kém hiệu quả trong việc phát hiện lỗi mới; cần rà soát, sửa đổi test case và dữ liệu kiểm thử, bổ sung test case mới (mục 1.3).','Nguyên tắc này nói: kiểm thử kỹ mọi yêu cầu và sửa hết lỗi vẫn có thể cho ra hệ thống không đáp ứng nhu cầu người dùng; bên cạnh xác minh cần thẩm định.'] },
{ id:'1-07', ch:1, lo:'FL-1.3.1', k:'K2', q:'Thống kê sprint: 34/42 bug nằm ở module thanh toán. Nguyên tắc nào phản ánh điều này?',
  o:['Lỗi có xu hướng tập trung','Kiểm thử sớm giúp tiết kiệm thời gian và chi phí','Kiểm thử phụ thuộc vào ngữ cảnh','Test case giảm hiệu quả theo thời gian'], a:0,
  w:['Đúng. Một số ít module chứa phần lớn lỗi; dùng thông tin này để tập trung kiểm thử theo rủi ro.','Không liên quan tới phân bố lỗi.','Không liên quan.','Không liên quan.'] },
{ id:'1-08', ch:1, lo:'FL-1.3.1', k:'K2', q:'App đặt hàng mới không còn bug mức High nào, nhưng sau release rất ít người dùng vì luồng đặt hàng khác hẳn thói quen của khách. Đây là ví dụ của nguyên tắc nào?',
  o:['Kiểm thử cho thấy sự tồn tại của lỗi, chứ không phải sự vắng mặt của lỗi','Ngộ nhận về việc không có lỗi','Lỗi có xu hướng tập trung','Kiểm thử vét cạn là không thể'], a:1,
  w:['Gần nghĩa nhưng không đúng trọng tâm: vấn đề ở đây là hệ thống không đáp ứng nhu cầu.','Đúng. Hết lỗi không có nghĩa là thành công; còn phải thẩm định (validate) với nhu cầu người dùng.','Không liên quan.','Không liên quan.'] },
{ id:'1-09', ch:1, lo:'FL-1.3.1', k:'K2', q:'Cùng một team QC, nhưng dự án app y tế cần kỹ thuật kiểm thử chặt chẽ và nhiều tài liệu hơn hẳn dự án game giải trí. Nguyên tắc nào?',
  o:['Kiểm thử sớm giúp tiết kiệm thời gian và chi phí','Test case giảm hiệu quả theo thời gian','Kiểm thử phụ thuộc vào ngữ cảnh','Ngộ nhận về việc không có lỗi'], a:2,
  w:['Không liên quan.','Không liên quan.','Đúng. Không có cách kiểm thử nào áp dụng chung cho mọi trường hợp.','Không liên quan.'] },
{ id:'1-10', ch:1, lo:'FL-1.4.1', k:'K2', q:'QC đọc spec màn hoàn tiền và lập danh sách: "hoàn đúng số đã thu", "không hoàn 2 lần", "hoàn đúng phương thức". Danh sách này được tạo trong hoạt động nào?',
  o:['Lập kế hoạch kiểm thử','Phân tích kiểm thử','Thiết kế test case','Triển khai kiểm thử'], a:1,
  w:['Lập kế hoạch xác định mục tiêu kiểm thử và chọn cách tiếp cận phù hợp nhất để đạt mục tiêu.','Đúng. Đây là các khía cạnh kiểm thử (cần test cái gì), sản phẩm của phân tích.','Thiết kế test case chi tiết hóa các khía cạnh kiểm thử thành test case, trả lời câu hỏi “kiểm thử như thế nào?”.','Triển khai chuẩn bị sản phẩm kiểm thử để chạy: trình tự thực hiện kiểm thử, bộ test case, lịch.'] },
{ id:'1-11', ch:1, lo:'FL-1.4.1', k:'K2', q:'QC gom các test case thành bộ "Regression thanh toán", viết trình tự thực hiện kiểm thử, chuẩn bị dữ liệu seed và xếp lịch chạy tối thứ Sáu. Đây là hoạt động nào?',
  o:['Thiết kế test case','Thực thi kiểm thử','Triển khai kiểm thử','Hoàn tất kiểm thử'], a:2,
  w:['Thiết kế test case chi tiết hóa khía cạnh kiểm thử thành test case, xác định yêu cầu dữ liệu kiểm thử và thiết kế môi trường kiểm thử; chưa tạo dữ liệu hay xếp lịch.','Thực thi là chạy test.','Đúng. Triển khai tạo hoặc thu thập sản phẩm kiểm thử cần cho thực thi: trình tự thực hiện kiểm thử, bộ test case, lịch, dữ liệu.','Hoàn tất kiểm thử diễn ra tại các mốc dự án (phát hành, kết thúc chu kỳ phát triển, hoàn tất một mức kiểm thử): lưu trữ sản phẩm kiểm thử, rút kinh nghiệm, viết báo cáo hoàn tất kiểm thử.'] },
{ id:'1-12', ch:1, lo:'FL-1.4.4', k:'K2', q:'Lợi ích chính của việc duy trì khả năng truy vết giữa yêu cầu và test case là gì?',
  o:['Tăng số lỗi tìm được','Giảm số test case cần viết','Thay thế cho báo cáo tiến độ','Đánh giá độ bao phủ yêu cầu và phân tích ảnh hưởng khi yêu cầu thay đổi'], a:3,
  w:['Truy vết không trực tiếp làm tăng số lỗi tìm được.','Không phải mục đích của truy vết.','Truy vết hỗ trợ báo cáo, không thay thế báo cáo.','Đúng.'] },
{ id:'1-13', ch:1, lo:'FL-1.5.3', k:'K2', q:'Đâu là <b>bất lợi</b> của kiểm thử độc lập?',
  o:['Tester độc lập tìm được loại lỗi khác so với tác giả','Tester có thể bị tách khỏi team phát triển, và dev có thể giảm ý thức trách nhiệm về chất lượng','Tester độc lập dám phản biện giả định của stakeholder','Tester độc lập có góc nhìn khác do không bị thiên kiến của tác giả'], a:1,
  w:['Đây là lợi ích.','Đúng. Đây là các bất lợi được nêu trong syllabus.','Đây là lợi ích.','Đây là lợi ích.'] },
{ id:'1-14', ch:1, lo:'FL-1.5.2', k:'K1', q:'Phát biểu nào đúng về cách tiếp cận toàn đội ngũ (whole team approach)?',
  o:['Chỉ tester chịu trách nhiệm về chất lượng sản phẩm','Tester không tham gia lập kế hoạch','Cả nhóm cùng chịu trách nhiệm về chất lượng; tester có thể cùng business viết acceptance test','Dev không được viết test'], a:2,
  w:['Sai: trong cách tiếp cận này, tất cả mọi người trong nhóm đều chịu trách nhiệm về chất lượng.','Sai: các thành viên có đủ kiến thức và kỹ năng để thực hiện bất kỳ nhiệm vụ nào.','Đúng. Mọi người cùng chịu trách nhiệm về chất lượng; tester hợp tác với đại diện nghiệp vụ để xây dựng test case ở mức chấp nhận (mục 1.5.2).','Sai: tester làm việc với lập trình viên để thống nhất chiến lược kiểm thử và cách tự động hóa; ai cũng có thể làm việc kiểm thử.'] },

{ id:'1-15', ch:1, lo:'FL-1.2.1', k:'K2', q:'Ví dụ nào cho thấy kiểm thử <b>góp phần vào thành công</b> của dự án?',
  o:['QC tham gia rà soát user story và phát hiện hai tiêu chí chấp nhận mâu thuẫn nhau trước khi dev bắt đầu code','QC tự sửa lỗi trong code để dev đỡ mất thời gian','QC ký xác nhận phần mềm không còn lỗi nên PO không cần tham gia nghiệm thu','QC chỉ tham gia sau khi code xong để giữ tính độc lập'], a:0,
  w:['Đúng. Tester tham gia sớm vào rà soát yêu cầu giúp phát hiện lỗi khi chi phí sửa còn thấp (mục 1.2.1).','Sai: sửa lỗi là gỡ lỗi, việc của dev; tester sửa code còn làm mất tính độc lập.','Sai: kiểm thử không chứng minh được phần mềm hết lỗi (nguyên tắc 1), và vẫn cần thẩm định với nhu cầu người dùng.','Sai: tham gia muộn làm mất cơ hội phát hiện lỗi sớm (nguyên tắc kiểm thử sớm).'] },
{ id:'1-16', ch:1, lo:'FL-1.4.2', k:'K2', q:'App ví điện tử phải tuân thủ quy định bảo mật giao dịch của Ngân hàng Nhà nước, nên team phải lưu bằng chứng kiểm thử chi tiết cho từng yêu cầu. Yếu tố ngữ cảnh nào ảnh hưởng tới quy trình kiểm thử ở đây?',
  o:['Thành viên nhóm (kỹ năng, kinh nghiệm)','Lĩnh vực nghiệp vụ (mức độ quan trọng, rủi ro, quy định pháp lý)','Công cụ sẵn có','Mô hình vòng đời phát triển phần mềm'], a:1,
  w:['Không phải: tình huống không nói gì về năng lực của nhóm.','Đúng. Lĩnh vực nghiệp vụ gồm mức độ quan trọng của đối tượng kiểm thử, rủi ro, nhu cầu thị trường và các quy định pháp lý cụ thể (mục 1.4.2).','Không phải: tình huống không nói về công cụ.','Không phải: tình huống không nói về Agile hay tuần tự.'] },
{ id:'1-17', ch:1, lo:'FL-1.4.3', k:'K2', q:'Sản phẩm kiểm thử (testware) nào được tạo ra trong hoạt động <b>triển khai kiểm thử</b> (test implementation)?',
  o:['Kế hoạch kiểm thử, lịch trình, danh sách rủi ro','Các khía cạnh kiểm thử đã ưu tiên và báo cáo lỗi trong cơ sở kiểm thử','Quy trình kiểm thử, bộ kiểm thử (test suite), dữ liệu kiểm thử và lịch thực hiện kiểm thử','Nhật ký kiểm thử và báo cáo lỗi khi chạy test'], a:2,
  w:['Đây là sản phẩm của lập kế hoạch.','Đây là sản phẩm của phân tích kiểm thử.','Đúng. Triển khai kiểm thử tạo quy trình kiểm thử, kịch bản tự động, bộ kiểm thử, dữ liệu kiểm thử, lịch thực hiện và các thành phần môi trường như stub, driver, giả lập (mục 1.4.3).','Đây là sản phẩm của thực thi kiểm thử.'] },
{ id:'1-18', ch:1, lo:'FL-1.4.5', k:'K2', q:'Phát biểu nào đúng về <b>vai trò quản lý kiểm thử</b> (test management role)?',
  o:['Chịu trách nhiệm chính về phân tích, thiết kế, triển khai và thực thi kiểm thử','Chịu trách nhiệm chính về lập kế hoạch, giám sát, kiểm soát và hoàn thành kiểm thử; trong Agile một phần nhiệm vụ có thể do cả nhóm đảm nhận','Luôn phải do một người có chức danh Test Manager riêng đảm nhận','Chỉ tồn tại trong mô hình thác nước'], a:1,
  w:['Đây là vai trò kiểm thử (testing role), thiên về kỹ thuật.','Đúng. Mục 1.4.5: vai trò quản lý kiểm thử chịu trách nhiệm tổng thể về quy trình kiểm thử, nhóm kiểm thử và lãnh đạo các hoạt động kiểm thử.','Sai: một vai trò có thể do nhiều người khác nhau đảm nhận tùy ngữ cảnh, ví dụ team leader hay quản lý phát triển.','Sai: vai trò này có trong mọi mô hình, cách thực hiện thì khác nhau.'] },
{ id:'1-19', ch:1, lo:'FL-1.5.1', k:'K2', q:'Dev thường phản ứng tiêu cực khi nhận bug, coi QC là "người mang tin xấu". Kỹ năng nào giúp QC giảm vấn đề này nhất?',
  o:['Kỹ năng giao tiếp: trình bày lỗi khách quan, mang tính xây dựng, lắng nghe và làm việc nhóm','Kiến thức chuyên môn về lĩnh vực nghiệp vụ','Kỹ năng lập trình để tự sửa lỗi','Kỹ năng ước lượng công sức kiểm thử'], a:0,
  w:['Đúng. Mục 1.5.1: thông tin về lỗi dễ bị xem là chỉ trích tác giả, nên kỹ năng giao tiếp và cách trình bày mang tính xây dựng rất quan trọng.','Hữu ích nhưng không giải quyết vấn đề tâm lý khi báo lỗi.','Không phù hợp: sửa lỗi không phải việc của QC.','Không liên quan tới tình huống.'] },
{ id:'1-20', ch:1, lo:'FL-1.5.3', k:'K2', q:'Dev tự kiểm thử code mình viết. Đâu là <b>hạn chế chính</b> so với để tester độc lập kiểm thử?',
  o:['Dev không biết dùng công cụ kiểm thử','Dev dễ bỏ sót lỗi vì mang cùng giả định và cách hiểu đã dẫn tới lỗi khi viết code','Dev hiểu code quá rõ nên tìm được quá nhiều lỗi','Kiểm thử bởi dev luôn tốn chi phí hơn'], a:1,
  w:['Sai: không phải hạn chế bản chất.','Đúng. Tác giả thường có thiên kiến với sản phẩm của mình; tester độc lập có góc nhìn khác nên nhận ra các loại lỗi khác (mục 1.5.3).','Sai: hiểu code là ưu điểm của dev, không phải hạn chế.','Sai: thường ngược lại, dev tìm lỗi trong code của mình hiệu quả về chi phí.'] },
{ id:'1-21', ch:1, lo:'FL-1.5.3', k:'K2', q:'Đâu là <b>nhược điểm</b> của mức độ độc lập kiểm thử cao?',
  o:['Tester phát hiện được các loại lỗi khác với dev','Tester có thể kiểm chứng, phản biện các giả định của bên liên quan','Tester bị tách khỏi nhóm phát triển, giao tiếp kém, dễ thành nút thắt cổ chai; dev có thể giảm ý thức trách nhiệm về chất lượng','Tester không bị ảnh hưởng bởi thiên kiến của tác giả'], a:2,
  w:['Đây là ưu điểm.','Đây là ưu điểm.','Đúng. Mục 1.5.3 nêu các nhược điểm: bị cô lập, thiếu hợp tác, thành nút thắt, dev mất ý thức trách nhiệm về chất lượng.','Đây là ưu điểm.'] },
{ id:'1-22', ch:1, lo:'FL-1.4.4', k:'K2', q:'Team duy trì liên kết truy vết giữa user story, khía cạnh kiểm thử, test case và lỗi. Lợi ích nào có được từ việc này?',
  o:['Tự động sinh script kiểm thử từ user story','Giảm số lỗi dev tạo ra','Đánh giá độ bao phủ yêu cầu và phân tích ảnh hưởng khi một user story thay đổi','Không cần viết báo cáo kiểm thử'], a:2,
  w:['Không: truy vết không sinh script.','Không trực tiếp.','Đúng. Truy vết giúp đánh giá độ bao phủ, xác định ảnh hưởng của thay đổi, hỗ trợ kiểm toán và làm báo cáo dễ hiểu với bên liên quan (mục 1.4.4).','Sai: truy vết giúp báo cáo rõ ràng hơn, không thay thế báo cáo.'] },
{ id:'1-23', ch:1, lo:'FL-1.4.1', k:'K2', q:'Hoạt động nào thuộc <b>hoàn thành kiểm thử</b> (test completion)?',
  o:['So sánh kết quả thực tế với kết quả mong đợi','Lưu trữ sản phẩm kiểm thử để tái sử dụng, đóng môi trường kiểm thử, rút bài học và viết báo cáo hoàn thành','Xác định và ưu tiên các khía cạnh kiểm thử','Tạo dữ liệu kiểm thử và dựng môi trường'], a:1,
  w:['Đây là thực thi kiểm thử.','Đúng. Hoạt động này thường diễn ra ở các mốc dự án như release, cuối vòng lặp hoặc kết thúc một cấp kiểm thử.','Đây là phân tích kiểm thử.','Đây là triển khai kiểm thử.'] },
{ id:'1-24', ch:1, lo:'FL-1.4.1', k:'K2', q:'Giữa sprint, QC lead thấy tỉ lệ test pass mới đạt 60% so với tiêu chí kết thúc 95%, nên đề xuất thêm một tester và lùi ngày release. Đây là hoạt động nào?',
  o:['Lập kế hoạch kiểm thử','Giám sát và kiểm soát kiểm thử','Hoàn thành kiểm thử','Triển khai kiểm thử'], a:1,
  w:['Kế hoạch đã có từ trước; ở đây đang theo dõi tiến độ so với kế hoạch.','Đúng. Giám sát: so sánh tiến độ thực tế với kế hoạch; kiểm soát: đưa ra hành động điều chỉnh để đạt mục tiêu.','Chưa tới lúc hoàn thành.','Không phải.'] },

/* ---------- Chương 2 ---------- */
{ id:'2-01', ch:2, lo:'FL-2.1.2', k:'K1', q:'Thực hành kiểm thử tốt nào áp dụng cho <b>mọi</b> mô hình SDLC?',
  o:['Thiết kế test case chỉ bắt đầu khi code đã hoàn thành','Mỗi hoạt động phát triển có một hoạt động kiểm thử tương ứng','Mọi mức kiểm thử có cùng một mục tiêu','Tester chỉ rà soát bản cuối cùng của tài liệu'], a:1,
  w:['Sai: phân tích và thiết kế nên bắt đầu sớm.','Đúng.','Sai: mỗi mức có mục tiêu riêng.','Sai: nên tham gia rà soát từ bản nháp.'] },
{ id:'2-02', ch:2, lo:'FL-2.1.3', k:'K1', q:'PO, dev và QC cùng viết kịch bản "Given giỏ hàng 600.000đ / When áp mã SALE10 / Then tổng còn 540.000đ" bằng ngôn ngữ tự nhiên, sau đó tự động hóa. Đây là cách tiếp cận nào?',
  o:['TDD','Kiểm thử khám phá','BDD','Kiểm thử thành phần'], a:2,
  w:['TDD định hướng việc lập trình bằng test case viết trước, không dùng định dạng Given/When/Then cho các bên liên quan.','Không phải test-first.','Đúng. BDD mô tả hành vi bằng Given/When/Then để mọi bên cùng hiểu.','Không đúng mức.'] },
{ id:'2-03', ch:2, lo:'FL-2.1.3', k:'K1', q:'Dev viết unit test cho hàm tinh_phi_ship() trước, chạy thấy fail, sau đó viết code cho đến khi pass rồi refactor. Đây là:',
  o:['TDD','ATDD','BDD','Kiểm thử chấp nhận'], a:0,
  w:['Đúng.','ATDD dựa trên acceptance criteria, do cả nhóm viết.','BDD dùng Given/When/Then ở mức hành vi.','Không phải.'] },
{ id:'2-04', ch:2, lo:'FL-2.1.5', k:'K2', q:'Đâu <b>KHÔNG</b> phải là thực hành shift left (kiểm thử sớm)?',
  o:['Rà soát spec từ góc nhìn kiểm thử','Viết test case trước khi code','Chạy test tự động trong CI ở mỗi lần commit','Chỉ thực hiện kiểm thử hiệu năng ở giai đoạn UAT trước khi go-live'], a:3,
  w:['Là shift left.','Là shift left.','Là shift left.','Đúng. Đẩy kiểm thử phi chức năng về cuối là ngược với shift left; nên làm sớm, kể cả ở mức component.'] },
{ id:'2-05', ch:2, lo:'FL-2.2.1', k:'K2', q:'QC kiểm tra ShopDemo nhận và xử lý đúng callback từ cổng thanh toán Momo bên ngoài. Đây là mức kiểm thử nào?',
  o:['Kiểm thử thành phần','Kiểm thử tích hợp thành phần','Kiểm thử tích hợp hệ thống','Kiểm thử chấp nhận vận hành'], a:2,
  w:['Không phải: đang test giao tiếp giữa các hệ thống.','Tích hợp thành phần là giữa các module nội bộ.','Đúng. Giao tiếp với hệ thống hoặc dịch vụ bên ngoài.','Kiểm thử chấp nhận vận hành là một hình thức của kiểm thử chấp nhận, không phải kiểm thử điểm kết nối với hệ thống bên ngoài.'] },
{ id:'2-06', ch:2, lo:'FL-2.2.1', k:'K2', q:'Dev kiểm tra riêng hàm tinh_giam_gia(), dùng stub thay cho database. Đây là mức kiểm thử nào?',
  o:['Kiểm thử thành phần','Kiểm thử hệ thống','Kiểm thử tích hợp hệ thống','Kiểm thử chấp nhận'], a:0,
  w:['Đúng. Kiểm thử thành phần tập trung kiểm thử các thành phần một cách độc lập, thường cần môi trường chạy kiểm thử (test harness); stub là một hạng mục môi trường kiểm thử (mục 2.2.1, 1.4.3).','Không phải.','Không phải.','Không phải.'] },
{ id:'2-07', ch:2, lo:'FL-2.2.1', k:'K2', q:'Trước go-live, đội vận hành kiểm tra sao lưu, khôi phục dữ liệu và quy trình cài đặt bản cập nhật. Đây là loại kiểm thử chấp nhận nào?',
  o:['Kiểm thử chấp nhận người dùng (UAT)','Kiểm thử chấp nhận vận hành (OAT)','Kiểm thử beta','Kiểm thử chấp nhận theo hợp đồng'], a:1,
  w:['UAT do người dùng xác nhận hệ thống đáp ứng nhu cầu sử dụng.','Đúng. Lưu ý: syllabus v4.0 chỉ liệt kê tên “kiểm thử chấp nhận vận hành”, không mô tả nội dung; chi tiết sao lưu, khôi phục, cài đặt lấy từ syllabus v3.1. Câu này để hiểu thêm, ít khả năng ra thi v4.0.','Kiểm thử beta do người dùng thực hiện tại môi trường của họ (mô tả theo syllabus v3.1; v4.0 chỉ liệt kê tên).','Kiểm thử chấp nhận theo hợp đồng dựa trên các tiêu chí trong hợp đồng (mô tả theo syllabus v3.1; v4.0 chỉ liệt kê tên).'] },
{ id:'2-08', ch:2, lo:'FL-2.2.2', k:'K2', q:'"API đặt hàng phải phản hồi dưới 2 giây khi có 500 người dùng đồng thời." Kiểm thử yêu cầu này thuộc loại nào?',
  o:['Kiểm thử chức năng','Kiểm thử hộp trắng','Kiểm thử xác nhận','Kiểm thử phi chức năng'], a:3,
  w:['Không: kiểm thử chức năng đánh giá hệ thống phải “làm gì”; ở đây đánh giá hệ thống hoạt động “tốt như thế nào”.','Không liên quan cấu trúc code.','Không phải.','Đúng. Đây là đặc tính “hiệu năng hoạt động” trong ISO/IEC 25010 (mục 2.2.2).'] },
{ id:'2-09', ch:2, lo:'FL-2.2.3', k:'K2', q:'Sau khi dev sửa lỗi tổng tiền, QC (1) chạy lại đúng case đã fail, và (2) chạy lại các case giỏ hàng, voucher, thanh toán liên quan. Gọi đúng tên:',
  o:['(1) hồi quy, (2) xác nhận','(1) xác nhận, (2) hồi quy','Cả hai đều là kiểm thử xác nhận','Cả hai đều là kiểm thử hồi quy'], a:1,
  w:['Đảo ngược.','Đúng.','Sai: (2) là hồi quy.','Sai: (1) là xác nhận.'] },
{ id:'2-10', ch:2, lo:'FL-2.3.1', k:'K2', q:'Đâu <b>KHÔNG</b> phải tác nhân (trigger) của kiểm thử bảo trì?',
  o:['Nâng cấp hệ điều hành máy chủ đang chạy hệ thống','Hotfix lỗi thanh toán trên production','Ngừng sử dụng hệ thống cũ, cần lưu trữ dữ liệu','Viết user story cho một sản phẩm mới chưa phát hành'], a:3,
  w:['Là tác nhân: nâng cấp hoặc chuyển đổi môi trường vận hành.','Là tác nhân: thay đổi trong phần mềm (bản vá lỗi khẩn cấp).','Là tác nhân: ngừng sử dụng (kiểm thử việc lưu trữ dữ liệu).','Đúng. Sản phẩm chưa vận hành thì không có kiểm thử bảo trì.'] },

{ id:'2-11', ch:2, lo:'FL-2.1.1', k:'K2', q:'Trong mô hình phát triển <b>tuần tự</b> (ví dụ V-model), điều nào đúng về kiểm thử?',
  o:['Không thể áp dụng kiểm thử tĩnh','Tester chỉ được tham gia sau khi giai đoạn lập trình kết thúc','Ở giai đoạn đầu tester tham gia rà soát yêu cầu, phân tích và thiết kế test; kiểm thử động thường diễn ra muộn vì code có ở giai đoạn sau','Mỗi vòng lặp đều phải chạy kiểm thử hồi quy tự động'], a:2,
  w:['Sai: rà soát yêu cầu, thiết kế là kiểm thử tĩnh, rất phù hợp ở giai đoạn đầu.','Sai: tester nên tham gia từ đầu (shift left).','Đúng. Mục 2.1.1: trong mô hình tuần tự, giai đoạn đầu tester thường tham gia rà soát yêu cầu, phân tích và thiết kế test; code có muộn nên kiểm thử động không thể làm sớm.','Đây là đặc điểm của mô hình lặp và tăng dần.'] },
{ id:'2-12', ch:2, lo:'FL-2.1.4', k:'K2', q:'Đâu là <b>lợi ích</b> của DevOps đối với kiểm thử?',
  o:['Phản hồi nhanh về chất lượng code; CI tự động chạy test giúp phát hiện lỗi sớm và giảm rủi ro hồi quy','Không cần kiểm thử thủ công nữa','Không cần thiết lập và bảo trì pipeline CI/CD','Giảm nhu cầu môi trường kiểm thử ổn định'], a:0,
  w:['Đúng. Mục 2.1.4 còn nêu: khuyến khích dev viết code chất lượng cao kèm test thành phần, môi trường ổn định nhờ quy trình tự động.','Sai: vẫn cần kiểm thử thủ công, nhất là từ góc nhìn người dùng.','Sai: phải thiết lập và bảo trì pipeline, đó chính là một rủi ro/thách thức.','Sai: ngược lại.'] },
{ id:'2-13', ch:2, lo:'FL-2.1.4', k:'K2', q:'Đâu là <b>thách thức</b> (rủi ro) của DevOps đối với kiểm thử?',
  o:['Phản hồi nhanh về chất lượng code','Phải định nghĩa và thiết lập pipeline giao hàng, đưa vào và bảo trì công cụ CI/CD; tự động hóa kiểm thử cần thêm nguồn lực','Khả năng hiển thị các đặc tính phi chức năng tốt hơn','Giảm kiểm thử hồi quy thủ công lặp lại'], a:1,
  w:['Đây là lợi ích.','Đúng (mục 2.1.4).','Đây là lợi ích.','Đây là lợi ích.'] },
{ id:'2-14', ch:2, lo:'FL-2.2.1', k:'K2', q:'QC chạy toàn bộ luồng từ tìm sản phẩm, thêm giỏ, thanh toán đến nhận email xác nhận, trên môi trường gần giống production, đối chiếu với đặc tả hệ thống. Đây là cấp kiểm thử nào?',
  o:['Kiểm thử tích hợp thành phần','Kiểm thử tích hợp hệ thống','Kiểm thử hệ thống','Kiểm thử chấp nhận người dùng'], a:2,
  w:['Không: cấp này tập trung vào giao diện giữa các thành phần.','Không: cấp này tập trung vào giao diện với hệ thống, dịch vụ bên ngoài.','Đúng. Kiểm thử hệ thống tập trung vào hành vi tổng thể, đầu cuối của cả hệ thống, thường do nhóm kiểm thử độc lập thực hiện dựa trên đặc tả.','Không: UAT do người dùng thực hiện nhằm xác nhận hệ thống đáp ứng nhu cầu sử dụng.'] },
{ id:'2-15', ch:2, lo:'FL-2.2.2', k:'K2', q:'Phát biểu nào đúng về mối quan hệ giữa <b>loại kiểm thử</b> và <b>cấp kiểm thử</b>?',
  o:['Kiểm thử hộp trắng chỉ thực hiện ở cấp thành phần','Kiểm thử phi chức năng chỉ thực hiện ở cấp hệ thống','Kiểm thử chức năng chỉ thực hiện ở cấp chấp nhận','Mọi loại kiểm thử đều có thể áp dụng ở mọi cấp kiểm thử, dù trọng tâm mỗi cấp khác nhau'], a:3,
  w:['Sai: ví dụ có thể đo độ bao phủ giao diện ở cấp tích hợp.','Sai: ví dụ đo hiệu năng của một hàm ở cấp thành phần.','Sai.','Đúng (mục 2.2.2).'] },
{ id:'2-16', ch:2, lo:'FL-2.3.1', k:'K2', q:'Trước khi nâng cấp module voucher đang chạy production, team làm <b>phân tích ảnh hưởng</b> (impact analysis). Việc này giúp gì cho kiểm thử bảo trì?',
  o:['Xác định những phần của hệ thống có thể bị ảnh hưởng để quyết định phạm vi kiểm thử hồi quy','Thay thế hoàn toàn kiểm thử hồi quy','Đo hiệu năng của module mới','Chỉ dùng để ước lượng chi phí dev'], a:0,
  w:['Đúng. Mục 2.3.1: phân tích ảnh hưởng giúp quyết định có nên thay đổi và phạm vi kiểm thử hồi quy cần thiết.','Sai: vẫn cần kiểm thử hồi quy, chỉ là có trọng tâm hơn.','Không phải.','Không phải mục đích chính với kiểm thử.'] },
{ id:'2-17', ch:2, lo:'FL-2.3.1', k:'K2', q:'Phạm vi của kiểm thử bảo trì thường phụ thuộc vào những yếu tố nào?',
  o:['Số lượng tester đang có trong team','Mức độ rủi ro của thay đổi, quy mô hệ thống hiện tại và quy mô của thay đổi','Ngôn ngữ lập trình của hệ thống','Luôn bằng toàn bộ bộ kiểm thử hồi quy'], a:1,
  w:['Không phải yếu tố quyết định phạm vi.','Đúng (mục 2.3.1).','Không liên quan.','Sai: phạm vi điều chỉnh theo rủi ro và quy mô thay đổi.'] },
{ id:'2-18', ch:2, lo:'FL-2.1.6', k:'K2', q:'Buổi retrospective cuối sprint mang lại lợi ích gì cho kiểm thử?',
  o:['Phân công lỗi cho từng dev chịu trách nhiệm','Đánh giá năng lực cá nhân của tester để xét thưởng','Thay thế báo cáo hoàn thành kiểm thử','Tăng hiệu quả kiểm thử, cải thiện chất lượng testware và cơ sở kiểm thử, tăng gắn kết nhóm và hợp tác giữa dev và tester'], a:3,
  w:['Sai: retrospective không nhằm đổ lỗi.','Sai: không phải mục đích.','Sai.','Đúng (mục 2.1.6). Kết quả retrospective được ghi lại, thường nằm trong báo cáo hoàn thành kiểm thử.'] },

/* ---------- Chương 3 ---------- */
{ id:'3-01', ch:3, lo:'FL-3.1.1', k:'K1', q:'Sản phẩm nào <b>không nên</b> là đối tượng của kiểm thử tĩnh?',
  o:['User story và tiêu chí chấp nhận','Test case','Hợp đồng','Mã thực thi của bên thứ ba mà về mặt pháp lý không được phép phân tích'], a:3,
  w:['Kiểm tra được.','Kiểm tra được.','Kiểm tra được.','Đúng. Sản phẩm khó đọc với con người và không được phép phân tích bằng công cụ thì không phù hợp.'] },
{ id:'3-02', ch:3, lo:'FL-3.1.2', k:'K2', q:'Loại lỗi nào kiểm thử tĩnh tìm được nhưng kiểm thử động khó tìm?',
  o:['Thời gian phản hồi chậm khi tải cao','Code không bao giờ chạy tới (unreachable code)','Rò rỉ bộ nhớ khi chạy lâu','Giao diện hiển thị sai trên một trình duyệt'], a:1,
  w:['Cần chạy thật (động).','Đúng. Code không chạy tới thì kiểm thử động không thể kích hoạt.','Cần chạy thật.','Cần chạy thật.'] },
{ id:'3-03', ch:3, lo:'FL-3.1.3', k:'K2', q:'Phát biểu nào đúng về khác biệt giữa kiểm thử tĩnh và kiểm thử động?',
  o:['Kiểm thử tĩnh tìm lỗi trực tiếp; kiểm thử động làm lộ sự cố rồi phải phân tích để tìm lỗi','Kiểm thử tĩnh chỉ thực hiện được bằng công cụ','Kiểm thử động áp dụng được cho tài liệu yêu cầu','Kiểm thử tĩnh đo được hiệu năng hệ thống'], a:0,
  w:['Đúng.','Sai: rà soát do con người làm.','Sai: tài liệu không thực thi được.','Sai: hiệu năng phụ thuộc lúc chạy.'] },
{ id:'3-04', ch:3, lo:'FL-3.2.2', k:'K2', q:'Thứ tự đúng của các hoạt động trong quy trình rà soát là:',
  o:['Rà soát cá nhân → Lập kế hoạch → Khởi tạo rà soát → Khắc phục và báo cáo → Trao đổi và phân tích','Lập kế hoạch → Khởi tạo rà soát → Rà soát cá nhân → Trao đổi và phân tích → Khắc phục và báo cáo','Khởi tạo rà soát → Lập kế hoạch → Trao đổi và phân tích → Rà soát cá nhân → Khắc phục và báo cáo','Lập kế hoạch → Rà soát cá nhân → Khởi tạo rà soát → Khắc phục và báo cáo → Trao đổi và phân tích'], a:1,
  w:['Sai thứ tự.','Đúng.','Sai thứ tự.','Sai thứ tự.'] },
{ id:'3-05', ch:3, lo:'FL-3.2.3', k:'K1', q:'Trong buổi họp rà soát, ai chịu trách nhiệm điều phối để buổi họp hiệu quả, điều phối thảo luận, quản lý thời gian và duy trì môi trường an toàn để mọi người tự do phát biểu?',
  o:['Tác giả','Thư ký','Điều phối viên (moderator)','Quản lý'], a:2,
  w:['Tác giả tạo ra và sửa sản phẩm công việc đang được rà soát.','Thư ký tổng hợp các bất thường và ghi lại thông tin thảo luận, các quyết định.','Đúng (mục 3.2.3).','Quản lý quyết định rà soát cái gì và cấp nguồn lực.'] },
{ id:'3-06', ch:3, lo:'FL-3.2.4', k:'K2', q:'Dev lead trình bày thiết kế mới cho cả team để mọi người hiểu, góp ý và đạt đồng thuận; rà soát cá nhân trước buổi họp là không bắt buộc. Đây là loại rà soát nào?',
  o:['Đánh giá chuyên sâu (inspection)','Rà soát có hướng dẫn (walkthrough)','Rà soát kỹ thuật','Rà soát không chính thức'], a:1,
