    const ok = st.pick === q.a;
    h += '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? 'Đúng.' : 'Chưa đúng. Đáp án đúng được tô xanh; đọc giải thích của từng đáp án bên trên.') + '</div>';
    h += '<p class="reflink">Xem lại lý thuyết: mục tiêu ' + esc(q.lo) + ' trong tab <button type="button" class="linkbtn" id="toTheory">Lý thuyết</button>.</p>';
  }
  h += '<div class="actions"><button type="button" class="btn" id="prevQ"' + (i === 0 ? ' disabled' : '') + '>Câu trước</button>';
  h += st.submitted ? '<button type="button" class="btn" id="retryQ">Làm lại câu này</button>' : '<button type="button" class="btn primary" id="submitQ"' + (st.pick == null ? ' disabled' : '') + '>Trả lời</button>';
  h += '<span class="spacer"></span><button type="button" class="btn' + (st.submitted ? ' primary' : '') + '" id="nextQ"' + (i === qs.length - 1 ? ' disabled' : '') + '>Câu tiếp</button></div></div>';
  const answered = qs.filter(x => practice[x.id] && practice[x.id].submitted), right = answered.filter(x => practice[x.id].pick === x.a).length;
  if (answered.length) h += '<p class="note" style="margin-top:12px">Phiên này: đúng ' + right + '/' + answered.length + ' câu đã trả lời. Câu làm đúng được lưu vào tiến độ.</p>';
  $('chBody').innerHTML = h;
  const setI = j => { S.qi[n] = j; save(); renderQuiz(n); };
  $('chBody').querySelectorAll('.qdot').forEach(b => b.onclick = () => setI(+b.dataset.j));
  $('chBody').querySelectorAll('.opt:not(:disabled)').forEach(b => b.onclick = () => { practice[q.id] = { pick:+b.dataset.oi }; renderQuiz(n); });
  const sb = $('submitQ'); if (sb) sb.onclick = () => { st.submitted = true; practice[q.id] = Object.assign({}, practice[q.id], { submitted:true }); if (practice[q.id].pick === q.a){ S.done[q.id] = true; save(); renderNav(); } renderQuiz(n); };
  const rb = $('retryQ'); if (rb) rb.onclick = () => { delete practice[q.id]; delete orderCache[q.id]; renderQuiz(n); };
  $('prevQ').onclick = () => setI(i - 1); $('nextQ').onclick = () => setI(i + 1);
  const tt = $('toTheory'); if (tt) tt.onclick = () => { S.tab[n] = 'theory'; save(); renderChapter(n); };
}

/* ===================== Thi thử ===================== */
let tick = null;
// 3 đề cố định: mỗi chương xáo trộn ngân hàng câu hỏi theo hạt giống cố định rồi chia thành các phần không trùng nhau.
// Thêm câu hỏi mới vào một chương sẽ làm thay đổi thành phần các đề cố định của chương đó.
const SET_N = 3;
const seeded = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const seededShuffle = (a, seed) => { const r = seeded(seed); a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const setIds = k => { const out = []; CHAPTERS.forEach(c => { const pool = seededShuffle(byCh(c.ch).map(q => q.id).sort(), 4049 + c.ch * 7919); out.push(...pool.slice((k - 1) * c.exam, k * c.exam)); }); return out; };
const setName = k => k ? 'Đề ' + k : 'Đề ngẫu nhiên';
function startMock(minutes, set){
  set = set || 0;
  const ids = set ? setIds(set) : [];
  if (!set) CHAPTERS.forEach(c => ids.push(...shuffle(byCh(c.ch)).slice(0, c.exam).map(q => q.id)));
  ids.forEach(id => delete orderCache[id]);
  mock = { ids, set, picks:{}, flags:{}, i:0, end: Date.now() + minutes * 60000, minutes, done:false, confirm:false };
  runTimer(); renderMock();
}
function runTimer(){
  clearInterval(tick);
  tick = setInterval(() => {
    if (!mock || mock.done){ clearInterval(tick); return; }
    const left = mock.end - Date.now();
    if (left <= 0){ finishMock(); return; }
    const el = $('timer'); if (el){ el.textContent = fmt(left); el.classList.toggle('low', left < 5 * 60000); }
  }, 1000);
}
const fmt = ms => { const s = Math.max(0, Math.round(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const Q = id => QUESTIONS.find(q => q.id === id);
function finishMock(){
  clearInterval(tick); mock.done = true;
  const score = mock.ids.filter(id => mock.picks[id] === Q(id).a).length;
  mock.score = score;
  S.mockHist.push({ at: new Date().toISOString().slice(0, 16).replace('T', ' '), score, set: mock.set || 0 });
  if (mock.set){ S.setBest = S.setBest || {}; S.setBest[mock.set] = Math.max(S.setBest[mock.set] || 0, score); }
  S.mockHist = S.mockHist.slice(-10); save();
  renderMock();
}
function renderMock(){
  if (!mock){
    const min = S.mockMin === 75 ? 75 : 60, best = S.setBest || {};
    let h = '<div class="eyebrow">Kiểm tra</div><h2 class="h-title">Thi thử 40 câu</h2><p class="h-sub">Mỗi đề có đúng số câu từng chương như đề thật (8 · 6 · 4 · 11 · 9 · 2), lấy từ ngân hàng ' + QUESTIONS.length + ' câu. Không hiện đáp án cho tới khi nộp bài.</p>';
    h += '<div class="grid2"><div class="stat"><b>40</b><span>câu hỏi</span></div><div class="stat"><b>26</b><span>câu đúng để đạt (65%)</span></div></div>';
    h += '<div class="sec"><h3>Thời gian</h3><div class="seg" role="tablist" aria-label="Thời gian làm bài"><button type="button" role="tab" data-min="60" aria-selected="' + (min === 60) + '">60 phút</button><button type="button" role="tab" data-min="75" aria-selected="' + (min === 75) + '">75 phút</button></div><p class="note" style="margin-top:-8px">75 phút áp dụng khi thi bằng ngôn ngữ không phải tiếng mẹ đẻ, ví dụ bạn thi bằng tiếng Anh.</p></div>';
    h += '<div class="sec"><h3>Chọn đề</h3><div class="sets"><button type="button" class="setcard" data-set="0"><b>Đề ngẫu nhiên</b><span>Rút lại câu hỏi mỗi lần thi</span></button>';
    for (let k = 1; k <= SET_N; k++) h += '<button type="button" class="setcard" data-set="' + k + '"><b>' + setName(k) + '</b><span>Cố định 40 câu, không trùng với các đề cố định khác</span>' + (best[k] != null ? '<span class="best">Tốt nhất ' + best[k] + '/40</span>' : '<span>Chưa làm</span>') + '</button>';
    h += '</div><p class="note">Gợi ý: làm lần lượt Đề 1, 2, 3 để gặp hết ngân hàng câu hỏi; dùng đề ngẫu nhiên để ôn lại.</p></div>';
    if (S.mockHist.length) h += '<div class="sec"><h3>Các lần thi gần đây</h3><div class="tbl-wrap"><table class="res"><tr><th>Thời điểm</th><th>Đề</th><th>Điểm</th><th>Kết quả</th></tr>' + S.mockHist.slice().reverse().map(r => '<tr><td>' + r.at + '</td><td>' + setName(r.set) + '</td><td class="num">' + r.score + '/40</td><td>' + (r.score >= 26 ? 'Đạt' : 'Chưa đạt') + '</td></tr>').join('') + '</table></div></div>';
    $('view').innerHTML = h;
    $('view').querySelectorAll('[data-min]').forEach(b => b.onclick = () => { S.mockMin = +b.dataset.min; save(); renderMock(); });
    $('view').querySelectorAll('.setcard').forEach(b => b.onclick = () => startMock(min, +b.dataset.set));
    return;
  }
  if (mock.done) return renderMockResult();
  const id = mock.ids[mock.i], q = Q(id), answered = Object.keys(mock.picks).length;
  let h = '<div class="actions" style="margin:0 0 12px"><h2 class="h-title" style="margin:0">Thi thử · ' + setName(mock.set) + '</h2><span class="spacer"></span><span class="note">Đã trả lời ' + answered + '/40</span><span class="timer" id="timer">' + fmt(mock.end - Date.now()) + '</span></div>';
  h += '<div class="qnav">' + mock.ids.map((x, j) => '<button type="button" class="qdot' + (mock.picks[x] != null ? ' ans' : '') + (mock.flags[x] ? ' flag' : '') + '" data-j="' + j + '"' + (j === mock.i ? ' aria-current="true"' : '') + ' aria-label="Câu ' + (j+1) + '">' + (j+1) + '</button>').join('') + '</div>';
  h += '<div class="card"><div class="qmeta"><span class="chip acc">Câu ' + (mock.i + 1) + '/40</span><span class="chip">' + q.k + '</span></div><div class="qtext">' + q.q + '</div>' + optHTML(q, mock.picks[id], false, true);
  h += '<div class="actions"><button type="button" class="btn" id="mPrev"' + (mock.i === 0 ? ' disabled' : '') + '>Câu trước</button><button type="button" class="btn" id="mFlag">' + (mock.flags[id] ? 'Bỏ đánh dấu' : 'Đánh dấu xem lại') + '</button><span class="spacer"></span><button type="button" class="btn primary" id="mNext"' + (mock.i === 39 ? ' disabled' : '') + '>Câu tiếp</button></div></div>';
  h += '<div class="actions">' + (mock.confirm
    ? '<div class="confirm"><span>Nộp bài? Còn ' + (40 - answered) + ' câu chưa trả lời (câu bỏ trống tính 0 điểm).</span><button type="button" class="btn primary" id="mSubmit2">Nộp bài</button><button type="button" class="btn" id="mCancel">Làm tiếp</button></div>'
    : '<button type="button" class="btn" id="mSubmit">Nộp bài</button>') + '<span class="spacer"></span><button type="button" class="btn" id="mQuit">Hủy bài thi</button></div>';
  $('view').innerHTML = h;
  const setI = j => { mock.i = j; renderMock(); };
  $('view').querySelectorAll('.qdot').forEach(b => b.onclick = () => setI(+b.dataset.j));
  $('view').querySelectorAll('.opt').forEach(b => b.onclick = () => { mock.picks[id] = +b.dataset.oi; renderMock(); });
  $('mPrev').onclick = () => setI(mock.i - 1); $('mNext').onclick = () => setI(mock.i + 1);
  $('mFlag').onclick = () => { mock.flags[id] = !mock.flags[id]; renderMock(); };
  const s1 = $('mSubmit'); if (s1) s1.onclick = () => { mock.confirm = true; renderMock(); };
  const s2 = $('mSubmit2'); if (s2) s2.onclick = finishMock;
  const cc = $('mCancel'); if (cc) cc.onclick = () => { mock.confirm = false; renderMock(); };
  $('mQuit').onclick = () => { if (mock.quit){ clearInterval(tick); mock = null; renderMock(); } else { mock.quit = true; $('mQuit').textContent = 'Bấm lần nữa để hủy (không lưu điểm)'; } };
}
function renderMockResult(){
  const pass = mock.score >= 26;
  let h = '<div class="eyebrow">Kết quả thi thử · ' + setName(mock.set) + '</div><div class="actions" style="margin:0 0 6px"><span class="result-big">' + mock.score + '/40</span><span class="pass-tag ' + (pass ? 'ok' : 'no') + '">' + (pass ? 'Đạt' : 'Chưa đạt') + '</span></div>';
  h += '<p class="h-sub">Điểm đạt là 26/40. ' + (pass ? (mock.score >= 30 ? 'Kết quả tốt. Nếu ổn định ở mức này, hãy làm đề chính thức A.' : 'Đạt nhưng sát ngưỡng. Ôn lại các chương có tỉ lệ thấp bên dưới.') : 'Xem chương nào sai nhiều nhất, đọc lại lý thuyết và làm lại câu hỏi của chương đó.') + '</p>';
  h += '<div class="sec"><h3>Theo chương</h3><div class="tbl-wrap"><table class="res"><tr><th>Chương</th><th>Đúng</th><th style="width:40%">Tỉ lệ</th></tr>' + CHAPTERS.map(c => {
    const ids = mock.ids.filter(id => Q(id).ch === c.ch), ok = ids.filter(id => mock.picks[id] === Q(id).a).length, pct = Math.round(ok / ids.length * 100);
    return '<tr><td>' + c.ch + '. ' + esc(c.name) + '</td><td class="num">' + ok + '/' + ids.length + '</td><td><div class="meter"><i style="width:' + pct + '%"></i></div></td></tr>';
  }).join('') + '</table></div></div>';
  const wrong = mock.ids.filter(id => mock.picks[id] !== Q(id).a);
  h += '<div class="sec"><h3>Xem lại ' + wrong.length + ' câu sai hoặc bỏ trống</h3><div class="stack">' + (wrong.length ? wrong.map(id => {
    const q = Q(id), p = mock.picks[id];
    return '<div class="rv">' + qHead(q) + '<div class="qtext">' + q.q + '</div>' + optHTML(q, p, true, false) + (p == null ? '<p class="note">Bạn bỏ trống câu này.</p>' : '') + '</div>';
  }).join('') : '<p class="note">Không có câu sai nào.</p>') + '</div></div>';
  h += '<div class="actions"><button type="button" class="btn primary" id="again">' + (mock.set ? 'Làm lại ' + setName(mock.set) : 'Thi lại đề khác') + '</button>' + (mock.set && mock.set < SET_N ? '<button type="button" class="btn" id="nextSet">Làm ' + setName(mock.set + 1) + '</button>' : '') + '<button type="button" class="btn" id="back">Về trang thi thử</button></div>';
  $('view').innerHTML = h;
  $('again').onclick = () => startMock(mock.minutes, mock.set);
  const ns = $('nextSet'); if (ns) ns.onclick = () => startMock(mock.minutes, mock.set + 1);
  $('back').onclick = () => { mock = null; renderMock(); };
}

/* ===================== Giao diện ===================== */
$('themeBtn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('istqb.theme', root.dataset.theme); } catch(e) {}
};
try { const th = localStorage.getItem('istqb.theme'); if (th) document.documentElement.dataset.theme = th; } catch(e) {}

renderNav(); render();
</script>
