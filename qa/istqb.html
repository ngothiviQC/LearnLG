  w:['Đánh giá chuyên sâu là loại chính thức nhất, tuân theo đầy đủ quy trình rà soát (gồm rà soát cá nhân); tác giả không được làm trưởng nhóm rà soát hay thư ký.','Đúng. Rà soát có hướng dẫn do tác giả chủ trì; mục tiêu gồm đào tạo người rà soát, đạt sự đồng thuận, tạo ý tưởng mới; rà soát cá nhân trước buổi họp là không bắt buộc (mục 3.2.4).','Rà soát kỹ thuật do điều phối viên dẫn dắt, người rà soát có trình độ kỹ thuật; mục tiêu là đồng thuận và quyết định về vấn đề kỹ thuật.','Rà soát không chính thức không theo quy trình cố định, không yêu cầu ghi nhận kết quả chính thức; mục tiêu chính là phát hiện bất thường.'] },
{ id:'3-07', ch:3, lo:'FL-3.2.4', k:'K2', q:'Loại rà soát nào chính thức nhất, thu thập chỉ số để cải tiến quy trình, và tác giả <b>không được</b> làm trưởng nhóm rà soát hay thư ký?',
  o:['Đánh giá chuyên sâu (inspection)','Rà soát có hướng dẫn (walkthrough)','Rà soát kỹ thuật','Rà soát không chính thức'], a:0,
  w:['Đúng.','Rà soát có hướng dẫn do tác giả dẫn dắt.','Syllabus chỉ nêu việc thu thập chỉ số ở đánh giá chuyên sâu; rà soát kỹ thuật do điều phối viên dẫn dắt.','Không có quy trình cố định.'] },
{ id:'3-08', ch:3, lo:'FL-3.2.5', k:'K1', q:'Đâu <b>KHÔNG</b> phải yếu tố thành công của rà soát?',
  o:['Mục tiêu rõ ràng và tiêu chí kết thúc đo được','Đủ thời gian chuẩn bị','Rà soát toàn bộ tài liệu 80 trang trong một buổi để tiết kiệm thời gian','Có sự ủng hộ của quản lý'], a:2,
  w:['Là yếu tố thành công.','Là yếu tố thành công.','Đúng. Nên chia nhỏ để người rà soát không mất tập trung.','Là yếu tố thành công.'] },

{ id:'3-09', ch:3, lo:'FL-3.2.2', k:'K2', q:'Trong quy trình rà soát, mỗi người tự đọc sản phẩm công việc và ghi lại bất thường, đề xuất, câu hỏi. Đây là hoạt động nào?',
  o:['Lập kế hoạch','Khởi tạo rà soát','Rà soát cá nhân','Sửa chữa và báo cáo'], a:2,
  w:['Lập kế hoạch xác định phạm vi, mục đích, tiêu chí kết thúc, người tham gia.','Khởi tạo đảm bảo mọi người sẵn sàng: có quyền truy cập tài liệu, hiểu vai trò.','Đúng (mục 3.2.2).','Đây là bước cuối: tạo báo cáo lỗi, theo dõi sửa chữa.'] },
{ id:'3-10', ch:3, lo:'FL-3.2.1', k:'K1', q:'Lợi ích của việc nhận <b>phản hồi sớm và thường xuyên</b> từ các bên liên quan là gì?',
  o:['Không cần kiểm thử động nữa','Phát hiện sớm hiểu nhầm về yêu cầu, tránh làm lại tốn kém; giúp nhóm tập trung vào tính năng có giá trị nhất','Đảm bảo yêu cầu không thay đổi trong suốt dự án','Giảm số cuộc họp với khách hàng'], a:1,
  w:['Sai.','Đúng (mục 3.2.1).','Sai: yêu cầu vẫn có thể thay đổi; phản hồi giúp xử lý thay đổi sớm.','Không phải mục tiêu.'] },
{ id:'3-11', ch:3, lo:'FL-3.1.2', k:'K2', q:'Đặc tính chất lượng nào thường được đánh giá hiệu quả bằng <b>kiểm thử tĩnh</b>, không cần chạy code?',
  o:['Thời gian phản hồi khi có tải lớn','Mức tiêu thụ bộ nhớ khi chạy','Khả năng bảo trì (độ phức tạp, vi phạm chuẩn code, code trùng lặp)','Độ ổn định khi chạy liên tục 72 giờ'], a:2,
  w:['Cần chạy hệ thống: kiểm thử động.','Cần chạy: kiểm thử động.','Đúng. Mục 3.1.2: kiểm thử tĩnh có thể đánh giá khả năng bảo trì và bảo mật, những đặc tính không phụ thuộc việc thực thi.','Cần chạy: kiểm thử động.'] },
{ id:'3-12', ch:3, lo:'FL-3.2.3', k:'K1', q:'Trong rà soát, ai chịu trách nhiệm <b>tổng thể</b> cho việc rà soát, ví dụ quyết định ai tham gia và tổ chức thời gian, địa điểm?',
  o:['Người điều phối (moderator)','Người ghi chép (scribe)','Trưởng nhóm rà soát (review leader)','Tác giả (author)'], a:2,
  w:['Người điều phối đảm bảo buổi họp hiệu quả: điều phối thảo luận, quản lý thời gian.','Người ghi chép tổng hợp bất thường và ghi lại thông tin trong buổi họp.','Đúng (mục 3.2.3).','Tác giả tạo và sửa sản phẩm công việc.'] },

/* ---------- Chương 4 ---------- */
{ id:'4-01', ch:4, lo:'FL-4.2.1', k:'K3', q:'Trường "Tuổi" nhận số nguyên, hợp lệ từ 18 đến 60. Dùng phân vùng tương đương, cần tối thiểu bao nhiêu test để bao phủ 100% các phân vùng (cả hợp lệ và không hợp lệ)?',
  o:['2','3','4','6'], a:1,
  w:['Thiếu một vùng không hợp lệ.','Đúng. 3 vùng: &lt;18, 18–60, &gt;60; mỗi vùng một giá trị.','Chỉ có 3 vùng.','6 là số giá trị của BVA 3 giá trị, không phải EP.'] },
{ id:'4-02', ch:4, lo:'FL-4.2.1', k:'K3', q:'Cùng trường "Tuổi" 18–60. Bộ giá trị nào đạt 100% bao phủ phân vùng tương đương?',
  o:['18, 60, 61','20, 40, 59','17, 30, 61','18, 30, 60'], a:2,
  w:['Thiếu vùng &lt;18.','Chỉ có vùng hợp lệ.','Đúng. Mỗi vùng có một giá trị: 17 (&lt;18), 30 (18–60), 61 (&gt;60).','Chỉ có vùng hợp lệ.'] },
{ id:'4-03', ch:4, lo:'FL-4.2.2', k:'K3', q:'Số lượng mua hợp lệ từ 1 đến 10 (số nguyên). Dùng BVA <b>2 giá trị</b>, các giá trị cần test là:',
  o:['1, 10','0, 1, 10, 11','0, 1, 2, 9, 10, 11','1, 5, 10'], a:1,
  w:['Thiếu giá trị liền kề ở vùng bên cạnh.','Đúng. Mỗi biên lấy biên và giá trị liền kề thuộc vùng bên cạnh.','Đây là BVA 3 giá trị.','Không phải BVA.'] },
{ id:'4-04', ch:4, lo:'FL-4.2.2', k:'K3', q:'Cùng phạm vi 1–10. Dùng BVA <b>3 giá trị</b> thì có bao nhiêu giá trị cần test?',
  o:['4','5','6','8'], a:2,
  w:['Đó là BVA 2 giá trị.','Thiếu một giá trị.','Đúng. 0, 1, 2 và 9, 10, 11.','Thừa.'] },
{ id:'4-05', ch:4, lo:'FL-4.2.2', k:'K3', q:'Phạm vi hợp lệ 1–10, dùng BVA 2 giá trị. Bộ test hiện có các giá trị 1, 10, 11. Độ bao phủ BVA là bao nhiêu?',
  o:['50%','67%','75%','100%'], a:2,
  w:['Sai.','Sai mẫu số.','Đúng. Hạng mục bao phủ: 0, 1, 10, 11 (4 giá trị). Đã test 3 → 75%.','Còn thiếu giá trị 0.'] },
{ id:'4-06', ch:4, lo:'FL-4.2.3', k:'K3', q:'Quy tắc ưu đãi có 3 điều kiện đúng/sai: khách VIP?, đơn ≥ 500k?, có mã voucher? Bảng quyết định đầy đủ (chưa rút gọn) có bao nhiêu cột?',
  o:['3','6','8','9'], a:2,
  w:['Đó là số điều kiện.','Sai.','Đúng. 2³ = 8.','Sai.'] },
{ id:'4-07', ch:4, lo:'FL-4.2.3', k:'K3', q:`Bảng quyết định ưu đãi:
<div class="tbl-wrap"><table class="res"><tr><th></th><th>R1</th><th>R2</th><th>R3</th><th>R4</th></tr>
<tr><td>Khách VIP</td><td>T</td><td>T</td><td>F</td><td>F</td></tr>
<tr><td>Đơn ≥ 500k</td><td>T</td><td>F</td><td>T</td><td>F</td></tr>
<tr><td>Hành động</td><td>Giảm 20%</td><td>Giảm 10%</td><td>Freeship</td><td>Không ưu đãi</td></tr></table></div>
Khách thường đặt đơn 600.000đ. Kết quả mong đợi là gì?`,
  o:['Giảm 20%','Giảm 10%','Freeship','Không ưu đãi'], a:2,
  w:['Đây là R1 (VIP).','Đây là R2 (VIP, đơn &lt;500k).','Đúng. Khách thường (F) và đơn ≥ 500k (T) → R3.','Đây là R4 (đơn &lt;500k).'] },
{ id:'4-08', ch:4, lo:'FL-4.2.3', k:'K3', q:'Với bảng quyết định 4 cột ở câu trên, bộ test gồm: (a) VIP, đơn 700k; (b) VIP, đơn 200k; (c) VIP, đơn 900k. Độ bao phủ bảng quyết định là:',
  o:['25%','50%','75%','100%'], a:1,
  w:['Sai.','Đúng. (a) và (c) cùng là R1, (b) là R2 → 2/4 cột = 50%.','Sai: (a) và (c) trùng cột.','Sai.'] },
{ id:'4-09', ch:4, lo:'FL-4.2.4', k:'K3', q:`Trạng thái đơn hàng: Chờ thanh toán →(thanh toán)→ Đã thanh toán →(giao)→ Đang giao →(nhận hàng)→ Đã giao. Ngoài ra: Chờ thanh toán →(hủy)→ Đã hủy; Đã thanh toán →(hủy)→ Đã hủy.<br>Mỗi test bắt đầu từ "Chờ thanh toán". Cần tối thiểu bao nhiêu test để đạt 100% <b>bao phủ chuyển đổi trạng thái hợp lệ</b>?`,
  o:['2','3','4','5'], a:1,
  w:['Không đủ: có 2 chuyển đổi tới Đã hủy từ 2 trạng thái khác nhau.','Đúng. T1: Chờ TT → Đã TT → Đang giao → Đã giao; T2: Chờ TT → Đã hủy; T3: Chờ TT → Đã TT → Đã hủy.','Thừa.','5 là số chuyển đổi, không phải số test tối thiểu.'] },
{ id:'4-10', ch:4, lo:'FL-4.2.4', k:'K3', q:'Cùng sơ đồ trạng thái ở câu trên. Cần tối thiểu bao nhiêu test để đạt 100% <b>bao phủ tất cả trạng thái</b>?',
  o:['1','2','3','5'], a:1,
  w:['Một đường không thể vừa tới Đã giao vừa tới Đã hủy.','Đúng. T1 đi qua 4 trạng thái tới Đã giao; T2 tới Đã hủy.','Thừa.','5 là số trạng thái.'] },
{ id:'4-11', ch:4, lo:'FL-4.2.4', k:'K2', q:'Để đạt <b>bao phủ tất cả chuyển đổi trạng thái</b> (all transitions) cho sơ đồ trên, ngoài các chuyển đổi hợp lệ còn cần test điều gì?',
  o:['Mọi trạng thái được đi qua ít nhất 2 lần','Thử các chuyển đổi không hợp lệ, ví dụ chọn "Hủy" khi đơn đã ở trạng thái Đã giao','Mọi đường đi có thể có từ đầu đến cuối','Mọi giá trị biên của số tiền đơn hàng'], a:1,
  w:['Không phải định nghĩa.','Đúng. All transitions = mọi chuyển đổi hợp lệ + thử mọi chuyển đổi không hợp lệ.','Không phải định nghĩa.','Đó là BVA.'] },
{ id:'4-12', ch:4, lo:'FL-4.3.1, FL-4.3.2', k:'K2', q:`Đoạn code:<pre class="syn">if (tong &gt;= 500000) {
  phi_ship = 0
}
tinh_tien()</pre>Chỉ có một test với tong = 600000. Độ bao phủ câu lệnh và bao phủ nhánh lần lượt là:`,
  o:['100% câu lệnh, 100% nhánh','67% câu lệnh, 67% nhánh','100% câu lệnh, 67% nhánh','100% câu lệnh, 50% nhánh'], a:2,
  w:['Chưa thực thi nhánh sai của if (từ if đi thẳng tới tinh_tien()).','Sai: cả 3 câu lệnh (if, phi_ship = 0, tinh_tien()) đều được thực thi.','Đúng. Đồ thị luồng điều khiển có 3 nhánh: if → phi_ship = 0 (đúng), if → tinh_tien() (sai), phi_ship = 0 → tinh_tien() (vô điều kiện). Test đi qua 2/3 nhánh ≈ 67%. Mục 4.3.2: nhánh gồm cả có điều kiện và vô điều kiện.','Sai: 50% là khi chỉ đếm 2 kết quả đúng/sai của if. Theo syllabus, nhánh vô điều kiện cũng được tính nên tổng là 3 nhánh.'] },
{ id:'4-13', ch:4, lo:'FL-4.3.2', k:'K2', q:'Phát biểu nào đúng?',
  o:['100% bao phủ câu lệnh đảm bảo 100% bao phủ nhánh','100% bao phủ nhánh đảm bảo 100% bao phủ câu lệnh','Bao phủ câu lệnh và nhánh luôn bằng nhau','Bao phủ nhánh chỉ tính các nhánh có điều kiện, không tính nhánh vô điều kiện'], a:1,
  w:['Sai: ví dụ if không có else.','Đúng.','Sai.','Sai: nhánh gồm cả có điều kiện và vô điều kiện.'] },
{ id:'4-14', ch:4, lo:'FL-4.3.3', k:'K2', q:'Điểm yếu cơ bản của kiểm thử hộp trắng là gì?',
  o:['Không đo được độ bao phủ','Chỉ dùng được khi spec đầy đủ','Không phát hiện được yêu cầu bị bỏ sót, chưa được cài đặt','Chỉ áp dụng ở mức kiểm thử hệ thống'], a:2,
  w:['Sai: đo bao phủ là điểm mạnh.','Sai: hộp trắng vẫn dùng được khi spec mơ hồ.','Đúng. Không có code thì không có gì để bao phủ.','Sai.'] },
{ id:'4-15', ch:4, lo:'FL-4.4.1', k:'K2', q:'Dựa trên kinh nghiệm các dự án trước, QC lập danh sách lỗi hay gặp (bấm 2 lần, mất mạng giữa chừng, nhập emoji, số âm) rồi thiết kế test để "tấn công" từng lỗi. Đây là:',
  o:['Phân vùng tương đương','Đoán lỗi (tấn công lỗi – fault attacks)','Bảng quyết định','Kiểm thử chấp nhận'], a:1,
  w:['Không phải.','Đúng. Tấn công lỗi (fault attacks) là cách làm có hệ thống của đoán lỗi.','Không phải.','Không phải.'] },
{ id:'4-16', ch:4, lo:'FL-4.4.2', k:'K2', q:'Khi nào kiểm thử khám phá đặc biệt hữu ích?',
  o:['Khi spec đầy đủ và đã được phê duyệt chính thức','Khi cần chứng minh 100% bao phủ nhánh','Khi spec ít hoặc thiếu và thời gian kiểm thử gấp','Khi kiểm thử theo yêu cầu quy định cần tài liệu đầy đủ'], a:2,
  w:['Lúc đó kỹ thuật chính thức phù hợp hơn.','Đó là hộp trắng.','Đúng.','Không phù hợp nhất.'] },
{ id:'4-17', ch:4, lo:'FL-4.5.1', k:'K1', q:'3C của user story là gì?',
  o:['Card, Conversation, Confirmation','Code, Commit, Coverage','Criteria, Coverage, Completion','Card, Code, Confirmation'], a:0,
  w:['Đúng.','Sai.','Sai.','Sai.'] },
{ id:'4-18', ch:4, lo:'FL-4.5.2', k:'K2', q:'Tiêu chí chấp nhận viết theo dạng "Given voucher VIP20 hết lượt / When khách áp mã / Then hiển thị \'Mã đã hết lượt\'" thuộc dạng nào?',
  o:['Hướng quy tắc (rule-oriented)','Hướng kịch bản (scenario-oriented)','Bảng quyết định','Checklist'], a:1,
  w:['Hướng quy tắc là danh sách gạch đầu dòng hoặc bảng input–output.','Đúng.','Không phải.','Không phải.'] },
{ id:'4-19', ch:4, lo:'FL-4.5.3', k:'K2', q:'Phát biểu nào đúng về ATDD?',
  o:['Test được viết sau khi cài đặt xong, do riêng tester','Test được viết trước khi cài đặt, từ tiêu chí chấp nhận, bởi nhóm có business, dev và tester','ATDD chỉ áp dụng ở mức kiểm thử thành phần','ATDD thay thế hoàn toàn kiểm thử hệ thống'], a:1,
  w:['Sai.','Đúng.','Sai.','Sai.'] },

{ id:'4-20', ch:4, lo:'FL-4.2.1', k:'K3', q:'Phí ship theo giá trị đơn (số nguyên, nghìn đồng): đơn dưới 200 phí 30; từ 200 đến dưới 500 phí 15; từ 500 trở lên miễn phí. Giá trị đơn ≤ 0 là không hợp lệ. Có bao nhiêu phân vùng tương đương cho giá trị đơn?',
  o:['3','4','5','6'], a:1,
  w:['Thiếu phân vùng không hợp lệ ≤ 0.','Đúng. ≤ 0 (không hợp lệ), 1–199, 200–499, ≥ 500.','Thừa: không có phân vùng không hợp lệ phía trên vì không có giới hạn trên.','Thừa.'] },
{ id:'4-21', ch:4, lo:'FL-4.2.1', k:'K3', q:'Trường "Tuổi" có các phân vùng: P1 dưới 18, P2 từ 18 đến 60, P3 trên 60. Bộ test gồm các giá trị 17, 25, 30, 45. Độ bao phủ phân vùng tương đương là:',
  o:['33%','50%','67%','100%'], a:2,
  w:['Sai: đã bao phủ 2 phân vùng.','Sai.','Đúng. 17 thuộc P1; 25, 30, 45 cùng thuộc P2; chưa có giá trị nào thuộc P3 → 2/3 ≈ 67%.','Sai: thiếu P3 (ví dụ 61).'] },
{ id:'4-22', ch:4, lo:'FL-4.2.2', k:'K3', q:'Mật khẩu hợp lệ dài từ 8 đến 20 ký tự. Dùng BVA <b>2 giá trị</b>, các độ dài cần kiểm thử là:',
  o:['8, 20','7, 8, 20, 21','8, 9, 19, 20','7, 8, 9, 19, 20, 21'], a:1,
  w:['Thiếu hai giá trị biên của các phân vùng không hợp lệ.','Đúng. BVA 2 giá trị: mỗi biên lấy giá trị biên và giá trị liền kề thuộc phân vùng bên cạnh: 7 | 8 và 20 | 21.','Đây là các giá trị bên trong phân vùng hợp lệ, thiếu giá trị không hợp lệ.','Đây là BVA 3 giá trị.'] },
{ id:'4-23', ch:4, lo:'FL-4.2.2', k:'K3', q:'Đơn hàng từ 500 (nghìn đồng) trở lên được giảm giá; giá trị đơn là số nguyên theo nghìn đồng. Dùng BVA <b>3 giá trị</b> cho biên giữa "không giảm" và "được giảm", các giá trị cần kiểm thử là:',
  o:['499, 500','499, 500, 501','498, 499, 500, 501','500, 501, 502'], a:2,
  w:['Đây là BVA 2 giá trị.','Thiếu 498: 499 cũng là giá trị biên (của phân vùng "không giảm") nên cần cả hai giá trị liền kề của nó.','Đúng. Hai giá trị biên là 499 và 500. Với mỗi giá trị biên lấy chính nó và hai giá trị liền kề: 498, 499, 500 và 499, 500, 501 → gộp lại 498, 499, 500, 501.','Sai: thiếu phía phân vùng "không giảm".'] },
{ id:'4-24', ch:4, lo:'FL-4.2.3', k:'K2', q:'Trong bảng quyết định đã rút gọn, ký hiệu "–" ở một ô điều kiện có nghĩa là gì?',
  o:['Điều kiện đó sai (F)','Giá trị của điều kiện không ảnh hưởng tới hành động của quy tắc đó','Quy tắc đó là tổ hợp không khả thi','Chưa xác định kết quả mong đợi'], a:1,
  w:['Sai: F được ghi là F.','Đúng. Mục 4.2.3: "–" nghĩa là giá trị của điều kiện không liên quan tới hành động, giúp gộp nhiều cột thành một.','Sai: tổ hợp không khả thi thường bị loại khỏi bảng hoặc đánh dấu riêng.','Sai.'] },
{ id:'4-25', ch:4, lo:'FL-4.2.3', k:'K3', q:`Bảng quyết định đổi trả hàng:
<div class="tbl-wrap"><table class="res"><tr><th></th><th>R1</th><th>R2</th><th>R3</th></tr>
<tr><td>Trong vòng 7 ngày</td><td>T</td><td>T</td><td>F</td></tr>
<tr><td>Còn tem nhãn</td><td>T</td><td>F</td><td>–</td></tr>
<tr><td>Hành động</td><td>Hoàn tiền 100%</td><td>Đổi hàng, không hoàn tiền</td><td>Từ chối</td></tr></table></div>
Khách mua hàng 10 ngày trước, hàng còn nguyên tem nhãn. Kết quả mong đợi là gì?`,
  o:['Hoàn tiền 100%','Đổi hàng, không hoàn tiền','Từ chối','Không xác định được từ bảng'], a:2,
  w:['Sai: R1 cần mua trong vòng 7 ngày.','Sai: R2 cũng cần trong vòng 7 ngày.','Đúng. Quá 7 ngày (F) → R3; điều kiện tem nhãn là "–" nên không ảnh hưởng.','Sai: R3 bao gồm mọi trường hợp quá 7 ngày.'] },
{ id:'4-26', ch:4, lo:'FL-4.2.4', k:'K3', q:'Giỏ hàng có các chuyển đổi hợp lệ: Trống →(thêm)→ Có hàng; Có hàng →(thêm)→ Có hàng; Có hàng →(xóa hết)→ Trống; Có hàng →(thanh toán)→ Đang thanh toán; Đang thanh toán →(hủy)→ Có hàng; Đang thanh toán →(xác nhận)→ Đã đặt.<br>Một test đi: Trống → thêm → thanh toán → xác nhận. Độ bao phủ <b>chuyển đổi hợp lệ</b> đạt được là:',
  o:['33%','50%','67%','100%'], a:1,
  w:['Sai: đi qua 3 chuyển đổi chứ không phải 2.','Đúng. Có 6 chuyển đổi hợp lệ, test đi qua 3 (Trống→Có hàng, Có hàng→Đang TT, Đang TT→Đã đặt) → 3/6 = 50%.','Sai.','Sai: chưa đi qua thêm-khi-có-hàng, xóa hết và hủy.'] },
{ id:'4-27', ch:4, lo:'FL-4.2.4', k:'K3', q:'Cùng sơ đồ giỏ hàng ở câu trên (6 chuyển đổi hợp lệ, "Đã đặt" là trạng thái kết thúc). Mỗi test bắt đầu từ "Trống". Cần tối thiểu bao nhiêu test để đạt 100% bao phủ chuyển đổi hợp lệ?',
  o:['1','2','3','6'], a:0,
  w:['Đúng. Một đường đi qua cả 6: Trống →thêm→ Có hàng →thêm→ Có hàng →xóa hết→ Trống →thêm→ Có hàng →thanh toán→ Đang TT →hủy→ Có hàng →thanh toán→ Đang TT →xác nhận→ Đã đặt. Chỉ có một trạng thái kết thúc nên không cần tách test.','Thừa: các chuyển đổi đều có thể nối vào một đường trước khi tới Đã đặt.','Thừa.','6 là số chuyển đổi, không phải số test tối thiểu.'] },
{ id:'4-28', ch:4, lo:'FL-4.3.1, FL-4.3.2', k:'K2', q:`Đoạn code:<pre class="syn">if (tong &gt;= 500000) {
  giam = 50000
}
phi = 30000
if (la_thanh_vien) {
  phi = 0
}</pre>Cần tối thiểu bao nhiêu test để đạt 100% bao phủ câu lệnh và 100% bao phủ nhánh?`,
  o:['1 test cho câu lệnh, 1 test cho nhánh','1 test cho câu lệnh, 2 test cho nhánh','2 test cho câu lệnh, 2 test cho nhánh','2 test cho câu lệnh, 4 test cho nhánh'], a:1,
  w:['Sai: một test không thể đi qua cả kết quả đúng và sai của cùng một if.','Đúng. Câu lệnh: 1 test (tong ≥ 500000, là thành viên) chạy mọi câu lệnh. Nhánh: cần thêm 1 test cho kết quả sai của cả hai if (tong < 500000, không phải thành viên) → 2 test.','Sai: 1 test đủ cho câu lệnh.','Sai: 4 là số tổ hợp điều kiện, bao phủ nhánh không yêu cầu mọi tổ hợp.'] },
{ id:'4-29', ch:4, lo:'FL-4.3.3', k:'K2', q:'Đâu là <b>giá trị</b> của kiểm thử hộp trắng?',
  o:['Phát hiện được các yêu cầu bị thiếu trong đặc tả','Không cần kiến thức về code','Đo được độ bao phủ code một cách khách quan và phát hiện lỗi trong code ngay cả khi đặc tả mơ hồ, lỗi thời hoặc thiếu; dùng được cả trong kiểm thử tĩnh (chạy thử code trên giấy)','Đảm bảo hệ thống đáp ứng nhu cầu người dùng'], a:2,
  w:['Sai: đây là điểm yếu. Code không hiện thực yêu cầu nào đó thì hộp trắng không thấy được phần bị thiếu.','Sai: hộp trắng dựa trên cấu trúc bên trong.','Đúng (mục 4.3.3).','Sai: đó là mục tiêu của thẩm định, ví dụ kiểm thử chấp nhận.'] },
{ id:'4-30', ch:4, lo:'FL-4.1.1', k:'K2', q:'Đặc điểm chung của các kỹ thuật kiểm thử <b>hộp đen</b> là gì?',
  o:['Dựa trên cấu trúc bên trong như code, kiến trúc, luồng dữ liệu','Dựa trên phân tích hành vi được đặc tả của đối tượng kiểm thử; test case vẫn dùng được khi code thay đổi nhưng hành vi không đổi','Dựa chủ yếu vào kinh nghiệm và trực giác của tester','Chỉ dùng được ở cấp kiểm thử hệ thống'], a:1,
  w:['Đó là kỹ thuật hộp trắng.','Đúng (mục 4.1).','Đó là kỹ thuật dựa trên kinh nghiệm.','Sai: dùng được ở mọi cấp.'] },
{ id:'4-31', ch:4, lo:'FL-4.4.3', k:'K2', q:'Phát biểu nào đúng về <b>kiểm thử dựa trên checklist</b>?',
  o:['Checklist nên gồm cả những mục mà công cụ có thể kiểm tra tự động','Checklist chỉ dùng được khi có đặc tả chi tiết','Checklist cần cập nhật thường xuyên dựa trên phân tích lỗi; mục cũ có thể kém hiệu quả khi dev đã học được cách tránh lỗi đó','Checklist càng dài, càng chi tiết thì càng tốt'], a:2,
  w:['Sai: mục kiểm tra tự động được không nên đưa vào checklist.','Sai: khi thiếu test case chi tiết, checklist càng hữu ích.','Đúng (mục 4.4.3).','Sai: checklist không nên quá dài.'] },
{ id:'4-32', ch:4, lo:'FL-4.4.2', k:'K2', q:'Điều nào đúng về <b>kiểm thử khám phá theo phiên</b> (session-based)?',
  o:['Không có mục tiêu, tester làm tùy hứng','Thực hiện trong khung thời gian xác định, theo test charter có mục tiêu; sau phiên có trao đổi với bên liên quan','Chỉ phù hợp cho tester mới vào nghề','Phải viết đầy đủ test case trước khi bắt đầu phiên'], a:1,
  w:['Sai: luôn có mục tiêu trong charter.','Đúng. Tester dùng session sheet ghi lại các bước đã làm và phát hiện (mục 4.4.2).','Sai: hiệu quả phụ thuộc nhiều vào kinh nghiệm, kiến thức nghiệp vụ và kỹ năng phân tích của tester.','Sai: thiết kế, thực thi và đánh giá diễn ra đồng thời trong phiên.'] },
{ id:'4-33', ch:4, lo:'FL-4.5.1', k:'K2', q:'User story "Là khách hàng, tôi muốn trang web chạy nhanh" bị QC đánh giá là chưa đạt. Story này vi phạm tiêu chí nào của INVEST rõ nhất?',
  o:['Independent (độc lập)','Negotiable (thương lượng được)','Small (nhỏ)','Testable (kiểm thử được)'], a:3,
  w:['Không phải vấn đề chính.','Không phải vấn đề chính.','Không phải vấn đề chính.','Đúng. "Nhanh" không đo được; cần tiêu chí chấp nhận cụ thể, ví dụ "trang danh sách tải xong dưới 2 giây".'] },

/* ---------- Chương 5 ---------- */
{ id:'5-01', ch:5, lo:'FL-5.1.1', k:'K2', q:'Nội dung nào <b>ít khả năng</b> nằm trong kế hoạch kiểm thử?',
  o:['Phạm vi và mục tiêu kiểm thử','Danh sách rủi ro','Mã nguồn của các script kiểm thử tự động','Ngân sách và lịch'], a:2,
  w:['Có trong kế hoạch.','Có trong kế hoạch.','Đúng. Mã script là sản phẩm kiểm thử, không phải nội dung kế hoạch.','Có trong kế hoạch.'] },
{ id:'5-02', ch:5, lo:'FL-5.1.3', k:'K2', q:'Đâu là một <b>tiêu chí kết thúc (exit criteria)</b>?',
  o:['Môi trường test đã sẵn sàng','Build đã qua smoke test','Đã có tài liệu yêu cầu','Không còn lỗi Critical nào đang mở'], a:3,
  w:['Tiêu chí bắt đầu.','Tiêu chí bắt đầu.','Tiêu chí bắt đầu.','Đúng.'] },
{ id:'5-03', ch:5, lo:'FL-5.1.4', k:'K3', q:'Ước lượng ba điểm cho việc test module voucher: lạc quan a = 6 giờ, khả dĩ nhất m = 9 giờ, bi quan b = 18 giờ. Kết quả ước lượng E ± SD là:',
  o:['11 ± 4 giờ','9 ± 2 giờ','10 ± 2 giờ','10 ± 3 giờ'], a:2,
  w:['(6+9+18)/3 = 11 là trung bình cộng, sai công thức.','Sai.','Đúng. E = (6 + 4×9 + 18)/6 = 60/6 = 10; SD = (18 − 6)/6 = 2.','SD sai.'] },
{ id:'5-04', ch:5, lo:'FL-5.1.4', k:'K3', q:'Các dự án trước có tỉ lệ công sức dev : test = 3 : 2. Dự án mới ước lượng 600 giờ dev. Dùng ước lượng dựa trên tỷ lệ, công sức test là:',
  o:['200 giờ','300 giờ','400 giờ','900 giờ'], a:2,
  w:['Sai.','Sai.','Đúng. 600 × 2/3 = 400.','Đó là 600 × 3/2, đảo ngược tỉ lệ.'] },
{ id:'5-05', ch:5, lo:'FL-5.1.4', k:'K2', q:'Mỗi thành viên tự ước lượng, công bố cùng lúc; những người có ước lượng chênh lệch nhiều giải thích lý do, sau đó cả nhóm ước lượng lại cho tới khi đồng thuận. Đây là kỹ thuật nào?',
  o:['Ước lượng ba điểm','Ngoại suy','Wideband Delphi (planning poker là một biến thể)','Ước lượng dựa trên tỷ lệ'], a:2,
  w:['Không phải.','Không phải.','Đúng.','Không phải.'] },
{ id:'5-06', ch:5, lo:'FL-5.1.5', k:'K3', q:'Có 4 test case (1 là ưu tiên cao nhất): TC-A ưu tiên 1, cần TC-C chạy trước; TC-B ưu tiên 2; TC-C ưu tiên 3; TC-D ưu tiên 1, không phụ thuộc. Thứ tự thực thi hợp lý nhất:',
  o:['A, C, D, B','D, A, C, B','D, C, A, B','C, B, A, D'], a:2,
  w:['A không chạy trước C được.','A không chạy trước C được.','Đúng. D (ưu tiên 1, sẵn sàng) → C (tiên quyết của A) → A → B.','Chạy B và C trước các case ưu tiên 1 là sai.'] },
{ id:'5-07', ch:5, lo:'FL-5.1.6', k:'K1', q:'Theo tháp kiểm thử, tầng dưới cùng có đặc điểm gì?',
  o:['Ít test, chạy chậm, kiểm tra end-to-end qua giao diện','Nhiều test nhỏ, độc lập, chạy nhanh','Chỉ gồm kiểm thử thủ công','Chỉ gồm kiểm thử hiệu năng'], a:1,
  w:['Đó là tầng trên cùng.','Đúng.','Sai.','Sai.'] },
{ id:'5-08', ch:5, lo:'FL-5.1.7', k:'K2', q:'Kiểm thử khám phá, kiểm thử tính khả dụng và UAT thuộc góc phần tư nào?',
  o:['Q1: công nghệ, hỗ trợ nhóm','Q2: nghiệp vụ, hỗ trợ nhóm','Q3: nghiệp vụ, đánh giá sản phẩm','Q4: công nghệ, đánh giá sản phẩm'], a:2,
  w:['Q1 là component test.','Q2 là functional test, user story test.','Đúng.','Q4 là smoke test và phi chức năng (trừ usability).'] },
{ id:'5-09', ch:5, lo:'FL-5.2.1', k:'K3', q:'Rủi ro A: khả năng 4, ảnh hưởng 2. Rủi ro B: khả năng 2, ảnh hưởng 5. Rủi ro C: khả năng 3, ảnh hưởng 3 (thang 1–5). Rủi ro nào cần ưu tiên kiểm thử nhất?',
  o:['A','B','C','Ba rủi ro ngang nhau'], a:1,
  w:['A = 8.','Đúng. B = 10, cao nhất (C = 9, A = 8).','C = 9.','Không ngang nhau.'] },
{ id:'5-10', ch:5, lo:'FL-5.2.2', k:'K2', q:'Đâu là <b>rủi ro sản phẩm</b>?',
  o:['Tester chủ chốt nghỉ việc giữa dự án','Nhà cung cấp bàn giao môi trường test trễ 2 tuần','Hệ thống tính sai tổng tiền khi áp nhiều voucher','Ước lượng công sức test quá thấp'], a:2,
  w:['Rủi ro dự án.','Rủi ro dự án.','Đúng. Liên quan trực tiếp tới chất lượng sản phẩm.','Rủi ro dự án.'] },
{ id:'5-11', ch:5, lo:'FL-5.2.4', k:'K2', q:'Công ty ký hợp đồng để đơn vị cổng thanh toán chịu toàn bộ trách nhiệm bồi hoàn nếu giao dịch lỗi do phía họ. Đây là phản ứng rủi ro nào?',
  o:['Giảm thiểu bằng kiểm thử','Chấp nhận rủi ro','Chuyển giao rủi ro','Kế hoạch dự phòng'], a:2,
  w:['Không phải: không có kiểm thử nào ở đây.','Không phải.','Đúng. Rủi ro được chuyển sang bên khác.','Kế hoạch dự phòng là chuẩn bị sẵn hành động nếu rủi ro xảy ra.'] },
{ id:'5-12', ch:5, lo:'FL-5.4.1', k:'K2', q:'Quản lý cấu hình hỗ trợ kiểm thử như thế nào?',
  o:['Tự động sinh test case từ yêu cầu','Xác định, quản lý phiên bản và theo dõi thay đổi của đối tượng kiểm thử và sản phẩm kiểm thử để kết quả tái hiện được','Thay thế cho quản lý lỗi','Đo độ bao phủ code'], a:1,
  w:['Không phải.','Đúng.','Không phải.','Không phải.'] },
{ id:'5-13', ch:5, lo:'FL-5.5.1', k:'K3', q:'Báo cáo lỗi có: ID, tiêu đề, môi trường, build, các bước tái hiện, kết quả thực tế ("hoàn 500.000đ"), severity, priority. Thông tin quan trọng nào còn thiếu?',
  o:['Tên của dev sẽ sửa','Kết quả mong đợi','Ước lượng thời gian sửa','Danh sách người rà soát'], a:1,
  w:['Không bắt buộc ở báo cáo.','Đúng. Thiếu kết quả mong đợi ("hoàn đúng 447.000đ đã thu") thì dev không biết thế nào là đúng.','Không phải nội dung báo cáo lỗi.','Không phải nội dung báo cáo lỗi.'] },

{ id:'5-14', ch:5, lo:'FL-5.1.1', k:'K2', q:'Đâu là <b>mục đích</b> của kế hoạch kiểm thử?',
  o:['Ghi lại kết quả của từng test case đã chạy','Mô tả mục tiêu, nguồn lực và quy trình kiểm thử; là phương tiện giao tiếp với các bên liên quan và cho thấy kiểm thử tuân thủ chính sách, chiến lược kiểm thử','Là hợp đồng cố định, không được thay đổi sau khi duyệt','Chỉ dùng trong mô hình thác nước'], a:1,
  w:['Đó là nhật ký kiểm thử.','Đúng (mục 5.1.1).','Sai: kế hoạch được cập nhật khi dự án thay đổi.','Sai: mọi mô hình đều cần lập kế hoạch, chỉ khác hình thức.'] },
{ id:'5-15', ch:5, lo:'FL-5.1.2', k:'K1', q:'Trong buổi <b>lập kế hoạch vòng lặp</b> (iteration planning), tester đóng góp bằng cách nào?',
  o:['Quyết định thứ tự ưu tiên của backlog thay PO','Tham gia phân tích rủi ro chi tiết của user story, đánh giá khả năng kiểm thử, chia nhỏ thành nhiệm vụ kiểm thử và ước lượng công sức','Ký duyệt ngân sách dự án','Chỉ nhận test case do BA viết sẵn'], a:1,
  w:['Sai: đó là quyền của PO.','Đúng (mục 5.1.2). Tester cũng xác định các khía cạnh chức năng và phi chức năng cần kiểm thử.','Không phải.','Sai: tester chủ động thiết kế test.'] },
{ id:'5-16', ch:5, lo:'FL-5.1.3', k:'K2', q:'Trong Agile, tiêu chí <b>kết thúc</b> (exit criteria) thường được gọi là gì?',
  o:['Definition of Ready','Definition of Done','Sprint Goal','Product Vision'], a:1,
  w:['Đó là tiêu chí bắt đầu (entry criteria) của một user story.','Đúng (mục 5.1.3).','Sprint Goal là mục tiêu của sprint, không phải tiêu chí kết thúc.','Không phải.'] },
{ id:'5-17', ch:5, lo:'FL-5.1.4', k:'K3', q:'Ước lượng ba điểm cho việc kiểm thử module hoàn tiền: lạc quan a = 4 giờ, khả dĩ nhất m = 10 giờ, bi quan b = 22 giờ. Kết quả E ± SD là:',
  o:['10 ± 3','11 ± 3','11 ± 6','12 ± 3'], a:1,
  w:['Sai: E = (a + 4m + b) / 6, không phải m.','Đúng. E = (4 + 4×10 + 22) / 6 = 66 / 6 = 11; SD = (b − a) / 6 = 18 / 6 = 3.','Sai: SD = (22 − 4) / 6 = 3.','Sai: E = 66 / 6 = 11.'] },
{ id:'5-18', ch:5, lo:'FL-5.1.5', k:'K3', q:'Có 4 test case (1 là ưu tiên cao nhất): TC-P ưu tiên 2; TC-Q ưu tiên 1, cần TC-R chạy trước; TC-R ưu tiên 3; TC-S ưu tiên 2, cần TC-P chạy trước. Thứ tự thực thi hợp lý nhất là:',
  o:['TC-R, TC-Q, TC-P, TC-S','TC-Q, TC-R, TC-P, TC-S','TC-R, TC-P, TC-Q, TC-S','TC-P, TC-S, TC-R, TC-Q'], a:0,
  w:['Đúng. TC-Q ưu tiên cao nhất nhưng phụ thuộc TC-R nên chạy TC-R trước; sau đó TC-P và TC-S (cùng ưu tiên 2, TC-S phụ thuộc TC-P).','Sai: TC-Q không chạy được trước TC-R.','Sai: TC-Q ưu tiên cao hơn TC-P nên chạy ngay khi phụ thuộc đã xong.','Sai: đẩy TC-Q (ưu tiên cao nhất) xuống cuối.'] },
{ id:'5-19', ch:5, lo:'FL-5.1.6', k:'K1', q:'Theo mô hình tháp kiểm thử, càng lên các tầng trên thì:',

{ id:'5-20', ch:5, lo:'FL-5.2.1', k:'K1', q:'<b>Mức độ rủi ro</b> được xác định bởi những yếu tố nào?',

  o:['Chỉ quyết định ai trong team sẽ làm tester','Quyết định ngôn ngữ lập trình của dự án','Không ảnh hưởng nếu đã có kế hoạch kiểm thử','Quyết định phạm vi kiểm thử, cấp và loại kiểm thử, kỹ thuật, mức độ kỹ lưỡng, thứ tự ưu tiên và công sức kiểm thử'], a:3,

{ id:'5-22', ch:5, lo:'FL-5.2.4', k:'K2', q:'Rủi ro sản phẩm: tính sai thuế với một số tỉnh có quy định riêng (khả năng cao, ảnh hưởng cao). Biện pháp <b>giảm thiểu bằng kiểm thử</b> phù hợp nhất?',

{ id:'5-23', ch:5, lo:'FL-5.3.1', k:'K1', q:'Chỉ số nào thuộc nhóm chỉ số về <b>chất lượng sản phẩm</b>?',

{ id:'5-24', ch:5, lo:'FL-5.3.2', k:'K2', q:'<b>Báo cáo tiến độ kiểm thử</b> khác <b>báo cáo hoàn thành kiểm thử</b> ở điểm nào?',

{ id:'5-25', ch:5, lo:'FL-5.3.3', k:'K2', q:'Team phân tán ở 3 múi giờ, PO cần nắm trạng thái kiểm thử hằng ngày. Cách truyền đạt nào phù hợp nhất?',
  o:['Chỉ gửi báo cáo chính thức vào cuối dự án','Họp trực tiếp mỗi sáng tại văn phòng','Dashboard tự động (kết quả CI/CD, biểu đồ lỗi) kết hợp kênh trao đổi trực tuyến','Không cần báo cáo vì đang làm Agile'], a:2,
  w:['Quá muộn với nhu cầu hằng ngày.','Không khả thi với team ở nhiều múi giờ.','Đúng. Mục 5.3.3: chọn cách truyền đạt theo bên liên quan và ngữ cảnh, ví dụ dashboard, kênh điện tử, tài liệu trực tuyến.','Sai: Agile vẫn cần minh bạch về trạng thái.'] },
{ id:'5-26', ch:5, lo:'FL-5.5.1', k:'K3', q:'Nút "Đặt hàng" không phản hồi trên Safari iOS 17 nhưng Chrome Android vẫn bình thường. Khi viết báo cáo lỗi, thông tin nào <b>quan trọng nhất</b> để dev tái hiện được?',
  o:['Tên người phát hiện lỗi','Môi trường: thiết bị, hệ điều hành và trình duyệt kèm phiên bản, build đang test','Thời gian dự kiến sửa','Số lượng người dùng bị ảnh hưởng ước tính'], a:1,
  w:['Có ích nhưng không giúp tái hiện.','Đúng. Lỗi chỉ xảy ra trên một môi trường cụ thể, thiếu thông tin này dev rất khó tái hiện.','Không phải nội dung báo cáo lỗi.','Có thể dùng để đánh giá mức ảnh hưởng nhưng không giúp tái hiện.'] },
{ id:'5-27', ch:5, lo:'FL-5.1.7', k:'K2', q:'Unit test và kiểm thử tích hợp thành phần thuộc góc phần tư kiểm thử nào?',
  o:['Q1: hướng công nghệ, hỗ trợ nhóm','Q2: hướng nghiệp vụ, hỗ trợ nhóm','Q3: hướng nghiệp vụ, đánh giá sản phẩm','Q4: hướng công nghệ, đánh giá sản phẩm'], a:0,

const GLOSSARY = {
1:[
 ['Kiểm thử','Testing','Kiểm thử phần mềm là một tập hợp nhiều hoạt động nhằm phát hiện lỗi và đánh giá chất lượng của các sản phẩm công việc (work products) của phần mềm.','Chạy testcase trên app và rà soát spec đều là kiểm thử.','1.1'],
 ['Đối tượng kiểm thử','Test object','Các sản phẩm công việc này, khi được kiểm thử, được gọi là đối tượng kiểm thử (test object).','Màn "Đơn hàng của tôi" bản build 2.4.0.','1.1'],
 ['Mục tiêu kiểm thử','Test objective','Các mục tiêu kiểm thử điển hình bao gồm: Đánh giá các sản phẩm công việc như tài liệu yêu cầu, user story, tài liệu thiết kế, và mã nguồn; Phát hiện các sự cố và tìm lỗi; Đảm bảo mức độ bao phủ cần thiết của đối tượng kiểm thử; Giảm mức rủi ro liên quan đến việc chất lượng phần mềm không đạt yêu cầu; Xác minh xem các yêu cầu đã được đáp ứng hay chưa; Xác minh rằng đối tượng kiểm thử đã tuân thủ các yêu cầu trong hợp đồng, pháp lý, và các quy định; Cung cấp đầy đủ thông tin giúp các bên liên quan đưa ra quyết định sáng suốt; Tăng niềm tin vào chất lượng của đối tượng kiểm thử; Thẩm định xem đối tượng kiểm thử đã hoàn chỉnh và hoạt động như mong đợi của các bên liên quan hay chưa','','1.1.1'],
 ['Xác minh','Verification','xác minh, tức là kiểm tra xem hệ thống có đáp ứng các yêu cầu đã được mô tả hay không','So màn hình với spec từng trường.','1.1'],
 ['Thẩm định','Validation','thẩm định (validation), tức là đánh giá xem hệ thống có đáp ứng nhu cầu của người dùng và các bên liên quan trong môi trường vận hành hay không.','Cho khách dùng thử xem luồng đặt hàng có thuận tiện không.','1.1'],
 ['Kiểm thử động / Kiểm thử tĩnh','Dynamic testing / Static testing','Các hoạt động kiểm thử có thể là kiểm thử động hoặc kiểm thử tĩnh. Kiểm thử động cần thực thi phần mềm, trong khi đó, kiểm thử tĩnh thì không. Kiểm thử tĩnh bao gồm các hoạt động rà soát và phân tích tĩnh (xem Chương 3).','Chạy testcase trên app là kiểm thử động; đọc spec tìm mâu thuẫn là kiểm thử tĩnh.','1.1'],
 ['Gỡ lỗi','Debugging','Kiểm thử và gỡ lỗi là hai hoạt động riêng biệt. […] Khi kiểm thử động (xem Chương 4) phát hiện một sự cố, hoạt động gỡ lỗi sẽ tập trung vào việc tìm nguyên nhân của sự cố này (gọi là lỗi), phân tích nguyên nhân, và loại bỏ chúng. Quy trình gỡ lỗi điển hình bao gồm các hoạt động: Tái hiện lại sự cố; Chẩn đoán (để tìm lỗi); Sửa lỗi','Dev đọc log, tìm biến null và sửa.','1.1.2'],
 ['Đảm bảo chất lượng (QA)','Quality assurance','Đảm bảo chất lượng (QA - quality assurance) là cách tiếp cận hướng quy trình và mang tính phòng ngừa, tập trung vào việc triển khai và cải tiến các quy trình phát triển phần mềm. QA dựa trên nguyên tắc nếu một quy trình tốt được tuân thủ đúng cách, thì sẽ tạo ra một sản phẩm tốt.','Quy định bắt buộc rà soát spec trước khi code.','1.2.2'],
 ['Kiểm soát chất lượng (QC)','Quality control','Kiểm thử là cách tiếp cận hướng sản phẩm và mang tính khắc phục, tập trung vào các hoạt động hỗ trợ để phần mềm đạt được mức chất lượng phù hợp. Kiểm thử là một hình thức kiểm soát chất lượng (QC - quality control) quan trọng, bên cạnh các hình thức khác bao gồm các phương pháp chính thức (kiểm tra mô hình và chứng minh tính đúng đắn), mô phỏng, và tạo mẫu.','Chạy regression trước release.','1.2.2'],
 ['Sai sót','Error / Mistake','Trong quá trình làm việc, con người có thể mắc sai sót (error / mistake), từ đó tạo ra lỗi (còn gọi là khiếm khuyết – defect / fault / bug), và các lỗi này có thể dẫn đến sự cố (failure) khi chương trình được thực thi.','Dev hiểu sai quy tắc làm tròn.','1.2.3'],
 ['Lỗi','Defect / Fault / Bug','Lỗi có thể tồn tại trong tài liệu (như tài liệu đặc tả yêu cầu, hay kịch bản kiểm thử), mã nguồn, hoặc các sản phẩm công việc hỗ trợ (ví dụ: bản build phần mềm).','Hàm làm tròn viết sai công thức.','1.2.3'],
 ['Sự cố','Failure','Khi một lỗi trong mã nguồn được thực thi, hệ thống có thể không thực hiện đúng chức năng cần thiết, hoặc thực hiện điều không nên làm, gây ra sự cố. […] Sự cố cũng có thể xảy ra do điều kiện môi trường, ví dụ như bức xạ hoặc trường điện từ gây ra lỗi trong firmware (phần mềm điều khiển được tích hợp sẵn trong thiết bị phần cứng).','Khách thấy tổng tiền lệch 100đ.','1.2.3'],
 ['Nguyên nhân gốc rễ','Root cause','Nguyên nhân gốc rễ là lý do căn bản dẫn đến sự xuất hiện của một vấn đề (ví dụ: một tình huống dẫn đến sai sót). Nguyên nhân gốc rễ được xác định thông qua các hoạt động phân tích nguyên nhân gốc rễ (RCA – root cause analysis), thường được thực hiện khi có sự cố xảy ra hoặc khi một lỗi nghiêm trọng được phát hiện.','Spec không ghi quy tắc làm tròn.','1.2.3'],
 ['Quy trình kiểm thử','Test process','Kiểm thử phụ thuộc vào ngữ cảnh, nhưng ở mức tổng thể, vẫn có các tập hoạt động kiểm thử chung mà nếu thiếu chúng thì việc kiểm thử ít có khả năng đạt được các mục tiêu kiểm thử. Các tập hoạt động này hình thành nên một quy trình kiểm thử.','Lập kế hoạch → phân tích → thiết kế → triển khai → thực thi → hoàn tất.','1.4'],
 ['Lập kế hoạch kiểm thử','Test planning','Lập kế hoạch kiểm thử bao gồm việc xác định các mục tiêu kiểm thử và sau đó lựa chọn cách tiếp cận phù hợp nhất để đạt được những mục tiêu đó, dựa vào các ràng buộc của bối cảnh tổng thể.','','1.4.1'],
 ['Giám sát kiểm thử / Kiểm soát kiểm thử','Test monitoring / Test control','Giám sát kiểm thử bao gồm việc liên tục theo dõi mọi hoạt động kiểm thử và so sánh tiến độ thực tế với kế hoạch. Kiểm soát kiểm thử bao gồm việc thực hiện mọi hành động cần thiết để đạt được các mục tiêu kiểm thử.','Lệch tiến độ → đổi ưu tiên test case.','1.4.1'],
 ['Phân tích kiểm thử','Test analysis','Phân tích kiểm thử bao gồm việc phân tích cơ sở kiểm thử để xác định các tính năng có thể kiểm thử được. Các khía cạnh kiểm thử liên quan cũng được xác định và ưu tiên hoá, có xét đến các rủi ro và mức rủi ro liên quan (xem mục 5.2). […] Phân tích kiểm thử trả lời câu hỏi “kiểm thử cái gì?” dưới dạng các tiêu chí bao phủ có thể đo lường được.','','1.4.1'],
 ['Cơ sở kiểm thử','Test basis','Phân tích kiểm thử bao gồm việc phân tích cơ sở kiểm thử để xác định các tính năng có thể kiểm thử được. […] Cơ sở kiểm thử và đối tượng kiểm thử cũng được đánh giá để tìm lỗi tiềm ẩn, và đánh giá khả năng kiểm thử của chúng.','Spec màn hoàn tiền là cơ sở kiểm thử cho các test case hoàn tiền.','1.4.1'],
 ['Khía cạnh kiểm thử','Test condition','Các khía cạnh kiểm thử liên quan cũng được xác định và ưu tiên hoá, có xét đến các rủi ro và mức rủi ro liên quan (xem mục 5.2).','"Hoàn đúng số tiền đã thu".','1.4.1'],
 ['Thiết kế test case','Test design','Thiết kế test case bao gồm việc chi tiết hóa các khía cạnh kiểm thử thành các test case và các sản phẩm kiểm thử khác (ví dụ: test charter - thẻ kiểm thử). […] Thiết kế test case trả lời câu hỏi “kiểm thử như thế nào?”.','','1.4.1'],
 ['Trường hợp kiểm thử (test case)','Test case','Thông thường, test case bao gồm các câu mô tả bằng ngôn ngữ tự nhiên, gồm các điều kiện tiên quyết nếu có (precondition), dữ liệu đầu vào, và các yêu cầu sau khi thực thi test case (postcondition).','Hủy đơn đã trả 447.000đ → mong đợi hoàn 447.000đ.','4.5.3'],
 ['Triển khai kiểm thử','Test implementation','Triển khai kiểm thử bao gồm việc tạo ra hoặc thu thập các sản phẩm kiểm thử cần thiết cho việc thực thi kiểm thử (ví dụ: dữ liệu kiểm thử).','','1.4.1'],
 ['Trình tự thực hiện kiểm thử / Bộ test case','Test procedure / Test suite','Các test case có thể được sắp xếp thành vào những trình tự thực hiện kiểm thử (test procedure), và các trình tự này sau đó thường được gom thành các bộ test case (test suite).','Đăng nhập → tạo đơn → thanh toán → hủy → kiểm tra hoàn tiền.','1.4.1'],
 ['Thực thi kiểm thử','Test execution','Thực thi kiểm thử bao gồm việc chạy các test case theo lịch thực thi kiểm thử (gọi là test run). Việc thực thi kiểm thử có thể là thủ công hoặc tự động.','','1.4.1'],
 ['Kết quả kiểm thử','Test result','Kết quả thực tế sẽ được so sánh với kết quả mong đợi để đánh giá kết quả kiểm thử. Các kết quả kiểm thử này được ghi lại.','','1.4.1'],
 ['Hoàn tất kiểm thử','Test completion','Hoàn tất kiểm thử thường diễn ra tại các mốc dự án (ví dụ: sau khi phát hành một phiên bản, kết thúc một chu kỳ phát triển, hoàn tất một mức kiểm thử nào đó).','','1.4.1'],
 ['Sản phẩm kiểm thử','Testware','Các sản phẩm kiểm thử được tạo ra như các sản phẩm công việc đầu ra từ các hoạt động kiểm thử được mô tả trong mục 1.4.1.','File testcase Excel và báo cáo lỗi đều là sản phẩm kiểm thử.','1.4.3'],
 ['Khả năng truy vết','Traceability','Để thực hiện các hoạt động giám sát và kiểm soát kiểm thử hiệu quả, việc thiết lập và duy trì khả năng truy vết trong suốt quy trình kiểm thử giữa các phần tử trong cơ sở kiểm thử, sản phẩm kiểm thử liên quan (ví dụ: khía cạnh kiểm thử, rủi ro, test case), kết quả kiểm thử, và lỗi là điều rất quan trọng.','Cột "Requirement ID" trong file testcase.','1.4.4'],
 ['Cách tiếp cận toàn đội ngũ','Whole team approach','Trong cách tiếp cận này, các thành viên trong nhóm có đủ kiến thức và kỹ năng để có thể thực hiện bất kỳ nhiệm vụ nào, và tất cả mọi người trong nhóm đều chịu trách nhiệm về chất lượng.','QC và PO cùng viết tiêu chí chấp nhận.','1.5.2'],
 ['Tính độc lập của kiểm thử','Independence of testing','Các sản phẩm công việc có thể được kiểm thử bởi chính người tạo ra nó (không có tính độc lập), đồng nghiệp trong cùng nhóm (mức độ độc lập thấp), tester bên ngoài nhóm nhưng trong cùng tổ chức (mức độ độc lập cao), và tester bên ngoài tổ chức (mức độ độc lập rất cao).','Thuê đơn vị ngoài test bảo mật.','1.5.3'],
],
2:[
 ['Mô hình SDLC','SDLC model','Một mô hình SDLC là một biểu diễn trừu tượng, ở mức khái quát cao của một quy trình phát triển phần mềm. Mô hình SDLC xác định cách các giai đoạn phát triển và các loại hoạt động khác nhau, được thực hiện trong quy trình này liên quan với nhau, cả về mặt lôgic lẫn theo trình tự thời gian.','Mô hình chữ V, Scrum.','2.1'],
 ['Phát triển Hướng Kiểm thử (TDD)','Test-Driven Development','Định hướng việc lập trình thông qua các test case (thay vì dựa vào thiết kế phần mềm chi tiết) (Beck 2003); Test case được viết trước, sau đó mã nguồn được viết để đáp ứng các test case đó, rồi tiếp tục tái cấu trúc cả test case và mã nguồn','','2.1.3'],
 ['Phát triển Hướng Kiểm thử Chấp nhận (ATDD)','Acceptance Test-Driven Development','Xây dựng test case dựa trên các tiêu chí chấp nhận như một phần của quá trình thiết kế hệ thống (Gärtner 2011); Test case được viết trước khi phát triển phần tương ứng của ứng dụng để đáp ứng các test case này','','2.1.3'],
 ['Phát triển Hướng Hành vi (BDD)','Behavior-Driven Development','Mô tả hành vi mong muốn của ứng dụng bằng các test case được viết dưới dạng ngôn ngữ tự nhiên đơn giản, dễ hiểu đối với các bên liên quan – thường sử dụng định dạng Given/When/Then (Chelimsky 2010); Sau đó, các test case này nên được tự động chuyển đổi thành các test case có thể thực thi được','Given giỏ 600k / When áp SALE10 / Then còn 540k.','2.1.3'],
 ['DevOps','DevOps','DevOps là một cách tiếp cận ở cấp độ tổ chức nhằm tạo ra sự phối hợp hiệu quả giữa việc phát triển (bao gồm các hoạt động kiểm thử) và vận hành phần mềm để cùng đạt được các mục tiêu chung.','','2.1.4'],
 ['Tích hợp liên tục / Phân phối liên tục','Continuous integration (CI) / Continuous delivery (CD)','DevOps thúc đẩy tính tự chủ của nhóm, phản hồi nhanh, áp dụng chuỗi công cụ tích hợp, và các thực hành về kỹ thuật như tích hợp liên tục (continuous integration – CI) và phân phối liên tục (continuous delivery – CD).','Mỗi lần merge, pipeline chạy unit test.','2.1.4'],
 ['Shift left (kiểm thử sớm)','Shift left','Nguyên tắc kiểm thử sớm (xem mục 1.3) đôi khi được gọi là shift left, vì đây là cách tiếp cận trong đó các hoạt động kiểm thử được thực hiện sớm hơn trong SDLC.','QC rà soát spec trước khi dev bắt đầu code.','2.1.5'],
 ['Retrospective (họp rút kinh nghiệm)','Retrospective','Các buổi retrospective (họp rút kinh nghiệm) thường được tổ chức vào cuối dự án hoặc cuối mỗi chu kỳ phát triển, tại các mốc phát hành, hoặc khi cần thiết.','Retro sprint 12: thêm checklist rà soát spec.','2.1.6'],
 ['Mức kiểm thử','Test level','Mức kiểm thử (test level) là các nhóm các hoạt động kiểm thử được tổ chức và quản lý cùng nhau. Mỗi mức kiểm thử là một thể hiện của quy trình kiểm thử, được thực hiện đối với phần mềm ở một giai đoạn phát triển nhất định, từ các thành phần riêng lẻ đến toàn bộ hệ thống hoặc, khi phù hợp, đến các hệ thống gồm nhiều hệ thống.','','2.2'],
 ['Loại kiểm thử','Test type','Loại kiểm thử (test type) là các nhóm hoạt động kiểm thử liên quan đến các đặc tính chất lượng cụ thể, và hầu hết các hoạt động này có thể được thực hiện ở mọi mức kiểm thử.','','2.2'],
 ['Kiểm thử thành phần','Component testing','Kiểm thử thành phần (còn gọi là unit testing – kiểm thử đơn vị) tập trung kiểm thử các thành phần một cách độc lập.','Test hàm tinh_giam_gia().','2.2.1'],
 ['Kiểm thử tích hợp thành phần','Component integration testing','Kiểm thử tích hợp thành phần (component integration testing) tập trung kiểm thử các điểm kết nối và sự tương tác giữa các thành phần.','Module giỏ hàng gọi module voucher.','2.2.1'],
 ['Kiểm thử hệ thống','System testing','Kiểm thử hệ thống (system testing) tập trung vào hành vi tổng thể và khả năng của toàn bộ hệ thống hoặc sản phẩm, thường bao gồm kiểm thử chức năng cho các luồng nghiệp vụ (kiểm thử end-to-end) và kiểm thử phi chức năng đối với các đặc tính chất lượng.','Đặt hàng từ đầu tới cuối trên môi trường staging.','2.2.1'],
 ['Kiểm thử tích hợp hệ thống','System integration testing','Kiểm thử tích hợp hệ thống (system integration testing) tập trung kiểm thử các điểm kết nối giữa hệ thống đang kiểm thử với các hệ thống khác hoặc các dịch vụ bên ngoài.','ShopDemo ↔ cổng thanh toán Momo.','2.2.1'],
 ['Kiểm thử chấp nhận','Acceptance testing','Kiểm thử chấp nhận (acceptance testing) tập trung vào việc xác nhận (validation) và chứng minh mức độ sẵn sàng để triển khai của hệ thống, tức là hệ thống đã đáp ứng mọi nhu cầu nghiệp vụ của người dùng.','Khách hàng duyệt bản release.','2.2.1'],
 ['Các hình thức kiểm thử chấp nhận','UAT / OAT / Contractual / Regulatory / Alpha / Beta','Các hình thức chính của kiểm thử chấp nhận bao gồm: kiểm thử chấp nhận người dùng (UAT), kiểm thử chấp nhận vận hành, kiểm thử chấp nhận theo hợp đồng, kiểm thử chấp nhận theo quy định, kiểm thử alpha, và kiểm thử beta.','Mở bản beta cho 500 khách dùng thử.','2.2.1'],
 ['Kiểm thử chức năng','Functional testing','Kiểm thử chức năng (functional testing) đánh giá các chức năng mà một thành phần hoặc hệ thống cần thực hiện. Các chức năng cho thấy hệ thống phải “làm gì”.','Áp mã SALE10 thì giảm 10%.','2.2.2'],
 ['Kiểm thử phi chức năng','Non-functional testing','Kiểm thử phi chức năng (non-functional testing) đánh giá các thuộc tính khác chức năng của thành phần hoặc hệ thống. Đây là việc đánh giá hệ thống hoạt động “tốt như thế nào”.','API phản hồi dưới 2 giây.','2.2.2'],
 ['Kiểm thử hộp đen','Black-box testing','Kiểm thử hộp đen (Black-box testing) (xem mục 4.2) là việc kiểm thử dựa trên đặc tả, trong đó các test case được thiết kế dựa vào tài liệu, không liên quan đến cấu trúc bên trong của đối tượng kiểm thử.','Phân vùng tuổi theo spec.','2.2.2'],
 ['Kiểm thử hộp trắng','White-box testing','Kiểm thử hộp trắng (White-box testing) (xem mục 4.3) là việc kiểm thử dựa trên cấu trúc, trong đó các test case được thiết kế dựa trên kiến thức về cấu trúc bên trong hoặc chính mã nguồn của hệ thống (ví dụ: mã nguồn, kiến trúc, luồng điều khiển, và luồng dữ liệu).','Đảm bảo mọi nhánh if được chạy.','2.2.2'],
 ['Kiểm thử xác nhận','Confirmation testing','Kiểm thử xác nhận xác nhận rằng lỗi đã được sửa thành công.','Chạy lại đúng case DH-2009 sau khi sửa.','2.2.3'],
 ['Kiểm thử hồi quy','Regression testing','Kiểm thử hồi quy xác nhận rằng việc thực hiện những thay đổi (bao gồm cả việc sửa lỗi đã được kiểm thử xác nhận) không gây ra các tác động tiêu cực nào.','Chạy lại bộ giỏ hàng, voucher, thanh toán.','2.2.3'],
 ['Phân tích ảnh hưởng','Impact analysis','Nên thực hiện phân tích ảnh hưởng trước để xác định phạm vi kiểm thử hồi quy cần thiết, tức là xác định những phần nào của phần mềm có thể bị ảnh hưởng.','Đổi công thức giảm giá → ảnh hưởng giỏ hàng, hóa đơn, báo cáo doanh thu.','2.2.3'],
 ['Kiểm thử bảo trì','Maintenance testing','Các yếu tố dẫn đến hoạt động bảo trì và kiểm thử bảo trì có thể được phân loại như sau: Các thay đổi trong phần mềm […]; Nâng cấp hoặc chuyển đổi môi trường vận hành […]; Ngừng sử dụng, như khi một ứng dụng kết thúc vòng đời của nó.','Test sau khi chuyển DB sang server mới.','2.3'],
 ['Mô-đun giả / Thành phần điều khiển kiểm thử','Stub / Driver','Ví dụ một số hạng mục môi trường kiểm thử bao gồm: mô-đun giả (stub), thành phần điều khiển kiểm thử (driver), trình mô phỏng (simulator), và ảo hoá dịch vụ (service virtualization).','Stub trả về dữ liệu khách cố định thay cho DB.','1.4.3'],
],
3:[
 ['Kiểm thử tĩnh','Static testing','Khác với kiểm thử động, trong kiểm thử tĩnh, phần mềm đang được kiểm thử không cần phải được thực thi (chạy). Mã nguồn, đặc tả quy trình, đặc tả kiến trúc hệ thống, hoặc các sản phẩm công việc khác đều có thể được đánh giá thông qua việc kiểm tra thủ công (ví dụ: rà soát) hoặc bằng công cụ hỗ trợ (ví dụ: phân tích tĩnh).','Đọc spec để tìm chỗ mâu thuẫn.','3.1'],
 ['Kiểm thử động','Dynamic testing','Kiểm thử tĩnh phát hiện lỗi trực tiếp, trong khi kiểm thử động phát hiện sự cố, từ đó những lỗi liên quan có thể được xác định thông qua các hoạt động phân tích tiếp theo','Chạy testcase trên app.','3.1.3'],
 ['Rà soát','Review','Bất kỳ sản phẩm công việc nào mà có thể đọc và hiểu được đều có thể là đối tượng của hoạt động rà soát.','Rà soát test case của đồng nghiệp.','3.1.1'],
 ['Phân tích tĩnh','Static analysis','Phân tích tĩnh có thể giúp phát hiện vấn đề trước khi kiểm thử động được thực hiện, đồng thời thường đòi hỏi ít công sức hơn vì không cần viết test case, và thường được thực hiện bằng công cụ (xem chương 6).','SonarQube báo biến khai báo mà không dùng.','3.1'],
 ['Bất thường','Anomaly','Vì các bất thường được xác định trong quá trình rà soát không nhất thiết đều là lỗi, nên tất cả các bất thường này cần được phân tích và thảo luận.','Câu hỏi "email có phân biệt hoa thường không?" khi rà soát spec.','3.2.2'],
 ['Rà soát chính thức / không chính thức','Formal review / Informal review','Có nhiều loại rà soát khác nhau, từ rà soát không chính thức đến rà soát chính thức. Mức độ chính thức cần thiết phụ thuộc vào các yếu tố như: SDLC đang được áp dụng, mức độ trưởng thành của quy trình phát triển phần mềm, mức độ quan trọng và độ phức tạp của sản phẩm công việc cần được rà soát, các yêu cầu pháp lý hoặc quy định liên quan, và nhu cầu đảm bảo khả năng đánh giá tuân thủ.','','3.2.4'],
 ['Rà soát không chính thức','Informal review','Rà soát không chính thức (informal review) không tuân theo một quy trình cố định và không yêu cầu ghi nhận kết quả rà soát một cách chính thức. Mục tiêu chính là phát hiện các bất thường.','Nhờ đồng nghiệp đọc nhanh báo cáo lỗi.','3.2.4'],
 ['Rà soát có hướng dẫn','Walkthrough','Walkthrough (rà soát có hướng dẫn) do tác giả chủ trì, có thể phục vụ nhiều mục tiêu như: đánh giá chất lượng và xây dựng sự tin tưởng đối với sản phẩm công việc, đào tạo người rà soát, nhằm đạt được sự đồng thuận, tạo ra ý tưởng mới, thúc đẩy và hỗ trợ tác giả hoàn thiện hơn, cũng như phát hiện các bất thường.','Dev lead trình bày thiết kế cho cả team.','3.2.4'],
 ['Rà soát kỹ thuật','Technical review','Rà soát kỹ thuật (technical review) được thực hiện bởi những người rà soát có trình độ kỹ thuật phù hợp và do một điều phối viên dẫn dắt. Mục tiêu của rà soát kỹ thuật là đạt được sự đồng thuận và đưa ra quyết định liên quan đến một vấn đề kỹ thuật, đồng thời phát hiện các bất thường, đánh giá chất lượng và xây dựng sự tin tưởng đối với sản phẩm công việc, tạo ra ý tưởng mới, cũng như thúc đẩy và hỗ trợ tác giả hoàn thiện hơn.','Các senior dev rà soát phương án kiến trúc thanh toán.','3.2.4'],
 ['Đánh giá chuyên sâu','Inspection','Vì kiểm tra chuyên sâu (inspection) là loại rà soát chính thức nhất, nên nó tuân theo đầy đủ quy trình tổng quát (xem mục 3.2.2). Mục tiêu chính là tối đa hoá việc phát hiện các bất thường. […] Trong đánh giá chuyên sâu, tác giả không được nắm giữ vai trò là trưởng nhóm rà soát hay thư ký.','Đánh giá chuyên sâu tài liệu yêu cầu của hệ thống y tế.','3.2.4'],
 ['Quản lý','Manager','Quản lý – quyết định nội dung cần được rà soát và cung cấp các nguồn lực cần thiết, chẳng hạn như nhân sự và thời gian cho hoạt động rà soát','PM duyệt 2 giờ cho buổi rà soát.','3.2.3'],
 ['Tác giả','Author','Tác giả – tạo ra và thực hiện sửa chữa sản phẩm công việc đang được rà soát','BA viết spec.','3.2.3'],
 ['Điều phối viên','Moderator / Facilitator','Điều phối viên – đảm bảo việc tổ chức và vận hành hiệu quả các cuộc họp rà soát, bao gồm điều phối thảo luận, quản lý thời gian, và duy trì môi trường rà soát an toàn để mọi người có thể tự do phát biểu','QC lead điều phối buổi rà soát spec.','3.2.3'],
 ['Thư ký','Scribe / Recorder','Thư ký – tổng hợp các bất thường được phát hiện những bởi người rà soát và ghi lại các thông tin thảo luận trong buổi rà soát, như các quyết định và các bất thường mới phát sinh trong cuộc họp phân tích rà soát','Một QC ghi biên bản vào sheet.','3.2.3'],
 ['Người rà soát','Reviewer','Người rà soát – thực hiện việc rà soát. Người rà soát có thể là thành viên trong dự án, các chuyên gia trong lĩnh vực, hoặc bất kỳ bên liên quan nào khác','Dev và QC đọc spec, ghi câu hỏi.','3.2.3'],
 ['Trưởng nhóm rà soát','Review leader','Trưởng nhóm rà soát – chịu trách nhiệm tổng thể cho hoạt động rà soát, bao gồm việc quyết định ai sẽ tham gia và tổ chức thời gian, địa điểm diễn ra buổi rà soát','Test manager tổ chức đợt rà soát.','3.2.3'],
 ['Tiêu chí kết thúc rà soát','Exit criteria (review)','Khi các tiêu chí kết thúc rà soát đã được đáp ứng, sản phẩm công việc đó có thể được chấp nhận.','Mọi bất thường mức High đã có hướng xử lý.','3.2.2'],
],
4:[
 ['Kỹ thuật kiểm thử','Test technique','Các kỹ thuật kiểm thử hỗ trợ tester trong hoạt động phân tích kiểm thử (kiểm thử cái gì) và thiết kế test case (kiểm thử như thế nào). Các kỹ thuật kiểm thử giúp xây dựng một tập hợp test case tương đối nhỏ nhưng vẫn bao phủ đủ, theo một cách có hệ thống.','Phân vùng tương đương, bảng quyết định…','4.1'],
 ['Kỹ thuật kiểm thử hộp đen','Black-box test technique','Các kỹ thuật kiểm thử hộp đen (còn được gọi là kỹ thuật dựa trên đặc tả) dựa trên việc phân tích hành vi được mô tả của đối tượng kiểm thử mà không tham chiếu đến cấu trúc bên trong của đối tượng đó.','','4.1'],
 ['Kỹ thuật kiểm thử hộp trắng','White-box test technique','Các kỹ thuật kiểm thử hộp trắng (còn được gọi là kỹ thuật dựa trên cấu trúc) dựa trên việc phân tích cấu trúc bên trong và cách xử lý của đối tượng kiểm thử.','','4.1'],
 ['Kỹ thuật kiểm thử dựa trên kinh nghiệm','Experience-based test technique','Các kỹ thuật kiểm thử dựa trên kinh nghiệm tận dụng hiệu quả kiến thức và kinh nghiệm của tester trong việc thiết kế và thực thi test case.','','4.1'],
 ['Hạng mục bao phủ','Coverage item','Hoạt động này thường bao gồm việc xác định các hạng mục bao phủ, chúng đóng vai trò hướng dẫn cách xác định đầu vào cho test case.','Trong EP, mỗi vùng tương đương là một hạng mục bao phủ.','1.4.1'],
 ['Độ bao phủ','Coverage','Độ bao phủ được đo bằng số lượng vùng tương đương được kiểm thử bởi các test case, chia cho tổng số vùng tương đương đã xác định, và được biểu diễn dưới dạng phần trăm (%).','Đã test 3/4 vùng → 75%.','4.2.1'],
 ['Phân vùng tương đương','Equivalence Partitioning (EP)','Phân vùng tương đương (EP) chia dữ liệu thành các vùng (gọi là các vùng tương đương hoặc lớp tương đương) dựa trên giả định rằng tất cả các phần tử trong cùng một phân vùng sẽ được đối tượng kiểm thử xử lý theo một cách giống nhau.','Tuổi: &lt;18, 18–60, &gt;60.','4.2.1'],
 ['Phân vùng hợp lệ / không hợp lệ','Valid / Invalid partition','Vùng tương đương chứa các giá trị hợp lệ được gọi là phân vùng hợp lệ. Vùng tương đương chứa các giá trị không hợp lệ được gọi là phân vùng không hợp lệ.','18–60 hợp lệ; &lt;18 và &gt;60 không hợp lệ.','4.2.1'],
 ['Bao phủ Each Choice','Each Choice coverage','Tiêu chí bao phủ đơn giản nhất trong trường hợp có nhiều tập vùng tương đương là bao phủ Each Choice (Ammann 2016). Tiêu chí này yêu cầu các test case phải bao phủ mỗi vùng tương đương trong từng tập phân vùng ít nhất một lần. Bao phủ Each Choice không xét đến các tổ hợp các phân vùng tương đương.','Trường Tuổi và trường Hạng thẻ, mỗi vùng của mỗi trường có ít nhất 1 test.','4.2.1'],
 ['Phân tích giá trị biên','Boundary Value Analysis (BVA)','Phân tích giá trị biên (BVA) là kỹ thuật kiểm thử dựa trên việc kiểm tra các giá trị tại ranh giới (biên) của các phân vùng tương đương. Do đó, BVA chỉ có thể áp dụng cho các vùng tương đương có tính thứ tự.','Phạm vi 1–10: test 0, 1, 10, 11.','4.2.2'],
 ['BVA 2 giá trị','2-value BVA','BVA 2 giá trị (Craig 2002, Myers 2011), với mỗi biên có hai hạng mục bao phủ: giá trị biên của phân vùng đó và giá trị biên gần nhất của phân vùng liền kề.','Biên 1: test 0 và 1.','4.2.2'],
 ['BVA 3 giá trị','3-value BVA','BVA 3 giá trị (Koomen 2006, O’Regan 2019), với mỗi biên có ba hạng mục bao phủ: giá trị biên của phân vùng đó và hai giá trị lân cận của nó.','Biên 1: test 0, 1, 2.','4.2.2'],
 ['Kiểm thử dựa vào bảng quyết định','Decision table testing','Bảng quyết định được sử dụng để kiểm thử chương trình mà có các yêu cầu quy định các tổ hợp điều kiện khác nhau sẽ tạo ra các kết quả khác nhau. Bảng quyết định là một cách hiệu quả để biểu diễn lôgic phức tạp, chẳng hạn như các quy tắc nghiệp vụ.','VIP? × Đơn ≥ 500k? → 4 cột.','4.2.3'],
 ['Cột của bảng quyết định','Column (rule)','Mỗi cột trong bảng tương ứng với một quyết định nghiệp vụ, nó thể hiện một tổ hợp điều kiện duy nhất cùng với các hành động liên quan.','Cột 3: khách thường + đơn ≥ 500k → freeship.','4.2.3'],
 ['Ký hiệu trong bảng quyết định','T / F / – / N/A / X','“T” (true) nghĩa là điều kiện được thỏa mãn. “F” (false) là điều kiện không được thỏa mãn. “–” là giá trị của điều kiện không ảnh hưởng đến kết quả hành động. Và “N/A” là điều kiện không áp dụng trong tổ hợp đó. Đối với hành động: “X” là hành động xảy ra. Ô để trống là hành động không xảy ra.','Tài khoản bị khóa thì "–" cho mọi điều kiện còn lại.','4.2.3'],
 ['Kiểm thử dựa vào chuyển đổi trạng thái','State transition testing','Sơ đồ trạng thái giúp mô hình hóa hành vi của hệ thống bằng cách thể hiện các trạng thái có thể có và các chuyển đổi trạng thái hợp lệ.','Trạng thái đơn: Chờ TT, Đã TT, Đang giao, Đã giao, Đã hủy.','4.2.4'],
 ['Chuyển đổi trạng thái / Điều kiện bảo vệ','Transition / Guard condition','Một chuyển đổi trạng thái được kích hoạt bởi một sự kiện (event), có thể được bổ sung bởi một điều kiện bảo vệ (guard condition). […] Cú pháp ghi nhãn cho các chuyển đổi trạng thái thường dùng là: “event [guard condition] / action”.','Hủy đơn [chưa giao hàng] / hoàn tiền.','4.2.4'],
 ['Bảng trạng thái','State table','Bảng trạng thái là một mô hình tương đương với sơ đồ trạng thái. […] Khác với sơ đồ trạng thái, bảng trạng thái thể hiện rõ các chuyển đổi trạng thái không hợp lệ, được biểu diễn bằng các ô trống.','Ô (Đã giao, Hủy) để trống = chuyển đổi không hợp lệ.','4.2.4'],
 ['Bao phủ tất cả trạng thái','All states coverage','Với bao phủ tất cả trạng thái, hạng mục bao phủ là các trạng thái. Để đạt 100% độ bao phủ này, bộ test case phải đảm bảo tất cả các trạng thái đều được thực thi ít nhất một lần.','','4.2.4'],
 ['Bao phủ chuyển đổi trạng thái hợp lệ','Valid transitions coverage (0-switch)','Với bao phủ chuyển đổi trạng thái hợp lệ (còn gọi là bao phủ 0-switch), hạng mục bao phủ là các chuyển đổi trạng thái hợp lệ riêng lẻ. Để đạt 100% độ bao phủ này, bộ test case phải thực thi tất cả các chuyển đổi trạng thái hợp lệ.','','4.2.4'],
 ['Bao phủ tất cả chuyển đổi trạng thái','All transitions coverage','Với bao phủ tất cả chuyển đổi trạng thái, hạng mục bao phủ là tất cả các chuyển đổi trạng thái được thể hiện trong bảng trạng thái. Để đạt 100% độ bao phủ này, bộ test case phải thực thi tất cả các chuyển đổi trạng thái hợp lệ và cả các chuyển đổi trạng thái không hợp lệ.','','4.2.4'],
 ['Kiểm thử câu lệnh / Bao phủ câu lệnh','Statement testing / Statement coverage','Trong kiểm thử câu lệnh, các hạng mục bao phủ là các câu lệnh có thể thực thi được trong mã nguồn. […] Bao phủ câu lệnh được đo bằng số lượng câu lệnh được thực thi bởi các test case hiện có, chia cho tổng số câu lệnh có thể thực thi trong mã nguồn, và được biểu diễn dưới dạng phần trăm.','<code>phi_ship = 0</code> là một câu lệnh thực thi được.','4.3.1'],
 ['Nhánh','Branch','Nhánh là sự chuyển luồng điều khiển giữa hai nút trong đồ thị luồng điều khiển. […] Mỗi sự chuyển luồng điều khiển có thể là vô điều kiện (tức là các đoạn mã chạy tuần tự) hoặc có điều kiện (tức là kết quả của một quyết định).','if có 2 nhánh: đúng và sai.','4.3.2'],
 ['Kiểm thử nhánh / Độ bao phủ nhánh','Branch testing / Branch coverage','Trong kiểm thử nhánh, các hạng mục bao phủ là các nhánh. […] Độ bao phủ được đo bằng số lượng nhánh được thực thi bởi các test case hiện có, chia cho tổng số nhánh, và được biểu diễn dưới dạng phần trăm.','','4.3.2'],
 ['Đoán lỗi','Error guessing','Đoán lỗi là một kỹ thuật kiểm thử dùng để dự đoán sự xuất hiện của sai sót, lỗi, và các sự cố, dựa vào kiến thức và kinh nghiệm của của tester','Bấm Đặt hàng 2 lần liên tiếp.','4.4.1'],
 ['Tấn công lỗi','Fault attacks','Fault attacks (tấn công lỗi) là một cách triển khai thực tế của kỹ thuật đoán lỗi. Kỹ thuật này yêu cầu tester tạo ra hoặc thu thập danh sách các sai sót, lỗi, hoặc sự cố có thể xảy ra, sau đó thiết kế test case nhằm phát hiện lỗi hoặc sự cố liên quan đến các sai sót đó.','Danh sách: số âm, emoji, chuỗi rất dài, mất mạng.','4.4.1'],
 ['Kiểm thử khám phá','Exploratory testing','Trong kiểm thử khám phá, việc thiết kế, thực thi test case, và đánh giá kết quả được thực hiện đồng thời, cùng lúc đó tester cũng sẽ tìm hiểu thêm về đối tượng kiểm thử.','60 phút khám phá luồng hoàn tiền.','4.4.2'],
 ['Kiểm thử theo phiên / Thẻ kiểm thử','Session-based testing / Test charter','Với cách tiếp cận này, kiểm thử khám phá được thực hiện trong một khoảng thời gian có giới hạn (ví dụ: 45 phút). Tester sử dụng một thẻ kiểm thử (test charter) chứa các mục tiêu kiểm thử giúp định hướng việc kiểm thử.','"Khám phá hoàn tiền để tìm rủi ro hoàn sai số tiền".','4.4.2'],
 ['Kiểm thử dựa trên checklist','Checklist-based testing','Trong kiểm thử dựa trên checklist, tester thiết kế, triển khai, và thực thi các test case để bao phủ các khía cạnh kiểm thử được mô tả trong một checklist (danh sách các mục cần kiểm tra).','Checklist form: bắt buộc, độ dài, ký tự đặc biệt, khoảng trắng.','4.4.3'],
 ['Phương pháp kiểm thử dựa trên sự cộng tác','Collaboration-based test approach','Trong khi đó, các phương pháp tiếp cận kiểm thử dựa trên sự cộng tác tập trung vào việc phòng tránh lỗi thông qua sự hợp tác và giao tiếp giữa các bên liên quan.','','4.5'],
 ['User story','User story','Mỗi user story đại diện cho một tính năng mang lại giá trị cho người dùng hoặc người mua hệ thống/ phần mềm. […] Định dạng phổ biến nhất của một user story là: “Là [vai trò], tôi muốn [mục tiêu cần đạt được], để tôi có thể [giá trị nghiệp vụ mang lại cho vai trò đó]”, theo sau đó là các tiêu chí chấp nhận.','Là khách VIP, tôi muốn áp mã VIP20 để được giảm 20%.','4.5.1'],
 ['Nguyên tắc 3 C’s','Card, Conversation, Confirmation','Card (thẻ) – phương tiện mô tả user story (ví dụ: thẻ giấy, một mục trong bảng điện tử); Conversation (thảo luận) – giải thích cách phần mềm sẽ được sử dụng (có thể được ghi lại hoặc trao đổi bằng lời nói); Confirmation (xác nhận) – tiêu chí chấp nhận (xem mục 4.5.2)','','4.5.1'],
 ['INVEST','INVEST','Một user story tốt nên tuân theo nguyên tắc INVEST: Independent – độc lập, Negotiable – có thể thương lượng, Valuable – có giá trị, Estimable – có thể ước lượng, Small – nhỏ gọn, và Testable – có thể kiểm thử được.','Story "Làm lại toàn bộ thanh toán" vi phạm Small.','4.5.1'],
 ['Tiêu chí chấp nhận','Acceptance criteria (AC)','Tiêu chí chấp nhận (acceptance criteria - AC) của một user story là các điều kiện mà phần chương trình được lập trình cho user story đó phải đáp ứng để được các bên liên quan chấp nhận.','Then hiển thị "Mã đã hết lượt".','4.5.2'],
 ['Phát triển hướng Kiểm thử Chấp nhận (ATDD)','Acceptance Test-Driven Development','ATDD là một phương pháp phát triển phần mềm theo hướng kiểm thử trước (test-first) (xem mục 2.1.3). Các test case được tạo ra trước khi lập trình cho một user story.','','4.5.3'],
],
5:[
 ['Kế hoạch kiểm thử','Test plan','Kế hoạch kiểm thử mô tả các mục tiêu kiểm thử, nguồn lực, và các quy trình của một dự án kiểm thử.','Kế hoạch kiểm thử release 2.4.','5.1.1'],
 ['Phương pháp tiếp cận kiểm thử','Test approach','Phương pháp tiếp cận kiểm thử (ví dụ: mức kiểm thử, loại kiểm thử, kỹ thuật kiểm thử, các sản phẩm bàn giao của kiểm thử, tiêu chí bắt đầu và tiêu chí kết thúc, mức độ độc lập của kiểm thử, các chỉ số cần thu thập, yêu cầu về dữ liệu kiểm thử, yêu cầu về môi trường kiểm thử, các sai lệch so với chính sách kiểm thử và chiến lược kiểm thử)','Ưu tiên tự động API, khám phá cho UI.','5.1.1'],
 ['Tiêu chí bắt đầu','Entry criteria','Tiêu chí bắt đầu xác định các điều kiện tiên quyết để tiến hành một hoạt động nhất định. […] Các tiêu chí bắt đầu mà một user story phải đáp ứng để tiến hành các hoạt động phát triển và/hoặc kiểm thử được gọi là Định nghĩa Sẵn sàng (Definition of Ready - DoR).','Build qua smoke test.','5.1.3'],
 ['Tiêu chí kết thúc','Exit criteria','Tiêu chí kết thúc xác định những điều phải đạt được để tuyên bố rằng một hoạt động đã hoàn thành. […] Trong phát triển phần mềm Agile, tiêu chí kết thúc thường được gọi là Định nghĩa Hoàn thành (Definition of Done - DoD), là các chỉ số khách quan của nhóm để quyết định một hạng mục có thể được phát hành.','Không còn lỗi Critical mở.','5.1.3'],
 ['Ước lượng dựa trên tỷ lệ','Ratio-based estimation','Ước lượng dựa trên tỷ lệ. Trong kỹ thuật dựa trên số liệu này, các số liệu được thu thập từ những dự án trước đây trong tổ chức, qua đó có thể xác định các tỷ lệ “chuẩn” cho những dự án tương tự.','Dev:test = 3:2 → 600 ngày dev cần 400 ngày test.','5.1.4'],
 ['Kỹ thuật ước lượng ngoại suy','Extrapolation','Kỹ thuật ước lượng ngoại suy. Trong kỹ thuật dựa trên số liệu này, các phép đo được thực hiện càng sớm càng tốt trong dự án hiện tại để thu thập dữ liệu. Khi đã có đủ lượng dữ liệu quan sát, công sức cần thiết cho phần công việc còn lại có thể được ước lượng bằng cách ngoại suy từ dữ liệu này (thường bằng cách áp dụng một mô hình toán học).','Trung bình 3 chu kỳ gần nhất.','5.1.4'],
 ['Wideband Delphi','Wideband Delphi','Wideband Delphi. Trong kỹ thuật ước lượng dựa vào chuyên gia này, các chuyên gia đưa ra ước lượng dựa trên kinh nghiệm của mình. […] Planning Poker là một biến thể của Wideband Delphi, thường được sử dụng trong các mô hình phát triển phần mềm Agile.','','5.1.4'],
 ['Ước lượng ba điểm','Three-point estimation','Ước lượng ba điểm. Trong kỹ thuật ước lượng dựa vào chuyên gia này, mỗi chuyên gia cần đưa ra 3 ước lượng: ước lượng lạc quan nhất (a), ước lượng có khả năng xảy ra nhất (m), và ước lượng bi quan nhất (b). […] E = (a + 4*m + b) / 6. […] SD = (b – a) / 6.','a=6, m=9, b=18 → 10 ± 2 giờ.','5.1.4'],
 ['Ưu tiên hóa test case','Test case prioritization','Các chiến lược ưu tiên hoá test case phổ biến nhất bao gồm: Ưu tiên hoá dựa vào rủi ro […]; Ưu tiên hoá dựa vào độ bao phủ […]; Ưu tiên hoá dựa vào yêu cầu […]','','5.1.5'],
 ['Tháp kiểm thử','Test pyramid','Test pyramid (tháp kiểm thử) là mô hình thể hiện các loại test case khác nhau có thể có mức độ chi tiết khác nhau.','','5.1.6'],
 ['Các góc phần tư kiểm thử','Testing quadrants','Các testing quadrant (góc phần tư kiểm thử), được định nghĩa bởi Brian Marick (Marick 2003, Crispin 2008), gom nhóm các mức kiểm thử với các loại kiểm thử phù hợp, các hoạt động kiểm thử, kỹ thuật kiểm thử, và các sản phẩm công việc trong phát triển phần mềm Agile.','Kiểm thử tính khả dụng ở Q3, kiểm thử phi chức năng khác ở Q4.','5.1.7'],
 ['Quản lý rủi ro','Risk management','Các hoạt động chính của quản lý rủi ro bao gồm: Phân tích rủi ro (gồm nhận diện rủi ro và đánh giá rủi ro; xem mục 5.2.3); Kiểm soát rủi ro (gồm giảm thiểu rủi ro và giám sát rủi ro; xem mục 5.2.4)','','5.2'],
 ['Kiểm thử dựa vào rủi ro','Risk-based testing','Cách tiếp cận kiểm thử, trong đó các hoạt động kiểm thử được lựa chọn, ưu tiên, và quản lý dựa trên việc phân tích rủi ro và kiểm soát rủi ro, được gọi là kiểm thử dựa vào rủi ro (risk-based testing).','Module thanh toán rủi ro cao → test trước và kỹ hơn.','5.2'],
 ['Rủi ro','Risk','Rủi ro là một sự kiện, mối nguy, mối đe dọa, hoặc tình huống tiềm ẩn mà khi xảy ra sẽ gây ra tác động bất lợi.','','5.2.1'],
 ['Mức rủi ro','Risk level','Một rủi ro có thể được xác định dựa trên hai yếu tố: Khả năng xảy ra rủi ro – xác suất rủi ro xảy ra (lớn hơn 0 và nhỏ hơn 1); Mức độ ảnh hưởng của rủi ro (gây hại) – các hậu quả khi rủi ro xảy ra; Hai yếu tố này thể hiện mức rủi ro, là thước đo rủi ro.','4 × 2 = 8.','5.2.1'],
 ['Rủi ro dự án','Project risk','Rủi ro dự án liên quan đến việc quản lý và kiểm soát các hoạt động trong dự án.','Tester chủ chốt nghỉ việc.','5.2.2'],
 ['Rủi ro sản phẩm','Product risk','Rủi ro sản phẩm liên quan đến các đặc tính chất lượng của sản phẩm (ví dụ như được mô tả trong mô hình chất lượng ISO 25010).','Tính sai tổng tiền khi áp nhiều voucher.','5.2.2'],
 ['Phân tích rủi ro / Nhận diện rủi ro / Đánh giá rủi ro','Risk analysis / Risk identification / Risk assessment','Phân tích rủi ro sản phẩm bao gồm các hoạt động nhận diện rủi ro và đánh giá rủi ro. Nhận diện rủi ro là liệt kê danh sách các rủi ro đầy đủ. […] Đánh giá rủi ro bao gồm: phân loại các rủi ro đã xác định, xác định khả năng xảy ra, mức độ ảnh hưởng, và mức rủi ro, ưu tiên hóa, và đề xuất cách xử lý chúng.','','5.2.3'],
 ['Kiểm soát rủi ro / Giảm thiểu rủi ro / Giám sát rủi ro','Risk control / Risk mitigation / Risk monitoring','Kiểm soát rủi ro sản phẩm bao gồm giảm thiểu rủi ro và giám sát rủi ro. Giảm thiểu rủi ro là việc triển khai các hành động được đề xuất trong quá trình đánh giá rủi ro nhằm giảm mức rủi ro. Mục tiêu của việc giám sát rủi ro là đảm bảo rằng các biện pháp giảm thiểu rủi ro mang lại hiệu quả, thu thập thêm thông tin để cải thiện việc đánh giá rủi ro, và xác định các rủi ro mới phát sinh.','','5.2.4'],
 ['Các lựa chọn ứng phó rủi ro','Risk response options','sau khi một rủi ro đã được phân tích, có thể có nhiều lựa chọn ứng phó với rủi ro đó, ví dụ: giảm thiểu rủi ro bằng kiểm thử, chấp nhận rủi ro, chuyển giao rủi ro, hoặc lập kế hoạch dự phòng (Veenendaal 2012).','Hợp đồng để cổng thanh toán chịu bồi hoàn là chuyển giao rủi ro.','5.2.4'],
 ['Giám sát kiểm thử / Kiểm soát kiểm thử','Test monitoring / Test control','Giám sát kiểm thử liên quan đến việc thu thập thông tin về các hoạt động kiểm thử. […] Kiểm soát kiểm thử sử dụng những thông tin từ hoạt động giám sát kiểm thử để đưa ra các chỉ đạo điều chỉnh, hướng dẫn, và các hành động khắc phục cần thiết, nhằm đạt được hiệu quả và hiệu suất kiểm thử tốt nhất.','Lệch tiến độ → đổi ưu tiên test case.','5.3'],
 ['Kết thúc kiểm thử','Test completion','Kết thúc kiểm thử thu thập dữ liệu từ các hoạt động kiểm thử đã hoàn thành nhằm tổng hợp kinh nghiệm, các sản phẩm kiểm thử, và các thông tin liên quan khác.','','5.3'],
 ['Chỉ số kiểm thử','Test metric','Các chỉ số kiểm thử (test metric) được thu thập để thể hiện tiến độ thực tế so với kế hoạch kiểm thử đã đề ra và ngân sách đã phân bổ, chất lượng hiện tại của đối tượng kiểm thử, cũng như hiệu quả của các hoạt động kiểm thử so với mục tiêu kiểm thử, hoặc mục tiêu của một vòng lặp phát triển.','180/320 test case đã chạy.','5.3.1'],
 ['Báo cáo tiến độ kiểm thử','Test progress report','Báo cáo tiến độ kiểm thử hỗ trợ việc kiểm soát kiểm thử liên tục và phải cung cấp thông tin đầy đủ để có thể điều chỉnh lịch thực thi kiểm thử, nguồn lực, hoặc kế hoạch kiểm thử khi cần thiết, do có sự sai lệch so với kế hoạch, hoặc do bối cảnh kiểm thử đã bị thay đổi.','Daily report.','5.3.2'],
 ['Báo cáo kết thúc kiểm thử','Test completion report','Báo cáo kết thúc kiểm thử tổng hợp thông tin về một hoạt động kiểm thử cụ thể (ví dụ: một mức kiểm thử, một chu kỳ kiểm thử, một vòng lặp phát triển trong Agile) và có thể cung cấp thông tin đầu vào cho các hoạt động kiểm thử tiếp theo.','Báo cáo cuối release 2.4.','5.3.2'],
 ['Quản lý cấu hình','Configuration management (CM)','Trong kiểm thử, quản lý cấu hình (CM - configuration management) cung cấp một phương thức có hệ thống để xác định, kiểm soát và theo dõi các sản phẩm công việc như kế hoạch kiểm thử, chiến lược kiểm thử, điều kiện kiểm thử, test case, test script, kết quả kiểm thử, nhật ký kiểm thử và báo cáo kiểm thử dưới dạng các hạng mục cấu hình.','Ghi rõ build 2.4.0-rc3, testcase v1.2.','5.4'],
 ['Quản lý lỗi','Defect management','Ít nhất, quy trình quản lý lỗi gồm một luồng xử lý để giải quyết từng lỗi hoặc bất thường từ khi phát hiện cho đến khi nó được đóng lại, cùng với các quy tắc phân loại chúng.','','5.5'],
 ['Báo cáo lỗi','Defect report','Các báo cáo lỗi thường có các mục tiêu sau: Cung cấp đầy đủ thông tin cho những người chịu trách nhiệm xử lý và khắc phục lỗi để họ giải quyết vấn đề; Cung cấp phương tiện để theo dõi chất lượng của sản phẩm công việc; Cung cấp ý tưởng để cải tiến quy trình phát triển và kiểm thử','Báo cáo lỗi "Hoàn tiền vượt số đã thu".','5.5'],
 ['Mức độ nghiêm trọng','Severity','Mức độ ảnh hưởng (mức độ nghiêm trọng) của lỗi đối với lợi ích của các bên liên quan hoặc yêu cầu','Mất tiền của khách: Critical.','5.5'],
 ['Mức độ ưu tiên','Priority','Mức độ ưu tiên sửa lỗi','Sai chính tả logo trang chủ: mức độ nghiêm trọng thấp nhưng ưu tiên cao.','5.5'],
],
6:[
 ['Công cụ quản lý kiểm thử','Test management tools','Công cụ quản lý kiểm thử – giúp tăng hiệu quả của quy trình kiểm thử bằng cách hỗ trợ quản lý: vòng đời phát triển phần mềm (SDLC), yêu cầu, test case, lỗi, và cấu hình','Jira, TestRail.','6.1'],
 ['Công cụ kiểm thử tĩnh','Static testing tools','Công cụ kiểm thử tĩnh – hỗ trợ tester trong việc thực hiện rà soát và phân tích tĩnh','SonarQube, ESLint.','6.1'],
 ['Công cụ thiết kế và triển khai kiểm thử','Test design and implementation tools','Công cụ thiết kế và triển khai kiểm thử – hỗ trợ việc tạo test case, dữ liệu kiểm thử, và trình tự thực hiện kiểm thử','Công cụ sinh dữ liệu giả.','6.1'],
 ['Công cụ thực thi kiểm thử và đo độ bao phủ','Test execution and coverage tools','Công cụ thực thi kiểm thử và đo độ bao phủ – hỗ trợ thực thi kiểm thử tự động và đo lường độ bao phủ','Playwright, JaCoCo.','6.1'],
 ['Công cụ kiểm thử phi chức năng','Non-functional testing tools','Công cụ kiểm thử phi chức năng – cho phép tester thực hiện các kiểm thử phi chức năng vốn khó hoặc không thể thực hiện thủ công','JMeter, OWASP ZAP.','6.1'],
 ['Công cụ DevOps','DevOps tools','Công cụ DevOps – hỗ trợ quy trình phân phối DevOps, theo dõi quy trình công việc, tự động hóa quá trình build phần mềm và CI/CD','GitHub Actions, Jenkins.','6.1'],
 ['Công cụ cộng tác','Collaboration tools','Công cụ cộng tác – hỗ trợ giao tiếp giữa các bên liên quan','Slack, Confluence.','6.1'],
 ['Công cụ hỗ trợ khả năng mở rộng và chuẩn hóa triển khai','Scalability and deployment standardization tools','Các công cụ hỗ trợ khả năng mở rộng và chuẩn hóa triển khai phần mềm (ví dụ: máy ảo, công cụ container hóa)','Docker.','6.1'],

let termQ = '';
const fold = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
const termMatch = (t, q) => !q || fold(t[0] + ' ' + t[1] + ' ' + t[2] + ' ' + t[3]).includes(fold(q));
const termCard = (t, chNo) => '<div class="term"><div class="term-h"><b>' + t[0] + '</b><i>' + t[1] + '</i>' + (chNo ? '<span class="chip">Chương ' + chNo + '</span>' : '') + '</div><p>“' + t[2] + '”</p>' + (t[4] ? '<p class="term-src">Syllabus CTFL v4.0.1 (VN), mục ' + t[4] + '</p>' : '') + (t[3] ? '<p class="term-ex"><b>Ví dụ:</b> ' + t[3] + '</p>' : '') + '</div>';
function renderTerms(n){
  let h = '<div class="term-search"><input type="search" id="termQ" placeholder="Tìm thuật ngữ (tiếng Việt hoặc tiếng Anh, gõ không dấu cũng được)" value="' + esc(termQ) + '" aria-label="Tìm thuật ngữ"></div><p class="note" style="margin:0 0 12px">Tên thuật ngữ và phần giải thích trích nguyên văn từ Syllabus CTFL v4.0.1 bản tiếng Việt (© ISTQB®). Dấu “;” thay cho gạch đầu dòng, “[…]” là đoạn lược bớt. Chỉ phần <b>Ví dụ</b> là minh họa thêm.</p><div id="termList"></div>';
  $('chBody').innerHTML = h;
  const draw = () => {
    const mine = GLOSSARY[n].filter(t => termMatch(t, termQ));
    let out = mine.length ? '<div class="terms">' + mine.map(t => termCard(t)).join('') + '</div>' : '<p class="note">Không có thuật ngữ nào trong chương ' + n + ' khớp với "' + esc(termQ) + '".</p>';
    if (termQ){
      const other = [];
      Object.keys(GLOSSARY).forEach(k => { if (+k !== n) GLOSSARY[k].forEach(t => { if (termMatch(t, termQ)) other.push(termCard(t, k)); }); });
      if (other.length) out += '<div class="sec"><h3>Ở chương khác</h3><div class="terms">' + other.join('') + '</div></div>';
    }
    $('termList').innerHTML = out;
  };
  const inp = $('termQ');
  inp.addEventListener('input', () => { termQ = inp.value; draw(); });
  draw();
}
function optHTML(q, picked, reveal, clickable){
  return '<div class="opts">' + orderOf(q).map((oi, pos) => {
    let cls = 'opt';
    if (reveal){ if (oi === q.a) cls += ' right'; else if (oi === picked) cls += ' wrong'; }
    else if (oi === picked) cls += ' sel';
    const why = reveal ? '<span class="why">' + q.w[oi] + '</span>' : '';
    return '<button type="button" class="' + cls + '" data-oi="' + oi + '"' + (clickable ? '' : ' disabled') + '><span class="L">' + LETTERS[pos] + '</span><span>' + q.o[oi] + why + '</span></button>';
  }).join('') + '</div>';
}
function qHead(q){
  const c = chap(q.ch);
  return '<div class="qmeta"><span class="chip acc">' + q.k + ' · ' + KDESC[q.k] + '</span><span class="chip">' + esc(q.lo) + '</span><span class="chip">Chương ' + q.ch + '</span></div>';
}
function renderQuiz(n){
  const qs = byCh(n); let i = S.qi[n] || 0; if (i >= qs.length) i = 0;
  const q = qs[i], st = practice[q.id] || {};

  }).join('') + '</div>';
  h += '<div class="card">' + qHead(q) + '<div class="qtext"><b>Câu ' + (i+1) + '/' + qs.length + '.</b> ' + q.q + '</div>' + optHTML(q, st.pick, st.submitted, !st.submitted);
