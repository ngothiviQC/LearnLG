<style>
code.cblock{display:block;width:fit-content;max-width:100%;box-sizing:border-box;margin:6px 0;padding:8px 10px;
  background:var(--code-bg,#f4f4f5);border:1px solid var(--line,#ddd);border-radius:6px;font-size:12.5px;line-height:1.55;
  white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:auto;text-align:left}
</style>
<script>(function(){
  var SKIP='pre,button,a,label,summary,h1,h2,h3,h4,h5,h6,th,td,option,select,textarea,nav,.opt,.cblock-off';
  var KW=/^\s*(SELECT|INSERT|UPDATE|DELETE|WITH|CREATE|ALTER|DROP|FROM|WHERE|JOIN|LEFT JOIN|GROUP BY|ORDER BY|HAVING|CASE |UNION|\/\/|\/html|@|#|const |let |var |await |return |new |class |interface |package |driver\.|By\.|import |public |private |static |mvn |npx |npm |git |adb |k6 |curl |docker |mv |cp |cd |mkdir |assert|expect\(|test\(|Authorization:|Content-Type:|following-sibling|preceding-sibling|ancestor::)/i;
  var JSONISH=/^\s*[\[{]\s*["{\[]/;   // {"items": …} hoặc [{…}]
  var SYM=/[;{}()=]/;
  function isBlock(el){
    var t=(el.textContent||'').trim();
    if(t.length<28) return false;
    if(el.closest(SKIP)) return false;
    return KW.test(t) || JSONISH.test(t) || (SYM.test(t) && /[A-Za-z_]\w*\s*[(.=]/.test(t));
  }
  // Thành khối thì dấu câu ngay sau nó (". , ; :") sẽ rơi xuống một dòng riêng: bỏ dấu câu lẻ đó đi
  function mark(el){
    el.classList.add('cblock');
    var n=el.nextSibling;
    if(n&&n.nodeType===3&&/^[.,;:]/.test(n.nodeValue)) n.nodeValue=n.nodeValue.replace(/^[.,;:]\s*/,'');
  }
  function scan(root){
    var list=(root.querySelectorAll?root.querySelectorAll('code:not(.cblock)'):[]);
    for(var i=0;i<list.length;i++) if(isBlock(list[i])) mark(list[i]);
  }
  function start(){
    scan(document.body);
    new MutationObserver(function(ms){ for(var i=0;i<ms.length;i++){ var n=ms[i].addedNodes; for(var j=0;j<n.length;j++){ var x=n[j]; if(x.nodeType===1){ if(x.matches&&x.matches('code:not(.cblock)')&&isBlock(x)) mark(x); scan(x); } } } })
      .observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();</script>

  --f-display:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;

  --pass:#5fd08e; --pass-soft:#163322; --fail:#ff8a80; --fail-soft:#3a1a18; --warn:#f0c35a; --warn-soft:#352a12;
  --code-bg:#121918; --kw:#ce93d8; --str:#f0b070; --num:#8db8f2; --cmt:#73827f; --ann:#4db6ac; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#161e1d; --sunken:#0b100f; --ink:#e4eeec; --muted:#93a6a2; --line:#283432;
  --accent:#4db6ac; --accent-ink:#06201d; --accent-soft:#16312e;
  --pass:#5fd08e; --pass-soft:#163322; --fail:#ff8a80; --fail-soft:#3a1a18; --warn:#f0c35a; --warn-soft:#352a12;

}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;display:flex;flex-direction:column}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
code,pre,textarea,input,select{font-family:var(--f-mono)}
code{font-size:.9em;background:var(--sunken);padding:1px 5px;border-radius:4px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.bar{width:120px;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}

.theme-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:4px 8px;font-size:12px}

.app{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1.25fr)}
.pane{min-height:0;overflow:auto}

.phase{margin-bottom:14px}
.phase h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 8px 6px;display:flex;justify-content:space-between;gap:6px}
.phase h2 span{font-family:var(--f-mono);letter-spacing:0}
.qitem{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:6px}
.qitem:hover{background:var(--sunken)}
.qitem[aria-current="true"]{background:var(--accent-soft)}
.qitem .dot{width:14px;height:14px;margin-top:3px;border-radius:50%;border:1.5px solid var(--line)}
.qitem.done .dot{background:var(--pass);border-color:var(--pass)}
.qitem .k{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-weight:500;display:block}

.ticket{padding:20px 24px 40px;border-right:1px solid var(--line)}
.tk-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.tk-key{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.chip.acc{background:var(--accent-soft);color:var(--accent)}

.field p,.field ul,.field ol{margin:0 0 8px}

.expect{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.lesson{display:flex;flex-direction:column;gap:8px}

.kw-body ul{margin:0;padding-left:20px}

.hl-t{color:var(--kw)}.hl-at{color:var(--num)}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:13.5px}
.hint b{color:var(--warn);font-weight:600;margin-right:4px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:13px}
.linkbtn:disabled{color:var(--muted);cursor:default}
.donebox{border-radius:8px;padding:10px 14px;background:var(--pass-soft);color:var(--pass);font-weight:600;max-width:72ch;margin-bottom:16px}

.work{display:flex;flex-direction:column;min-height:0;overflow:auto;background:var(--surface)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.toolbar .ttl{font-weight:600;font-size:13px;margin-right:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;font-weight:500;font-size:13px}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}

.sec{padding:12px 14px;border-bottom:1px solid var(--line)}

.chk .ic{font-weight:700;text-align:center}
.chk.ok .ic{color:var(--pass)}.chk.no .ic{color:var(--fail)}

const LESSONS = {
  arch:['Kiến trúc WebDriver (WebDriver architecture) và Selenium Manager',
    '<p>Code test gọi thư viện Selenium (client library) → thư viện gửi lệnh qua giao thức W3C WebDriver (HTTP + JSON) → driver của trình duyệt (chromedriver, geckodriver, msedgedriver) → trình duyệt thật thực hiện thao tác.</p><p>Từ Selenium 4.6, <b>Selenium Manager</b> tự tìm hoặc tải driver đúng phiên bản trình duyệt: chỉ cần <code>new ChromeDriver()</code>, không cần <code>System.setProperty("webdriver.chrome.driver", ...)</code> hay WebDriverManager.</p>',
    'WebDriver driver = new ChromeDriver();     // Selenium Manager tự lo chromedriver\ndriver.get("https://qa.shopdemo.test/login");\nSystem.out.println(driver.getTitle());\ndriver.quit();                              // đóng mọi cửa sổ và kết thúc phiên'],
  locators:['8 cách tìm phần tử (locator strategies) và thứ tự ưu tiên',
    '<table class="tbl"><tr><th>By</th><th>Ví dụ</th><th>Ghi chú</th></tr><tr><td><code>By.id</code></td><td><code>By.id("user-name")</code></td><td>Nhanh, rõ ràng — chỉ khi id ổn định (không tự sinh)</td></tr><tr><td><code>By.name</code></td><td><code>By.name("password")</code></td><td>Hay dùng cho form</td></tr><tr><td><code>By.className</code></td><td><code>By.className("item-price")</code></td><td>Chỉ một class, không được có dấu cách</td></tr><tr><td><code>By.tagName</code></td><td><code>By.tagName("iframe")</code></td><td>Thường dùng với findElements</td></tr><tr><td><code>By.linkText</code></td><td><code>By.linkText("Quên mật khẩu?")</code></td><td>Chỉ cho thẻ &lt;a&gt;, khớp toàn bộ chữ</td></tr><tr><td><code>By.partialLinkText</code></td><td><code>By.partialLinkText("Quên")</code></td><td>Khớp một phần chữ của link</td></tr><tr><td><code>By.cssSelector</code></td><td><code>By.cssSelector("[data-test=\'error\']")</code></td><td>Linh hoạt, nhanh</td></tr><tr><td><code>By.xpath</code></td><td><code>By.xpath("//a[text()=\'Mũ lưỡi trai\']")</code></td><td>Tìm theo chữ, đi ngược lên cha</td></tr></table><p><b>Thứ tự ưu tiên:</b> thuộc tính dành cho test (<code>data-test</code>, <code>data-testid</code>) hoặc id ổn định → name → CSS ngắn → XPath tương đối. <b>Tránh:</b> XPath tuyệt đối (<code>/html/body/div[2]/...</code>), id/class tự sinh (<code>ember-1482</code>, <code>css-1x9k2v</code>), chỉ số vị trí (<code>[3]</code>, <code>:nth-child(3)</code>) — chỉ cần giao diện đổi nhẹ là test hỏng.</p>', null],
  css:['Cú pháp CSS selector',
    '<ul><li><code>#user-name</code> — theo id; <code>.item-price</code> — theo class</li><li><code>[data-test=\'error\']</code> — theo thuộc tính; <code>input[type=\'password\']</code> — thẻ + thuộc tính</li><li><code>[id^=\'item_\']</code> bắt đầu bằng, <code>[id$=\'_title\']</code> kết thúc bằng, <code>[class*=\'btn\']</code> chứa</li><li><code>.inventory-item .item-name</code> — con cháu bất kỳ cấp; <code>form &gt; input</code> — con trực tiếp</li><li>CSS <b>không</b> tìm được theo nội dung chữ và không đi ngược lên phần tử cha — khi cần thì dùng XPath.</li></ul>', null],
  xpath:['XPath tương đối (relative XPath)',
    '<ul><li><code>//tag[@attr=\'v\']</code> — tìm ở mọi cấp; <code>/</code> ở đầu là đường dẫn tuyệt đối từ gốc → tránh.</li><li><code>//a[text()=\'Mũ lưỡi trai\']</code> theo chữ chính xác; <code>//h3[contains(text(),\'Sai\')]</code> chứa chữ; <code>normalize-space()</code> bỏ khoảng trắng thừa.</li><li>Trục (axis): <code>ancestor::div[@data-test=\'item\']</code> đi lên cha, <code>following-sibling::button</code> anh em phía sau.</li><li>Điều kiện lồng: <code>//div[@data-test=\'item\'][.//a[text()=\'Giày sneaker canvas\']]//button</code> — “nút nằm trong ô sản phẩm có tên Giày sneaker canvas”.</li></ul>',
    '// Nút "Thêm vào giỏ" của đúng sản phẩm, không phụ thuộc vị trí trong danh sách\nBy addSneaker = By.xpath(\n    "//a[text()=\'Giày sneaker canvas\']/ancestor::div[@data-test=\'item\']//button");'],
  findEls:['findElement và findElements',
    '<p><code>findElement</code> trả về phần tử <b>đầu tiên</b> khớp, không có thì ném <code>NoSuchElementException</code>. <code>findElements</code> trả về <code>List&lt;WebElement&gt;</code>, không có thì trả danh sách rỗng — dùng để đếm hoặc kiểm tra “không còn hiển thị”.</p>',
    'List<WebElement> prices = driver.findElements(By.cssSelector("[data-test=\'price\']"));\nAssert.assertEquals(prices.size(), 6);\nboolean noBadge = driver.findElements(By.cssSelector(".cart-badge")).isEmpty();'],
  testng:['TestNG cơ bản: @Test, @BeforeMethod, @AfterMethod, Assert',
    '<ul><li><code>@BeforeMethod</code> chạy <b>trước mỗi</b> @Test (mở trình duyệt); <code>@AfterMethod</code> chạy <b>sau mỗi</b> @Test (đóng trình duyệt) → test độc lập với nhau.</li><li><code>@BeforeClass</code>/<code>@AfterClass</code> chạy một lần cho cả class — nhanh hơn nhưng các test dùng chung trạng thái.</li><li><b>TestNG:</b> <code>Assert.assertEquals(actual, expected)</code> — giá trị thực tế đứng trước. (JUnit thì ngược lại.)</li><li>Mỗi @Test phải có ít nhất một assertion; test không có assertion luôn “pass” và không chứng minh gì.</li></ul>',
    'public class LoginTest {\n    private WebDriver driver;\n\n    @BeforeMethod\n    public void setUp() {\n        driver = new ChromeDriver();\n        driver.get("https://qa.shopdemo.test/login");\n    }\n\n    @Test\n    public void hienThiOMatKhau() {\n        Assert.assertTrue(driver.findElement(By.id("password")).isDisplayed());\n    }\n\n    @AfterMethod\n    public void tearDown() {\n        if (driver != null) driver.quit();\n    }\n}'],
  waits:['Ba kiểu chờ: Implicit, Explicit, Fluent Wait',
    '<ul><li><b>Implicit wait</b> (<code>driver.manage().timeouts().implicitlyWait(...)</code>): áp cho mọi findElement, chỉ chờ phần tử <i>có trong DOM</i>.</li><li><b>Explicit wait</b> (<code>WebDriverWait</code> + <code>ExpectedConditions</code>): chờ một điều kiện cụ thể (hiển thị, bấm được, có alert…) — kiểu nên dùng.</li><li><b>Fluent wait</b>: explicit wait tự cấu hình tần suất kiểm tra (polling) và exception bỏ qua. <code>WebDriverWait</code> chính là một <code>FluentWait</code> dựng sẵn.</li><li><b>Không trộn</b> implicit và explicit: thời gian chờ cộng dồn khó đoán. <b>Không dùng</b> <code>Thread.sleep</code>: luôn chờ đủ thời gian (chậm) mà vẫn có thể thiếu (flaky).</li></ul>',
    'WebDriverWait wait = new WebDriverWait(driver, Duration.ofSeconds(10));\nWebElement title = wait.until(\n    ExpectedConditions.visibilityOfElementLocated(By.cssSelector("[data-test=\'page-title\']")));\n\n// Fluent wait: kiểm tra mỗi 500 ms, bỏ qua NoSuchElementException\nWait<WebDriver> fluent = new FluentWait<>(driver)\n    .withTimeout(Duration.ofSeconds(10))\n    .pollingEvery(Duration.ofMillis(500))\n    .ignoring(NoSuchElementException.class);'],
  ec:['ExpectedConditions hay dùng',
    '<table class="tbl"><tr><th>Điều kiện</th><th>Dùng khi</th></tr><tr><td><code>visibilityOfElementLocated(by)</code></td><td>Chờ phần tử hiện ra để đọc chữ</td></tr><tr><td><code>elementToBeClickable(by)</code></td><td>Chờ trước khi click</td></tr><tr><td><code>invisibilityOfElementLocated(by)</code></td><td>Chờ spinner biến mất</td></tr><tr><td><code>textToBe(by, text)</code></td><td>Chờ chữ đổi thành giá trị mong đợi</td></tr><tr><td><code>urlContains(s)</code>, <code>titleIs(s)</code></td><td>Chờ chuyển trang</td></tr><tr><td><code>alertIsPresent()</code></td><td>Chờ hộp thoại alert/confirm — trả về <code>Alert</code></td></tr><tr><td><code>frameToBeAvailableAndSwitchToIt(by)</code></td><td>Chờ iframe sẵn sàng và chuyển vào</td></tr><tr><td><code>numberOfWindowsToBe(n)</code></td><td>Chờ tab/cửa sổ mới mở</td></tr></table>', null],
  select:['Dropdown với lớp Select',
    '<p>Chỉ dùng cho thẻ <code>&lt;select&gt;</code> thật. Dropdown tự vẽ bằng div thì click như phần tử thường.</p>',
    'Select sort = new Select(driver.findElement(By.cssSelector("[data-test=\'sort\']")));\nsort.selectByVisibleText("Giá: thấp đến cao");   // theo chữ hiển thị\nsort.selectByValue("lohi");                       // theo thuộc tính value\nString chosen = sort.getFirstSelectedOption().getText();'],
  alert:['Alert, confirm, prompt của trình duyệt',
    '<p>Hộp thoại JavaScript không nằm trong DOM nên không findElement được. Chờ bằng <code>alertIsPresent()</code> rồi dùng <code>getText()</code>, <code>accept()</code> (OK), <code>dismiss()</code> (Cancel), <code>sendKeys()</code> (prompt).</p>',
    'Alert alert = wait.until(ExpectedConditions.alertIsPresent());\n// hoặc: Alert alert = driver.switchTo().alert();\nAssert.assertEquals(alert.getText(), "Xóa toàn bộ giỏ hàng?");\nalert.accept();'],
  frame:['Làm việc với iframe',
    '<p>Phần tử trong iframe thuộc một tài liệu khác: phải <code>switchTo().frame(...)</code> trước khi tìm, xong việc thì <code>switchTo().defaultContent()</code> để quay về trang chính. Quên quay về → mọi findElement sau đó đều NoSuchElement.</p>',
    'wait.until(ExpectedConditions.frameToBeAvailableAndSwitchToIt(By.id("chat-frame")));\ndriver.findElement(By.id("chat-input")).sendKeys("Xin chào");\ndriver.switchTo().defaultContent();   // về trang chính\n// switchTo().parentFrame() chỉ lùi một cấp khi có iframe lồng nhau'],
  window:['Nhiều cửa sổ / tab',
    '<p>Mỗi cửa sổ có một <b>handle</b>. Lưu handle gốc, chờ số cửa sổ tăng, duyệt <code>getWindowHandles()</code> để chuyển sang handle mới; xong thì <code>close()</code> tab đó và chuyển về handle gốc.</p>',
    'String original = driver.getWindowHandle();\nlink.click();\nwait.until(ExpectedConditions.numberOfWindowsToBe(2));\nfor (String h : driver.getWindowHandles()) {\n    if (!h.equals(original)) driver.switchTo().window(h);\n}\n// ... kiểm tra tab mới ...\ndriver.close();\ndriver.switchTo().window(original);\n\n// Selenium 4: tự mở tab mới\ndriver.switchTo().newWindow(WindowType.TAB);'],
  actions:['Actions, JavascriptExecutor và upload file',
    '<ul><li><code>Actions</code>: hover (<code>moveToElement</code>), double click, right click (<code>contextClick</code>), kéo thả (<code>dragAndDrop</code>) — luôn kết thúc bằng <code>.perform()</code>.</li><li><code>JavascriptExecutor</code>: cuộn tới phần tử, đọc giá trị JS. Chỉ dùng khi thao tác bình thường không làm được — click bằng JS bỏ qua kiểm tra “người dùng có bấm được không”.</li><li>Upload: <code>sendKeys</code> <b>đường dẫn tuyệt đối</b> vào <code>&lt;input type="file"&gt;</code>, không click mở hộp thoại của hệ điều hành. Đường dẫn dựng từ thư mục project, không hard-code <code>C:\\Users\\...</code>.</li></ul>',
    'new Actions(driver).moveToElement(menu).perform();\n((JavascriptExecutor) driver).executeScript("arguments[0].scrollIntoView(true);", el);\nString path = Paths.get("src/test/resources/data/avatar.png").toAbsolutePath().toString();\ndriver.findElement(By.id("avatar-upload")).sendKeys(path);'],
  shot:['Chụp màn hình khi fail và chạy headless',
    '<ul><li>Headless: chạy trình duyệt không mở cửa sổ — cần cho CI. Chrome: <code>--headless=new</code>. Nên bật/tắt bằng tham số (<code>-Dheadless=true</code>), không sửa code.</li><li>Đặt <code>--window-size=1366,768</code> khi headless để layout giống khi chạy thường.</li><li><code>@AfterMethod</code> nhận <code>ITestResult</code>: nếu <code>getStatus() == ITestResult.FAILURE</code> thì chụp màn hình <b>trước</b> khi quit driver.</li></ul>',
    'File src = ((TakesScreenshot) driver).getScreenshotAs(OutputType.FILE);\nPath dest = Paths.get("target/screenshots", result.getName() + ".png");\nFiles.createDirectories(dest.getParent());\nFiles.copy(src.toPath(), dest, StandardCopyOption.REPLACE_EXISTING);'],
  xml:['testng.xml: suite, test, group, class, package',
    '<p>Cấu trúc: <code>&lt;suite&gt;</code> chứa một hoặc nhiều <code>&lt;test&gt;</code>; mỗi test chọn code cần chạy bằng <code>&lt;classes&gt;</code> hoặc <code>&lt;packages&gt;</code> và lọc theo <code>&lt;groups&gt;&lt;run&gt;&lt;include/&gt;&lt;exclude/&gt;</code>.</p>',
    '<!DOCTYPE suite SYSTEM "https://testng.org/testng-1.0.dtd">\n<suite name="ShopDemo">\n    <test name="Smoke">\n        <groups>\n            <run>\n                <include name="smoke"/>\n            </run>\n        </groups>\n        <classes>\n            <class name="tests.LoginTest"/>\n        </classes>\n    </test>\n</suite>', 'xml'],
  groups:['Group, priority, dependsOn và alwaysRun',
    '<ul><li><code>@Test(groups = {"smoke", "regression"})</code> — một test có thể thuộc nhiều group.</li><li><code>priority</code>: số nhỏ chạy trước (mặc định 0). Chỉ để sắp thứ tự hiển thị, không dùng để “test B cần dữ liệu test A tạo”.</li><li><code>dependsOnMethods</code>: A fail thì B bị <b>SKIP</b>; test không chạy riêng được → hạn chế dùng. Mỗi test tự chuẩn bị dữ liệu (qua API, qua bước đăng nhập chung).</li><li>Chạy theo group thì <code>@BeforeMethod</code>/<code>@AfterMethod</code> không khai báo group sẽ <b>không chạy</b> → thêm <code>alwaysRun = true</code>.</li><li>Maven: <code>mvn test -Dgroups=smoke</code>.</li></ul>', null],
  parallel:['Chạy song song và an toàn luồng (thread-safety)',
    '<p><code>parallel="methods" thread-count="3"</code> chạy 3 test cùng lúc trên 3 luồng. Nếu driver là <code>static WebDriver driver</code> thì các luồng ghi đè driver của nhau → test click nhầm cửa sổ, fail ngẫu nhiên. Cách đúng: mỗi luồng một driver, giữ trong <code>ThreadLocal&lt;WebDriver&gt;</code> (bài C1).</p><p>Giá trị <code>parallel</code>: <code>methods</code>, <code>classes</code>, <code>tests</code>, <code>instances</code>.</p>', null],
  listener:['Listener (ITestListener) và log',
    '<p>Listener nhận sự kiện của TestNG: <code>onTestStart</code>, <code>onTestSuccess</code>, <code>onTestFailure</code>, <code>onTestSkipped</code>… Dùng để ghi log, chụp ảnh khi fail, đính kèm vào report mà không lặp code trong từng test. Đăng ký bằng <code>&lt;listeners&gt;</code> trong testng.xml hoặc <code>@Listeners(TestListener.class)</code> trên class.</p><p>Ghi log bằng logger (SLF4J/Log4j2) thay cho <code>System.out.println</code>: có mức (INFO, ERROR), có thời gian, ghi ra file được.</p>',
    'public class TestListener implements ITestListener {\n    private static final Logger log = LoggerFactory.getLogger(TestListener.class);\n\n    @Override\n    public void onTestFailure(ITestResult result) {\n        log.error("FAIL: {}", result.getName(), result.getThrowable());\n    }\n}'],
  report:['Report: Allure và ExtentReports',
    '<ul><li><b>Allure</b>: TestNG ghi kết quả vào <code>target/allure-results</code> (thư viện <code>allure-testng</code>); xem bằng <code>allure serve target/allure-results</code> hoặc tạo HTML bằng <code>allure generate</code>. Đính ảnh: <code>Allure.addAttachment(...)</code>; chia bước: <code>@Step</code> (cần cấu hình aspectj trong surefire).</li><li><b>ExtentReports</b>: tự tạo file HTML trong code (ExtentSparkReporter), thường gọi từ listener.</li><li>Report mặc định của TestNG/Surefire nằm ở <code>target/surefire-reports</code>.</li></ul>', null],
  pom:['Page Object Model (POM)',
    '<ul><li>Mỗi trang (hoặc thành phần lớn) là một class: chứa <b>locator</b> (private) và <b>hành động</b> nghiệp vụ (<code>login(user, pass)</code>, <code>getErrorText()</code>).</li><li>Test chỉ gọi hành động và <b>assert</b>; page object <b>không assert</b> (trả dữ liệu cho test tự kiểm tra).</li><li>Giao diện đổi → chỉ sửa một chỗ trong page object, không sửa hàng chục test.</li><li>Hành động dẫn sang trang khác có thể trả về page object của trang đó (<code>InventoryPage</code>) — gọi là fluent page.</li></ul>',

{ id:'T2', ph:'T', kind:'code', lang:'java', page:'inventory', snippet:true, t:'Sửa test flaky: thay Thread.sleep bằng explicit wait', learn:['waits','ec'],

    { t:'Vẫn kiểm tra tiêu đề “Sản phẩm”', re:/Assert\.\w+\s*\([\s\S]*"Sản phẩm"|textToBe\s*\([^;]*"Sản phẩm"[\s\S]*Assert\./ },
    { t:'Không đặt implicit wait trong test', not:true, re:/implicitlyWait/ },

  answer:'@Test\npublic void dangNhapUserCham() {\n    login("slow_user", "Demo@123");\n    WebDriverWait wait = new WebDriverWait(driver, Duration.ofSeconds(10));\n    WebElement title = wait.until(\n        ExpectedConditions.visibilityOfElementLocated(By.cssSelector("[data-test=\'page-title\']")));\n    Assert.assertEquals(title.getText(), "Sản phẩm");\n}\n',

{ id:'T3', ph:'T', kind:'code', lang:'java', page:'inventory', snippet:true, t:'Dropdown sắp xếp và kiểm tra giá tăng dần', learn:['select','findEls'],

  starter:'@Test\npublic void sapXepGiaTangDan() {\n    // TODO\n}\n',

    { t:'Kiểm tra lựa chọn hiện tại (getFirstSelectedOption)', re:/getFirstSelectedOption\s*\(\s*\)/ },
    { t:'Lấy danh sách giá bằng findElements', re:/findElements\s*\(/ },
    { t:'Đổi chữ giá thành số', re:/(Integer|Long|Double)\.(parseInt|parseLong|parseDouble|valueOf)\s*\(/, why:'"149.000 ₫" phải bỏ ký tự không phải số (replaceAll("[^0-9]", "")) rồi parse — so sánh chuỗi "99.000" và "149.000" sẽ sai thứ tự.' },
    { t:'So sánh với bản đã sắp xếp hoặc duyệt từng cặp', re:/Collections\.sort|\.sorted\s*\(|\.sort\s*\(|for\s*\([^;]*;[^;]*;[^)]*\)\s*\{[\s\S]*?(<=|>=|<|>)/ },
    { t:'Có assertion', re:/Assert\.\w+\s*\(/, min:2, why:'Cần ít nhất 2 assertion: lựa chọn của dropdown và thứ tự giá.' },

  answer:'@Test\npublic void sapXepGiaTangDan() {\n    Select sort = new Select(driver.findElement(By.cssSelector("[data-test=\'sort\']")));\n    sort.selectByVisibleText("Giá: thấp đến cao");\n    Assert.assertEquals(sort.getFirstSelectedOption().getText(), "Giá: thấp đến cao");\n\n    List<WebElement> prices = driver.findElements(By.cssSelector("[data-test=\'price\']"));\n    List<Integer> values = new ArrayList<>();\n    for (WebElement p : prices) {\n        values.add(Integer.parseInt(p.getText().replaceAll("[^0-9]", "")));\n    }\n    List<Integer> sorted = new ArrayList<>(values);\n    Collections.sort(sorted);\n    Assert.assertEquals(values, sorted);\n}\n',

  hints:['<code>selectByIndex</code> dễ vỡ khi thêm lựa chọn mới — dùng chữ hiển thị hoặc value.', 'Sắp xếp chuỗi "99.000 ₫" đứng sau "459.000 ₫" vì so từng ký tự → phải đổi sang số.'] },

{ id:'T8', ph:'T', kind:'code', lang:'java', snippet:true, t:'Bài nộp buổi 7: headless và chụp màn hình khi fail', learn:['shot'],
  need:['Viết lại <code>setUp</code> và <code>tearDown</code> của class test:', '① Tạo <code>ChromeOptions</code>; bật headless (<code>--headless=new</code>) <b>chỉ khi</b> chạy với <code>-Dheadless=true</code>; đặt kích thước cửa sổ.', '② Trong <code>@AfterMethod</code> nhận <code>ITestResult</code>; nếu test fail thì chụp màn hình, lưu vào <code>target/screenshots/&lt;tên test&gt;.png</code>, <b>sau đó</b> mới quit driver.'],
  starter:'@BeforeMethod\npublic void setUp() {\n    driver = new ChromeDriver();\n}\n\n@AfterMethod\npublic void tearDown() {\n    driver.quit();\n}\n',
  rules:[
    { t:'Dùng ChromeOptions và truyền vào ChromeDriver', re:/new\s+ChromeOptions\s*\(\s*\)[\s\S]*new\s+ChromeDriver\s*\(\s*\w+\s*\)/ },
    { t:'Headless bật theo tham số hệ thống, không cố định', re:/System\.(getProperty|getenv)\s*\(\s*"headless"/, why:'Đọc System.getProperty("headless", "false") để chạy thường trên máy và headless trên CI mà không sửa code.' },
    { t:'Dùng cờ --headless=new', re:/"--headless(=new)?"/ },
    { t:'Đặt kích thước cửa sổ', re:/--window-size=\d+,\d+|\.setSize\s*\(|\.maximize\s*\(/ },
    { t:'@AfterMethod nhận ITestResult', re:/@AfterMethod[\s\S]*?\(\s*ITestResult\s+\w+\s*\)/ },
    { t:'Chỉ chụp khi FAILURE', re:/getStatus\s*\(\s*\)\s*==\s*ITestResult\.FAILURE|ITestResult\.FAILURE\s*==\s*\w+\.getStatus\s*\(\s*\)|!\s*\w+\.isSuccess\s*\(\s*\)/ },
    { t:'Chụp bằng TakesScreenshot.getScreenshotAs', re:/\(\s*\(\s*TakesScreenshot\s*\)\s*driver\s*\)\s*\.getScreenshotAs\s*\(\s*OutputType\.(FILE|BYTES)\s*\)/ },
    { t:'Tên file ảnh theo tên test, trong target/screenshots', re:/target\/screenshots[\s\S]*getName\s*\(\s*\)|getName\s*\(\s*\)[\s\S]*target\/screenshots/ },
    { t:'quit() sau khi chụp', fn:s => { const a = s.search(/getScreenshotAs/), q = s.lastIndexOf('.quit('); return a >= 0 && q > a; }, why:'Quit trước thì không còn trình duyệt để chụp.' },
  ],
  answer:'@BeforeMethod\npublic void setUp() {\n    ChromeOptions options = new ChromeOptions();\n    if (Boolean.parseBoolean(System.getProperty("headless", "false"))) {\n        options.addArguments("--headless=new");\n    }\n    options.addArguments("--window-size=1366,768");\n    driver = new ChromeDriver(options);\n}\n\n@AfterMethod\npublic void tearDown(ITestResult result) throws IOException {\n    if (result.getStatus() == ITestResult.FAILURE) {\n        File src = ((TakesScreenshot) driver).getScreenshotAs(OutputType.FILE);\n        Path dest = Paths.get("target/screenshots", result.getName() + ".png");\n        Files.createDirectories(dest.getParent());\n        Files.copy(src.toPath(), dest, StandardCopyOption.REPLACE_EXISTING);\n    }\n    driver.quit();\n}\n',
  wrong:['@BeforeMethod\npublic void setUp() {\n    ChromeOptions options = new ChromeOptions();\n    options.addArguments("--headless=new");\n    options.addArguments("--window-size=1366,768");\n    driver = new ChromeDriver(options);\n}\n@AfterMethod\npublic void tearDown(ITestResult result) throws IOException {\n    if (result.getStatus() == ITestResult.FAILURE) {\n        File src = ((TakesScreenshot) driver).getScreenshotAs(OutputType.FILE);\n        Files.copy(src.toPath(), Paths.get("target/screenshots", result.getName() + ".png"));\n    }\n    driver.quit();\n}',
    '@BeforeMethod\npublic void setUp() {\n    ChromeOptions options = new ChromeOptions();\n    if (Boolean.parseBoolean(System.getProperty("headless", "false"))) options.addArguments("--headless=new");\n    options.addArguments("--window-size=1366,768");\n    driver = new ChromeDriver(options);\n}\n@AfterMethod\npublic void tearDown(ITestResult result) throws IOException {\n    driver.quit();\n    if (result.getStatus() == ITestResult.FAILURE) {\n        File src = ((TakesScreenshot) driver).getScreenshotAs(OutputType.FILE);\n        Files.copy(src.toPath(), Paths.get("target/screenshots", result.getName() + ".png"));\n    }\n}'],
  hints:['<code>Boolean.parseBoolean(System.getProperty("headless", "false"))</code> — giá trị mặc định "false" khi không truyền -D.', '<code>Files.createDirectories</code> tạo thư mục nếu chưa có, tránh NoSuchFileException.'] },

{ id:'N1', ph:'N', kind:'code', lang:'xml', t:'testng.xml chỉ chạy group smoke', learn:['xml','groups'],
  need:['Viết <code>testng-smoke.xml</code>: suite tên “ShopDemo Smoke”, một <code>&lt;test&gt;</code> chỉ chạy các test thuộc group <code>smoke</code>.', 'Lấy test từ 2 class <code>tests.LoginTest</code> và <code>tests.CartTest</code>.'],
  starter:'<!DOCTYPE suite SYSTEM "https://testng.org/testng-1.0.dtd">\n<suite name="ShopDemo Smoke">\n\n</suite>\n',
  rules:[

    { t:'Có <test name="…"> bên trong suite', re:/<suite[\s\S]*<test\s+[^>]*name\s*=\s*"[^"]+"[\s\S]*<\/suite>/ },
    { t:'Lọc group: <groups><run><include name="smoke"/>', re:/<groups>\s*<run>[\s\S]*?<include\s+name\s*=\s*"smoke"\s*\/>[\s\S]*?<\/run>\s*<\/groups>/ },
    { t:'Khai báo class tests.LoginTest', re:/<class\s+name\s*=\s*"tests\.LoginTest"\s*\/>/ },
    { t:'Khai báo class tests.CartTest', re:/<class\s+name\s*=\s*"tests\.CartTest"\s*\/>/ },
    { t:'Các <class> nằm trong <classes>', re:/<classes>[\s\S]*<class\s[\s\S]*<\/classes>/ },
  ],
  answer:'<!DOCTYPE suite SYSTEM "https://testng.org/testng-1.0.dtd">\n<suite name="ShopDemo Smoke">\n    <test name="Smoke">\n        <groups>\n            <run>\n                <include name="smoke"/>\n            </run>\n        </groups>\n        <classes>\n            <class name="tests.LoginTest"/>\n            <class name="tests.CartTest"/>\n        </classes>\n    </test>\n</suite>\n',

    '<suite name="ShopDemo Smoke">\n    <test name="Smoke">\n        <groups><run><include name="smoke"/></run></groups>\n        <classes>\n            <class name="tests.LoginTest"/>\n            <class name="tests.CartTest">\n        </classes>\n    </test>\n</suite>'],
  hints:['Thứ tự lồng: <code>suite › test › groups › run › include</code> và <code>suite › test › classes › class</code>.', 'Thẻ rỗng phải tự đóng: <code>&lt;class name="..."/&gt;</code>.'] },
{ id:'N2', ph:'N', kind:'code', lang:'xml', t:'Suite regression chạy song song', learn:['xml','parallel','listener'],
  need:['Viết <code>testng-regression.xml</code>: chạy <b>song song theo method</b> với <b>3 luồng</b>.', 'Chạy mọi class trong package <code>tests</code>, lấy group <code>regression</code> nhưng <b>bỏ</b> group <code>broken</code> (test đang chờ sửa).', 'Đăng ký listener <code>listeners.TestListener</code> ở mức suite.'],
  starter:'<!DOCTYPE suite SYSTEM "https://testng.org/testng-1.0.dtd">\n<suite name="ShopDemo Regression">\n\n</suite>\n',
  rules:[

    { t:'Suite có thread-count="3"', re:/<suite\s[^>]*thread-count\s*=\s*"3"/ },
    { t:'Đăng ký <listeners><listener class-name="listeners.TestListener"/>', re:/<listeners>\s*<listener\s+class-name\s*=\s*"listeners\.TestListener"\s*\/>\s*<\/listeners>/ },
    { t:'Lấy group regression', re:/<run>[\s\S]*?<include\s+name\s*=\s*"regression"\s*\/>[\s\S]*?<\/run>/ },
    { t:'Loại group broken', re:/<run>[\s\S]*?<exclude\s+name\s*=\s*"broken"\s*\/>[\s\S]*?<\/run>/ },
    { t:'Chạy cả package tests: <packages><package name="tests"/>', re:/<packages>\s*<package\s+name\s*=\s*"tests"\s*\/>\s*<\/packages>/ },
  ],
  answer:'<!DOCTYPE suite SYSTEM "https://testng.org/testng-1.0.dtd">\n<suite name="ShopDemo Regression" parallel="methods" thread-count="3">\n    <listeners>\n        <listener class-name="listeners.TestListener"/>\n    </listeners>\n    <test name="Regression">\n        <groups>\n            <run>\n                <include name="regression"/>\n                <exclude name="broken"/>\n            </run>\n        </groups>\n        <packages>\n            <package name="tests"/>\n        </packages>\n    </test>\n</suite>\n',

    '<suite name="ShopDemo Regression" parallel="methods" thread-count=3>\n    <listeners><listener class-name="listeners.TestListener"/></listeners>\n    <test name="Regression">\n        <groups><run><include name="regression"/><exclude name="broken"/></run></groups>\n        <packages><package name="tests"/></packages>\n    </test>\n</suite>'],
  hints:['<code>parallel</code> và <code>thread-count</code> là thuộc tính của thẻ <code>&lt;suite&gt;</code> (cũng đặt được ở <code>&lt;test&gt;</code>).', 'Giá trị thuộc tính XML luôn nằm trong dấu nháy.'] },
{ id:'N3', ph:'N', kind:'code', lang:'java', t:'Gắn group và bỏ dependsOn', learn:['groups'],
  need:['Class <code>CartTest</code> bên dưới dùng <code>dependsOnMethods</code>: test 2 và 3 cần giỏ hàng do test 1 tạo — chạy riêng một test là fail/skip.', 'Sửa để <b>mỗi test tự chuẩn bị dữ liệu</b> (dùng các hàm có sẵn trong <code>BaseTest</code>: <code>loginAs(user)</code>, <code>addToCart(tên sản phẩm)</code>).', 'Gắn group: test thêm vào giỏ thuộc <code>smoke</code> và <code>regression</code>; hai test còn lại thuộc <code>regression</code>.'],
  starter:'public class CartTest extends BaseTest {\n\n    @Test(priority = 1)\n    public void themSanPhamVaoGio() {\n        loginAs("an_user");\n        addToCart("Mũ lưỡi trai");\n        Assert.assertEquals(driver.findElement(By.cssSelector(".cart-badge")).getText(), "1");\n    }\n\n    @Test(priority = 2, dependsOnMethods = "themSanPhamVaoGio")\n    public void badgeDemDungSoLuong() {\n        addToCart("Balo laptop 15 inch");\n        Assert.assertEquals(driver.findElement(By.cssSelector(".cart-badge")).getText(), "2");\n    }\n\n    @Test(priority = 3, dependsOnMethods = "badgeDemDungSoLuong")\n    public void xoaSanPhamKhoiGio() {\n        driver.findElement(By.cssSelector("[data-test=\'remove\']")).click();\n        Assert.assertEquals(driver.findElement(By.cssSelector(".cart-badge")).getText(), "1");\n    }\n}\n',
  rules:[
    { t:'Không còn dependsOnMethods', not:true, re:/dependsOnMethods/ },
    { t:'Có 3 @Test đều khai báo groups', re:/@Test\s*\(\s*[^)]*groups\s*=/, min:3 },
    { t:'Một test thuộc cả smoke và regression', re:/groups\s*=\s*\{\s*("smoke"\s*,\s*"regression"|"regression"\s*,\s*"smoke")\s*\}/ },
    { t:'Mỗi test tự đăng nhập (loginAs)', each:/@Test\b/, re:/loginAs\s*\(/, why:'Mỗi test chạy trên trình duyệt mới (BeforeMethod) nên phải tự đăng nhập.' },
    { t:'Mỗi test tự thêm sản phẩm cần thiết (addToCart)', each:/@Test\b/, re:/addToCart\s*\(/ },
    { t:'Mỗi @Test có assertion', each:/@Test\b/, re:/Assert\.\w+\s*\(/ },
    { t:'Không dùng priority để sắp thứ tự phụ thuộc', not:true, re:/priority\s*=/, why:'Test đã độc lập thì không cần priority; giữ lại dễ khiến người sau tưởng thứ tự là quan trọng.' },
  ],
  answer:'public class CartTest extends BaseTest {\n\n    @Test(groups = {"smoke", "regression"})\n    public void themSanPhamVaoGio() {\n        loginAs("an_user");\n        addToCart("Mũ lưỡi trai");\n        Assert.assertEquals(driver.findElement(By.cssSelector(".cart-badge")).getText(), "1");\n    }\n\n    @Test(groups = {"regression"})\n    public void badgeDemDungSoLuong() {\n        loginAs("an_user");\n        addToCart("Mũ lưỡi trai");\n        addToCart("Balo laptop 15 inch");\n        Assert.assertEquals(driver.findElement(By.cssSelector(".cart-badge")).getText(), "2");\n    }\n\n    @Test(groups = {"regression"})\n    public void xoaSanPhamKhoiGio() {\n        loginAs("an_user");\n        addToCart("Mũ lưỡi trai");\n        driver.findElement(By.cssSelector("[data-test=\'remove\']")).click();\n        Assert.assertTrue(driver.findElements(By.cssSelector(".cart-badge")).isEmpty());\n    }\n}\n',
  wrong:['public class CartTest extends BaseTest {\n    @Test(groups = {"smoke", "regression"})\n    public void a() { loginAs("an_user"); addToCart("Mũ lưỡi trai"); Assert.assertEquals(1, 1); }\n    @Test(groups = {"regression"}, dependsOnMethods = "a")\n    public void b() { loginAs("an_user"); addToCart("x"); Assert.assertEquals(1, 1); }\n    @Test(groups = {"regression"})\n    public void c() { loginAs("an_user"); addToCart("x"); Assert.assertEquals(1, 1); }\n}',
    'public class CartTest extends BaseTest {\n    @Test(groups = {"smoke", "regression"})\n    public void a() { loginAs("an_user"); addToCart("Mũ lưỡi trai"); Assert.assertEquals(1, 1); }\n    @Test(groups = {"regression"})\n    public void b() { addToCart("x"); Assert.assertEquals(1, 1); }\n    @Test(groups = {"regression"})\n    public void c() { loginAs("an_user"); addToCart("x"); Assert.assertEquals(1, 1); }\n}'],
  hints:['Test xóa: sau khi xóa sản phẩm duy nhất, badge biến mất → dùng <code>findElements(...).isEmpty()</code>.'] },

{ id:'N5', ph:'N', kind:'code', lang:'java', t:'Listener: log và đính ảnh khi fail', learn:['listener','report'],
  need:['Viết class <code>TestListener</code> cài <code>ITestListener</code>:', '• <code>onTestStart</code> ghi log tên test (mức INFO);', '• <code>onTestFailure</code> ghi log mức ERROR kèm thông điệp lỗi (<code>getThrowable()</code>), chụp màn hình và đính vào report Allure.', 'Lấy driver qua <code>((BaseTest) result.getInstance()).getDriver()</code>. Dùng logger SLF4J, không dùng <code>System.out.println</code>.'],
  starter:'public class TestListener implements ITestListener {\n\n}\n',
  rules:[
    { t:'Cài interface ITestListener', re:/class\s+TestListener\s+implements\s+ITestListener/ },
    { t:'Có logger (LoggerFactory.getLogger / LogManager.getLogger)', re:/(LoggerFactory|LogManager)\.getLogger\s*\(/ },
    { t:'onTestStart ghi log INFO', re:/void\s+onTestStart\s*\(\s*ITestResult\s+\w+\s*\)\s*\{[^}]*\.info\s*\(/ },
    { t:'onTestFailure ghi log ERROR', re:/void\s+onTestFailure\s*\(\s*ITestResult\s+\w+\s*\)\s*\{[\s\S]*?\.error\s*\(/ },
    { t:'Log kèm lỗi từ getThrowable()', re:/getThrowable\s*\(\s*\)/ },
    { t:'Lấy driver từ instance của test', re:/\(\s*\(\s*BaseTest\s*\)\s*\w+\.getInstance\s*\(\s*\)\s*\)\s*\.getDriver\s*\(\s*\)/ },
    { t:'Chụp màn hình (TakesScreenshot)', re:/\(\s*\(\s*TakesScreenshot\s*\)\s*\w+\s*\)\s*\.getScreenshotAs\s*\(/ },
    { t:'Đính ảnh vào Allure', re:/Allure\.addAttachment\s*\(/ },
    { t:'Không dùng System.out.println', not:true, re:/System\.out\.print/ },
    { t:'Dùng @Override cho các hàm của interface', re:/@Override/, min:2 },
  ],
  answer:'public class TestListener implements ITestListener {\n    private static final Logger log = LoggerFactory.getLogger(TestListener.class);\n\n    @Override\n    public void onTestStart(ITestResult result) {\n        log.info("BẮT ĐẦU: {}", result.getName());\n    }\n\n    @Override\n    public void onTestSuccess(ITestResult result) {\n        log.info("PASS: {}", result.getName());\n    }\n\n    @Override\n    public void onTestFailure(ITestResult result) {\n        log.error("FAIL: {} - {}", result.getName(), result.getThrowable().getMessage());\n        WebDriver driver = ((BaseTest) result.getInstance()).getDriver();\n        if (driver != null) {\n            byte[] png = ((TakesScreenshot) driver).getScreenshotAs(OutputType.BYTES);\n            Allure.addAttachment(result.getName(), new ByteArrayInputStream(png));\n        }\n    }\n}\n',
  wrong:['public class TestListener implements ITestListener {\n    @Override\n    public void onTestStart(ITestResult result) { System.out.println("START " + result.getName()); }\n    @Override\n    public void onTestFailure(ITestResult result) {\n        System.out.println("FAIL " + result.getThrowable());\n        WebDriver driver = ((BaseTest) result.getInstance()).getDriver();\n        byte[] png = ((TakesScreenshot) driver).getScreenshotAs(OutputType.BYTES);\n        Allure.addAttachment(result.getName(), new ByteArrayInputStream(png));\n    }\n}'],
  hints:['SLF4J: <code>private static final Logger log = LoggerFactory.getLogger(TestListener.class);</code>, ghi bằng <code>log.info("... {}", x)</code>.', '<code>Allure.addAttachment(tên, InputStream)</code> — bọc mảng byte bằng <code>new ByteArrayInputStream(png)</code>.'] },

  answer:'public class LoginPage {\n    private static final String URL = "https://qa.shopdemo.test/login";\n    private final WebDriver driver;\n    private final By username = By.id("user-name");\n    private final By password = By.id("password");\n    private final By loginButton = By.cssSelector("[data-test=\'login-button\']");\n    private final By errorMessage = By.cssSelector("[data-test=\'error\']");\n\n    public LoginPage(WebDriver driver) {\n        this.driver = driver;\n    }\n\n    public void open() {\n        driver.get(URL);\n    }\n\n    public void login(String user, String pass) {\n        driver.findElement(username).sendKeys(user);\n        driver.findElement(password).sendKeys(pass);\n        driver.findElement(loginButton).click();\n    }\n\n    public String getErrorText() {\n        return driver.findElement(errorMessage).getText();\n    }\n}\n',

{ id:'P3', ph:'P', kind:'code', lang:'java', t:'BasePage với explicit wait', learn:['base','waits'],
  need:['Viết <code>abstract class BasePage</code> giữ <code>protected WebDriver driver</code> và <code>WebDriverWait wait</code> (10 giây), cùng các hàm:', '• <code>click(By)</code> — chờ <code>elementToBeClickable</code> rồi click;', '• <code>type(By, String)</code> — chờ hiển thị, xóa nội dung cũ, nhập;', '• <code>textOf(By)</code> — chờ hiển thị rồi trả chữ.', 'Viết lại <code>LoginPage extends BasePage</code>, chỉ dùng các hàm trên (không gọi <code>driver.findElement</code> trực tiếp).'],
  starter:'public abstract class BasePage {\n\n}\n\npublic class LoginPage extends BasePage {\n\n}\n',
  rules:[
    { t:'abstract class BasePage', re:/abstract\s+class\s+BasePage\b/ },
    { t:'BasePage có protected WebDriver', in:'BasePage', re:/protected\s+(final\s+)?WebDriver\s+\w+/ },
    { t:'BasePage tạo WebDriverWait với Duration', in:'BasePage', re:/new\s+WebDriverWait\s*\(\s*\w+\s*,\s*Duration\.ofSeconds\s*\(/ },
    { t:'click(By) chờ elementToBeClickable', in:'BasePage', re:/void\s+click\s*\(\s*By\s+\w+\s*\)\s*\{[\s\S]*?elementToBeClickable/ },
    { t:'type(By, String) chờ hiển thị, clear rồi sendKeys', in:'BasePage', re:/void\s+type\s*\(\s*By\s+\w+\s*,\s*String\s+\w+\s*\)\s*\{[\s\S]*?\.clear\s*\(\s*\)[\s\S]*?\.sendKeys\s*\(/ },
    { t:'textOf(By) trả String', in:'BasePage', re:/String\s+textOf\s*\(\s*By\s+\w+\s*\)/ },
    { t:'LoginPage extends BasePage', re:/class\s+LoginPage\s+extends\s+BasePage/ },
    { t:'Constructor LoginPage gọi super(driver)', in:'LoginPage', re:/super\s*\(\s*\w+\s*\)/ },
    { t:'LoginPage không gọi driver.findElement trực tiếp', in:'LoginPage', not:true, re:/findElement/ },
    { t:'LoginPage dùng type/click/textOf', in:'LoginPage', fn:s => /\btype\s*\(/.test(s) && /\bclick\s*\(/.test(s) && /\btextOf\s*\(/.test(s) },
  ],
  answer:'public abstract class BasePage {\n    protected final WebDriver driver;\n    protected final WebDriverWait wait;\n\n    protected BasePage(WebDriver driver) {\n        this.driver = driver;\n        this.wait = new WebDriverWait(driver, Duration.ofSeconds(10));\n    }\n\n    protected WebElement waitVisible(By locator) {\n        return wait.until(ExpectedConditions.visibilityOfElementLocated(locator));\n    }\n\n    protected void click(By locator) {\n        wait.until(ExpectedConditions.elementToBeClickable(locator)).click();\n    }\n\n    protected void type(By locator, String text) {\n        WebElement el = waitVisible(locator);\n        el.clear();\n        el.sendKeys(text);\n    }\n\n    protected String textOf(By locator) {\n        return waitVisible(locator).getText();\n    }\n}\n\npublic class LoginPage extends BasePage {\n    private final By username = By.id("user-name");\n    private final By password = By.id("password");\n    private final By loginButton = By.cssSelector("[data-test=\'login-button\']");\n    private final By errorMessage = By.cssSelector("[data-test=\'error\']");\n\n    public LoginPage(WebDriver driver) {\n        super(driver);\n    }\n\n    public void login(String user, String pass) {\n        type(username, user);\n        type(password, pass);\n        click(loginButton);\n    }\n\n    public String getErrorText() {\n        return textOf(errorMessage);\n    }\n}\n',
  wrong:['public abstract class BasePage {\n    protected WebDriver driver;\n    protected WebDriverWait wait;\n    protected BasePage(WebDriver driver) { this.driver = driver; this.wait = new WebDriverWait(driver, Duration.ofSeconds(10)); }\n    protected void click(By l) { wait.until(ExpectedConditions.elementToBeClickable(l)).click(); }\n    protected void type(By l, String t) { WebElement e = wait.until(ExpectedConditions.visibilityOfElementLocated(l)); e.clear(); e.sendKeys(t); }\n    protected String textOf(By l) { return wait.until(ExpectedConditions.visibilityOfElementLocated(l)).getText(); }\n}\npublic class LoginPage extends BasePage {\n    private final By u = By.id("user-name");\n    public LoginPage(WebDriver driver) { super(driver); }\n    public void login(String a, String b) { type(u, a); click(u); driver.findElement(u).click(); }\n    public String getErrorText() { return textOf(u); }\n}'],
  hints:['Hàm helper để <code>protected</code>: page con dùng được, test thì không gọi trực tiếp.'] },

  answer:'public class LoginDataTest extends BaseTest {\n\n    @DataProvider(name = "loginData")\n    public Object[][] loginData() throws IOException {\n        List<String> lines = Files.readAllLines(Paths.get("src/test/resources/data/login.csv"));\n        Object[][] data = new Object[lines.size() - 1][];\n        for (int i = 1; i < lines.size(); i++) {\n            String[] cols = lines.get(i).split(",", -1);\n            data[i - 1] = new Object[] { cols[0], cols[1], cols[2] };\n        }\n        return data;\n    }\n\n    @Test(dataProvider = "loginData")\n    public void dangNhapSai(String user, String pass, String expectedError) {\n        LoginPage loginPage = new LoginPage(driver);\n        loginPage.open();\n        loginPage.login(user, pass);\n        Assert.assertEquals(loginPage.getErrorText(), expectedError);\n    }\n}\n',
  wrong:['public class LoginDataTest extends BaseTest {\n    @DataProvider(name = "loginData")\n    public Object[][] loginData() throws IOException {\n        List<String> lines = Files.readAllLines(Paths.get("src/test/resources/data/login.csv"));\n        Object[][] data = new Object[lines.size() - 1][];\n        for (int i = 1; i < lines.size(); i++) {\n            String[] c = lines.get(i).split(",");\n            data[i - 1] = new Object[] { c[0], c[1], c[2] };\n        }\n        return data;\n    }\n    @Test(dataProvider = "loginData")\n    public void x(String u, String p, String e) { LoginPage l = new LoginPage(driver); l.open(); l.login(u, p); Assert.assertEquals(l.getErrorText(), e); }\n}',

  answer:'public final class ConfigReader {\n    private static final Properties PROPS = new Properties();\n\n    static {\n        String env = System.getProperty("env", "qa");\n        String path = "src/test/resources/config/" + env + ".properties";\n        try (InputStream in = new FileInputStream(path)) {\n            PROPS.load(in);\n        } catch (IOException e) {\n            throw new IllegalStateException("Không đọc được file cấu hình: " + path, e);\n        }\n    }\n\n    private ConfigReader() {}\n\n    public static String get(String key) {\n        String value = System.getProperty(key, PROPS.getProperty(key));\n        if (value == null) {\n            throw new IllegalArgumentException("Thiếu khóa cấu hình: " + key);\n        }\n        return value;\n    }\n}\n',

/* ===================== Chấm Locator ===================== */
const STRATS = [['id','By.id'],['name','By.name'],['className','By.className'],['tagName','By.tagName'],['linkText','By.linkText'],['partialLinkText','By.partialLinkText'],['css','By.cssSelector'],['xpath','By.xpath']];
const stratName = k => (STRATS.find(x => x[0] === k) || [k, k])[1];
const docCache = {};
function pageDoc(key){
  if (!docCache[key]){
    const d = new DOMParser().parseFromString('<!doctype html><html><head><title>ShopDemo</title></head><body>' + PAGES[key].html + '</body></html>', 'text/html');
    let i = 0; d.body.querySelectorAll('*').forEach(el => el.setAttribute('data-sx', String(i++)));
    docCache[key] = d;
  }
  return docCache[key];
}
const norm = s => s.replace(/\s+/g, ' ').trim();
function findBy(doc, strat, v){
  if (!v.trim()) return { err:'Giá trị locator đang trống.' };
  const inBody = e => doc.body.contains(e);
  try {
    switch (strat){
      case 'id': return { els:[...doc.querySelectorAll('[id]')].filter(e => e.id === v) };
      case 'name': return { els:[...doc.querySelectorAll('[name]')].filter(e => e.getAttribute('name') === v) };
      case 'className':
        if (/\s/.test(v.trim())) return { err:'InvalidSelectorException: Compound class names not permitted — By.className chỉ nhận MỘT class, không có dấu cách.' };
        if (/^\./.test(v)) return { err:'InvalidSelectorException: By.className nhận tên class, không có dấu chấm (dấu chấm là cú pháp CSS).' };
        return { els:[...doc.body.getElementsByClassName(v.trim())] };
      case 'tagName': return { els:[...doc.body.getElementsByTagName(v.trim())] };
      case 'linkText': return { els:[...doc.querySelectorAll('a')].filter(a => norm(a.textContent) === v) };
      case 'partialLinkText': return { els:[...doc.querySelectorAll('a')].filter(a => norm(a.textContent).includes(v)) };
      case 'css': return { els:[...doc.querySelectorAll(v)].filter(inBody) };
      case 'xpath': {
        const r = doc.evaluate(v, doc, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null), els = [];
        for (let i = 0; i < r.snapshotLength; i++){
          const n = r.snapshotItem(i);
          if (n.nodeType !== 1) return { err:'InvalidSelectorException: XPath phải trả về phần tử (element), không phải chữ hay thuộc tính — bỏ /text() hoặc /@... ở cuối.' };
          els.push(n);
        }
        return { els };
      }
    }
  } catch(e){ return { err:'InvalidSelectorException: ' + (strat === 'xpath' ? 'XPath' : 'CSS selector') + ' không hợp lệ — kiểm tra dấu ngoặc và dấu nháy.' }; }
  return { err:'Chiến lược không hỗ trợ.' };
}
function gradeLoc(t, strat, v){
  const doc = pageDoc(t.page), r = findBy(doc, strat, v), checks = [];
  checks.push({ t:'Locator hợp lệ', ok:!r.err, why:r.err });
  if (r.err) return { pass:false, checks, els:[] };
  const els = r.els, target = [...doc.querySelectorAll(t.target)].filter(e => doc.body.contains(e));
  if (t.many) checks.push({ t:'Khớp đủ ' + target.length + ' phần tử', ok:els.length === target.length, why:'Đang khớp ' + els.length + ' phần tử.' });
  else checks.push({ t:'Khớp duy nhất 1 phần tử', ok:els.length === 1, why:els.length ? 'Đang khớp ' + els.length + ' phần tử — findElement sẽ lấy phần tử đầu tiên, dễ trỏ nhầm.' : 'Không khớp phần tử nào → NoSuchElementException.' });
  const same = els.length > 0 && els.length === target.length && els.every(e => target.includes(e));
  checks.push({ t:t.many ? 'Đúng các phần tử cần tìm' : 'Đúng phần tử cần tìm', ok:same, why:'Phần tử khớp (tô vàng trên trang) không phải phần tử đề bài yêu cầu.' });
  if (t.only) checks.push({ t:'Dùng ' + t.only.map(stratName).join(' hoặc '), ok:t.only.includes(strat), why:'Đề bài yêu cầu chiến lược này.' });
  if (t.forbid && t.forbid[strat]) checks.push({ t:'Không dùng ' + stratName(strat), ok:false, why:t.forbid[strat] });
  if (t.must) checks.push({ t:t.must[1], ok:t.must[0].test(v) });
  if (strat === 'xpath') checks.push({ t:'Không dùng XPath tuyệt đối', ok:!/^\s*\(?\s*\/(?!\/)/.test(v), why:'Bắt đầu bằng một dấu / là đi từ gốc trang — thêm một thẻ bất kỳ là hỏng.' });
  if (strat === 'xpath' || strat === 'css') checks.push({ t:'Không dựa vào chỉ số vị trí', ok:!(strat === 'xpath' ? /\[\s*\d+\s*\]/.test(v) : /:nth-(child|of-type)|:(first|last)-(child|of-type)/.test(v)), why:'[3] hay :nth-child(3) đổi nghĩa khi danh sách được sắp xếp lại hoặc thêm phần tử.' });
  checks.push({ t:'Không dùng id/class tự sinh', ok:!/ember-\d+|css-[0-9a-z]{4,}/i.test(v), why:'ember-1482, css-1x9k2v do framework sinh ra, đổi sau mỗi lần build.' });
  return { pass:checks.every(c => c.ok), checks, els };
}

/* ===================== Chấm code (Java / XML / YAML) ===================== */
function stripJava(src){
  let out = '', i = 0; const n = src.length;
  while (i < n){
    const c = src[i], d = src[i + 1];
    if (c === '/' && d === '/'){ while (i < n && src[i] !== '\n') i++; continue; }
    if (c === '/' && d === '*'){ i += 2; while (i < n && !(src[i] === '*' && src[i + 1] === '/')){ if (src[i] === '\n') out += '\n'; i++; } i += 2; out += ' '; continue; }

    t.qs.map((q, i) => '<div class="qq"><p class="q">Câu ' + (i + 1) + '. ' + q.q + '</p>' + q.o.map((o, j) => {
      const sel = ans.a && ans.a[i] === j, cls = sub ? (j === q.a && sel ? ' right' : sel ? ' wrong' : '') : '';
      return '<label class="opt' + cls + '"><input type="radio" name="q' + i + '" value="' + j + '"' + (sel ? ' checked' : '') + '><span>' + esc(o) + '</span></label>'; }).join('') +
      (sub ? '<p class="expl">' + (ans.a && ans.a[i] === q.a ? '✓ Đúng. ' : '✗ Chưa đúng. ') + esc(q.w) + '</p>' : '') + '</div>').join('') +
    '<div id="qRes"></div></div>';
  w.querySelectorAll('input[type=radio]').forEach(r => r.onchange = () => { const a = (S.quiz[t.id] && S.quiz[t.id].a) || []; a[+r.name.slice(1)] = +r.value; S.quiz[t.id] = { a, sub:false }; save(); });
  if (sub){ const right = t.qs.filter((q, i) => ans.a[i] === q.a).length; showQuizRes(t, right); }
  $('qSubmit').onclick = () => {
    const a = (S.quiz[t.id] && S.quiz[t.id].a) || [];
    if (t.qs.some((q, i) => a[i] == null)){ $('qRes').innerHTML = '<p class="msg">Còn câu chưa chọn đáp án.</p>'; return; }
    S.quiz[t.id] = { a, sub:true }; save();
    if (t.qs.every((q, i) => a[i] === q.a)) markDone(t);
    workQuiz(t, w);
  };
}
function showQuizRes(t, right){
  const ok = right === t.qs.length;
  $('qRes').innerHTML = '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + right + '/' + t.qs.length + ' câu đúng' + (ok ? ' — đạt.' + nextBtn(t) : ' — đọc giải thích ở câu tô đỏ, chọn lại rồi nộp lần nữa.') + '</div>';
  wireNext($('qRes'));
}
function workReview(t, w){
  const st = S.rev[t.id] || { a:[], sub:false };
  w.innerHTML = '<div class="toolbar"><span class="ttl">Pull request: BaseTest.java, CheckoutTest.java</span><button type="button" class="btn primary" id="rvSubmit">Nộp đánh giá</button></div>' +
    '<div class="sec"><pre class="syn">' + hlJava(t.code) + '</pre></div><div class="sec"><h4>Checklist 9 mục</h4><div class="res">' +
    t.items.map((it, i) => { const v = st.a[i], cls = st.sub ? (v === it[1] ? ' right' : ' wrong') : '';
      return '<div class="rv' + cls + '"><span>' + (i + 1) + '. ' + esc(it[0]) + '</span><span class="seg"><button type="button" data-i="' + i + '" data-v="0" aria-pressed="' + (v === 0) + '">Đạt</button><button type="button" data-i="' + i + '" data-v="1" aria-pressed="' + (v === 1) + '">Vi phạm</button></span>' +
        (st.sub && (v !== it[1] || st.all) ? '<span class="ex">' + it[2] + '</span>' : '') + '</div>'; }).join('') + '</div><div id="rvRes" style="margin-top:10px"></div></div>';
  w.querySelectorAll('.seg button').forEach(b => b.onclick = () => { st.a[+b.dataset.i] = +b.dataset.v; st.sub = false; S.rev[t.id] = st; save(); workReview(t, w); });
  if (st.sub){ const right = t.items.filter((it, i) => st.a[i] === it[1]).length;
    $('rvRes').innerHTML = '<div class="verdict ' + (st.all ? 'ok' : 'no') + '">' + right + '/9 mục đánh giá đúng' + (st.all ? ' — đạt phần review của Checkpoint 2.' + nextBtn(t) : ' — đọc giải thích ở các mục tô đỏ rồi đánh giá lại.') + '</div>'; wireNext($('rvRes')); }
  $('rvSubmit').onclick = () => {
    if (t.items.some((it, i) => st.a[i] == null)){ $('rvRes').innerHTML = '<p class="msg">Còn mục chưa đánh giá.</p>'; return; }
    st.sub = true; st.all = t.items.every((it, i) => st.a[i] === it[1]); S.rev[t.id] = st; save();
    if (st.all) markDone(t);
    workReview(t, w);
  };
}
function workSelf(t, w){
  const st = S.self[t.id] || [];
  w.innerHTML = '<div class="toolbar"><span class="ttl">Tự kiểm tra bài nộp</span></div><div class="sec res">' +
    t.items.map((x, i) => '<label class="selfck"><input type="checkbox" data-i="' + i + '"' + (st[i] ? ' checked' : '') + '><span>' + esc(x) + '</span></label>').join('') + '<div id="selfRes"></div></div>';
  const upd = () => { const all = t.items.every((x, i) => st[i]);
    $('selfRes').innerHTML = all ? '<div class="verdict ok">Đã đủ các mục của bài nộp buổi 10.' + nextBtn(t) + '</div>' : '<p class="msg">' + t.items.filter((x, i) => st[i]).length + '/' + t.items.length + ' mục đã xong.</p>';
    wireNext($('selfRes'));
    if (all) markDone(t); else if (S.done[t.id]){ delete S.done[t.id]; save(); renderQueue(); renderTicket(); } };
  w.querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = () => { st[+c.dataset.i] = c.checked; S.self[t.id] = st; save(); upd(); });
  upd();
}

/* ===================== Tự kiểm tra dữ liệu bài (gọi selSelfTest() trong console) ===================== */
function selSelfTest(){
  const bad = [];
  TICKETS.forEach(t => {
    if (t.kind === 'loc'){
      if (pageDoc(t.page).querySelectorAll(t.target).length < 1) bad.push(t.id + ': target không tồn tại');
      (t.ans || []).forEach(a => { const g = gradeLoc(t, a[0], a[1]); if (!g.pass) bad.push(t.id + ' ans ' + a.join(' ') + ' → ' + g.checks.filter(c => !c.ok).map(c => c.t).join('; ')); });
      (t.bad || []).forEach(a => { if (gradeLoc(t, a[0], a[1]).pass) bad.push(t.id + ' bad passes: ' + a.join(' ')); });
    }
    if (t.kind === 'code'){
      const g = gradeCode(t, t.answer); if (!g.pass) bad.push(t.id + ' answer fails: ' + g.checks.filter(c => !c.ok).map(c => c.t + (c.why ? ' (' + c.why + ')' : '')).join('; '));
      if (gradeCode(t, t.starter).pass) bad.push(t.id + ' starter passes');
      (t.wrong || []).forEach((x, i) => { if (gradeCode(t, x).pass) bad.push(t.id + ' wrong#' + i + ' passes'); });
    }
    if (t.kind === 'quiz') t.qs.forEach((q, i) => { if (q.a == null || q.a >= q.o.length) bad.push(t.id + ' q' + i + ' đáp án sai chỉ số'); });
    (t.learn || []).forEach(k => { if (!LESSONS[k]) bad.push(t.id + ': thiếu bài học ' + k); });
  });
  return bad.length ? bad : 'all ok (' + TICKETS.length + ' bài)';
}

/* ===================== Điều khiển chung ===================== */
function openTicket(id){
  if (!TICKETS.some(t => t.id === id)) id = TICKETS[0].id;
  S.current = id; save();
  renderQueue(); renderTicket(); renderWork();
  $('ticket').scrollTop = 0; $('work').scrollTop = 0;
  try { if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id); } catch(e) {}
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TICKETS.some(t => t.id === h) && h !== S.current) openTicket(h); });
$('themeBtn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('selqc.theme', root.dataset.theme); } catch(e) {}
};
try { const th = localStorage.getItem('selqc.theme'); if (th) document.documentElement.dataset.theme = th; } catch(e) {}
openTicket(TICKETS.some(t => t.id === location.hash.slice(1)) ? location.hash.slice(1) : S.current);
</script>
