<style>
code.cblock{display:block;width:fit-content;max-width:100%;box-sizing:border-box;margin:6px 0;padding:8px 10px;
  background:var(--code-bg,#f4f4f5);border:1px solid var(--line,#ddd);border-radius:6px;font-size:12.5px;line-height:1.55;
  white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:auto;text-align:left}
</style>
<script>(function(){
  var SKIP='pre,button,a,label,summary,h1,h2,h3,h4,h5,h6,th,td,option,select,textarea,nav,.opt,.cblock-off';
  var KW=/^\s*(SELECT|INSERT|UPDATE|DELETE|WITH|CREATE|ALTER|DROP|FROM|WHERE|JOIN|LEFT JOIN|GROUP BY|ORDER BY|HAVING|CASE |UNION|\/\/|\/html|@|#|const |let |var |await |return |new |class |interface |package |driver\.|By\.|import |public |private |static |mvn |npx |npm |git |adb |k6 |curl |docker |mv |cp |cd |mkdir |assert|expect\(|test\(|Authorization:|Content-Type:|following-sibling|preceding-sibling|ancestor::)/i;
  var JSONISH=/^\s*[\[{]\s*["{\[]/;   // {"items": …} hoặc [{…}]
  var SYM=/[;{}()=]/;
  function isBlock(el){
    var t=(el.textContent||'').trim();
    if(t.length<28) return false;
    if(el.closest(SKIP)) return false;
    return KW.test(t) || JSONISH.test(t) || (SYM.test(t) && /[A-Za-z_]\w*\s*[(.=]/.test(t));
  }
  // Thành khối thì dấu câu ngay sau nó (". , ; :") sẽ rơi xuống một dòng riêng: bỏ dấu câu lẻ đó đi
  function mark(el){
    el.classList.add('cblock');
    var n=el.nextSibling;
    if(n&&n.nodeType===3&&/^[.,;:]/.test(n.nodeValue)) n.nodeValue=n.nodeValue.replace(/^[.,;:]\s*/,'');
  }
  function scan(root){
    var list=(root.querySelectorAll?root.querySelectorAll('code:not(.cblock)'):[]);
    for(var i=0;i<list.length;i++) if(isBlock(list[i])) mark(list[i]);
  }
  function start(){
    scan(document.body);
    new MutationObserver(function(ms){ for(var i=0;i<ms.length;i++){ var n=ms[i].addedNodes; for(var j=0;j<n.length;j++){ var x=n[j]; if(x.nodeType===1){ if(x.matches&&x.matches('code:not(.cblock)')&&isBlock(x)) mark(x); scan(x); } } } })
      .observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();</script>
<title>Luyện Java qua ticket QC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: bàn làm việc của QC — hàng đợi ticket bên trái, ticket ở giữa, khung code/terminal bên phải; điện thoại thì xếp chồng. */
:root{
  --bg:#f8f4f6; --surface:#ffffff; --sunken:#f1e9ed; --ink:#22161c; --muted:#6b5a63; --line:#e6d9df;
  --accent:#c2185b; --accent-ink:#ffffff; --accent-soft:#fce4ec;
  --pass:#1d7a46; --pass-soft:#e1f3e7; --fail:#b3261e; --fail-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fbf0d6;
  --t-ui:#1f5fae; --t-ui-soft:#e3edfa; --t-bug:#b3261e; --t-bug-soft:#fbe7e5; --t-dc:#8a5a00; --t-dc-soft:#fbf0d6; --t-td:#6a3fb0; --t-td-soft:#efe7fb;
  --code-bg:#fbf8f9; --kw:#ad1457; --str:#9a4b00; --num:#1f5fae; --cmt:#7c8a84;
  --f-display:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151013; --surface:#1d161a; --sunken:#100c0e; --ink:#efe6ea; --muted:#ab99a2; --line:#352a30;
  --accent:#f48fb1; --accent-ink:#2a0a17; --accent-soft:#3d1a29;
  --pass:#5fd08e; --pass-soft:#163322; --fail:#ff8a80; --fail-soft:#3a1a18; --warn:#f0c35a; --warn-soft:#352a12;
  --t-ui:#8db8f2; --t-ui-soft:#18273b; --t-bug:#ff8a80; --t-bug-soft:#3a1a18; --t-dc:#f0c35a; --t-dc-soft:#352a12; --t-td:#c3a6f5; --t-td-soft:#2a2040;
  --code-bg:#171114; --kw:#f8a5c2; --str:#f0b070; --num:#8db8f2; --cmt:#73827b; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151013; --surface:#1d161a; --sunken:#100c0e; --ink:#efe6ea; --muted:#ab99a2; --line:#352a30;
  --accent:#f48fb1; --accent-ink:#2a0a17; --accent-soft:#3d1a29;
  --pass:#5fd08e; --pass-soft:#163322; --fail:#ff8a80; --fail-soft:#3a1a18; --warn:#f0c35a; --warn-soft:#352a12;
  --t-ui:#8db8f2; --t-ui-soft:#18273b; --t-bug:#ff8a80; --t-bug-soft:#3a1a18; --t-dc:#f0c35a; --t-dc-soft:#352a12; --t-td:#c3a6f5; --t-td-soft:#2a2040;
  --code-bg:#171114; --kw:#f8a5c2; --str:#f0b070; --num:#8db8f2; --cmt:#73827b; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;display:flex;flex-direction:column}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
code,kbd,pre,textarea{font-family:var(--f-mono);font-variant-ligatures:none}
code{font-size:.9em;background:var(--sunken);padding:1px 5px;border-radius:4px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Thanh trên */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.bar{width:120px;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.switch{display:flex;gap:2px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.sw{padding:4px 12px;border-radius:6px;font-size:12.5px;font-weight:500;text-decoration:none;color:var(--muted);white-space:nowrap}
a.sw:hover{background:var(--sunken);color:var(--ink)}
.sw.cur{background:var(--accent);color:var(--accent-ink)}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:4px 8px;font-size:12px}

/* Khung chính */
.app{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr) minmax(0,1.15fr)}
.pane{min-height:0;overflow:auto}
.queue{border-right:1px solid var(--line);background:var(--surface);padding:12px 10px 24px}
.phase{margin-bottom:14px}
.phase h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 8px 6px}
.qitem{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:7px 8px;border-radius:6px}
.qitem:hover{background:var(--sunken)}
.qitem[aria-current="true"]{background:var(--accent-soft)}
.qitem .dot{width:14px;height:14px;margin-top:3px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.qitem.done .dot{background:var(--pass);border-color:var(--pass)}
.qitem.done .dot::after{content:"";width:6px;height:3px;border:solid var(--surface);border-width:0 0 1.5px 1.5px;transform:rotate(-45deg) translate(1px,-1px)}
.qitem .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:block}
.qitem .t{font-size:13px;line-height:1.35;display:block}
.qitem .s{font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--accent);display:block;line-height:1.35;margin-bottom:2px}
.qitem .t{color:var(--muted);font-size:12.5px}
.subtitle{font-size:15px;color:var(--muted);margin:0 0 10px;font-weight:500}
.practice{display:inline-flex;gap:8px;align-items:baseline;flex-wrap:wrap;background:var(--accent-soft);border-radius:8px;padding:6px 12px;margin-bottom:12px;font-size:13.5px}
.practice b{color:var(--accent);font-weight:600}
.practice code{background:transparent;padding:0;font-weight:500}

.ticket{padding:20px 24px 40px;border-right:1px solid var(--line)}
.tk-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tk-key{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.chip.ui{color:var(--t-ui);background:var(--t-ui-soft)}
.chip.bug{color:var(--t-bug);background:var(--t-bug-soft)}
.chip.dc{color:var(--t-dc);background:var(--t-dc-soft)}
.chip.td{color:var(--t-td);background:var(--t-td-soft)}
.chip.prio{color:var(--muted);background:var(--sunken)}
.ticket h2.title{font-size:21px;font-weight:700;line-height:1.3;margin-bottom:6px}
.meta{font-size:12.5px;color:var(--muted);margin-bottom:18px;display:flex;gap:14px;flex-wrap:wrap}
.field{margin-bottom:18px;max-width:68ch}
.field h3{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field p,.field ul,.field ol{margin:0 0 8px}
.field ul,.field ol{padding-left:20px}
.expect{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.skills{display:flex;gap:6px;flex-wrap:wrap}
.skills span{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13.5px}
.hint b{color:var(--warn);font-weight:600;margin-right:4px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:13px}
.linkbtn:disabled{color:var(--muted);cursor:default}
.lesson{display:flex;flex-direction:column;gap:8px}
.kw{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.kw summary{cursor:pointer;padding:8px 12px;font-weight:600}
.kw summary code{background:transparent;padding:0;color:var(--accent);font-size:13px}
.kw-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.kw-body p{margin:0}
.kw-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:4px}
.kw-label .linkbtn{text-transform:none;letter-spacing:0;font-size:12.5px}
pre.syn{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;font-size:12.5px;line-height:1.55;white-space:pre}
.kw-note{font-size:13px;color:var(--muted)}
.kw-note b{color:var(--ink)}
.out .answer pre{margin-bottom:10px}
.qc{border-radius:8px;padding:12px 14px;background:var(--accent-soft);max-width:68ch}
.qc h3{color:var(--accent)}
.answer pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:12.5px;line-height:1.6;white-space:pre}

/* Console */
.work{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--surface)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 12px;font-weight:500;font-size:13px}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:default}
.kbd{font-size:11.5px;color:var(--muted);margin-left:auto}
.editor-wrap{position:relative;flex:0 0 42%;min-height:170px;border-bottom:1px solid var(--line);background:var(--code-bg)}
.editor-wrap pre,.editor-wrap textarea{position:absolute;inset:0;margin:0;padding:12px 14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;overflow:auto;tab-size:2}
.editor-wrap pre{pointer-events:none;color:var(--ink)}
.editor-wrap textarea{border:0;resize:none;background:transparent;color:transparent;caret-color:var(--ink);outline:none}
.editor-wrap textarea::selection{background:var(--accent-soft);color:var(--ink);-webkit-text-fill-color:var(--ink)}
.hl-k{color:var(--kw);font-weight:500}.hl-s{color:var(--str)}.hl-n{color:var(--num)}.hl-c{color:var(--cmt);font-style:italic}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:9px 10px;color:var(--muted);font-size:13px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .badge{font-size:11px;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--sunken)}
.tab .badge.pass{background:var(--pass-soft);color:var(--pass)}.tab .badge.fail{background:var(--fail-soft);color:var(--fail)}
.out{flex:1;min-height:0;overflow:auto;padding:12px 14px 24px}
.msg{font-size:13px;color:var(--muted);margin:0 0 10px}
.msg.err{color:var(--fail);background:var(--fail-soft);padding:8px 12px;border-radius:8px;font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-width:100%}
table.res{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:100%}
table.res th,table.res td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.res th{position:sticky;top:0;background:var(--sunken);font-family:var(--f-mono);font-weight:500;font-size:12px}
table.res td.num{text-align:right;font-family:var(--f-mono)}
table.res td.null{color:var(--muted);font-style:italic}
table.res tr:last-child td{border-bottom:0}
.checks{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;font-size:13.5px}
.checks .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.checks .ok .ic{background:var(--pass-soft);color:var(--pass)}
.checks .no .ic{background:var(--fail-soft);color:var(--fail)}
.checks .skip .ic{background:var(--sunken);color:var(--muted)}
.verdict{border-radius:8px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.verdict.pass{background:var(--pass-soft);color:var(--pass)}
.verdict.fail{background:var(--fail-soft);color:var(--fail)}
.trap{background:var(--warn-soft);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13.5px}
.trap b{color:var(--warn)}
.dtable{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.dtable summary{cursor:pointer;padding:8px 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}
.dtable summary::-webkit-details-marker{display:none}
.dtable summary b{font-family:var(--f-mono);font-weight:500}
.dtable summary span{color:var(--muted);font-size:12.5px}
.dtable .cols{padding:0 12px 8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dtable .body{padding:0 12px 12px}
.legend{font-size:12.5px;color:var(--muted);margin-bottom:12px;max-width:68ch}
.loading{color:var(--muted);font-size:13px}

/* Buổi 2: nhãn kế hoạch, tiêu chí đạt, câu hỏi ERD, sơ đồ ERD */
.chip.learn{color:var(--accent);background:var(--accent-soft)}
.phase h2 .ses{display:block;text-transform:none;letter-spacing:0;font-weight:500;color:var(--accent);font-size:11.5px;margin-top:1px}
.crit{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 12px;margin:0 0 14px;display:flex;flex-direction:column;gap:8px}
.crit-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.crit-head h2{font-size:13px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);padding:0}
.crit-chip{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.crit-chip.ok{background:var(--pass-soft);color:var(--pass)}
.crit ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.crit li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12.5px;align-items:baseline}
.crit li .cn{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.crit li.ok .cn{color:var(--pass);font-weight:600}
.crit li .bar{grid-column:1/-1;width:100%;height:4px}
.crit li.ok .bar i{background:var(--pass)}
.crit p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
.crit textarea{width:100%;min-height:120px;font-size:11.5px;border:1px solid var(--line);border-radius:6px;background:var(--code-bg);color:var(--ink);padding:6px}
.crit-inline{display:none;max-width:68ch;margin-top:8px}
.quiz{padding-left:20px;margin:8px 0 0;display:flex;flex-direction:column;gap:14px}
.quiz code{overflow-wrap:anywhere}
.ticket h2.title,.ticket .subtitle{overflow-wrap:anywhere}
.quiz .opts{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.quiz label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13.5px}
.quiz label:hover{background:var(--sunken)}
.quiz input{margin:3px 0 0;accent-color:var(--accent)}
.erd{overflow-x:auto;margin:6px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px}
.erd svg{display:block;width:100%;min-width:520px;height:auto}
.erd text{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.erd .bx{fill:var(--surface);stroke:var(--line)}
.erd .hd{fill:var(--accent-soft)}
.erd .tn{font-family:var(--f-display);font-weight:700;font-size:12px}
.erd .pk{fill:var(--accent);font-weight:600;font-size:10px}
.erd .fk{fill:var(--t-ui);font-weight:600;font-size:10px}
.erd .ln{stroke:var(--muted);fill:none;stroke-width:1.4}
.erd .ln.opt{stroke-dasharray:5 4}
.erd .card{fill:var(--muted);font-weight:600}
.erd .lg{fill:var(--muted);font-family:var(--f-body)}

@media (max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:auto minmax(0,1fr)}
  .queue{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 10px}
  .phase{display:contents}
  .phase h2{display:none}
  .qitem{flex:0 0 auto;width:auto;grid-template-columns:14px auto}
  .qitem .s{white-space:nowrap;margin-bottom:0}
  .qitem .t{display:none}
  .queue .crit{display:none}
  .crit-inline{display:flex}
}
@media (max-width:760px){
  html,body{height:auto}
  .app{display:block}
  .pane{overflow:visible}
  .queue{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow-x:auto}
  .switch{max-width:100%;overflow-x:auto}

<script>
/* ===================== Trình thông dịch Java (tập con của buổi 3–5) =====================

class JErr extends Error {

class JStr { constructor(s){ this.s = s; } }
let OBJ_ID = 0;
const idHash = id => ((0x1b6d3586 + id * 0x2f0b3e1) >>> 0).toString(16);
const ARRCODE = { int:'I', long:'J', double:'D', char:'C', boolean:'Z' };

/* Map / Set. mode: hash (HashMap, thứ tự theo bucket), linked (thứ tự thêm vào), tree (sắp xếp theo khóa) */
class JMap {
  constructor(kt, vt, mode, isSet){ this.kt = kt; this.vt = vt; this.mode = mode; this.isSet = !!isSet; this.m = new Map(); this.seq = 0; this.cap = 16; this.mod = 0; this.imm = false; this.id = ++OBJ_ID; }

const J_KW = new Set('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var true false null'.split(' '));
const J_OPS = ['>>>=','<<=','>>=','>>>','...','->','::','++','--','&&','||','==','!=','<=','>=','+=','-=','*=','/=','%=','&=','|=','^=','<<','>>','+','-','*','/','%','=','<','>','!','~','?',':',';',',','.','(',')','{','}','[',']','&','|','^','@'];

function jLex(src){
  const toks = []; let i = 0, line = 1; const n = src.length;
  while (i < n){
    const c = src[i];
    if (c === '\n'){ line++; i++; continue; }
    if (/\s/.test(c)){ i++; continue; }
    if (c === '/' && src[i+1] === '/'){ while (i < n && src[i] !== '\n') i++; continue; }
    if (c === '/' && src[i+1] === '*'){ const j = src.indexOf('*/', i + 2); if (j < 0) throw CERR('unclosed comment', line); for (let k = i; k < j; k++) if (src[k] === '\n') line++; i = j + 2; continue; }
    if (c === '"'){
      if (src.startsWith('"""', i)) throw UNSUP('Text block """ … """', line);
      let j = i + 1, s = '';

      }
      if (j >= n) throw CERR('unclosed string literal', line);

    }
    if (c === "'"){
      let j = i + 1, s;
      if (src[j] === '\\'){ const r = jEsc(src, j, line); s = r.ch; j = r.end; } else { s = src[j]; j++; }

function jEsc(src, j, line){

        if (!pflag && !isDir(env, parentOf(p)) && parentOf(p) !== HOME){ print("mkdir: cannot create directory '" + a + "': No such file or directory (thêm -p để tạo cả thư mục cha)", 'err'); return; }
        mkdirs(env, p);
      });
      return;
    }
    case 'mv': case 'cp': {
      const ops = args.filter(a => !a.startsWith('-'));
      if (ops.length < 2){ print(cmd + ': missing destination file operand', 'err'); return; }
      const dst0 = ops[ops.length - 1], srcs = ops.slice(0, -1);
      const dst = normPath(env.cwd, dst0);
      if (srcs.length > 1 && !isDir(env, dst)){ print(cmd + ": target '" + dst0 + "' is not a directory", 'err'); return; }
      srcs.forEach(s0 => {
        const s = normPath(env.cwd, s0);
        const into = isDir(env, dst) ? dst + '/' + baseOf(s) : dst;
        if (dst0.endsWith('/') && !isDir(env, dst)){ print(cmd + ": cannot move '" + s0 + "' to '" + dst0 + "': Not a directory (tạo thư mục trước bằng mkdir -p)", 'err'); return; }
        if (env.files.has(s)){
          if (!isDir(env, parentOf(into))){ print(cmd + ": cannot " + (cmd === 'mv' ? 'move' : 'create regular file') + " '" + s0 + "' to '" + dst0 + "': No such file or directory", 'err'); return; }
          writeFile(env, into, env.files.get(s)); if (cmd === 'mv') env.files.delete(s); return;
        }
        if (isDir(env, s)){
          if (cmd === 'cp' && !args.some(a => /^-\w*r/i.test(a))){ print("cp: -r not specified; omitting directory '" + s0 + "'", 'err'); return; }
          filesUnder(env, s).forEach(f => { writeFile(env, into + f.slice(s.length), env.files.get(f)); if (cmd === 'mv') env.files.delete(f); });
          [...env.dirs].filter(d => d === s || d.startsWith(s + '/')).forEach(d => { mkdirs(env, into + d.slice(s.length)); if (cmd === 'mv') env.dirs.delete(d); });
          return;
        }
        print(cmd + ": cannot stat '" + s0 + "': No such file or directory", 'err');
      });
      return;
    }
    case 'rm': {
      const rec = args.some(a => /^-\w*r/i.test(a));
      args.filter(a => !a.startsWith('-')).forEach(a => {
        const p = normPath(env.cwd, a.replace(/\/$/, ''));
        if (env.files.has(p)){ env.files.delete(p); return; }
        if (isDir(env, p)){ if (!rec){ print("rm: cannot remove '" + a + "': Is a directory", 'err'); return; } filesUnder(env, p).forEach(f => env.files.delete(f)); [...env.dirs].forEach(d => { if (d === p || d.startsWith(p + '/')) env.dirs.delete(d); }); return; }
        print("rm: cannot remove '" + a + "': No such file or directory", 'err');
      });
      return;
    }
    case 'clear': return;
    case 'nano': case 'vim': case 'vi': case 'code': case 'idea': print(cmd + ': trình mô phỏng không mở được trình soạn thảo. Dùng echo "nội dung" > file hoặc echo "dòng" >> file.', 'warn'); return;
  }
  print('bash: ' + cmd + ': command not found', 'err');
}
/* Chạy cả kịch bản: mỗi dòng một lệnh, dòng bắt đầu bằng # là chú thích */
function runScript(env, script){
  const out = [];
  const print = (t, c) => out.push({ t:String(t), c:c || '' });
  script.split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line || line.startsWith('#')) return;
    const r = repoOf(env);
    out.push({ prompt:true, t:'qc@laptop:' + tildify(env.cwd) + (r ? ' (' + r.head + ')' : '') + '$ ', cmd:line });
    try { shCmd(env, line, print); } catch (e){ print('Lỗi trình mô phỏng: ' + e.message, 'err'); }
  });
  return out;
}

function addFiles(env, root, files){ Object.entries(files).forEach(([p, c]) => writeFile(env, root + '/' + p, c)); mkdirs(env, root); }
function addRepo(env, root, history, opts){
  opts = opts || {};
  const r = { root, index:new Map(), commits:new Map(), branches:new Map([['main', null]]), head:'main', remote:null, upstream:new Map(), config:{} };
  env.repos.set(root, r); mkdirs(env, root);
  let tree = new Map(), parent = null;
  history.forEach(h => {
    Object.entries(h.files || {}).forEach(([p, c]) => tree.set(p, c));
    (h.del || []).forEach(p => tree.delete(p));
    parent = makeCommit(env, r, h.msg, tree, parent);
  });
  r.branches.set('main', parent); r.index = new Map(tree);
  tree.forEach((c, p) => writeFile(env, root + '/' + p, c));
  return r;
}
function addRemote(env, url, history){
  const tmp = newEnv(); const r = addRepo(tmp, '/tmp/remote', history);
  env.remotes.set(url, { url, commits:new Map(r.commits), branches:new Map(r.branches), head:'main' });
  env.seq += tmp.seq;
}

  checks:[

    ['Có ít nhất 1 commit', env => allMsgs(env, P).length >= 1],

  ],
  traps:[
    env => { const m = allMsgs(env, P); return m.some(c => !meaningfulMsg(c.msg)) ? 'Message "' + esc(m.find(c => !meaningfulMsg(c.msg)).msg) + '" chưa nói commit này làm gì. Ví dụ tốt: "Khởi tạo project Maven shop-tests và README".' : null; },
    env => env.repos.has(P) && !allMsgs(env, P).length ? 'Đã init nhưng chưa commit. Có thể bạn quên <code>git add</code> trước <code>git commit</code>.' : null,

<p><code>target/</code> sinh lại được bằng <code>mvn package</code>; <code>.idea/</code> khác nhau trên mỗi máy. Cả hai không được đưa lên repo.</p>`,

cat .gitignore

git commit -m "Thêm .gitignore cho target/ và .idea/, thêm test cộng với 0"
git status`,

  checks:[

    ['.gitignore có .idea/', env => { const t = headTree(env, P); return !!t && t.has('.gitignore') && /^\/?\.idea\/?\s*$/m.test(t.get('.gitignore')); }],
    ['Commit không chứa file nào trong target/ hay .idea/', env => { const t = headTree(env, P); return !!t && !hasPath(t, 'target') && !hasPath(t, '.idea'); }],

    ['Commit message mới có nghĩa', env => { const m = allMsgs(env, P); return m.length > 1 && meaningfulMsg(m[0].msg); }],

    env => { const g = env.files.get(P + '/.gitignore'); return g && /target\s+\.idea|\.idea\s+target/.test(g.split('\n')[0]) ? 'Hai mẫu đang nằm trên cùng một dòng. Mỗi dòng của .gitignore là một mẫu: dùng <code>&gt;</code> cho dòng đầu và <code>&gt;&gt;</code> cho dòng sau.' : null; },
    env => { const g = env.files.get(P + '/.gitignore'); return g && !/\.idea/.test(g) && /idea/.test(g) ? 'Tên thư mục là <code>.idea</code> (có dấu chấm ở đầu).' : null; } ],
  hints:['<code>echo "target/" &gt; .gitignore</code> tạo file mới (ghi đè nếu đã có).', '<code>&gt;&gt;</code> thêm dòng vào cuối file, <code>&gt;</code> ghi đè cả file.', 'Chạy <code>git status</code> sau khi tạo .gitignore: target/ và .idea/ phải biến mất khỏi danh sách.'],
  qc:`<p>File build trong repo làm diff phình to, gây conflict vô nghĩa, và che mất thay đổi thật khi review. Tiêu chí đạt buổi 3 ghi rõ: không commit <code>target/</code> và <code>.idea/</code>.</p>
<p>Thói quen tốt: tạo <code>.gitignore</code> ngay sau <code>git init</code>, trước lần <code>git add .</code> đầu tiên.</p>`,
},

{ id:'J4', phase:'J', key:'Java 4', name:'Ép kiểu và làm tròn', type:'bug', mode:'java', prio:'High', reporter:'QC (màn đánh giá sản phẩm)',
  title:'Điểm đánh giá luôn là số tròn, sản phẩm chưa có đánh giá làm crash',
  skills:['double','(double)','Math.round','printf("%.1f")','if'],
  context:`<p>Màn sản phẩm hiện điểm đánh giá trung bình (1 chữ số thập phân) và số sao (làm tròn đến số nguyên gần nhất, 4.5 → 5). Input: tổng số sao và số lượt đánh giá.</p>
<p><b>Bug 1:</b> 13 sao / 3 lượt hiện <code>4.0</code>, mong đợi <code>4.3</code>.<br><b>Bug 2:</b> 4.7 điểm chỉ hiện 4 sao.<br><b>Bug 3:</b> sản phẩm chưa có lượt đánh giá nào làm chương trình dừng với <code>ArithmeticException</code>.</p>`,
  task:`<p>Sửa code. Khi số lượt = 0, chỉ in đúng một dòng <code>Chưa có đánh giá</code>.</p>`,
  expect:'13 3 → "Điểm trung bình: 4.3" và "Số sao hiển thị: 4". 9 2 → 4.5 và 5 sao. 0 0 → "Chưa có đánh giá".',
  cases:[ { in:'13 3' }, { in:'9 2', note:'biên làm tròn: .5' }, { in:'47 10' }, { in:'5 1' }, { in:'0 0', note:'biên: chưa có lượt nào' } ],
  sample:'13 3',
  answer:`import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        int tongSao = sc.nextInt();
        int soLuot = sc.nextInt();
        if (soLuot == 0) {
            System.out.println("Chưa có đánh giá");
            return;
        }
        double trungBinh = (double) tongSao / soLuot;
        System.out.printf("Điểm trung bình: %.1f%n", trungBinh);
        int saoHienThi = (int) Math.round(trungBinh);
        System.out.println("Số sao hiển thị: " + saoHienThi);
    }
}`,

  sample:'STD 1000\nSTD 1001\nEXP 1200',
  answer:`import java.util.*;

abstract class Shipping {
    private final String code;

    Shipping(String code) {
        this.code = code;
    }

    abstract long fee(int grams);

    String receipt(int grams) {
        return code + " | " + grams + "g | " + fee(grams) + "đ";
    }
}

class StandardShipping extends Shipping {
    StandardShipping() {
        super("STD");
    }

    @Override
    long fee(int grams) {
        if (grams <= 1000) {
            return 20000;
        }
        int them = (grams - 1000 + 499) / 500;
        return 20000 + 5000L * them;
    }
}

class ExpressShipping extends Shipping {
    private final StandardShipping standard = new StandardShipping();

    ExpressShipping() {
        super("EXP");
    }

    @Override
    long fee(int grams) {
        return standard.fee(grams) * 2;
    }
}

public class Main {
    public static void main(String[] args) {
        Map<String, Shipping> loai = new HashMap<>();
        loai.put("STD", new StandardShipping());
        loai.put("EXP", new ExpressShipping());
        Scanner sc = new Scanner(System.in);
        while (sc.hasNext()) {
            String code = sc.next();
            int grams = sc.nextInt();
            Shipping s = loai.get(code);
            if (s == null) {
                System.out.println("Không hỗ trợ " + code);
            } else {
                System.out.println(s.receipt(grams));
            }
        }
    }
}`,

{ id:'O7', phase:'O', key:'OOP 7', name:'interface: bộ quy tắc kiểm tra', type:'task', mode:'java', prio:'High', reporter:'Spec form đăng ký', plan:PLAN5,

  task:`<p>Viết <code>DigitsRule</code> (thông báo <code>chỉ gồm chữ số</code>) và <code>MinLengthRule</code> nhận độ dài tối thiểu qua constructor (thông báo <code>tối thiểu &lt;n&gt; ký tự</code>). Input: mỗi dòng một giá trị. Kết quả: <code>&lt;giá trị&gt;: hợp lệ</code> hoặc <code>&lt;giá trị&gt;: lỗi - &lt;các thông báo, cách nhau bằng "; "&gt;</code>; giá trị rỗng hiển thị <code>(trống)</code>.</p>`,
  expect:'Đúng ở biên 9 / 10 ký tự, với chuỗi rỗng và chuỗi lẫn chữ.',
  cases:[ { in:'0912345678', note:'đúng 10 số' }, { in:'091234567\nabc', note:'9 số' }, { in:'\n0912a45678', note:'dòng trống, lẫn chữ' }, { in:'09123456789' } ],
  sample:'0912345678\n091234567\nabc',
  answer:`import java.util.*;

interface Rule {
    boolean check(String value);
    String message();
}

class NotBlankRule implements Rule {
    public boolean check(String value) {
        return !value.isBlank();
    }

    public String message() {
        return "không được để trống";
    }
}

class DigitsRule implements Rule {
    public boolean check(String value) {
        for (char c : value.toCharArray()) {
            if (!Character.isDigit(c)) {
                return false;
            }
        }
        return true;
    }

    public String message() {
        return "chỉ gồm chữ số";
    }
}

class MinLengthRule implements Rule {
    private final int min;

    MinLengthRule(int min) {

  answer:`import java.util.*;

class Session {
    private String user;
    private final Map<String, Integer> cart = new LinkedHashMap<>();

    String getUser() {
        return user;
    }

    void setUser(String user) {
        this.user = user;
    }

    boolean isLoggedIn() {
        return user != null;
    }

    Map<String, Integer> getCart() {
        return cart;
    }
}

abstract class BasePage {
    private final String name;
    private final Session session;

    BasePage(String name, Session session) {
        this.name = name;
        this.session = session;
    }

    protected Session session() {
        return session;
    }

    protected void log(String msg) {
        System.out.println("[" + name + "] " + msg);
    }

    abstract void handle(String[] cmd);
}

class LoginPage extends BasePage {
    private final Map<String, String> accounts = new HashMap<>();

    LoginPage(Session session) {
        super("Đăng nhập", session);
        accounts.put("standard_user", "secret_sauce");
        accounts.put("locked_out_user", "secret_sauce");
    }

    @Override
    void handle(String[] cmd) {
        if (cmd[0].equals("logout")) {
            session().setUser(null);
            session().getCart().clear();
            log("Đã đăng xuất");
            return;
        }
        String user = cmd[1];
        String pass = cmd[2];
        if (user.equals("locked_out_user")) {
            log("Lỗi: tài khoản bị khóa");
        } else if (!pass.equals(accounts.get(user))) {
            log("Lỗi: sai tên đăng nhập hoặc mật khẩu");
        } else {
            session().setUser(user);
            log("OK " + user);
        }
    }
}

class ProductPage extends BasePage {
    private final Map<String, Long> catalog = new LinkedHashMap<>();

    ProductPage(Session session) {
        super("Sản phẩm", session);
        catalog.put("Balo", 450000L);
        catalog.put("Ao", 150000L);
        catalog.put("Mu", 90000L);
    }

    long priceOf(String item) {
        return catalog.get(item);
    }

    @Override
    void handle(String[] cmd) {
        String item = cmd[1];
        if (!session().isLoggedIn()) {
            log("Lỗi: chưa đăng nhập");
        } else if (!catalog.containsKey(item)) {
            log("Lỗi: không có " + item);
        } else {
            session().getCart().merge(item, 1, Integer::sum);
            log("Thêm " + item);
        }
    }
}

class CartPage extends BasePage {
    private final ProductPage products;

    CartPage(Session session, ProductPage products) {
        super("Giỏ hàng", session);
        this.products = products;
    }

    @Override
    void handle(String[] cmd) {
        Map<String, Integer> cart = session().getCart();
        if (cart.isEmpty()) {
            log("Trống");
            return;
        }
        long tong = 0;
        int soLuong = 0;
        for (String item : cart.keySet()) {
            int q = cart.get(item);
            long tien = products.priceOf(item) * q;
            System.out.println("  " + item + " x" + q + " = " + tien);
            tong += tien;
            soLuong += q;
        }
        log(soLuong + " sản phẩm, tổng " + tong);
    }
}

public class Main {
    public static void main(String[] args) {
        Session s = new Session();
        ProductPage products = new ProductPage(s);
        Map<String, BasePage> pages = new HashMap<>();
        pages.put("login", new LoginPage(s));
        pages.put("logout", pages.get("login"));
        pages.put("add", products);
        pages.put("cart", new CartPage(s, products));
        Scanner sc = new Scanner(System.in);
        while (sc.hasNextLine()) {
            String line = sc.nextLine().trim();
            if (line.isEmpty()) continue;
            String[] cmd = line.split(" ");
            BasePage page = pages.get(cmd[0]);
            if (page == null) {
                System.out.println("Lệnh không hợp lệ: " + cmd[0]);
            } else {
                page.handle(cmd);
            }
        }
    }
}`,

  answer:`import java.util.*;

class TestResult {
    private final String id;
    private final String module;
    private final boolean passed;
    private final int millis;

    TestResult(String id, String module, boolean passed, int millis) {
        this.id = id;
        this.module = module;
        this.passed = passed;
        this.millis = millis;
    }

    String getId() {
        return id;
    }

    String getModule() {
        return module;
    }

    boolean isPassed() {
        return passed;
    }

    int getMillis() {
        return millis;
    }

    static TestResult parse(String line) {
        String[] p = line.split(";");
        if (p.length != 4) {
            throw new IllegalArgumentException("sai số cột");
        }
        String status = p[2].trim();
        if (!status.equals("PASS") && !status.equals("FAIL")) {
            throw new IllegalArgumentException("trạng thái " + status);
        }
        return new TestResult(p[0].trim(), p[1].trim(), status.equals("PASS"), Integer.parseInt(p[3].trim()));
    }
}

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        List<TestResult> ds = new ArrayList<>();
        while (sc.hasNextLine()) {
            String line = sc.nextLine();
            if (line.isBlank()) continue;
            try {
                ds.add(TestResult.parse(line));
            } catch (IllegalArgumentException e) {
                System.out.println("Bỏ qua dòng lỗi: " + line);
            }
        }
        if (ds.isEmpty()) {
            System.out.println("Không có kết quả");
            return;
        }
        int pass = 0;
        Map<String, Integer> loi = new TreeMap<>();
        TestResult lauNhat = ds.get(0);
        for (TestResult r : ds) {
            if (r.isPassed()) {
                pass++;
            } else {
                loi.merge(r.getModule(), 1, Integer::sum);
            }
            if (r.getMillis() > lauNhat.getMillis()) {
                lauNhat = r;
            }
        }
        System.out.printf("Tổng: %d | PASS: %d | FAIL: %d | Tỷ lệ pass: %.1f%%%n", ds.size(), pass, ds.size() - pass, pass * 100.0 / ds.size());
        if (loi.isEmpty()) {
            System.out.println("Module lỗi: không có");
        } else {
            System.out.println("Module lỗi:");
            for (String m : loi.keySet()) {
                System.out.println("  " + m + ": " + loi.get(m));
            }
        }
        System.out.println("Chạy lâu nhất: " + lauNhat.getId() + " (" + lauNhat.getModule() + ") " + lauNhat.getMillis() + "ms");
    }
}`,

 {k:'Ba vùng của Git', d:'Thư mục làm việc (file trên máy) → staging (sau <code>git add</code>) → commit. <code>git status</code> chia file theo đúng ba vùng này.', s:'git add      : thư mục làm việc → staging\ngit commit   : staging → commit\ngit restore --staged : bỏ khỏi staging', e:'git status', n:'Untracked: file mới Git chưa theo dõi.'},
 {k:'git diff', d:'<code>git diff</code>: file trên máy so với staging. <code>git diff --staged</code>: staging so với commit gần nhất.', s:'git diff\ngit diff --staged', e:'git diff\ngit diff --staged', n:'Dòng bắt đầu bằng <code>-</code> là bị xóa, <code>+</code> là được thêm.'},
],
J1:[
 {k:'Khai báo biến', d:'Mỗi biến có kiểu cố định: <code>int</code> số nguyên, <code>long</code> số nguyên lớn, <code>double</code> số thực, <code>char</code> một ký tự, <code>boolean</code> đúng/sai, <code>String</code> chuỗi.', s:'kieu tenBien = giaTri;', e:MAIN('int soLuong = 2;\ndouble giam = 0.1;\nchar hang = \'A\';\nboolean conHang = true;\nString ten = "Áo thun";\nSystem.out.println(ten + " x" + soLuong + ", hạng " + hang + ", còn hàng: " + conHang + ", giảm " + giam);'), n:'Tên biến viết kiểu camelCase: <code>donGia</code>, <code>soLuong</code>.'},
 {k:'Scanner', d:'Đọc input từ bàn phím (System.in). Ở trang này, input lấy từ ô <b>Input</b> dưới khung code.', s:'import java.util.Scanner;\nScanner sc = new Scanner(System.in);\nString dong = sc.nextLine();  // cả dòng\nint so = sc.nextInt();        // một số nguyên\nString tu = sc.next();        // một từ', e:'import java.util.Scanner;\n' + MAIN('Scanner sc = new Scanner(System.in);\nString ten = sc.nextLine();\nint so = sc.nextInt();\nSystem.out.println("[" + ten + "] " + so);'), in:'Áo thun basic\n199000', n:'Gọi <code>nextLine()</code> ngay sau <code>nextInt()</code> sẽ nhận chuỗi rỗng (phần còn lại của dòng số).'},
 {k:'println và nối chuỗi', d:'<code>System.out.println(x)</code> in x rồi xuống dòng; <code>print</code> không xuống dòng. Dấu <code>+</code> giữa chuỗi và số là nối chuỗi.', s:'System.out.println("Tổng: " + tong);', e:MAIN('int a = 199000;\nSystem.out.println("Tạm tính: " + a * 2);\nSystem.out.print("Không ");\nSystem.out.println("xuống dòng");'), n:'Phép <code>*</code> được tính trước <code>+</code>, nên <code>"…" + a * 2</code> vẫn ra số đúng.'},
],
J2:[
 {k:'Chia nguyên /', d:'Hai số nguyên chia nhau thì kết quả là số nguyên, phần thập phân bị bỏ (cắt về phía 0).', s:'int thuong = a / b;', e:MAIN('System.out.println(23 / 10);\nSystem.out.println(-23 / 10);\nSystem.out.println(23 / 10.0);'), n:'Chỉ cần một vế là double thì phép chia là chia thực.'},
 {k:'Chia lấy dư %', d:'Phần dư của phép chia nguyên.', s:'int du = a % b;', e:MAIN('System.out.println(23 % 10);\nSystem.out.println(20 % 10);\nSystem.out.println(9 % 10);'), n:'<code>n % 2 == 0</code> là cách kiểm tra số chẵn hay dùng.'},
 {k:'Toán tử ba ngôi ? :', d:'Chọn một trong hai giá trị theo điều kiện, viết gọn thay cho if/else.', s:'kieu x = dieuKien ? giaTriNeuDung : giaTriNeuSai;', e:MAIN('int le = 3;\nint them = le > 0 ? 1 : 0;\nSystem.out.println(them);'), n:'Dùng cho biểu thức ngắn; logic dài thì viết if/else cho dễ đọc.'},
],
J3:[
 {k:'Khoảng giá trị int và long', d:'<code>int</code>: −2.147.483.648 … 2.147.483.647. <code>long</code>: khoảng ±9,2 × 10<sup>18</sup>. Vượt khoảng thì số bị quay vòng, không báo lỗi.', s:'int a = Integer.MAX_VALUE;\nlong b = Long.MAX_VALUE;\nlong c = 3000000000L;  // số long viết hậu tố L', e:MAIN('int a = Integer.MAX_VALUE;\nSystem.out.println(a);\nSystem.out.println(a + 1);\nlong b = a;\nSystem.out.println(b + 1);'), n:'Gõ <code>3000000000</code> không có L là lỗi biên dịch "integer number too large".'},
 {k:'Ép kiểu sang long trước khi nhân', d:'Kiểu kết quả của phép toán theo kiểu của hai vế. Ép một vế sang long thì cả phép nhân tính bằng long.', s:'long tong = (long) a * b;', e:MAIN('int donGia = 25000000, soLuong = 120;\nlong sai = donGia * soLuong;\nlong dung = (long) donGia * soLuong;\nSystem.out.println(sai);\nSystem.out.println(dung);'), n:'<code>(long) (a * b)</code> vẫn sai vì ép sau khi đã tràn.'},
],
J4:[
 {k:'Ép kiểu (double)', d:'Ép một vế sang double để phép chia giữ phần thập phân.', s:'double tb = (double) tong / soLuot;', e:MAIN('int tong = 13, luot = 3;\nSystem.out.println(tong / luot);\nSystem.out.println((double) tong / luot);\nSystem.out.println((double) (tong / luot));'), n:'Dòng thứ ba: ép sau khi đã chia nguyên nên vẫn ra 4.0.'},
 {k:'Ép (int) và Math.round', d:'<code>(int) x</code> cắt bỏ phần thập phân. <code>Math.round(x)</code> làm tròn đến số gần nhất (.5 lên) và trả về <b>long</b>.', s:'int a = (int) 4.7;               // 4\nint b = (int) Math.round(4.7);   // 5', e:MAIN('System.out.println((int) 4.7);\nSystem.out.println(Math.round(4.5));\nSystem.out.println(Math.round(4.49));'), n:'<code>int b = Math.round(4.7);</code> báo lỗi biên dịch vì long không gán thẳng vào int.'},
 {k:'printf và %.1f', d:'In theo định dạng: <code>%d</code> số nguyên, <code>%.1f</code> số thực 1 chữ số thập phân, <code>%s</code> chuỗi, <code>%n</code> xuống dòng.', s:'System.out.printf("Điểm: %.1f%n", diem);\nString s = String.format("%,d đ", tien);', e:MAIN('double d = 13.0 / 3;\nSystem.out.printf("%.1f | %.2f%n", d, d);\nSystem.out.printf("%,d đ%n", 3000000000L);\nSystem.out.printf("%d%n", 4.5);'), n:'Dòng cuối của ví dụ cố ý sai: <code>%d</code> với số double gây <code>IllegalFormatConversionException</code>. Trình mô phỏng dùng dấu chấm thập phân (Locale en_US); máy cài tiếng Việt có thể in 4,3.'},
 {k:'return trong main', d:'Kết thúc chương trình sớm, các dòng sau không chạy.', s:'if (soLuot == 0) {\n    System.out.println("…");\n    return;\n}', e:MAIN('int soLuot = 0;\nif (soLuot == 0) {\n    System.out.println("Chưa có đánh giá");\n    return;\n}\nSystem.out.println("Không in dòng này");'), n:'Kiểm tra trường hợp đặc biệt trước rồi return là cách tránh chia cho 0.'},
],
J5:[
 {k:'if / else if / else', d:'Kiểm tra lần lượt từ trên xuống, chạy nhánh đầu tiên có điều kiện đúng.', s:'if (dk1) {\n    …\n} else if (dk2) {\n    …\n} else {\n    …\n}', e:MAIN('long tong = 300000;\nif (tong < 300000) {\n    System.out.println("Phí 30000");\n} else if (tong < 1000000) {\n    System.out.println("Phí 15000");\n} else {\n    System.out.println("Miễn phí");\n}'), n:'Vào được nhánh <code>else if</code> nghĩa là mọi điều kiện phía trên đều sai.'},
 {k:'Toán tử so sánh và logic', d:'<code>&lt; &lt;= &gt; &gt;= == !=</code> so sánh; <code>&amp;&amp;</code> (và), <code>||</code> (hoặc), <code>!</code> (phủ định).', s:'if (tong >= 300000 && tong < 1000000) { … }', e:MAIN('int t = 300000;\nSystem.out.println(t < 300000);\nSystem.out.println(t <= 300000);\nSystem.out.println(t >= 0 && t < 300000);'), n:'Viết <code>if (x = 5)</code> thay vì <code>==</code> là lỗi biên dịch trong Java.'},
 {k:'nextLong()', d:'Đọc số nguyên kiểu long từ input.', s:'long tong = sc.nextLong();', e:'import java.util.Scanner;\n' + MAIN('Scanner sc = new Scanner(System.in);\nlong x = sc.nextLong();\nSystem.out.println(x + 1);'), in:'5000000000', n:'<code>nextInt()</code> với số vượt khoảng int gây <code>InputMismatchException</code>.'},
],
J6:[
 {k:'switch, case, break', d:'So giá trị với từng case. Khớp case nào thì chạy từ đó trở xuống cho đến khi gặp <code>break</code>.', s:'switch (bien) {\n    case \'P\':\n        …\n        break;\n    default:\n        …\n}', e:MAIN("char ma = 'P';\nswitch (ma) {\n    case 'P':\n        System.out.println(\"Chờ thanh toán\");\n    case 'S':\n        System.out.println(\"Đang giao\");\n        break;\n    default:\n        System.out.println(\"Không rõ\");\n}"), n:'Ví dụ cố ý thiếu break ở case P: chạy sẽ in cả hai dòng.'},
 {k:'charAt và Character.toUpperCase', d:'<code>s.charAt(i)</code> lấy ký tự thứ i (đếm từ 0). <code>Character.toUpperCase(c)</code> đổi ký tự sang chữ hoa.', s:"char c = s.charAt(0);\nchar hoa = Character.toUpperCase(c);", e:MAIN('String s = "paid";\nchar c = s.charAt(0);\nSystem.out.println(c);\nSystem.out.println(Character.toUpperCase(c));'), n:'<code>charAt</code> với vị trí ngoài chuỗi gây <code>StringIndexOutOfBoundsException</code>.'},
],
J7:[
 {k:'equals và ==', d:'<code>a.equals(b)</code> so <b>nội dung</b>. <code>a == b</code> so xem hai biến có trỏ tới <b>cùng một đối tượng</b> không.', s:'if (ma.equals("SALE10")) { … }', e:MAIN('String a = "SALE10";\nString b = new String("SALE10");\nSystem.out.println(a == "SALE10");\nSystem.out.println(a == b);\nSystem.out.println(a.equals(b));'), n:'Dòng đầu ra true chỉ vì hai chuỗi gõ sẵn trong code dùng chung đối tượng. Dữ liệu đọc từ input thì không.'},
 {k:'trim, equalsIgnoreCase, toUpperCase', d:'<code>trim()</code> bỏ khoảng trắng hai đầu; <code>equalsIgnoreCase</code> so không phân biệt hoa thường.', s:'ma.trim().equalsIgnoreCase("SALE10")', e:MAIN('String ma = "  sale10 ";\nSystem.out.println("[" + ma.trim() + "]");\nSystem.out.println(ma.trim().equalsIgnoreCase("SALE10"));\nSystem.out.println(ma.toUpperCase());'), n:'String không đổi được: <code>ma.trim()</code> trả về chuỗi mới, biến <code>ma</code> giữ nguyên.'},
],
J8:[
 {k:'char là một số', d:'Mỗi ký tự có một mã số (A = 65, B = 66…). Cộng char với int ra int.', s:"char c = 'A';\nint ma = c + 1;          // 66\nchar d = (char) (c + 1); // 'B'", e:MAIN("char c = 'A';\nSystem.out.println(c + 1);\nSystem.out.println((char) (c + 1));\nc++;\nSystem.out.println(c);"), n:'<code>c++</code> giữ kiểu char nên in ra B.'},
 {k:'So sánh char', d:'So sánh theo mã ký tự.', s:"if (c >= 'A' && c <= 'E') { … }", e:MAIN("char c = '@';\nSystem.out.println(c < 'A');\nSystem.out.println((int) c);\nSystem.out.println('a' > 'E');"), n:'Chữ thường có mã lớn hơn chữ hoa (a = 97).'},
],
J9:[
 {k:'Thứ tự tính toán', d:'Java tính <code>* / %</code> trước <code>+ -</code>, cùng mức thì từ trái sang phải. Khi một vế của <code>+</code> là String, phép đó là nối chuỗi.', s:'"1" + 2 + 3   // ("1" + 2) + 3\n1 + 2 + "3"   // (1 + 2) + "3"', e:MAIN('System.out.println("Tổng: " + 1 + 2);\nSystem.out.println("Tổng: " + (1 + 2));'), n:'Dùng ngoặc khi muốn cộng số trước rồi mới nối chuỗi.'},
],
L1:[
 {k:'for', d:'Lặp một số lần biết trước. Gồm 3 phần: khởi tạo; điều kiện (còn đúng thì chạy tiếp); bước nhảy sau mỗi lượt.', s:'for (int i = 0; i < n; i++) {\n    // chạy với i = 0, 1, …, n - 1\n}', e:MAIN('int tong = 0;\nfor (int i = 1; i <= 4; i++) {\n    tong += i;\n    System.out.println("i = " + i + ", tong = " + tong);\n}'), n:'Biến <code>i</code> khai báo trong <code>for</code> chỉ dùng được bên trong vòng lặp.'},
 {k:'Cộng dồn', d:'Biến kết quả khai báo <b>trước</b> vòng lặp, mỗi lượt cộng thêm. Tổng tiền dùng <code>long</code> để không tràn số.', s:'long tong = 0;\nfor (…) {\n    tong += gia;\n}', e:MAIN('int a = 0;\nlong b = 0;\nfor (int i = 0; i < 3; i++) {\n    a += 1000000000;\n    b += 1000000000;\n}\nSystem.out.println(a);\nSystem.out.println(b);'), n:'Khai báo biến tổng bên trong vòng lặp thì mỗi lượt nó lại bị đặt về 0.'},
 {k:'return trong main', d:'<code>return;</code> kết thúc main ngay, các dòng phía sau không chạy. Dùng để xử lý trường hợp đặc biệt trước.', s:'if (n == 0) {\n    System.out.println("Giỏ hàng trống");\n    return;\n}', e:MAIN('int n = 0;\nif (n == 0) {\n    System.out.println("Giỏ hàng trống");\n    return;\n}\nSystem.out.println("Không in dòng này");'), n:'Trong method void, <code>return;</code> không kèm giá trị.'},
],
L2:[
 {k:'Mảng (array)', d:'Dãy cố định nhiều giá trị cùng kiểu. Phần tử đánh số từ 0 đến <code>length - 1</code>.', s:'int[] gia = new int[n];   // n phần tử, mặc định 0\ngia[0] = 100;\nint soPhanTu = gia.length;', e:'import java.util.Arrays;\n\npublic class Main {\n    public static void main(String[] args) {\n        int[] gia = new int[3];\n        gia[0] = 100;\n        gia[2] = 300;\n        System.out.println(gia.length);\n        System.out.println(gia[1]);\n        System.out.println(Arrays.toString(gia));\n    }\n}', n:'<code>length</code> của mảng không có ngoặc; String thì dùng <code>length()</code>.'},
 {k:'Điều kiện dừng', d:'Duyệt cả mảng: <code>i</code> chạy từ 0 và dừng khi <code>i &lt; n</code> sai. Viết <code>n - 1</code> là bỏ sót phần tử cuối; viết <code>&lt;=</code> là vượt mảng.', s:'for (int i = 0; i < gia.length; i++) { … }', e:MAIN('int[] a = {5, 6, 7};\nfor (int i = 0; i < a.length - 1; i++) System.out.print(a[i] + " ");\nSystem.out.println("← thiếu phần tử cuối");\nfor (int i = 0; i < a.length; i++) System.out.print(a[i] + " ");\nSystem.out.println("← đủ");'), n:'Viết vòng lặp xong, thử ngay với mảng 1 phần tử.'},
],
L3:[
 {k:'while', d:'Lặp khi chưa biết trước số lần: kiểm tra điều kiện trước mỗi lượt.', s:'while (điều kiện) {\n    // …\n}', e:MAIN('int lan = 0;\nwhile (lan < 3) {\n    lan++;\n    System.out.println("Lần " + lan);\n}'), n:'Biến trong điều kiện phải thay đổi trong thân vòng lặp, nếu không vòng lặp không dừng.'},
 {k:'break', d:'Thoát vòng lặp ngay lập tức, chạy tiếp lệnh sau vòng lặp.', s:'while (…) {\n    if (timThay) break;\n}', e:MAIN('int[] ma = {11, 22, 33, 44};\nfor (int x : ma) {\n    if (x == 33) {\n        System.out.println("Tìm thấy 33");\n        break;\n    }\n    System.out.println("Bỏ qua " + x);\n}'), n:'<code>continue</code> thì khác: bỏ qua phần còn lại của lượt hiện tại và sang lượt sau.'},
 {k:'hasNext()', d:'<code>sc.hasNext()</code> trả về true nếu input còn dữ liệu chưa đọc. Dùng làm điều kiện để đọc tới hết input.', s:'while (sc.hasNext()) {\n    String s = sc.next();\n}', in:'a b c', e:'import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int dem = 0;\n        while (sc.hasNext()) {\n            System.out.println("Đọc: " + sc.next());\n            dem++;\n        }\n        System.out.println("Tổng: " + dem);\n    }\n}', n:'Gọi <code>next()</code> khi hết input sẽ gặp NoSuchElementException.'},
],
L4:[
 {k:'static method', d:'Đặt một xử lý vào method có tên để gọi lại nhiều lần. Khai báo trong class, ngoài main. Buổi 4 chỉ viết method <code>static</code>.', s:'static kiểuTrảVề tênMethod(kiểu thamSo) {\n    …\n    return giaTri;\n}', e:'public class Main {\n    static int binhPhuong(int x) {\n        return x * x;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(binhPhuong(4));\n        System.out.println(binhPhuong(binhPhuong(2)));\n    }\n}', n:'Method kiểu khác <code>void</code> phải <code>return</code> ở mọi nhánh, nếu không javac báo "missing return statement".'},
 {k:'return nhiều nhánh', d:'<code>return</code> kết thúc method ngay và trả giá trị về nơi gọi.', s:'if (a) return 1;\nif (b) return 2;\nreturn 0;', e:'public class Main {\n    static String xepLoai(int diem) {\n        if (diem >= 8) return "Giỏi";\n        if (diem >= 5) return "Đạt";\n        return "Chưa đạt";\n    }\n\n    public static void main(String[] args) {\n        System.out.println(xepLoai(9));\n        System.out.println(xepLoai(5));\n        System.out.println(xepLoai(4));\n    }\n}', n:'Method chỉ tính và trả về; việc in ra để nơi gọi làm.'},
],
L5:[
 {k:'do-while', d:'Chạy thân vòng lặp trước, kiểm tra điều kiện sau, nên luôn chạy ít nhất một lần.', s:'do {\n    …\n} while (điều kiện);', e:MAIN('int k = 5;\ndo {\n    System.out.println("Chạy với k = " + k);\n    k++;\n} while (k < 3);'), n:'Nhớ dấu <code>;</code> sau <code>while (…)</code>.'},
 {k:'continue', d:'Bỏ qua phần còn lại của lượt hiện tại, sang lượt kế tiếp.', s:'for (…) {\n    if (boQua) continue;\n    …\n}', e:MAIN('for (int i = 1; i <= 5; i++) {\n    if (i % 2 == 0) continue;\n    System.out.print(i + " ");\n}'), n:'Trong <code>for</code>, sau continue bước nhảy <code>i++</code> vẫn chạy.'},
],
C1:[
 {k:'Khởi tạo mảng có sẵn giá trị', d:'Liệt kê các phần tử trong dấu ngoặc nhọn.', s:'int[] a = {3, 9, 1};\nString[] ten = {"An", "Bình"};', e:MAIN('int[] a = {3, 9, 1};\nint max = a[0];\nfor (int i = 1; i < a.length; i++) {\n    if (a[i] > max) max = a[i];\n}\nSystem.out.println("max = " + max);'), n:'Khởi tạo max/min bằng phần tử đầu tiên, không bằng 0.'},
 {k:'for-each', d:'Duyệt lần lượt từng phần tử khi không cần chỉ số.', s:'for (int x : mang) {\n    …\n}', e:MAIN('int[] gia = {300, 900, 100};\nint tong = 0;\nfor (int g : gia) tong += g;\nSystem.out.println(tong);'), n:'Cần vị trí (chỉ số) thì dùng vòng for thường.'},
],
C2:[
 {k:'So sánh phần tử liền kề', d:'Khi so <code>a[i]</code> với phần tử bên cạnh, phạm vi của <code>i</code> phải hẹp lại một để không vượt mảng.', s:'for (int i = 1; i < a.length; i++) {\n    if (a[i] < a[i - 1]) …\n}', e:MAIN('int[] a = {100, 90, 95, 80};\nfor (int i = 1; i < a.length; i++) {\n    System.out.println("so a[" + i + "] với a[" + (i - 1) + "]: " + (a[i] < a[i - 1] ? "giảm" : "không giảm"));\n}'), n:'Mảng 1 phần tử thì vòng lặp không chạy lượt nào, không lỗi.'},

 {k:'Map và HashMap', d:'Lưu cặp khóa → giá trị. Mỗi khóa xuất hiện một lần; put cùng khóa thì ghi đè.', s:'Map<String, Integer> dem = new HashMap<>();\ndem.put("PAID", 1);\ndem.get("PAID");               // 1\ndem.getOrDefault("X", 0);      // 0 nếu không có', e:'import java.util.HashMap;\nimport java.util.Map;\n\npublic class Main {\n    public static void main(String[] args) {\n        Map<String, Integer> dem = new HashMap<>();\n        String[] ds = {"PAID", "PENDING", "PAID"};\n        for (String tt : ds) {\n            dem.put(tt, dem.getOrDefault(tt, 0) + 1);\n        }\n        System.out.println(dem.get("PAID"));\n        System.out.println(dem.get("CANCELLED"));\n        System.out.println(dem.getOrDefault("CANCELLED", 0));\n    }\n}', n:'<code>get</code> khóa không có trả về <code>null</code>, không phải 0.'},

 {k:'Files.readAllLines', d:'Đọc cả file thành <code>List&lt;String&gt;</code>, mỗi phần tử là một dòng. Có thể ném <code>IOException</code> (checked exception) nên bắt buộc phải xử lý.', s:'List<String> dong = Files.readAllLines(Path.of("ten.csv"));', files:{ 'demo.csv':'ma,khach\nDH01,An\n' }, e:'import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        List<String> dong = Files.readAllLines(Path.of("demo.csv"));\n        System.out.println(dong.size() + " dòng");\n        for (String d : dong) System.out.println(d);\n    }\n}', n:'Trình mô phỏng có một thư mục ảo chứa các file của bài (xem mục Tệp).'},
 {k:'throws và checked exception', d:'Checked exception (IOException…) phải được <code>catch</code>, hoặc method phải khai báo <code>throws</code> để đẩy cho nơi gọi xử lý. Thiếu cả hai thì javac báo "unreported exception".', s:'static long doc(String f) throws IOException { … }\n\ntry {\n    doc("a.csv");\n} catch (NoSuchFileException e) { … }\n  catch (IOException e) { … }', files:{ 'demo.csv':'ma,khach\nDH01,An\n' }, e:'import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.NoSuchFileException;\nimport java.nio.file.Path;\n\npublic class Main {\n    static int demDong(String f) throws IOException {\n        return Files.readAllLines(Path.of(f)).size();\n    }\n\n    public static void main(String[] args) {\n        String[] ten = {"demo.csv", "khong-co.csv"};\n        for (String f : ten) {\n            try {\n                System.out.println(f + ": " + demDong(f) + " dòng");\n            } catch (NoSuchFileException e) {\n                System.out.println("Không có file " + e.getMessage());\n            } catch (IOException e) {\n                System.out.println("Lỗi đọc file");\n            }\n        }\n    }\n}', n:'Catch lớp con (NoSuchFileException) đặt trước lớp cha (IOException), nếu không javac báo "has already been caught".'},
 {k:'BufferedReader', d:'Cách đọc từng dòng, hợp với file lớn. Viết trong try-with-resources để file tự đóng.', s:'try (BufferedReader br = new BufferedReader(new FileReader("a.csv"))) {\n    String line;\n    while ((line = br.readLine()) != null) { … }\n}', files:{ 'demo.csv':'ma,khach\nDH01,An\n' }, e:'import java.io.BufferedReader;\nimport java.io.FileReader;\nimport java.io.IOException;\n\npublic class Main {\n    public static void main(String[] args) {\n        try (BufferedReader br = new BufferedReader(new FileReader("demo.csv"))) {\n            String line;\n            while ((line = br.readLine()) != null) {\n                System.out.println("> " + line);\n            }\n        } catch (IOException e) {\n            System.out.println("Lỗi: " + e.getMessage());\n        }\n    }\n}', n:'<code>readLine()</code> trả về <code>null</code> khi hết file.'},

 {k:'constructor', d:'Hàm đặc biệt <b>trùng tên class</b>, <b>không có kiểu trả về</b>, chạy khi gọi <code>new</code>. Dùng để gán giá trị ban đầu cho field, đảm bảo object tạo ra luôn đủ dữ liệu.', s:'TenClass(kieu thamSo1, kieu thamSo2) {\n    this.field1 = thamSo1;\n    this.field2 = thamSo2;\n}', e:`class Book {

 {k:'private và getter (đóng gói)', d:'<b>Đóng gói</b> (encapsulation): field để <code>private</code> để code bên ngoài class không đọc / sửa trực tiếp; muốn đọc thì gọi method <b>getter</b>, muốn sửa có kiểm tra thì gọi <b>setter</b>.', s:'private kieu field;\n\nkieu getField() {\n    return field;\n}\n\nvoid setField(kieu giaTri) {\n    // kiểm tra rồi mới gán\n    this.field = giaTri;\n}', e:`class Account {

function ticketEnv(t){ const env = newEnv(); if (t.setup) t.setup(env); return env; }
/* Chạy kịch bản terminal (sh) hoặc ghi pom.xml rồi chạy mvn (pom) */
function runEnvTicket(t, text){

/* Lấy thân của một method static trong code (để kiểm tra bài có tách method không) */
function methodBody(src, name){
  const m = new RegExp('static\\s+[\\w<>\\[\\],\\s]*?\\b' + name + '\\s*\\(').exec(src); if (!m) return null;
  const i = src.indexOf('{', m.index + m[0].length); if (i < 0) return null;
  let d = 0;
  for (let j = i; j < src.length; j++){ if (src[j] === '{') d++; else if (src[j] === '}'){ d--; if (!d) return src.slice(i + 1, j); } }
  return null;
}

const allPrivate = c => { if (!c) return false; const fs = c.fields.filter(f => !(f.isStatic && f.fin)); return fs.length > 0 && fs.every(f => f.access === 'private'); };
function subclassesOf(src, base){
  const cs = classesOf(src), by = new Map(cs.map(c => [c.name, c]));
  const reaches = c => { const seen = new Set(); while (c && !seen.has(c.name)){ seen.add(c.name); if (c.sup === base) return true; c = by.get(c.sup); } return false; };
  return cs.filter(c => !c.isAbstract && reaches(c));
}
const normOut = s => s.replace(/\r/g, '').split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/\n+$/, '');
function gradeJava(t, src){
  const checks = []; let pass = true;
  const rs = t.cases.map(c => {
    const files = Object.assign({}, t.files || {}, c.files || {});
    const res = jRun(src, c.in, { files }), ref = jRun(t.answer, c.in, { files });
    const out = res.out + (res.err ? (res.out && !res.out.endsWith('\n') ? '\n' : '') + res.err : '');
    const ok = res.ok && normOut(res.out) === normOut(ref.out);
    return { c, res, out, exp:ref.out, pass:ok };
  });
  const first = rs[0].res;
  if (first.kind === 'compile' || first.kind === 'unsupported'){
    checks.push({ ok:false, text:first.kind === 'compile' ? 'Lỗi biên dịch dòng ' + first.line + ': <code>' + esc(first.msg) + '</code>' : 'Dùng cú pháp mà trình mô phỏng chưa hỗ trợ (dòng ' + first.line + '): ' + esc(first.msg) });
    pass = false;
  } else {
    checks.push({ ok:true, text:'Biên dịch được' });
    const nOk = rs.filter(x => x.pass).length;
    checks.push({ ok:nOk === rs.length, text:'Output đúng ' + nOk + '/' + rs.length + ' bộ input' });
    if (nOk < rs.length) pass = false;
  }
  (t.checks || []).forEach(([label, fn]) => { const ok = !!fn(src); checks.push({ ok, text:label }); if (!ok) pass = false; });
  let trap = null;
  if (!pass && rs.every(x => x.res.ok && !x.res.out.trim())) trap = 'Chương trình chạy nhưng chưa in gì. Dùng <code>System.out.println(…)</code> để in kết quả.';
  if (!pass && !trap) (t.traps || []).some(f => (trap = f(rs, src)));
  return { pass, checks, trap, cases:rs };
}
function gradeEnv(t, text){
  const base = ticketEnv(t);
  const { env, lines } = runEnvTicket(t, text);
  const x = {};
  if (t.mode === 'pom'){ try { x.pom = parseXml(env.files.get(P + '/pom.xml')); } catch (e){ x.pom = null; x.pomErr = e.message; } }
  if (t.prep) t.prep(env, x, base);
  const checks = []; let pass = true;
  t.checks.forEach(([label, fn]) => { let ok; try { ok = !!fn(env, x); } catch (e){ ok = false; } checks.push({ ok, text:label }); if (!ok) pass = false; });
  let trap = null; if (!pass) (t.traps || []).some(f => { try { trap = f(env, x); } catch (e){ trap = null; } return trap; });
  return { pass, checks, trap, env, lines };
}
function gradeQuiz(t, sel){
  const checks = []; let pass = true;
  t.quiz.forEach((q, i) => {
    const s = sel[i], ok = s === q.a;
    checks.push({ ok, text:'Câu ' + (i + 1) + ': ' + (s == null ? 'chưa chọn đáp án' : ok ? 'đúng' : 'chưa đúng. ' + q.h) });
    if (!ok) pass = false;
  });
  return { pass, checks, trap:null };
}
function gradeTicket(t, text, sel){
  if (t.quiz) return gradeQuiz(t, sel || {});
  if (t.mode === 'java') return gradeJava(t, text);
  return gradeEnv(t, text);
}

const JAVA_HL = new Set([...J_KW, 'String','Scanner','System','Math','Integer','Long','Double','Character','Boolean','StringBuilder','List','ArrayList','Map','HashMap','LinkedHashMap','TreeMap','Set','HashSet','Arrays','Collections','Files','Path','Paths','BufferedReader','FileReader', ...Object.keys(EXC)]);
function highlight(src, mode){
  let out = '', i = 0; const n = src.length;
  const span = (c, s) => '<span class="hl-' + c + '">' + esc(s) + '</span>';
  if (mode === 'pom'){
    while (i < n){
      if (src.startsWith('<!--', i)){ let j = src.indexOf('-->', i); j = j < 0 ? n : j + 3; out += span('c', src.slice(i, j)); i = j; continue; }
      if (src[i] === '<'){ let j = src.indexOf('>', i); j = j < 0 ? n : j + 1; const tag = src.slice(i, j);
        out += tag.replace(/^(<\/?\??)([\w.\-:]*)([^]*)$/, (m, a, b, c) => esc(a) + span('k', b) + c.replace(/("[^"]*")|([^"]+)/g, (mm, q, o) => q ? span('s', q) : esc(o))); i = j; continue; }
      let j = src.indexOf('<', i); if (j < 0) j = n; out += esc(src.slice(i, j)); i = j;
    }
    return out + '\n';
  }
  if (mode === 'sh'){
    return src.split('\n').map(line => {
      if (/^\s*#/.test(line)) return span('c', line);
      let o = '', first = true;
      line.replace(/("[^"]*"?|'[^']*'?|\s+|[^\s"']+)/g, tok => {
        if (/^\s+$/.test(tok)) o += tok;
        else if (tok[0] === '"' || tok[0] === "'") o += span('s', tok);
        else if (first){ o += span('k', tok); first = false; }
        else if (tok[0] === '-') o += span('n', tok);
        else o += esc(tok);
        return tok;
      });
      return o;
    }).join('\n') + '\n';
  }
  while (i < n){
    const c = src[i];
    if (c === '/' && src[i+1] === '/'){ let j = src.indexOf('\n', i); if (j < 0) j = n; out += span('c', src.slice(i, j)); i = j; continue; }
    if (c === '/' && src[i+1] === '*'){ let j = src.indexOf('*/', i + 2); j = j < 0 ? n : j + 2; out += span('c', src.slice(i, j)); i = j; continue; }
    if (c === '"' || c === "'"){ let j = i + 1; while (j < n && src[j] !== c && src[j] !== '\n'){ if (src[j] === '\\') j++; j++; } out += span('s', src.slice(i, Math.min(j + 1, n))); i = j + 1; continue; }
    if (/[0-9]/.test(c) && !/[A-Za-z_]/.test(src[i-1] || '')){ let j = i; while (j < n && /[0-9._xXa-fA-FlLdD]/.test(src[j])) j++; out += span('n', src.slice(i, j)); i = j; continue; }
    if (/[A-Za-z_]/.test(c)){ let j = i; while (j < n && /[A-Za-z0-9_]/.test(src[j])) j++; const w = src.slice(i, j); out += JAVA_HL.has(w) ? span('k', w) : esc(w); i = j; continue; }
    out += esc(c); i++;
  }
  return out + '\n';
}

function explainJava(r){
  if (r.kind === 'unsupported') return 'Trình mô phỏng chỉ chạy phần Java của buổi 3–5. Phần này thuộc buổi sau hoặc ngoài phạm vi; trên máy thật code vẫn chạy được.';
  const hit = VI_JAVA.find(x => x[0].test(r.msg)); return hit ? hit[1](r.msg.match(hit[0])) : '';
}
function javaOutHTML(r){
  let h = '';
  if (r.out) h += esc(r.out);
  if (r.err) h += '<span class="c-err">' + esc((r.out && !r.out.endsWith('\n') ? '\n' : '') + r.err) + '</span>';
  if (!r.out && !r.err) h = '<span class="c-warn">(chương trình không in gì)</span>';
  let x = '<pre class="con">' + h + '</pre>';
  const ex = !r.ok ? explainJava(r) : ''; if (ex) x = '<div class="explain"><b>Giải thích: </b>' + ex + '</div>' + x;
  return x;
}
function conHTML(lines){
  return '<pre class="con">' + lines.map(l => l.prompt ? '<span class="pr">' + esc(l.t) + '</span><span class="cm">' + esc(l.cmd) + '</span>' : (l.c ? '<span class="c-' + l.c + '">' + esc(l.t) + '</span>' : esc(l.t))).join('\n') + '</pre>';
}
function run(){
  const t = cur(); showTab('result');
  let h;
  if (t.mode === 'java'){
    const r = jRun(editor.value, $('stdin').value, { files:t.files });
    h = '<p class="msg">Kết quả chạy với input trong ô <b>Input</b>' + (r.ok ? '' : r.kind === 'runtime' ? ' · chương trình dừng vì exception' : ' · không biên dịch được') + ':</p>' + javaOutHTML(r);
  } else {
    const { env, lines } = runEnvTicket(t, editor.value);
    h = (lines.length ? conHTML(lines) : '<p class="msg">Chưa có lệnh nào. Dòng bắt đầu bằng # là chú thích.</p>') + '<p class="msg">Xem file sau khi chạy ở tab <b>Tệp</b>.</p>';
    lastFiles[t.id] = env; renderFiles(env, false);
  }
  $('out-result').innerHTML = h; lastRes[t.id] = h;
}
function runExample(x){
  const t = cur(); showTab('result');
  let h = '<p class="msg"><b>Ví dụ: ' + esc(x.k) + '</b> (khung soạn thảo của bạn không bị thay đổi)</p>';
  if (t.mode === 'java'){ h += '<div class="answer"><pre>' + highlight(x.e, 'java') + '</pre></div>' + javaOutHTML(jRun(x.e, x.in || '', { files:x.files || t.files })); }
  else { const env = ticketEnv(t); h += conHTML(runScript(env, x.e)); }
  $('out-result').innerHTML = h; lastRes[t.id] = h;
}
function renderFiles(env, initial){
  const t = cur(); if (t.mode === 'java') return;
  const root = isDir(env, P) ? P : HOME;
  const r = env.repos.get(root);
  const files = filesUnder(env, root);
  let h = '<p class="legend">' + (initial ? 'Trạng thái ban đầu của bài' : 'Trạng thái sau lần chạy gần nhất') + ': <code>' + esc(tildify(root)) + '</code>' + (r ? ' · repo Git, branch <code>' + esc(r.head) + '</code>' : '') + '. Bấm tên file để xem nội dung.</p>';
  if (!files.length) h += '<p class="msg">Thư mục trống.</p>';
  else h += '<div class="ftree">' + files.map(f => {
    const rp = rel(root, f); const ign = r && isIgnored(env, r, rp); const tracked = r && r.index.has(rp);
    const tag = r ? (ign ? 'bị .gitignore bỏ qua' : tracked ? '' : 'chưa theo dõi') : '';
    return '<details><summary>' + esc(rp) + (tag ? '<span>' + tag + '</span>' : '') + '</summary><pre>' + esc(env.files.get(f)) + '</pre></details>';
  }).join('') + '</div>';
  if (env.remotes.size){ env.remotes.forEach(rm => { h += '<p class="legend">Remote <code>' + esc(rm.url) + '</code>: ' + [...rm.branches.keys()].map(b => '<code>' + esc(b) + '</code>').join(', ') + '</p>'; }); }
  $('out-files').innerHTML = h;
}

/* ===================== Chấm bài ===================== */
function li(ok, text){ return '<li class="' + (ok === null ? 'skip' : ok ? 'ok' : 'no') + '"><span class="ic">' + (ok === null ? '–' : ok ? '✓' : '✕') + '</span><span>' + text + '</span></li>'; }
function setBadge(pass){
  const b = $('gradeBadge');
  if (pass === null){ b.hidden = true; return; }
  b.hidden = false; b.className = 'badge ' + (pass ? 'pass' : 'fail'); b.textContent = pass ? 'Đạt' : 'Chưa đạt';
}
function grade(){
  const t = cur(); showTab('grade');
  const g = gradeTicket(t, editor.value, (state.qz || {})[t.id] || {});
  let h = '<div class="verdict ' + (g.pass ? 'pass' : 'fail') + '">' + (g.pass ? 'Đạt. Xem "Góc QC" ở ticket để biết làm gì tiếp.' : 'Chưa đạt. Xem các mục bị đánh dấu ✕ bên dưới.') + '</div>';
  if (g.trap) h += '<div class="trap"><b>Bẫy thường gặp: </b>' + g.trap + '</div>';
  h += '<ul class="checks">' + g.checks.map(c => li(c.ok, c.text)).join('') + '</ul>';
  if (g.cases){
    const first = g.cases[0].res;
    if (first.kind === 'compile' || first.kind === 'unsupported') h += javaOutHTML(first);
    else h += '<div class="cases">' + g.cases.map((x, i) => '<div class="case ' + (x.pass ? 'ok' : 'no') + '"><div class="case-h"><b>' + (x.pass ? '✓' : '✕') + ' Bộ ' + (i + 1) + '</b>' + (x.c.note ? '<span class="nt">' + esc(x.c.note) + '</span>' : '') + '</div>' +
      '<div class="case-b"><div><span>Input</span><pre>' + esc(showIn(x.c.in)) + '</pre></div><div><span>Mong đợi</span><pre>' + esc(x.exp.replace(/\n$/, '')) + '</pre></div><div class="act"><span>Thực tế</span><pre>' + (esc(x.out.replace(/\n$/, '')) || '(không in gì)') + '</pre></div></div></div>').join('') + '</div>';
  }
  if (g.lines) h += '<details><summary class="msg" style="cursor:pointer">Terminal của lần chấm</summary>' + conHTML(g.lines) + '</details>';
  $('out-grade').innerHTML = h;
  lastGrade[t.id] = { html:h, pass:g.pass };
  if (g.env){ lastFiles[t.id] = g.env; renderFiles(g.env, false); }
  setBadge(g.pass);
  if (g.pass){ state.done[t.id] = true; save(); renderQueue(); renderTicket(); }
}

/* ===================== Tab, nút, giao diện ===================== */
function showTab(name){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  ['result','grade','files'].forEach(n => $('out-' + n).hidden = n !== name);
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
$('runBtn').onclick = run;
$('checkBtn').onclick = grade;
$('resetBtn').onclick = () => { const t = cur(); editor.value = t.starter; delete state.drafts[t.id]; if (t.mode === 'java'){ $('stdin').value = t.sample || ''; delete state.stdin[t.id]; } save(); syncHL(); editor.focus(); };
$('themeBtn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('javaqc.theme', root.dataset.theme); } catch(e) {}
};
try { const th = localStorage.getItem('javaqc.theme'); if (th) document.documentElement.dataset.theme = th; } catch(e) {}

/* ===================== Khởi động ===================== */
openTicket(state.current);
</script>
