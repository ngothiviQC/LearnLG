<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA Mastery Roadmap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Learning Planner — menu bên trái (Tổng quan, Khóa học, Lịch, Thời gian, Thống kê, Lộ trình Automation, Cài đặt), nội dung bên phải; điện thoại: menu thành dải tab ngang. */
:root{
  --bg:#f8f4f6; --surface:#ffffff; --sunken:#f1e9ed; --ink:#22161c; --muted:#6b5a63; --line:#e6d9df;
  --accent:#c2185b; --accent-ink:#ffffff; --accent-soft:#fce4ec;
  --done:#1d7a46; --done-soft:#e1f3e7; --late:#b3261e; --late-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fbf0d6;
  --c1:#c2185b; --c1s:#fce4ec; --c2:#6a3fb0; --c2s:#eee7fb; --c3:#0f7a6a; --c3s:#dcf1ec; --c4:#b5541b; --c4s:#fbe9dc; --cb:#6b5a63; --cbs:#efe8eb;
  --f-display:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151013; --surface:#1d161a; --sunken:#100c0e; --ink:#efe6ea; --muted:#ab99a2; --line:#352a30;
  --accent:#f48fb1; --accent-ink:#2a0a17; --accent-soft:#3d1a29;
  --done:#5fd08e; --done-soft:#163322; --late:#ff8a80; --late-soft:#3a1a18; --warn:#f0c35a; --warn-soft:#352a12;
  --c1:#f48fb1; --c1s:#3d1a29; --c2:#c3a6f5; --c2s:#2a2140; --c3:#5fd0bd; --c3s:#12302b; --c4:#f2a271; --c4s:#3a2416; --cb:#ab99a2; --cbs:#2a2226; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151013; --surface:#1d161a; --sunken:#100c0e; --ink:#efe6ea; --muted:#ab99a2; --line:#352a30;
  --accent:#f48fb1; --accent-ink:#2a0a17; --accent-soft:#3d1a29;
  --done:#5fd08e; --done-soft:#163322; --late:#ff8a80; --late-soft:#3a1a18; --warn:#f0c35a; --warn-soft:#352a12;
  --c1:#f48fb1; --c1s:#3d1a29; --c2:#c3a6f5; --c2s:#2a2140; --c3:#5fd0bd; --c3s:#12302b; --c4:#f2a271; --c4s:#3a2416; --cb:#ab99a2; --cbs:#2a2226; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}

.app{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand svg{color:var(--accent)}
.brand b{font-family:var(--f-display);font-size:16px}
.nav{display:grid;grid-template-columns:22px minmax(0,1fr) 14px;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;text-decoration:none;color:var(--ink)}
.nav:hover{background:var(--sunken)}
.nav[aria-current="page"]{background:var(--accent-soft)}
.nav[aria-current="page"] svg{color:var(--accent)}
.nav svg{color:var(--muted)}
.nav b{display:block;font-weight:600;font-size:14px}
.nav small{display:block;color:var(--muted);font-size:12px}
.nav .chev{color:var(--muted);font-size:13px}
.side .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.side .foot a{color:var(--muted);text-decoration:none}
.side .foot a:hover{color:var(--accent)}
.themebtn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:4px 8px;font-size:12px;align-self:flex-start}

.navsep{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.main.framed{padding:0;overflow:hidden;display:flex}
.main.framed .wrap{display:none}
.pframe{flex:1;border:0;width:100%;height:100%;display:block;background:var(--bg)}
.pframe[hidden]{display:none}
.main{overflow:auto;padding-block:24px 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.banner{border-radius:10px;padding:10px 14px;font-size:13.5px;background:var(--warn-soft);color:var(--ink)}
.banner.err{background:var(--late-soft)}
.head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.head h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.head .sub{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--done-soft);color:var(--done);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.head .pill{margin-left:auto;margin-top:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:16px;font-weight:600}
.row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.row .r{margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--sunken);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.bar.thin{height:6px}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.big{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.today{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border-radius:10px;padding:12px 14px;background:var(--cs);border-left:4px solid var(--cc)}
.today .d{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--cc)}
.today b{display:block}
.today span{font-size:13px;color:var(--muted)}

.course{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.no{width:40px;height:40px;border-radius:9px;background:var(--cs);color:var(--cc);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px}
.course b{display:block;font-weight:600}
.course .s{font-size:12px;color:var(--muted)}
.course .bar{margin-top:5px}
.course .bar i{background:var(--cc)}
.pct{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunken);font-variant-numeric:tabular-nums}
.cc1{--cc:var(--c1);--cs:var(--c1s)} .cc2{--cc:var(--c2);--cs:var(--c2s)} .cc3{--cc:var(--c3);--cs:var(--c3s)} .cc4{--cc:var(--c4);--cs:var(--c4s)} .ccb{--cc:var(--cb);--cs:var(--cbs)}
.buffer{background:var(--sunken);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.buffer .row b{font-weight:600}
.buffer span{font-size:12.5px;color:var(--muted)}

.ccard{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.ccard-h{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-left:4px solid var(--cc)}
.ccard-h h3{font-size:16px}
.ccard-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ccard-b{padding:0 16px 14px 20px;display:flex;flex-direction:column;gap:10px}
.facts{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.facts b{color:var(--ink);font-variant-numeric:tabular-nums}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.task{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 6px;border-radius:7px}
.task:hover{background:var(--sunken)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-size:14px;overflow-wrap:anywhere}
.ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;font-size:11px;font-weight:700;color:var(--surface)}
.ck.on{background:var(--done);border-color:var(--done)}
.x{border:0;background:transparent;color:var(--muted);font-size:13px;padding:2px 6px;border-radius:5px;opacity:.6}
.x:hover{opacity:1;background:var(--late-soft);color:var(--late)}
.addrow{display:flex;gap:6px}
.inp,select.inp{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
.btn{font:inherit;font-weight:600;font-size:13.5px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--sunken)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{border-color:var(--late);color:var(--late)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:4px 10px;font-size:12.5px}

.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;border-top:3px solid var(--cc)}
.day .dl{font-size:10px;letter-spacing:.08em;color:var(--muted)}
.day .dn{font-family:var(--f-display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.day .dd{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day .dh{font-size:11px;color:var(--cc);font-weight:600;min-height:16px;font-variant-numeric:tabular-nums}
.day.is-today{outline:2px solid var(--accent);outline-offset:-1px}
.day.done{background:var(--done-soft)}
.day .ck{width:22px;height:22px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--cc);margin-right:5px;vertical-align:-1px}

.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.form .w2{grid-column:span 2}

.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tgt{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:13px}
.hbar .track{position:relative;height:14px;background:var(--sunken);border-radius:4px;overflow:hidden}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;background:var(--cc);border-radius:4px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

.sform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sform label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.sform .full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.msg{font-size:13px;color:var(--muted);margin:0;min-height:18px}
.msg.err{color:var(--late)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:13.5px}

.phases{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.phase{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:10px;background:var(--cs);text-decoration:none;color:var(--ink);min-width:0}
.phase b{font-family:var(--f-display);font-size:18px;color:var(--cc)}
.phase span{font-size:12px;line-height:1.3;color:var(--muted)}
.phase .bar{margin-top:4px;background:var(--surface)}
.phase .bar i{background:var(--cc)}
.cps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cp{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cp.done{background:var(--done-soft);border-color:transparent}
.cp p{margin:0;font-size:13px}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.phh{display:flex;flex-direction:column;min-width:0;flex:1}
.sess{display:flex;flex-direction:column;gap:6px}
.ses{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ses[open]{border-color:var(--cc)}
.ses.done{background:var(--done-soft);border-color:transparent}
.ses summary{display:grid;grid-template-columns:22px 26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;list-style:none}
.ses summary::-webkit-details-marker{display:none}
.ses .sn{font-family:var(--f-display);font-weight:700;color:var(--cc)}
.ses .st{font-weight:600;overflow-wrap:anywhere}
.ses.done .st{color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.tag.cpt{background:var(--warn-soft);color:var(--warn);font-weight:600}
.sbody{padding:2px 14px 14px 70px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.sbody p{margin:0}
.sbody ul{margin:0;padding-left:18px}

.links{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.vtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vtab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px}
.vtab[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.vocab{width:100%;border-collapse:collapse;font-size:14px}
.vocab th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.vocab td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.vocab .jw{display:block;font-size:16px;font-weight:600}
.vocab .kn{display:block;color:var(--muted);font-size:12.5px}
.vocab td.mean{width:55%}
.vocab.hide td.mean:not(.show){color:transparent;background:var(--sunken);border-radius:6px;cursor:pointer;user-select:none}
.tpl{margin:0;padding:12px 14px;border-radius:8px;background:var(--sunken);white-space:pre-wrap;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
@media (max-width:860px){
  .navsep{display:none}
  .main.framed{height:calc(100dvh - 54px)}
  .ccard-h .links{grid-column:1/-1;justify-content:flex-start}
  .phases{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cps{grid-template-columns:1fr}
  .ses summary{grid-template-columns:22px 24px minmax(0,1fr)}
  .ses .tags{grid-column:3;justify-content:flex-start}
  .sbody{padding:2px 14px 14px 14px}
  html,body{height:auto}
  .app{display:block}
  .side{flex-direction:row;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;gap:4px}
  .brand,.side .foot,.nav small,.nav .chev{display:none}
  .nav{grid-template-columns:18px auto;width:auto;flex:0 0 auto;padding:7px 10px}
  .main{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .days{grid-template-columns:repeat(3,minmax(0,1fr))}
  .form{grid-template-columns:1fr 1fr}
  .form .w2{grid-column:1/-1}
  .sform{grid-template-columns:1fr}
  .hbar{grid-template-columns:100px minmax(0,1fr) 70px}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <nav class="side" id="side" aria-label="Menu"></nav>
  <main class="main" id="main"><div class="wrap" id="view"></div></main>
</div>

];
const ikey = n => 'i' + pad(n);
const isIstqDone = n => !!(D.istq[ikey(n)] && D.istq[ikey(n)].done);
const istqDoneN = () => ISTQB.filter(s => isIstqDone(s.n)).length;
const istqNext = () => ISTQB.find(s => !isIstqDone(s.n)) || null;
let istqOpen = null;
function vIstqb(){
  const dn = istqDoneN(), nx = istqNext(), pct = Math.round(dn / ISTQB.length * 100), PR = practice();
  const chDone = ISTQB.filter(s => s.g === 'L' && isIstqDone(s.n)).length;
  let h = head('Lộ trình ISTQB CTFL 4.0') + '<section class="panel">' +
    '<div class="tiles">' + tile('Mục đã xong', dn + '/' + ISTQB.length, 'lý thuyết, thực hành, thi thử') +
    tile('Chương đã học', chDone + '/6', 'syllabus CTFL 4.0') +
    tile('Thi thử', ISTQB.filter(s => s.g === 'E' && isIstqDone(s.n)).length + '/2', 'đề 40 câu, đạt từ 26') +
    tile('Mục tiếp theo', nx ? pad(nx.n) : '—', nx ? esc(IGR[nx.g].name) : 'Đã xong lộ trình') + '</div>' +
    '<div class="row"><h2>Tiến độ lộ trình</h2><span class="r big">' + pct + '%</span></div><div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="row"><a class="btn sm" href="' + L_ISTQB[1] + '" target="_blank" rel="noopener">Mở trang ' + L_ISTQB[0] + ' ↗</a></div></section>';
  Object.keys(IGR).forEach(k => {
    const ss = ISTQB.filter(s => s.g === k), d = ss.filter(s => isIstqDone(s.n)).length;
    h += '<section class="panel ' + IGR[k].cc + '"><div class="row"><h2>' + esc(IGR[k].name) + '</h2><span class="r pct">' + d + '/' + ss.length + '</span></div><div class="sess">';
    ss.forEach(s => { const on = isIstqDone(s.n), open = istqOpen === s.n || (istqOpen === null && nx && nx.n === s.n);
      h += '<details class="ses' + (on ? ' done' : '') + '"' + (open ? ' open' : '') + ' data-n="' + s.n + '"><summary><button type="button" class="ck' + (on ? ' on' : '') + '" data-act="istq" data-n="' + s.n + '" aria-label="' + esc(s.t) + ': ' + (on ? 'bỏ đánh dấu' : 'đánh dấu đã xong') + '">' + (on ? '✓' : '') + '</button><span class="sn num">' + pad(s.n) + '</span><span class="st">' + esc(s.t) + '</span><span class="tags">' + (s.g === 'L' ? '<span class="tag">Đúng ' + (PR.ch[s.n] || 0) + '/' + ISTQ_NEED[s.n][1] + ' · cần ' + ISTQ_NEED[s.n][0] + '</span>' : '') + (s.n === 8 && PR.ms.length ? '<span class="tag">Gần nhất ' + PR.ms.slice(-2).join(', ') + '/40</span>' : '') + (s.exam ? '<span class="tag">' + esc(s.exam) + '</span>' : '') + '</span></summary>' +
        '<div class="sbody"><div><span class="lbl">Nội dung chính</span><ul>' + s.main.map(m => '<li>' + esc(m) + '</li>').join('') + '</ul></div>' +
        '<div><span class="lbl">Bài làm</span><p>' + esc(s.out) + '</p></div><div><span class="lbl">Tiêu chí đạt</span><p>' + esc(s.crit) + '</p></div></div></details>'; });
    h += '</div></section>';
  });
  h += '<p class="hint">Chương 1–6 và thi thử tự được đánh dấu khi kết quả trong mục Luyện ISTQB đạt tiêu chí; mục khác đánh dấu bằng nút tròn.</p>';
  $('view').innerHTML = h;
  $('view').querySelectorAll('details.ses').forEach(el => el.addEventListener('toggle', () => { if (el.open) istqOpen = +el.dataset.n; }));
}

/* ===================== Sự kiện chung ===================== */
$('view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'FORM') return;
  const act = b.dataset.act;
  if (act === 'istq'){
    e.preventDefault();
    const n = +b.dataset.n, k = ikey(n), was = isIstqDone(n);
    istqOpen = n;
    write(() => db.collection('istqb_items').doc(k).set({ done: !was, manual: was, updated_at: new Date().toISOString() }), was ? '' : 'Đã đánh dấu xong mục ' + pad(n) + '.');
  } else if (act === 'auto'){
    e.preventDefault();
    const n = +b.dataset.n, k = akey(n), was = isAutoDone(n);
    autoOpen = n;
    write(() => db.collection('auto_sessions').doc(k).set({ done: !was, manual: was, updated_at: new Date().toISOString() }), was ? '' : 'Đã đánh dấu xong buổi ' + pad(n) + '.');
  } else if (act === 'jump'){
    e.preventDefault();
    const el = $('ph-' + b.dataset.ph); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
  }
});
window.addEventListener('hashchange', () => { const h = fromHash(); if (h && h !== viewId) go(h); });
try { const th = localStorage.getItem('planner.theme'); if (th) document.documentElement.dataset.theme = th; } catch(e) {}

/* ===================== Khởi động: đọc dữ liệu đã lưu ===================== */
render();
(async () => {
  const CL = window.claude || (function(){ try { return window.parent !== window ? window.parent.claude : null; } catch(e){ return null; } })();

  // Kho dữ liệu thay thế khi không có claude.ai: cùng kiểu gọi db.doc()/db.collection() nhưng lưu vào localStorage ('qa.db').
  const qaLocalDb = () => {
    const KEY = 'qa.db', subs = [];
    const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; } };
    const save = all => { try { localStorage.setItem(KEY, JSON.stringify(all)); } catch(e) { const er = new Error('quota'); er.code = 'quota_exceeded'; throw er; } };
    const meta = { fromCache: false };
    const docSnap = (c, id) => { const v = (load()[c] || {})[id]; return { id, exists: !!v, data: () => v ? JSON.parse(JSON.stringify(v)) : undefined, metadata: meta }; };
    const colSnap = c => { const m = load()[c] || {}; return { docs: Object.keys(m).map(id => ({ id, data: () => JSON.parse(JSON.stringify(m[id])) })), metadata: meta }; };
    const notify = () => subs.forEach(f => { try { f(); } catch(e) {} });
    const listen = f => { subs.push(f); setTimeout(f, 0); return () => { const i = subs.indexOf(f); if (i >= 0) subs.splice(i, 1); }; };
    const docRef = (c, id) => ({
      set: async (data, opt) => { const all = load(); all[c] = all[c] || {}; all[c][id] = opt && opt.merge ? Object.assign({}, all[c][id], data) : data; save(all); notify(); },
      delete: async () => { const all = load(); if (all[c]) delete all[c][id]; save(all); notify(); },
      onSnapshot: cb => listen(() => cb(docSnap(c, id)))
    });
    window.addEventListener('storage', e => { if (e.key === KEY) notify(); });   // đồng bộ khi mở nhiều tab
    return {
      doc: path => { const [c, id] = path.split('/'); return docRef(c, id); },
      collection: c => ({ doc: id => docRef(c, id), onSnapshot: cb => listen(() => cb(colSnap(c))) })
    };
  };
  db = CL && CL.use ? await CL.use('db') : qaLocalDb();
  if (!db){ render(); return; }
  render();
  const timer = setTimeout(() => flash('Chưa kết nối được tới nơi lưu tiến độ. Dữ liệu sẽ hiện khi kết nối lại.', true), 10000);
  const done = (k, snap) => { if (!snap.metadata.fromCache) clearTimeout(timer); ready[k] = true; render(); };
  const fail = k => err => { clearTimeout(timer); ready[k] = true; flash('Không đọc được dữ liệu (' + err.code + ').', true); render(); };
  db.doc('planner/settings').onSnapshot(s => { D.settings = s.exists ? s.data() : null; done('settings', s); }, fail('settings'));
  db.collection('courses').onSnapshot(s => { D.courses = s.docs.map(d => Object.assign({ id: d.id }, d.data())); done('courses', s); }, fail('courses'));
  db.collection('auto_sessions').onSnapshot(s => { D.autos = {}; s.docs.forEach(d => D.autos[d.id] = d.data()); done('autos', s); }, fail('autos'));
  db.collection('istqb_items').onSnapshot(s => { D.istq = {}; s.docs.forEach(d => D.istq[d.id] = d.data()); done('istq', s); }, fail('istq'));
})();
</script>
