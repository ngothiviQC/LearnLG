}
const aLabel = a => 'expect(' + short(show(a.a), 48) + ')' + (a.neg ? '.not' : '') + '.' + a.m + '(' + (a.e === undefined ? '' : short(show(a.e), 40)) + ')';
function newmanHTML(r){
  let h = r.error ? '<p class="msg err">Lỗi khi đọc collection: ' + esc(r.error) + '</p>' : '';
  if (!r.runs.length) return h + '<p class="msg">Collection chưa có request nào. Khai báo bằng <code>request(tên, { method, url, headers, body, tests })</code>.</p>';
  let nA = 0, fA = 0, fR = 0;
  h += r.runs.map(x => {
    const fails = x.asserts.filter(a => !a.ok).length + (x.terr ? 1 : 0); nA += x.asserts.length; fA += fails; if (fails) fR++;
    return '<div class="nm-req"><div class="nm-name">→ ' + esc(x.name) + '</div><div class="ln"><span class="m ' + x.method + '">' + x.method + '</span><span class="p">' + esc(x.url) + '</span><span class="st ' + stCls(x.res.status) + '">' + x.res.status + ' ' + (STATUS_TEXT[x.res.status] || '') + '</span><span class="ms">' + x.res.time + ' ms</span></div>' +
      (x.unresolved.length ? '<p class="msg err">Biến chưa có giá trị: ' + esc(x.unresolved.join(', ')) + '</p>' : '') +
      '<ul class="tres">' + x.asserts.map(a => '<li><span class="' + (a.ok ? 'ok' : 'no') + '">' + (a.ok ? '✓' : '✕') + '</span><span>' + esc(aLabel(a)) + (a.ok ? '' : '<small>' + esc(a.msg) + '</small>') + '</span></li>').join('') +
      (x.terr ? '<li><span class="no">✕</span><span>Lỗi trong tests<small>' + esc(x.terr) + '</small></span></li>' : '') +
      (x.asserts.length || x.terr ? '' : '<li><span class="wn">!</span><span>Request này chưa có assertion nào</span></li>') + '</ul></div>';
  }).join('');
  h += '<div class="tbl-wrap"><table class="res"><thead><tr><th></th><th>Đã chạy</th><th>Fail</th></tr></thead><tbody><tr><td>requests</td><td>' + r.runs.length + '</td><td>' + fR + '</td></tr><tr><td>assertions</td><td>' + nA + '</td><td>' + fA + '</td></tr></tbody></table></div>';
  return h;
}
const buildLabel = () => S.build === 'v10' ? 'build v1.0 (có bug)' : 'build v1.1 (đã sửa)';

async function gradeColl(){
  const t = cur(), code = $('editor').value, envText = $('envIn').value;
  const r = await runCollection(code, envText, []), runs = r.runs;
  const hard = USERS.some(u => code.includes(u.token) || envText.includes(u.token)) || /eyJ[\w-]+\.[\w-]+\./.test(code + '\n' + envText);
  const neg = st => runs.some(x => x.res.status === st && x.asserts.some(a => a.ok && a.m === 'toBe' && !a.neg && a.e === st));
  const few = runs.filter(x => x.asserts.length < 2).map(x => x.name);
  const failed = runs.filter(x => x.terr || x.asserts.some(a => !a.ok)).map(x => x.name);
  const checks = [
    [!r.error && runs.length > 0, r.error ? 'Collection lỗi khi đọc: ' + esc(r.error) : 'Collection có ' + runs.length + ' request'],
    [!!(r.env.baseUrl || parseEnv(envText).baseUrl), 'Environment có biến baseUrl'],
    [runs.length > 0 && runs.every(x => /^\{\{\s*baseUrl\s*\}\}/.test(x.rawUrl)), 'Mọi URL bắt đầu bằng {{baseUrl}}'],
    [!hard && /pm\.environment\.set\(\s*['"]token['"]/.test(code) && runs.some(x => /\{\{\s*token\s*\}\}/.test(JSON.stringify(x.rawHeaders))), 'Token lấy từ request đăng nhập và dùng qua {{token}}' + (hard ? ' (đang có token chép cứng)' : '')],
    [neg(401), 'Có case âm 401 với assertion kiểm tra status 401'],
    [neg(404), 'Có case âm 404 với assertion kiểm tra status 404'],
    [neg(400), 'Có case body sai (400) với assertion kiểm tra status 400'],
    [runs.length > 0 && !few.length, 'Mỗi request có ít nhất 2 assertion' + (few.length ? ' (chưa đủ: ' + esc(few.join(', ')) + ')' : '')],
    [runs.length > 0 && !failed.length, 'Không assertion nào fail trên build v1.1' + (failed.length ? ' (fail ở: ' + esc(failed.join(', ')) + ')' : '')],
  ];
  finish(checks.every(c => c[0]), checks, '<div class="build">Lần chạy trên build v1.1</div>' + newmanHTML(r));
}

  if (s.minLength != null && typeof v === 'string' && v.length < s.minLength) errs.push(path + ': chuỗi ngắn hơn ' + s.minLength + ' ký tự');
  if (s.minimum != null && typeof v === 'number' && v < s.minimum) errs.push(path + ': ' + v + ' nhỏ hơn minimum ' + s.minimum);

  if (s.exclusiveMinimum != null && typeof v === 'number' && v <= s.exclusiveMinimum) errs.push(path + ': ' + v + ' phải lớn hơn ' + s.exclusiveMinimum);

function jtok(src){
  const t = []; let i = 0; const n = src.length;
  while (i < n){
    const c = src[i];
    if (/\s/.test(c)){ i++; continue; }
    if (c === '/' && src[i+1] === '/'){ while (i < n && src[i] !== '\n') i++; continue; }
    if (c === '/' && src[i+1] === '*'){ const j = src.indexOf('*/', i + 2); i = j < 0 ? n : j + 2; continue; }
    if (src.startsWith('"""', i)){
      const j = src.indexOf('"""', i + 3); if (j < 0) throw new Error('Text block """ chưa đóng');
      const lines = src.slice(i + 3, j).replace(/^[ \t]*\n/, '').split('\n');

      t.push({ k:'str', v: lines.map(l => l.slice(Math.min(ind, l.length))).join('\n').replace(/\n[ \t]*$/, '\n') }); i = j + 3; continue;
    }
    if (c === '"' || c === "'"){

      while (j < n && src[j] !== c){ if (src[j] === '\n') throw new Error('Chuỗi chưa đóng dấu ' + c); if (src[j] === '\\'){ const e = src[j+1]; s += e === 'n' ? '\n' : e === 't' ? '\t' : e; j += 2; } else s += src[j++]; }

function findTests(toks){

    if (!(toks[i].k === 'id' && toks[i].v === '@Test')) continue;
    let j = i + 1;
    if (isP(toks[j], '(')){ let d = 0; do { if (isP(toks[j], '(')) d++; else if (isP(toks[j], ')')) d--; j++; } while (j < toks.length && d > 0); }
    while (j < toks.length && !isP(toks[j], '(')) j++;

    const name = toks[j - 1] && toks[j - 1].k === 'id' ? toks[j - 1].v : 'test';
    let d = 0; do { if (isP(toks[j], '(')) d++; else if (isP(toks[j], ')')) d--; j++; } while (j < toks.length && d > 0);

function splitStmts(body){

    if (isP(t, '(')) d++; else if (isP(t, ')')) d--;

    s.onload = () => initSqlJs().then(x => { SQLLIB = x; resolve(x); }, reject);
    s.onerror = () => reject(new Error('Không tải được sql.js'));

}
async function ensureDbLab(){

  if (dbLab) return dbLab;

  db.run('CREATE TABLE customers (id INTEGER PRIMARY KEY, email TEXT, full_name TEXT);' +
    'CREATE TABLE products (id INTEGER PRIMARY KEY, sku TEXT, name TEXT, price INTEGER, stock INTEGER);' +
    'CREATE TABLE orders (id INTEGER PRIMARY KEY, code TEXT, customer_id INTEGER, status TEXT, voucher_code TEXT, discount_amount INTEGER, total_amount INTEGER, created_at TEXT);' +
    'CREATE TABLE order_items (id INTEGER PRIMARY KEY AUTOINCREMENT, order_id INTEGER, product_id INTEGER, qty INTEGER, unit_price INTEGER);');
  USERS.forEach(u => db.run('INSERT INTO customers VALUES (?,?,?)', [u.id, u.email, u.full_name]));
  PRODUCTS.forEach(p => db.run('INSERT INTO products VALUES (?,?,?,?,?)', [p.id, p.sku, p.name, p.price, p.stock]));
  const putOrder = (o, B) => {
    db.run('INSERT INTO orders VALUES (?,?,?,?,?,?,?,?)', [o.id, o.code, o.customer_id, o.status, o.voucher_code || null, o.discount_amount, B && B.has('dbNoDiscount') ? o.total_amount + o.discount_amount : o.total_amount, o.created_at]);
    o.items.forEach(i => db.run('INSERT INTO order_items (order_id, product_id, qty, unit_price) VALUES (?,?,?,?)', [o.id, i.product_id, i.qty, i.unit_price]));
  };
  SEED_ORDERS.forEach(o => putOrder(o));
  const server = makeServer(['dbNoDiscount'], {
    orderCreated: putOrder,
    orderUpdated: o => db.run('UPDATE orders SET status = ? WHERE id = ?', [o.status, o.id]),

}

  try { await new AsyncFn('api', 'test', 'expect', code)(api, test, makeExpect()); } catch(e){ error = e.message; }
  const results = [];
  for (const t of tests){ try { await t.fn(); results.push({ name:t.name, ok:true }); } catch(e){ results.push({ name:t.name, ok:false, msg:e.message }); } }
  return { error, results };
}
const resHTML = r => (r.error ? '<p class="msg err">Lỗi khi chạy script: ' + esc(r.error) + '</p>' : '') + (r.results.length ? '<ul class="tres">' + r.results.map(x => '<li><span class="' + (x.ok ? 'ok' : 'no') + '">' + (x.ok ? '✓' : '✕') + '</span><span>' + esc(x.name) + (x.ok ? '' : '<small>' + esc(x.msg) + '</small>') + '</span></li>').join('') + '</ul>' : '<p class="msg">Chưa có test nào được khai báo bằng test().</p>');
async function runScriptUI(){
  const code = $('editor').value, bugs = S.build === 'v10' ? BUGS_V10 : [];
  const r = await runScript(code, bugs);
  const pass = r.results.filter(x => x.ok).length;
  $('out-resp').innerHTML = lastRun[cur().id] = '<p class="msg">Chạy trên <b>' + (S.build === 'v10' ? 'build v1.0 (có bug)' : 'build v1.1 (đã sửa)') + '</b>: ' + pass + '/' + r.results.length + ' test pass.</p>' + resHTML(r);
  showTab('resp');
}

/* ===================== Chấm bài ===================== */
const li = (ok, text) => '<li class="' + (ok ? 'ok' : 'no') + '"><span class="ic">' + (ok ? '✓' : '✕') + '</span><span>' + text + '</span></li>';
function setBadge(p){ const b = $('gradeBadge'); if (p === null){ b.hidden = true; return; } b.hidden = false; b.className = 'badge ' + (p ? 'pass' : 'fail'); b.textContent = p ? 'Đạt' : 'Chưa đạt'; }
function finish(pass, checks, extra){
  const t = cur();
  $('out-grade').innerHTML = '<div class="verdict ' + (pass ? 'pass' : 'fail') + '">' + (pass ? 'Đạt. Xem "Góc QC" ở đề bài để biết làm gì tiếp.' : 'Chưa đạt. Xem các mục ✕ bên dưới.') + '</div><ul class="checks">' + checks.map(c => li(c[0], c[1])).join('') + '</ul>' + (extra || '');
  lastGrade[t.id] = { html: $('out-grade').innerHTML, pass };
  setBadge(pass); showTab('grade');
  if (pass && !S.done[t.id]){ S.done[t.id] = true; save(); renderQueue(); }
  if (pass) renderTicket();
}
function gradeReq(){
  const t = cur(), checks = t.grade(S.hist[t.id] || [], { sql: S.sql[t.id] || [], concl: S.concl[t.id] || '' });
  finish(checks.every(c => c[0]), checks, (S.hist[t.id] || []).length ? '' : '<p class="msg">Chấm dựa trên lịch sử request của bài này. Hãy gửi request trước.</p>');
}
async function gradeScript(){
  const t = cur(), code = $('editor').value;
  const good = await runScript(code, []);
  const checks = [];
  checks.push([!good.error, good.error ? 'Script lỗi khi chạy: ' + esc(good.error) : 'Script chạy không lỗi']);
  checks.push([good.results.length >= t.minTests, 'Có ít nhất ' + t.minTests + ' test (hiện có ' + good.results.length + ')']);
  const allPass = good.results.length > 0 && good.results.every(x => x.ok);
  checks.push([allPass, allPass ? 'Mọi test pass trên build v1.1' : !good.results.length ? 'Chưa có test nào để chạy trên build v1.1' : 'Có test fail trên build v1.1 (bản đúng): test đang kiểm tra sai mong đợi']);
  let extra = '<div class="build">Build v1.1 (đúng)</div>' + resHTML(good);
  for (const [bug, desc] of t.mutants){
    const r = await runScript(code, [bug]);
    const caught = !!r.error || r.results.some(x => !x.ok);
    checks.push([caught, (caught ? 'Bắt được bản lỗi: ' : 'Chưa bắt được bản lỗi: ') + desc]);
    extra += '<div class="build">Bản lỗi: ' + esc(desc) + '</div>' + resHTML(r);
  }
  finish(checks.every(c => c[0]), checks, extra);
}

/* ===================== Tài liệu API ===================== */
function renderDocs(){
  $('out-docs').innerHTML = '<p class="msg">Base URL <code>' + BASE + '</code>. Endpoint có 🔑 cần header <code>Authorization: Bearer &lt;access_token&gt;</code>. Lỗi luôn có dạng <code>{ "error": { "code", "message", "field"? } }</code>.</p>' +
    '<p class="msg">Tài khoản test: <code>an.nguyen@shopdemo.test</code> và <code>binh.tran@shopdemo.test</code>, mật khẩu đều là <code>Test@1234</code>.</p>' +
    DOCS.map((d, i) => '<details class="doc-ep"' + (i < 1 ? ' open' : '') + '><summary><span class="m ' + d.m + '">' + d.m + '</span><span class="p">' + d.p + (d.auth ? ' 🔑' : '') + '</span><span class="d">' + esc(d.d) + '</span></summary><div class="doc-body">' + (d.body ? '<div><b>Body:</b> <code>' + esc(d.body) + '</code></div>' : '') + '<ul>' + d.rules.map(r => '<li>' + esc(r) + '</li>').join('') + '</ul></div></details>').join('');
}

/* ===================== Điều khiển chung ===================== */
function showTab(name){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  ['resp','hist','grade','docs'].forEach(n => $('out-' + n).hidden = n !== name);
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
function openTicket(id){
  view = 'ticket';
  if (!TICKETS.some(t => t.id === id)) id = TICKETS[0].id;
  S.current = id; save();
  renderQueue(); renderTicket(); renderWorkspace(); restoreOutputs();
  showTab('resp'); $('ticket').scrollTop = 0;
}
function restoreOutputs(){
  const t = cur(), h = S.hist[t.id] || [];
  if (t.type !== 'req' && t.type !== 'db'){ if (lastRun[t.id]) $('out-resp').innerHTML = lastRun[t.id]; }
  else if (h.length){ const e = h[h.length - 1]; showResp(e.req, e.res); }
  const g = lastGrade[t.id];
  if (g){ $('out-grade').innerHTML = g.html; setBadge(g.pass); }
  else { $('out-grade').innerHTML = '<p class="msg">Bấm <b>Kiểm tra bài</b> để chấm.</p>'; setBadge(null); }
}
$('themeBtn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('apiqa.theme', root.dataset.theme); } catch(e) {}
};
try { const th = localStorage.getItem('apiqa.theme'); if (th) document.documentElement.dataset.theme = th; } catch(e) {}
renderDocs();
openTicket(S.current);
</script>
