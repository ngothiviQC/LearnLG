<style>
code.cblock{display:block;width:fit-content;max-width:100%;box-sizing:border-box;margin:6px 0;padding:8px 10px;
  background:var(--code-bg,#f4f4f5);border:1px solid var(--line,#ddd);border-radius:6px;font-size:12.5px;line-height:1.55;
  white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:auto;text-align:left}
</style>
<script>(function(){
  var SKIP='pre,button,a,label,summary,h1,h2,h3,h4,h5,h6,th,td,option,select,textarea,nav,.opt,.cblock-off';
  var KW=/^\s*(SELECT|INSERT|UPDATE|DELETE|WITH|CREATE|ALTER|DROP|FROM|WHERE|JOIN|LEFT JOIN|GROUP BY|ORDER BY|HAVING|CASE |UNION|\/\/|\/html|@|#|const |let |var |await |return |new |class |interface |package |driver\.|By\.|import |public |private |static |mvn |npx |npm |git |adb |k6 |curl |docker |mv |cp |cd |mkdir |assert|expect\(|test\(|Authorization:|Content-Type:|following-sibling|preceding-sibling|ancestor::)/i;
  var JSONISH=/^\s*[\[{]\s*["{\[]/;   // {"items": …} hoặc [{…}]
  var SYM=/[;{}()=]/;
  function isBlock(el){
    var t=(el.textContent||'').trim();
    if(t.length<28) return false;
    if(el.closest(SKIP)) return false;
    return KW.test(t) || JSONISH.test(t) || (SYM.test(t) && /[A-Za-z_]\w*\s*[(.=]/.test(t));
  }
  // Thành khối thì dấu câu ngay sau nó (". , ; :") sẽ rơi xuống một dòng riêng: bỏ dấu câu lẻ đó đi
  function mark(el){
    el.classList.add('cblock');
    var n=el.nextSibling;
    if(n&&n.nodeType===3&&/^[.,;:]/.test(n.nodeValue)) n.nodeValue=n.nodeValue.replace(/^[.,;:]\s*/,'');
  }
  function scan(root){
    var list=(root.querySelectorAll?root.querySelectorAll('code:not(.cblock)'):[]);
    for(var i=0;i<list.length;i++) if(isBlock(list[i])) mark(list[i]);
  }
  function start(){
    scan(document.body);
    new MutationObserver(function(ms){ for(var i=0;i<ms.length;i++){ var n=ms[i].addedNodes; for(var j=0;j<n.length;j++){ var x=n[j]; if(x.nodeType===1){ if(x.matches&&x.matches('code:not(.cblock)')&&isBlock(x)) mark(x); scan(x); } } } })
      .observe(document.body,{childList:true,subtree:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();</script>
<title>Luyện test API</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cùng bộ với các bài luyện khác — danh sách bài bên trái, đề bài ở giữa, "mini Postman" bên phải (form request hoặc editor test script). */
:root{
  --bg:#f8f4f6; --surface:#ffffff; --sunken:#f1e9ed; --ink:#22161c; --muted:#6b5a63; --line:#e6d9df;
  --accent:#c2185b; --accent-ink:#ffffff; --accent-soft:#fce4ec;
  --pass:#1d7a46; --pass-soft:#e1f3e7; --fail:#b3261e; --fail-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fbf0d6;
  --get:#1f5fae; --post:#1d7a46; --put:#8a5a00; --del:#b3261e;
  --code-bg:#fbf8f9; --kw:#ad1457; --str:#9a4b00; --num:#1f5fae; --cmt:#868296;
  --f-display:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151013; --surface:#1d161a; --sunken:#100c0e; --ink:#efe6ea; --muted:#ab99a2; --line:#352a30;
  --accent:#f48fb1; --accent-ink:#2a0a17; --accent-soft:#3d1a29;
  --pass:#5fd08e; --pass-soft:#163322; --fail:#ff8a80; --fail-soft:#3a1a18; --warn:#f0c35a; --warn-soft:#352a12;
  --get:#8db8f2; --post:#5fd08e; --put:#f0c35a; --del:#ff8a80;
  --code-bg:#171114; --kw:#f8a5c2; --str:#f0b070; --num:#8db8f2; --cmt:#7a768a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151013; --surface:#1d161a; --sunken:#100c0e; --ink:#efe6ea; --muted:#ab99a2; --line:#352a30;
  --accent:#f48fb1; --accent-ink:#2a0a17; --accent-soft:#3d1a29;
  --pass:#5fd08e; --pass-soft:#163322; --fail:#ff8a80; --fail-soft:#3a1a18; --warn:#f0c35a; --warn-soft:#352a12;
  --get:#8db8f2; --post:#5fd08e; --put:#f0c35a; --del:#ff8a80;
  --code-bg:#171114; --kw:#f8a5c2; --str:#f0b070; --num:#8db8f2; --cmt:#7a768a; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;display:flex;flex-direction:column}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
code,pre,textarea,input,select{font-family:var(--f-mono)}
code{font-size:.9em;background:var(--sunken);padding:1px 5px;border-radius:4px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.switch{display:flex;gap:2px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg);flex-wrap:wrap}
.sw{padding:4px 12px;border-radius:6px;font-size:12.5px;font-weight:500;text-decoration:none;color:var(--muted);white-space:nowrap}
a.sw:hover{background:var(--sunken);color:var(--ink)}
.sw.cur{background:var(--accent);color:var(--accent-ink)}
.progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.bar{width:120px;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:4px 8px;font-size:12px}

.app{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr) minmax(0,1.2fr)}
.pane{min-height:0;overflow:auto}
.queue{border-right:1px solid var(--line);background:var(--surface);padding:12px 10px 24px}
.phase{margin-bottom:14px}
.phase h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 8px 6px}
.qitem{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:6px}
.qitem:hover{background:var(--sunken)}
.qitem[aria-current="true"]{background:var(--accent-soft)}
.qitem .dot{width:14px;height:14px;margin-top:3px;border-radius:50%;border:1.5px solid var(--line)}
.qitem.done .dot{background:var(--pass);border-color:var(--pass)}
.qitem .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:block}
.qitem .s{font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--accent);display:block;line-height:1.35;margin-bottom:2px}
.qitem .t{font-size:12.5px;line-height:1.35;display:block;color:var(--muted)}

.ticket{padding:20px 24px 40px;border-right:1px solid var(--line)}
.tk-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.tk-key{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.chip.req{background:var(--accent-soft);color:var(--accent)}
.chip.bug{background:var(--fail-soft);color:var(--fail)}
.chip.auto{background:var(--pass-soft);color:var(--pass)}
.ticket h2.title{font-size:21px;font-weight:700;line-height:1.3;margin-bottom:2px}
.subtitle{font-size:15px;color:var(--muted);margin:0 0 10px;font-weight:500}
.practice{display:inline-flex;gap:8px;align-items:baseline;flex-wrap:wrap;background:var(--accent-soft);border-radius:8px;padding:6px 12px;margin-bottom:12px;font-size:13.5px}
.practice b{color:var(--accent);font-weight:600}
.practice code{background:transparent;padding:0;font-weight:500}
.meta{font-size:12.5px;color:var(--muted);margin-bottom:18px;display:flex;gap:14px;flex-wrap:wrap}
.field{margin-bottom:18px;max-width:70ch}
.field h3{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field p,.field ul,.field ol{margin:0 0 8px}
.field ul,.field ol{padding-left:20px}
.expect{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.lesson{display:flex;flex-direction:column;gap:8px}
.kw{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.kw summary{cursor:pointer;padding:8px 12px;font-weight:600}
.kw summary code{background:transparent;padding:0;color:var(--accent);font-size:13px}
.kw-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.kw-body p{margin:0}
.kw-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.kw-note{font-size:13px;color:var(--muted)}
.kw-note b{color:var(--ink)}
pre.syn{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;font-size:12.5px;line-height:1.55;white-space:pre}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:13.5px}
.hint b{color:var(--warn);font-weight:600;margin-right:4px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:13px}
.linkbtn:disabled{color:var(--muted);cursor:default}
.qc{border-radius:8px;padding:12px 14px;background:var(--accent-soft);max-width:70ch}
.qc h3{color:var(--accent)}

.work{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--surface)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;font-weight:500;font-size:13px}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:default}
.kbd{font-size:11.5px;color:var(--muted);margin-left:auto}
.reqform{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--code-bg);flex:0 0 auto}
.urlrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:center}
.urlrow select,.urlrow input,.reqform textarea,.toolbar select{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:13px;padding:6px 8px}
.urlrow select{font-weight:600}
.base{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.reqform label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.reqform textarea{width:100%;resize:vertical;min-height:58px;line-height:1.5}
#rqBody{min-height:96px}
.editor-wrap{position:relative;flex:0 0 46%;min-height:200px;border-bottom:1px solid var(--line);background:var(--code-bg)}
.editor-wrap pre,.editor-wrap textarea{position:absolute;inset:0;margin:0;padding:12px 14px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;overflow:auto;tab-size:2}
.editor-wrap pre{pointer-events:none;color:var(--ink)}
.editor-wrap textarea{border:0;resize:none;background:transparent;color:transparent;caret-color:var(--ink);outline:none}
.editor-wrap textarea::selection{background:var(--accent-soft);color:var(--ink);-webkit-text-fill-color:var(--ink)}
.hl-k{color:var(--kw);font-weight:500}.hl-s{color:var(--str)}.hl-n{color:var(--num)}.hl-c{color:var(--cmt);font-style:italic}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 10px;color:var(--muted);font-size:13px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .badge{font-size:11px;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--sunken)}
.tab .badge.pass{background:var(--pass-soft);color:var(--pass)}.tab .badge.fail{background:var(--fail-soft);color:var(--fail)}
.out{flex:1;min-height:0;overflow:auto;padding:12px 14px 24px}
.msg{font-size:13px;color:var(--muted);margin:0 0 10px}
.msg.err{color:var(--fail);background:var(--fail-soft);padding:8px 12px;border-radius:8px;font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap}
.status{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.st{font-family:var(--f-mono);font-weight:600;padding:2px 8px;border-radius:6px}
.st.s2{background:var(--pass-soft);color:var(--pass)}.st.s4{background:var(--warn-soft);color:var(--warn)}.st.s5{background:var(--fail-soft);color:var(--fail)}
.json{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:12.5px;line-height:1.55;white-space:pre}
.hdrs{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0 0 10px;white-space:pre-wrap;word-break:break-all}
.m{font-family:var(--f-mono);font-weight:600;font-size:12px}
.m.GET{color:var(--get)}.m.POST{color:var(--post)}.m.PUT,.m.PATCH{color:var(--put)}.m.DELETE{color:var(--del)}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:6px 10px;font-size:12.5px}
.hrow:hover{background:var(--sunken)}
.hrow .p{font-family:var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .ms{color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.checks{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;font-size:13.5px}
.checks .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.checks .ok .ic{background:var(--pass-soft);color:var(--pass)}
.checks .no .ic{background:var(--fail-soft);color:var(--fail)}
.verdict{border-radius:8px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.verdict.pass{background:var(--pass-soft);color:var(--pass)}
.verdict.fail{background:var(--fail-soft);color:var(--fail)}
.tres{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.tres li{display:grid;grid-template-columns:18px 1fr;gap:6px}
.tres .ok{color:var(--pass)} .tres .no{color:var(--fail)}
.tres small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.build{font-size:12px;font-weight:600;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.doc-ep{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--surface)}
.doc-ep summary{cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.doc-ep summary .p{font-family:var(--f-mono);font-size:13px}
.doc-ep summary span.d{color:var(--muted);font-size:12.5px}
.doc-body{padding:0 12px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.doc-body ul{margin:0;padding-left:18px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-width:100%}
table.res{border-collapse:collapse;font-size:12.5px;min-width:100%}
table.res th,table.res td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.res th{background:var(--sunken);font-weight:600}
table.res tr:last-child td{border-bottom:0}

/* Buổi học, tiêu chí đạt, collection runner, REST Assured, trắc nghiệm, đối chiếu DB */
.phase h2{display:flex;flex-direction:column;gap:1px}
.phase h2 .bu{color:var(--accent);letter-spacing:.04em;font-size:10.5px}
.crit-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:14px;font-size:12.5px;font-weight:600;text-align:left}
.crit-btn:hover{background:var(--sunken)}
.crit-btn[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.crit-btn .n{font-family:var(--f-mono);font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.buoi{background:transparent;border:1px solid var(--line);color:var(--ink)}
.crit-sec{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px 8px;margin-bottom:16px;max-width:76ch}
.crit-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.crit-head h3{font-size:16px;font-weight:700}
.crit-head .eyebrow{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.crit-pct{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.crit-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.crit-row .lbl{font-size:13.5px;font-weight:500}
.crit-row .src{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.tk-link{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:1px 8px;font-family:var(--f-mono);font-size:11.5px}
.tk-link:hover{background:var(--sunken)}
.tk-link.ok{background:var(--pass-soft);color:var(--pass);border-color:transparent}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--pass-soft);color:var(--pass)}.pill.part{background:var(--warn-soft);color:var(--warn)}.pill.no{background:var(--sunken);color:var(--muted)}
.crit-sub{font-size:13px;color:var(--muted);margin:8px 0 6px;padding-top:8px;border-top:1px solid var(--line)}
.nm-req{margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.nm-name{font-weight:600;font-size:13.5px;margin-bottom:2px}
.nm-req .ln{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:12.5px;margin-bottom:6px}
.nm-req .ln .p{font-family:var(--f-mono);word-break:break-all}
.nm-req .ms{color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.tres .wn{color:var(--warn)}
.quiz{display:flex;flex-direction:column;gap:14px;padding:12px 14px 20px}
.qz{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface)}
.qz h4{margin:0 0 8px;font-family:var(--f-display);font-size:14px;font-weight:600;line-height:1.45}
.qz .opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}

<script>
/* ===================== API ShopDemo mô phỏng ===================== */
const BASE = 'https://api.shopdemo.test/v1';
const PRODUCTS = [
  { id:1, sku:'TS-001', name:'Áo thun basic trắng', category:'ao', price:149000, stock:120 },
  { id:2, sku:'TS-002', name:'Áo thun basic đen', category:'ao', price:149000, stock:0 },
  { id:3, sku:'JN-010', name:'Quần jeans slim', category:'quan', price:459000, stock:35 },
  { id:4, sku:'SN-021', name:'Giày sneaker canvas', category:'giay', price:699000, stock:8 },
  { id:5, sku:'BG-005', name:'Balo laptop 15 inch', category:'phu-kien', price:389000, stock:18 },
  { id:6, sku:'CP-100', name:'Mũ lưỡi trai', category:'phu-kien', price:99000, stock:60 },
  { id:7, sku:'SM-200', name:'Sơ mi oxford', category:'ao', price:329000, stock:25 },
];
const USERS = [
  { id:1, email:'an.nguyen@shopdemo.test', password:'Test@1234', full_name:'Nguyễn Văn An', token:'eyJhbGciOiJIUzI1NiJ9.dWlkOjE.an_k7Qw2' },
  { id:2, email:'binh.tran@shopdemo.test', password:'Test@1234', full_name:'Trần Thị Bình', token:'eyJhbGciOiJIUzI1NiJ9.dWlkOjI.binh_P9x4' },
];
const VOUCHERS = { SALE10:10 };
const SEED_ORDERS = [
  { id:101, code:'DH-2001', customer_id:1, status:'delivered', items:[{ product_id:1, name:'Áo thun basic trắng', qty:2, unit_price:149000 }], discount_amount:0, total_amount:298000, created_at:'2026-11-02T02:15:00Z' },
  { id:102, code:'DH-2002', customer_id:2, status:'delivered', items:[{ product_id:3, name:'Quần jeans slim', qty:1, unit_price:459000 }], discount_amount:45900, total_amount:413100, created_at:'2026-11-03T07:40:00Z' },
  { id:103, code:'DH-2003', customer_id:1, status:'paid', items:[{ product_id:5, name:'Balo laptop 15 inch', qty:1, unit_price:389000 }], discount_amount:0, total_amount:389000, created_at:'2026-11-05T13:20:00Z' },
];
/* Bug của build v1.0 (bản đang test). Build v1.1 đã sửa hết. */
const BUGS_V10 = ['qtyZero', 'register500', 'noAuth403', 'idor', 'idempotency'];
const clone = x => JSON.parse(JSON.stringify(x));

/* hooks (tùy chọn): báo cho DB giả lập khi API ghi dữ liệu, dùng ở bài đối chiếu API ↔ DB. */
function makeServer(bugs, hooks){
  const B = new Set(bugs || []), HK = hooks || {};
  const st = { orders: clone(SEED_ORDERS), nextId: 104, idem: {}, users: clone(USERS).map(u => ({ id:u.id, email:u.email, password:u.password, full_name:u.full_name, token:u.token })), nextUser: 3, seq: 0 };
  const J = (status, body, extra) => ({ status, headers: Object.assign({ 'content-type': B.has('htmlType') ? 'text/html; charset=utf-8' : 'application/json; charset=utf-8', 'x-request-id': 'req_' + (++st.seq).toString(36).padStart(5, '0') }, extra || {}), body });
  const E = (status, code, message, field) => J(status, { error: Object.assign({ code, message }, field ? { field } : {}) });
  const authUser = h => { const a = h['authorization'] || ''; const m = a.match(/^Bearer\s+(.+)$/i); return m ? st.users.find(u => u.token === m[1].trim()) : null; };
  const pub = p => {
    const o = { id:p.id, sku:p.sku, name:p.name, category:p.category, price:p.price, stock:p.stock };
    if (B.has('priceString')) o.price = String(o.price);
    if (B.has('negativeStock') && p.id === 4) o.stock = -2;
    if (B.has('missingName') && p.id === 1) delete o.name;
    return o;
  };
  function route(req){
    const { method, path, query, headers } = req;
    let body = null;
    if (req.bodyText && req.bodyText.trim()){
      try { body = JSON.parse(req.bodyText); } catch(e){ return E(400, 'INVALID_JSON', 'Body không phải JSON hợp lệ: ' + e.message); }
    }
    const seg = path.replace(/\/+$/, '').split('/').filter(Boolean);
    const allow = (list) => list.includes(method) ? null : J(405, { error:{ code:'METHOD_NOT_ALLOWED', message:'Phương thức ' + method + ' không được hỗ trợ cho ' + path } }, { allow: list.join(', ') });

    if (seg[0] === 'products' && seg.length === 1){
      const na = allow(['GET']); if (na) return na;
      let list = PRODUCTS.slice();
      if (query.category) list = list.filter(p => p.category === query.category);
      if (query.sort){
        if (!['price', '-price', 'name'].includes(query.sort)) return E(400, 'VALIDATION_ERROR', 'sort chỉ nhận price, -price, name', 'sort');
        const k = query.sort.replace('-', ''), dir = query.sort.startsWith('-') ? -1 : 1;
        list.sort((a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : a.id - b.id) * dir);
      }
      const page = query.page ? +query.page : 1, limit = query.limit ? +query.limit : 20;
      if (!Number.isInteger(page) || page < 1) return E(400, 'VALIDATION_ERROR', 'page phải là số nguyên ≥ 1', 'page');
      if (!Number.isInteger(limit) || limit < 1 || limit > 50) return E(400, 'VALIDATION_ERROR', 'limit phải từ 1 đến 50', 'limit');
      return J(200, { data: list.slice((page - 1) * limit, page * limit).map(pub), page, limit, total: list.length });
    }
    if (seg[0] === 'products' && seg.length === 2){
      const na = allow(['GET']); if (na) return na;
      if (!/^\d+$/.test(seg[1])) return E(400, 'INVALID_ID', 'id sản phẩm phải là số nguyên dương');
      let id = +seg[1];
      if (B.has('wrongId') && id === 1) id = 2;
      const p = PRODUCTS.find(x => x.id === id);
      if (!p) return E(404, 'PRODUCT_NOT_FOUND', 'Không tìm thấy sản phẩm ' + seg[1]);
      return J(200, pub(p));
    }
    if (seg[0] === 'auth' && seg[1] === 'login' && seg.length === 2){
      const na = allow(['POST']); if (na) return na;
      if (!body || !body.email || !body.password) return E(400, 'VALIDATION_ERROR', 'Cần email và password', !body || !body.email ? 'email' : 'password');
      const u = st.users.find(x => x.email.toLowerCase() === String(body.email).trim().toLowerCase() && x.password === body.password);
      if (!u) return E(401, 'INVALID_CREDENTIALS', 'Email hoặc mật khẩu không đúng');
      return J(200, { access_token: u.token, token_type:'Bearer', expires_in:3600, user:{ id:u.id, email:u.email, full_name:u.full_name } });
    }
    if (seg[0] === 'me' && seg.length === 1){
      const na = allow(['GET']); if (na) return na;
      const u = authUser(headers);
      if (!u) return E(401, 'UNAUTHORIZED', 'Thiếu hoặc sai access token');
      return J(200, { id:u.id, email:u.email, full_name:u.full_name });
    }
    if (seg[0] === 'users' && seg.length === 1){
      const na = allow(['POST']); if (na) return na;
      const b = body || {};
      if (B.has('register500') && b.email === undefined) return E(500, 'INTERNAL_ERROR', "TypeError: Cannot read properties of undefined (reading 'toLowerCase') at UserService.register (user.service.js:42:31)");
      if (!b.email) return E(400, 'VALIDATION_ERROR', 'email là bắt buộc', 'email');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(b.email).trim())) return E(400, 'VALIDATION_ERROR', 'email không đúng định dạng', 'email');
      if (!b.password || String(b.password).length < 8) return E(400, 'VALIDATION_ERROR', 'password phải có ít nhất 8 ký tự', 'password');
      if (!b.full_name || !String(b.full_name).trim()) return E(400, 'VALIDATION_ERROR', 'full_name là bắt buộc', 'full_name');
      const email = String(b.email).trim().toLowerCase();
      if (st.users.some(u => u.email.toLowerCase() === email)) return E(409, 'EMAIL_EXISTS', 'Email đã được đăng ký');
      const u = { id: st.nextUser++, email, password: String(b.password), full_name: String(b.full_name).trim(), token: 'eyJhbGciOiJIUzI1NiJ9.dWlkOj' + st.nextUser + '.new_' + Math.random().toString(36).slice(2, 6) };
      st.users.push(u);
      if (HK.userCreated) HK.userCreated(clone(u));
      return J(201, { id:u.id, email:u.email, full_name:u.full_name, created_at: new Date().toISOString().slice(0, 19) + 'Z' }, { location: '/v1/users/' + u.id });
    }
    if (seg[0] === 'orders' && seg.length <= 2){
      const na = allow(seg.length === 1 ? ['GET', 'POST'] : ['GET', 'PATCH']); if (na) return na;
      const u = authUser(headers);
      if (!u){
        if (B.has('noAuth403')) return E(403, 'FORBIDDEN', 'Bạn không có quyền truy cập tài nguyên này');
        return E(401, 'UNAUTHORIZED', 'Thiếu hoặc sai access token');
      }
      if (seg.length === 1 && method === 'GET') return J(200, { data: st.orders.filter(o => o.customer_id === u.id) });
      if (seg.length === 2){
        if (!/^\d+$/.test(seg[1])) return E(400, 'INVALID_ID', 'id đơn hàng phải là số nguyên dương');
        const o = st.orders.find(x => x.id === +seg[1]);
        if (!o) return E(404, 'ORDER_NOT_FOUND', 'Không tìm thấy đơn hàng ' + seg[1]);
        if (o.customer_id !== u.id && !B.has('idor')) return E(403, 'FORBIDDEN', 'Bạn không có quyền xem đơn hàng này');
        if (method === 'PATCH'){
          if (!body || body.status !== 'cancelled') return E(400, 'VALIDATION_ERROR', 'Chỉ hỗ trợ đổi status sang cancelled', 'status');
          if (o.status !== 'pending_payment') return E(409, 'INVALID_STATUS', 'Chỉ hủy được đơn đang chờ thanh toán (pending_payment)');
          o.status = 'cancelled';
          if (HK.orderUpdated) HK.orderUpdated(clone(o), B);
          return J(200, clone(o));
        }
        const out = clone(o);
        if (o.id >= 104){
          if (B.has('wrongTotal')) out.total_amount = out.items[0].unit_price;
          if (B.has('statusPaid')) out.status = 'paid';
        }
        return J(200, out);
      }
      // POST /orders
      const key = headers['idempotency-key'];
      if (key && st.idem[u.id + ':' + key] && !B.has('idempotency')) return J(200, clone(st.orders.find(o => o.id === st.idem[u.id + ':' + key])), { 'idempotent-replayed': 'true' });
      const b = body || {};
      if (!Array.isArray(b.items) || !b.items.length) return E(400, 'VALIDATION_ERROR', 'items phải là mảng có ít nhất 1 phần tử', 'items');
      const items = [];
      for (let i = 0; i < b.items.length; i++){
        const it = b.items[i] || {};
        if (!Number.isInteger(it.product_id)) return E(400, 'VALIDATION_ERROR', 'product_id phải là số nguyên', 'items[' + i + '].product_id');
        const p = PRODUCTS.find(x => x.id === it.product_id);
        if (!p) return E(422, 'PRODUCT_NOT_FOUND', 'Không tìm thấy sản phẩm ' + it.product_id, 'items[' + i + '].product_id');
        const bad = !Number.isInteger(it.qty) || (B.has('qtyZero') ? (it.qty < 0 || it.qty > 10) : (it.qty < 1 || it.qty > 10));
        if (bad) return E(400, 'VALIDATION_ERROR', 'qty phải là số nguyên từ 1 đến 10', 'items[' + i + '].qty');
        if (it.qty > p.stock) return E(409, 'OUT_OF_STOCK', 'Sản phẩm ' + p.sku + ' chỉ còn ' + p.stock, 'items[' + i + '].qty');
        items.push({ product_id:p.id, name:p.name, qty:it.qty, unit_price:p.price });
      }
      let pct = 0;
      if (b.voucher_code != null){ pct = VOUCHERS[b.voucher_code]; if (!pct) return E(400, 'VOUCHER_INVALID', 'Mã giảm giá không hợp lệ', 'voucher_code'); }
      const sub = items.reduce((s, x) => s + x.qty * x.unit_price, 0), disc = Math.round(sub * pct / 100);
      const id = st.nextId++;
      const o = { id, code:'DH-' + (2000 + id - 100), customer_id:u.id, status:'pending_payment', items, discount_amount:disc, total_amount:sub - disc, created_at: new Date().toISOString().slice(0, 19) + 'Z' };
      if (b.voucher_code) o.voucher_code = b.voucher_code;
      st.orders.push(o);
      if (HK.orderCreated) HK.orderCreated(clone(o), B);
      if (key) st.idem[u.id + ':' + key] = id;
      return J(201, clone(o), { location: '/v1/orders/' + id });
    }
    return E(404, 'ROUTE_NOT_FOUND', 'Không có endpoint ' + method + ' ' + path);
  }
  return async function handle(req){
    const res = route(req);
    res.time = B.has('slow') ? 700 + Math.floor(Math.random() * 120) : 40 + Math.floor(Math.random() * 110);
    return res;
  };
}
function parseUrl(u){
  u = String(u || '').trim();
  if (u.startsWith(BASE)) u = u.slice(BASE.length);
  else if (/^https?:\/\//i.test(u)){ const x = u.replace(/^https?:\/\/[^/]+/i, ''); u = x.startsWith('/v1') ? x.slice(3) : x; }
  else if (u.startsWith('/v1/')) u = u.slice(3);
  if (!u.startsWith('/')) u = '/' + u;
  const [p, qs] = u.split('?');
  const query = {};
  (qs || '').split('&').filter(Boolean).forEach(kv => { const [k, v] = kv.split('='); query[decodeURIComponent(k)] = decodeURIComponent((v || '').replace(/\+/g, ' ')); });
  return { path: p, query };
}
function parseHeaders(text){
  const h = {};
  String(text || '').split('\n').forEach(line => { const i = line.indexOf(':'); if (i > 0){ const k = line.slice(0, i).trim().toLowerCase(); if (k) h[k] = line.slice(i + 1).trim(); } });
  return h;
}

/* ===================== Bài luyện ===================== */
/* buoi: buổi tương ứng trong kế hoạch học Automation v2 (buổi 11: Postman/Newman; buổi 12: REST Assured + JDBC). */
const PHASES = [
  { id:'A', name:'Gửi request cơ bản', buoi:'Buổi 11' },
  { id:'B', name:'Tìm bug API (build v1.0)', buoi:'Buổi 11' },
  { id:'C', name:'Viết test script', buoi:'Buổi 11' },
  { id:'D', name:'Hồi quy & chạy collection', buoi:'Buổi 11 · Newman/CI' },
  { id:'E', name:'API automation bằng code', buoi:'Buổi 12' },
];
const find = (h, f) => h.filter(f);
const hasAuth = e => !!e.req.headers['authorization'];
const TICKETS = [
{ id:'A1', phase:'A', key:'Bài 1', type:'req', name:'GET & query params', skills:['GET','query params','status 200'],
  title:'Danh sách áo, giá từ thấp đến cao',
  context:`<p>Màn "Áo" trên app gọi API lấy danh sách sản phẩm thuộc danh mục áo, sắp theo giá tăng dần. Bạn cần gọi trực tiếp API để đối chiếu với màn hình.</p>`,
  task:`<p>Gửi request lấy sản phẩm có <code>category</code> là <code>ao</code>, sắp xếp theo <code>price</code> tăng dần. Đọc phản hồi: có bao nhiêu sản phẩm, sản phẩm rẻ nhất là gì.</p>`,
  expect:'Gửi được request lấy đúng danh sách áo, sắp giá tăng dần, và nhận phản hồi thành công.',
  grade: h => { const g = find(h, e => e.req.method === 'GET' && e.req.path === '/products'); const c = g.filter(e => e.req.query.category === 'ao'); const s = c.filter(e => e.req.query.sort === 'price');
    return [[g.length > 0, 'Gọi đúng endpoint danh sách sản phẩm'], [c.length > 0, 'Lọc đúng danh mục áo'], [s.length > 0, 'Sắp xếp giá tăng dần'], [s.some(e => e.res.status === 200), 'Nhận phản hồi thành công']]; },
  answer:{ method:'GET', url:'/products?category=ao&sort=price', headers:'', body:'' },
  hints:['Query param nằm sau dấu <code>?</code> trong URL, các cặp nối bằng <code>&amp;</code>.','Xem tab <b>Tài liệu API</b>: <code>sort</code> nhận <code>price</code> (tăng) hoặc <code>-price</code> (giảm).','<code>GET /products?category=ao&amp;sort=price</code>'],
  lessons:[
    { k:'HTTP method', d:'Cho server biết bạn muốn làm gì với tài nguyên. GET: đọc; POST: tạo mới; PUT/PATCH: sửa; DELETE: xóa. GET không được làm thay đổi dữ liệu.', ex:'GET  /products        → đọc danh sách\nPOST /orders          → tạo đơn mới\nGET  /orders/101      → đọc một đơn', n:'Một bug hay gặp: endpoint GET mà lại ghi dữ liệu (vd GET /orders/101/cancel). Đáng báo bug thiết kế API.' },
    { k:'Query params', d:'Tham số lọc, sắp xếp, phân trang đặt sau dấu ? của URL, dạng key=value, nối bằng &.', ex:'/products?category=ao&sort=-price&page=2&limit=5', n:'Test cả giá trị sai của query param: sort=abc, limit=0, limit=1000, page=-1. API nên trả 400 kèm thông báo rõ ràng.' },
    { k:'Status 2xx', d:'Nhóm thành công. 200 OK (đọc/sửa thành công), 201 Created (tạo mới thành công), 204 No Content (thành công, không có body).', ex:'HTTP/1.1 200 OK\nContent-Type: application/json', n:'Kiểm tra status code là assertion đầu tiên của mọi test API.' },
  ],
  qc:`<p>Có 3 sản phẩm áo, rẻ nhất là "Áo thun basic trắng" và "Áo thun basic đen" (cùng 149.000đ). Khi hai sản phẩm cùng giá, API xếp theo id: đây là điều spec nên ghi rõ, nếu không UI và API dễ hiển thị thứ tự khác nhau.</p><p>Đối chiếu API với UI giúp khoanh vùng bug: API đúng mà màn hình sai thì lỗi ở frontend, và ngược lại.</p>` },

{ id:'A2', phase:'A', key:'Bài 2', type:'req', name:'Path param & 404', skills:['path param','404','error body'],
  title:'Sản phẩm không tồn tại trả về gì?',
  context:`<p>Link chia sẻ sản phẩm có dạng <code>/products/{id}</code>. Khách mở link của một sản phẩm đã bị xóa. Spec: API trả <b>404</b> với body lỗi có <code>error.code = PRODUCT_NOT_FOUND</code>.</p>`,
  task:`<p>Gửi request lấy một sản phẩm có id không tồn tại và xác nhận API trả đúng 404 và đúng mã lỗi. Thử thêm id không phải số (vd <code>abc</code>) xem API trả gì.</p>`,
  expect:'Nhận được phản hồi lỗi đúng spec khi sản phẩm không tồn tại: đúng status và đúng mã lỗi.',
  grade: h => { const g = find(h, e => e.req.method === 'GET' && /^\/products\/[^/]+$/.test(e.req.path)); const nf = g.filter(e => e.res.status === 404);
    return [[g.length > 0, 'Gọi endpoint chi tiết sản phẩm'], [nf.length > 0, 'Nhận đúng status cho trường hợp không tìm thấy'], [nf.some(e => e.res.body && e.res.body.error && e.res.body.error.code === 'PRODUCT_NOT_FOUND'), 'Body lỗi có mã lỗi đúng spec']]; },
  answer:{ method:'GET', url:'/products/999', headers:'', body:'' },
  hints:['Path param là phần của đường dẫn: <code>/products/1</code> thì 1 là id.','Danh sách chỉ có id từ 1 đến 7.','<code>GET /products/999</code>'],
  lessons:[
    { k:'Path param', d:'Giá trị nằm trong đường dẫn, xác định một tài nguyên cụ thể.', ex:'GET /products/3     → sản phẩm id 3\nGET /orders/101     → đơn id 101', n:'Test id không tồn tại (404), id sai kiểu (abc → 400), id âm, id rất lớn.' },
    { k:'Status 4xx', d:'Lỗi phía client (request sai). 400 Bad Request: dữ liệu không hợp lệ; 401: chưa xác thực; 403: không có quyền; 404: không tìm thấy; 405: sai method; 409: xung đột; 422: dữ liệu đúng cú pháp nhưng không xử lý được.', ex:'HTTP/1.1 404 Not Found\n{ "error": { "code": "PRODUCT_NOT_FOUND", "message": "..." } }', n:'Kiểm tra cả body lỗi, không chỉ status: mã lỗi có đúng spec không, message có dễ hiểu không, có lộ thông tin nội bộ không.' },
  ],
  qc:`<p>Với <code>/products/abc</code> API trả 400 <code>INVALID_ID</code> chứ không phải 404: hai trường hợp khác nhau là đúng. Testcase âm cho path param thường gồm: không tồn tại, sai kiểu, số âm, số 0, số rất lớn, ký tự đặc biệt.</p>` },

{ id:'A3', phase:'A', key:'Bài 3', type:'req', name:'Login & Bearer token', skills:['POST','Authorization','Bearer'],
  title:'Đăng nhập rồi gọi API cần xác thực',
  context:`<p>Màn "Tài khoản" gọi <code>GET /me</code>. Endpoint này cần access token lấy từ <code>POST /auth/login</code>.</p><p>Tài khoản test: <code>an.nguyen@shopdemo.test</code> / <code>Test@1234</code>.</p>`,
  task:`<ol><li>Đăng nhập để lấy <code>access_token</code>.</li><li>Gọi <code>GET /me</code> với header <code>Authorization: Bearer &lt;token&gt;</code> và nhận 200.</li><li>Thử gọi <code>/me</code> không có token, hoặc token sai, xem API trả gì.</li></ol>`,
  expect:'Gọi thành công API lấy thông tin tài khoản bằng token của chính bạn.',
  grade: h => { const l = find(h, e => e.req.method === 'POST' && e.req.path === '/auth/login' && e.res.status === 200); const m = find(h, e => e.req.method === 'GET' && e.req.path === '/me');
    return [[l.length > 0, 'Đăng nhập thành công'], [m.some(hasAuth), 'Gọi API thông tin tài khoản có gửi kèm token'], [m.some(e => e.res.status === 200), 'Lấy được thông tin tài khoản']]; },
  answer:{ method:'GET', url:'/me', headers:'Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.dWlkOjE.an_k7Qw2', body:'', pre:{ method:'POST', url:'/auth/login', headers:'Content-Type: application/json', body:'{\n  "email": "an.nguyen@shopdemo.test",\n  "password": "Test@1234"\n}' } },
  hints:['Đăng nhập: method POST, URL <code>/auth/login</code>, body JSON có <code>email</code> và <code>password</code>.','Chép giá trị <code>access_token</code> trong phản hồi.','Ô Headers của request /me: <code>Authorization: Bearer eyJhbGci...</code> (có chữ Bearer và một dấu cách).'],
  lessons:[
    { k:'Header Authorization', d:'Cách phổ biến để gửi token xác thực. Server đọc token để biết bạn là ai.', ex:'Authorization: Bearer eyJhbGciOiJIUzI1NiJ9...', n:'Testcase: không có header, token sai, token hết hạn, thiếu chữ "Bearer", token của người khác. Mọi trường hợp sai đều phải 401.' },
    { k:'Body JSON', d:'Dữ liệu gửi kèm request POST/PUT, thường ở dạng JSON, kèm header Content-Type: application/json.', ex:'{\n  "email": "an.nguyen@shopdemo.test",\n  "password": "Test@1234"\n}', n:'Chuỗi JSON dùng nháy kép, không có dấu phẩy thừa ở phần tử cuối.' },
  ],
  qc:`<p>Không token và token sai đều trả 401 <code>UNAUTHORIZED</code>: đúng spec. Khi test xác thực, nên kiểm tra cả thông báo lỗi không tiết lộ lý do chi tiết (vd "email không tồn tại" giúp kẻ xấu dò email). API này trả chung "Email hoặc mật khẩu không đúng" là tốt.</p>` },

{ id:'A4', phase:'A', key:'Bài 4', type:'req', name:'POST tạo tài nguyên', skills:['POST','201 Created','Location'],
  title:'Tạo đơn hàng qua API',
  context:`<p>Bạn cần tạo đơn để chuẩn bị dữ liệu test thanh toán, nhanh hơn đi qua UI. Đăng nhập bằng tài khoản an.nguyen (xem bài 3).</p>`,
  task:`<p>Tạo đơn gồm 2 "Mũ lưỡi trai" (product_id 6) qua <code>POST /orders</code>. Kiểm tra: status 201, header <code>Location</code>, <code>total_amount</code> đúng 198000, <code>status</code> là <code>pending_payment</code>.</p>`,
  expect:'Tạo được một đơn hàng mới; phản hồi đúng status cho việc tạo mới và có header trỏ tới đơn vừa tạo.',
  grade: h => { const p = find(h, e => e.req.method === 'POST' && e.req.path === '/orders'); const ok = p.filter(e => e.res.status === 201);
    return [[p.length > 0, 'Gọi đúng endpoint tạo đơn'], [p.some(hasAuth), 'Request có gửi kèm token'], [ok.length > 0, 'Nhận đúng status cho việc tạo mới'], [ok.some(e => e.res.headers.location), 'Phản hồi có header trỏ tới đơn vừa tạo']]; },
  answer:{ method:'POST', url:'/orders', headers:'Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.dWlkOjE.an_k7Qw2\nContent-Type: application/json', body:'{\n  "items": [ { "product_id": 6, "qty": 2 } ]\n}' },
  hints:['Cần cả 2 header: <code>Authorization</code> và <code>Content-Type: application/json</code>.','Body: <code>{"items": [{"product_id": 6, "qty": 2}]}</code>.','Xem phần Headers trong tab Phản hồi để thấy <code>location</code>.'],
  lessons:[
    { k:'201 Created + Location', d:'Tạo mới thành công nên trả 201, kèm header Location trỏ tới tài nguyên vừa tạo, và body là tài nguyên đó.', ex:'HTTP/1.1 201 Created\nLocation: /v1/orders/104\n{ "id": 104, "status": "pending_payment", ... }', n:'Trả 200 thay vì 201 khi tạo mới không làm hỏng chức năng, nhưng sai chuẩn REST: nên ghi nhận mức Low.' },
    { k:'Kiểm tra dữ liệu trả về', d:'Không chỉ status: so từng trường với dữ liệu gửi đi và quy tắc nghiệp vụ (tổng tiền, trạng thái mặc định, người tạo).', ex:'qty 2 × 99000 = 198000 → total_amount phải là 198000\nstatus mặc định = pending_payment', n:'Gọi tiếp GET /orders/{id} để chắc dữ liệu thực sự được lưu, không chỉ được trả về.' },
  ],
  qc:`<p>Tạo dữ liệu test qua API nhanh hơn và ổn định hơn qua UI. Cách này hay dùng làm bước Precondition trong test tự động. Ghi lại request vào testcase để người khác chạy lại được.</p>` },

{ id:'B1', phase:'B', key:'Bài 5', type:'req', bug:true, name:'Giá trị biên trong API', skills:['BVA','400','validation'],
  title:'Số lượng ngoài khoảng 1–10 có bị chặn không?',
  context:`<p>Spec: mỗi sản phẩm trong đơn có <code>qty</code> là số nguyên <b>từ 1 đến 10</b>. Ngoài khoảng → <b>400 VALIDATION_ERROR</b>.</p><p>Build v1.0 vừa lên staging. Hãy tìm xem validation có lỗi không.</p>`,
  task:`<p>Áp dụng phân tích giá trị biên cho <code>qty</code>. Gửi các request <code>POST /orders</code> với các giá trị biên và tìm giá trị mà API <b>chấp nhận sai</b> (trả 201 trong khi spec nói phải 400).</p>`,
  expect:'Đã thử các giá trị biên và tìm ra giá trị không hợp lệ mà API vẫn chấp nhận.',
  grade: h => { const p = find(h, e => e.req.method === 'POST' && e.req.path === '/orders'); const vals = new Set(); p.forEach(e => { try { (JSON.parse(e.req.bodyText).items || []).forEach(i => vals.add(i.qty)); } catch(x){} });
    const bug = p.some(e => e.res.status === 201 && e.res.body && e.res.body.items && e.res.body.items.some(i => i.qty < 1 || i.qty > 10));
    return [[p.length >= 2, 'Đã thử nhiều giá trị (' + p.length + ' request tạo đơn)'], [[0, 1, 10, 11].filter(v => vals.has(v)).length >= 3, 'Đã thử đủ các giá trị biên của khoảng số lượng (đã thử: ' + ([...vals].join(', ') || 'chưa có') + ')'], [bug, 'Tìm ra giá trị ngoài khoảng mà API vẫn trả 201']]; },
  answer:{ method:'POST', url:'/orders', headers:'Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.dWlkOjE.an_k7Qw2\nContent-Type: application/json', body:'{\n  "items": [ { "product_id": 6, "qty": 0 } ]\n}' },
  hints:['BVA 2 giá trị cho khoảng 1–10: 0, 1, 10, 11.','Đổi <code>qty</code> trong body rồi gửi lại, xem status từng lần. Dùng sản phẩm còn hàng như product_id 6.','Thử <code>qty: 0</code>.'],
  lessons:[
    { k:'Giá trị biên trong API', d:'Kỹ thuật BVA áp dụng y hệt cho API: mỗi trường số có khoảng hợp lệ thì test ở biên và ngay ngoài biên.', ex:'qty: 0 → 400 | 1 → 201 | 10 → 201 | 11 → 400\nThêm: -1, 1.5, "2", null', n:'Validation ở UI không thay thế validation ở API: người dùng có thể gọi API trực tiếp, bỏ qua UI.' },
    { k:'Body lỗi validation', d:'API tốt chỉ rõ trường nào sai và vì sao, để client hiển thị đúng chỗ.', ex:'{ "error": { "code": "VALIDATION_ERROR",\n  "field": "items[0].qty",\n  "message": "qty phải là số nguyên từ 1 đến 10" } }', n:'Ghi cả request và response vào bug report. Dev tái hiện được ngay mà không cần UI.' },
  ],
  qc:`<p><b>Bug:</b> <code>qty = 0</code> được chấp nhận, tạo ra đơn 0đ. Điều kiện kiểm tra bị lệch biên (<code>qty &lt; 0</code> thay vì <code>qty &lt; 1</code>), một lỗi off-by-one điển hình.</p><p>Bug report mẫu: <i>Tiêu đề</i> "POST /orders chấp nhận qty = 0, tạo đơn tổng 0đ". <i>Mong đợi</i>: 400 VALIDATION_ERROR, field items[0].qty. <i>Thực tế</i>: 201, total_amount 0. <i>Severity</i>: High.</p>` },

{ id:'B2', phase:'B', key:'Bài 6', type:'req', bug:true, name:'Thiếu trường bắt buộc', skills:['negative test','500','lộ thông tin'],
  title:'Đăng ký thiếu email làm server lỗi',
  context:`<p>Spec <code>POST /users</code>: <code>email</code>, <code>password</code> (≥ 8 ký tự), <code>full_name</code> đều bắt buộc. Thiếu hoặc sai → <b>400</b> và chỉ rõ trường sai. Endpoint không cần token.</p>`,
  task:`<p>Thử đăng ký với các body thiếu từng trường bắt buộc. Tìm trường hợp server trả lỗi <b>5xx</b> thay vì 400.</p>`,
  expect:'Tìm ra trường hợp dữ liệu đăng ký sai khiến server bị lỗi, thay vì báo lỗi dữ liệu.',
  grade: h => { const p = find(h, e => e.req.method === 'POST' && e.req.path === '/users');
    return [[p.length > 0, 'Gọi đúng endpoint đăng ký'], [p.some(e => e.res.status === 400), 'Đã thấy ít nhất một trường hợp API báo lỗi dữ liệu đúng'], [p.some(e => e.res.status === 500), 'Tìm ra trường hợp server bị lỗi']]; },
  answer:{ method:'POST', url:'/users', headers:'Content-Type: application/json', body:'{\n  "password": "Matkhau@123",\n  "full_name": "Test Thiếu Email"\n}' },
  hints:['Bắt đầu với một body đầy đủ, hợp lệ để chắc nhận 201. Sau đó bỏ từng trường một.','Bỏ hẳn trường (không gửi key) khác với gửi chuỗi rỗng <code>""</code>. Thử cả hai.','Bỏ hẳn key <code>email</code>.'],
  lessons:[
    { k:'Status 5xx', d:'Lỗi phía server. 500: lỗi không lường trước; 502/503/504: lỗi gateway, server quá tải, hết thời gian chờ. Dữ liệu sai của client không bao giờ được gây ra 5xx.', ex:'HTTP/1.1 500 Internal Server Error', n:'Mọi 5xx do input của người dùng đều là bug: server phải validate và trả 4xx.' },
    { k:'Thiếu trường, rỗng, null', d:'Ba trường hợp khác nhau, code xử lý khác nhau, nên test riêng từng cái.', ex:'{ }                       ← thiếu key\n{ "email": "" }           ← chuỗi rỗng\n{ "email": null }         ← null', n:'Lỗi hay gặp: code chỉ kiểm tra chuỗi rỗng, quên trường hợp không có key.' },
    { k:'Lộ thông tin nội bộ', d:'Thông báo lỗi chứa stack trace, tên file, câu SQL… giúp kẻ tấn công hiểu hệ thống.', ex:'"TypeError: Cannot read properties of undefined\n at UserService.register (user.service.js:42:31)"', n:'Đây là vấn đề bảo mật, nên ghi thành bug riêng.' },
  ],
  qc:`<p><b>2 bug:</b> (1) thiếu key <code>email</code> → 500 thay vì 400; (2) body lỗi lộ stack trace (tên file, số dòng). Gửi <code>"email": ""</code> thì lại trả 400 đúng: vì vậy phải test cả "thiếu key" lẫn "chuỗi rỗng".</p>` },

{ id:'B3', phase:'B', key:'Bài 7', type:'req', bug:true, name:'401 hay 403', skills:['401','403','xác thực'],
  title:'Gọi danh sách đơn khi chưa đăng nhập',
  context:`<p>Spec: mọi endpoint <code>/orders</code> cần token. Không có token hoặc token sai → <b>401 UNAUTHORIZED</b>. Có token hợp lệ nhưng không có quyền → <b>403 FORBIDDEN</b>.</p><p>App mobile tự đăng xuất người dùng khi nhận 401. Đội mobile báo: "token hết hạn mà app không đăng xuất".</p>`,
  task:`<p>Gọi <code>GET /orders</code> không có token, rồi với token sai. So status nhận được với spec.</p>`,
  expect:'Phát hiện status code trả về khi thiếu token không đúng spec.',
  grade: h => { const g = find(h, e => e.req.method === 'GET' && e.req.path === '/orders');
    return [[g.some(e => !hasAuth(e)), 'Đã gọi danh sách đơn khi không có token'], [g.some(e => !hasAuth(e) && e.res.status === 403), 'Phát hiện status code sai spec']]; },
  answer:{ method:'GET', url:'/orders', headers:'', body:'' },
  hints:['Để trống ô Headers.','So sánh với <code>GET /me</code> không có token: endpoint đó trả gì?','401 = "bạn là ai?"; 403 = "tôi biết bạn là ai, nhưng bạn không được phép".'],
  lessons:[
    { k:'401 và 403', d:'401 Unauthorized: chưa xác thực được (thiếu, sai, hết hạn token). 403 Forbidden: đã xác thực nhưng không có quyền.', ex:'Không token        → 401\nToken của An xem đơn của Bình → 403', n:'Nhầm 401/403 làm client xử lý sai: app chờ 401 để bắt đăng nhập lại, nhận 403 thì hiển thị "không có quyền" và người dùng bị kẹt.' },
    { k:'Nhất quán giữa các endpoint', d:'Cùng một tình huống thì mọi endpoint phải trả cùng status và cùng cấu trúc lỗi.', ex:'GET /me     (không token) → 401\nGET /orders (không token) → phải 401', n:'So sánh chéo các endpoint là cách nhanh để tìm lỗi không nhất quán.' },
  ],
  qc:`<p><b>Bug:</b> <code>/orders</code> trả 403 khi thiếu token, trong khi <code>/me</code> trả 401. Đây chính là nguyên nhân của bug mobile: app chỉ đăng xuất khi nhận 401. Một bug API gây ra bug ở client, tìm ra nhờ đọc spec status code.</p>` },

{ id:'B4', phase:'B', key:'Bài 8', type:'req', bug:true, name:'Phân quyền dữ liệu (IDOR)', skills:['IDOR','403','bảo mật'],
  title:'Xem được đơn hàng của người khác',
  context:`<p>Đơn <code>102</code> thuộc khách Bình (customer_id 2). Spec: khách chỉ xem được đơn của chính mình; đơn của người khác → <b>403</b>.</p>`,
  task:`<p>Đăng nhập bằng tài khoản <b>An</b> (customer_id 1). Gọi <code>GET /orders/101</code> (đơn của An) rồi <code>GET /orders/102</code> (đơn của Bình). So kết quả với spec.</p>`,
  expect:'Phát hiện tài khoản đang đăng nhập xem được dữ liệu không thuộc về mình.',
  grade: h => { const g = find(h, e => e.req.method === 'GET' && /^\/orders\/\d+$/.test(e.req.path) && e.res.status === 200);
    const tokUser = e => { const m = (e.req.headers['authorization'] || '').match(/Bearer\s+(.+)/i); const u = m && USERS.find(x => x.token === m[1].trim()); return u ? u.id : null; };
    return [[find(h, e => e.req.path === '/auth/login' && e.res.status === 200).length > 0 || g.some(hasAuth), 'Đã có token đăng nhập'], [g.some(e => e.res.body.customer_id === tokUser(e)), 'Đã xem đơn của chính mình (để so sánh)'], [g.some(e => tokUser(e) && e.res.body.customer_id !== tokUser(e)), 'Phát hiện xem được đơn của người khác']]; },
  answer:{ method:'GET', url:'/orders/102', headers:'Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.dWlkOjE.an_k7Qw2', body:'' },
  hints:['Token của An lấy từ bài 3.','Gửi <code>GET /orders/102</code> với token của An.','Xem trường <code>customer_id</code> trong phản hồi.'],
  lessons:[
    { k:'IDOR / BOLA', d:'Insecure Direct Object Reference (OWASP API Top 10 gọi là Broken Object Level Authorization): đổi id trong URL là truy cập được dữ liệu của người khác. Đây là lỗ hổng API phổ biến nhất.', ex:'GET /orders/101  (token An) → 200 ✓ của An\nGET /orders/102  (token An) → phải 403, thực tế 200 ✗', n:'Cách test: luôn chuẩn bị 2 tài khoản; dùng token tài khoản A gọi tài nguyên của tài khoản B, với mọi method (GET, PUT, DELETE).' },
  ],
  qc:`<p><b>Bug bảo mật, mức Critical:</b> bất kỳ ai đăng nhập cũng xem được đơn (địa chỉ, sản phẩm, số tiền) của người khác chỉ bằng cách đổi id. Id đơn lại là số tăng dần nên rất dễ dò.</p><p>Báo cáo kèm 2 request: đơn của mình (200, đúng) và đơn người khác (200, sai). Bug bảo mật nên báo qua kênh riêng, không đăng công khai.</p>` },

{ id:'B5', phase:'B', key:'Bài 9', type:'req', bug:true, name:'Idempotency-Key', skills:['idempotency','gửi lặp','retry'],
  title:'Mạng chập chờn, app gửi lại request tạo đơn',
  context:`<p>Khi mạng chập chờn, app gửi lại <code>POST /orders</code>. Spec: request có header <code>Idempotency-Key</code>; gửi lại với <b>cùng key</b> thì API <b>không tạo đơn mới</b> mà trả lại đơn đã tạo (status 200).</p>`,
  task:`<p>Gửi <code>POST /orders</code> hai lần liên tiếp với cùng body và cùng <code>Idempotency-Key</code> (tự đặt, vd <code>order-test-001</code>). So <code>id</code> của 2 phản hồi.</p>`,
  expect:'Phát hiện việc gửi lại request không được xử lý đúng spec.',
  grade: h => { const p = find(h, e => e.req.method === 'POST' && e.req.path === '/orders' && e.req.headers['idempotency-key'] && e.res.status === 201); const by = {};
    p.forEach(e => { const k = e.req.headers['idempotency-key']; (by[k] = by[k] || []).push(e.res.body.id); });
    const dup = Object.values(by).some(ids => new Set(ids).size > 1);
    return [[p.length > 0, 'Có request tạo đơn kèm header chống tạo trùng'], [Object.values(by).some(ids => ids.length > 1), 'Đã gửi lại cùng key ít nhất 2 lần'], [dup, 'Phát hiện cùng key tạo ra nhiều đơn']]; },
  answer:{ method:'POST', url:'/orders', headers:'Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.dWlkOjE.an_k7Qw2\nContent-Type: application/json\nIdempotency-Key: order-test-001', body:'{\n  "items": [ { "product_id": 6, "qty": 1 } ]\n}' },
  hints:['Thêm một dòng vào Headers: <code>Idempotency-Key: order-test-001</code>.','Bấm Gửi 2 lần, không sửa gì.','So <code>id</code> và <code>code</code> trong 2 phản hồi ở tab Lịch sử.'],
  lessons:[
    { k:'Idempotency', d:'Một thao tác idempotent: gọi 1 lần hay nhiều lần cho cùng kết quả. GET, PUT, DELETE vốn idempotent; POST thì không, nên cần Idempotency-Key để an toàn khi retry.', ex:'POST /orders  Idempotency-Key: abc → 201, id 104\nPOST /orders  Idempotency-Key: abc → 200, id 104 (không tạo mới)', n:'Liên hệ bài SQL "Self join": đơn trùng do double submit. Bug này chính là nguyên nhân ở tầng API.' },
  ],
  qc:`<p><b>Bug:</b> API bỏ qua <code>Idempotency-Key</code>, mỗi lần gửi lại tạo thêm một đơn. Khách bị trừ tiền nhiều lần nếu app retry sau khi thanh toán. Mức High.</p><p>Testcase nên có: cùng key 2 lần (không tạo mới); khác key (tạo mới); cùng key nhưng body khác (spec cần nói rõ, thường trả 422).</p>` },

{ id:'C1', phase:'C', key:'Bài 10', type:'script', name:'test() & expect()', skills:['assertion','status','body'],
  title:'Test tự động đầu tiên: GET /products/1',
  context:`<p>Bộ test tự động chạy trên build <b>v1.1</b> (đã sửa lỗi). Hệ thống chấm sẽ chạy bộ test của bạn trên v1.1 và trên 2 bản lỗi bí mật:</p><ul><li>Bản lỗi (a): API trả về sai sản phẩm.</li><li>Bản lỗi (b): phản hồi thiếu trường <code>name</code>.</li></ul>`,
  task:`<p>Viết ít nhất 3 test cho <code>GET /products/1</code>. Bộ test phải <b>pass hết trên v1.1</b> và <b>fail trên cả 2 bản lỗi</b>.</p>`,
  expect:'≥ 3 test; pass trên v1.1; mỗi bản lỗi làm ít nhất 1 test fail.',
  minTests:3, mutants:[['wrongId', 'API trả về sai sản phẩm'], ['missingName', 'Thiếu trường name']],
  starter:`// Bài 10: viết test cho GET /products/1
const res = await api.get('/products/1');

test('Status là 200', () => {
  expect(res.status).toBe(200);
});

// Viết thêm test: đúng id? có name? price là số?
`,
  answer:`const res = await api.get('/products/1');

test('Status là 200', () => {
  expect(res.status).toBe(200);
});

test('Trả đúng sản phẩm id 1', () => {
  expect(res.body.id).toBe(1);
  expect(res.body.sku).toBe('TS-001');
});

test('Có name là chuỗi không rỗng', () => {
  expect(res.body).toHaveProperty('name');
  expect(typeof res.body.name).toBe('string');
  expect(res.body.name.length).toBeGreaterThan(0);
});

test('price là số dương', () => {
  expect(typeof res.body.price).toBe('number');
  expect(res.body.price).toBeGreaterThan(0);
});`,
  hints:['Mỗi <code>test()</code> kiểm tra một ý. Dữ liệu phản hồi nằm trong <code>res.body</code>.','Bắt lỗi (a): <code>expect(res.body.id).toBe(1)</code>.','Bắt lỗi (b): <code>expect(res.body).toHaveProperty(\'name\')</code>.'],
  lessons:[
    { k:'api.get / api.post', d:'Gửi request trong test script. Kết quả có res.status, res.headers (tên header viết thường), res.body (JSON đã parse), res.time (ms).', ex:"const res = await api.get('/products/1');\nconst r2 = await api.post('/orders', { items: [...] }, { headers: { Authorization: 'Bearer ' + token } });", n:'Nhớ <code>await</code> trước api.get / api.post.' },
    { k:'test() và expect()', d:'test(tên, hàm) là một test case. expect(giá trị_thực_tế) rồi gọi matcher để so với mong đợi. Một expect sai thì test đó fail.', ex:"test('Status là 200', () => {\n  expect(res.status).toBe(200);\n});", n:'Matcher có sẵn: toBe, toEqual, toBeGreaterThan, toBeLessThan, toContain, toHaveProperty, toMatch, toBeDefined, toBeTruthy; thêm .not để phủ định: expect(x).not.toBe(0).' },
    { k:'Test phải "bắt được lỗi"', d:'Một bộ test chỉ có giá trị khi nó fail lúc API sai. Chấm bài ở đây dùng bản lỗi cố ý (giống mutation testing) để đo điều đó.', ex:'Chỉ kiểm tra status 200 → bản lỗi (a) vẫn pass → test chưa đủ.', n:'Test luôn pass dù API sai còn nguy hiểm hơn không có test: nó tạo cảm giác an toàn giả.' },
  ],
  qc:`<p>Chỉ kiểm tra <code>status 200</code> là lỗi phổ biến của test API tự động: API trả sai sản phẩm vẫn là 200. Mỗi test nên trả lời được câu hỏi "nếu API sai kiểu X, test nào sẽ fail?".</p>` },

{ id:'C2', phase:'C', key:'Bài 11', type:'script', name:'Kiểm tra schema', skills:['schema','kiểu dữ liệu','vòng lặp'],
  title:'Mọi sản phẩm trong danh sách đúng kiểu dữ liệu',
  context:`<p>App mobile bị crash khi <code>price</code> là chuỗi. Team muốn test schema cho <code>GET /products</code>. Hệ thống chấm dùng 3 bản lỗi bí mật:</p><ul><li>(a) <code>price</code> trả về dạng chuỗi "149000".</li><li>(b) một sản phẩm có <code>stock</code> âm.</li><li>(c) một sản phẩm thiếu <code>name</code>.</li></ul>`,
  task:`<p>Viết test kiểm tra <b>mọi phần tử</b> trong <code>res.body.data</code>: <code>id</code> là số nguyên, <code>name</code> là chuỗi không rỗng, <code>price</code> là số &gt; 0, <code>stock</code> là số nguyên ≥ 0.</p>`,
  expect:'Pass trên v1.1; bắt được cả 3 bản lỗi.',
  minTests:2, mutants:[['priceString', 'price là chuỗi'], ['negativeStock', 'stock âm'], ['missingName', 'Thiếu name']],
  starter:`// Bài 11: kiểm tra schema mọi sản phẩm
const res = await api.get('/products');

test('Status 200 và có mảng data', () => {
  expect(res.status).toBe(200);
  expect(Array.isArray(res.body.data)).toBe(true);
});

test('Mọi sản phẩm đúng kiểu dữ liệu', () => {
  for (const p of res.body.data) {
    // viết expect cho id, name, price, stock của từng p
  }
});
`,
  answer:`const res = await api.get('/products');

test('Status 200 và có mảng data', () => {
  expect(res.status).toBe(200);
  expect(Array.isArray(res.body.data)).toBe(true);
  expect(res.body.data.length).toBeGreaterThan(0);
});

test('Mọi sản phẩm đúng kiểu dữ liệu', () => {
  for (const p of res.body.data) {
    expect(Number.isInteger(p.id)).toBe(true);
    expect(typeof p.name).toBe('string');
    expect(p.name.length).toBeGreaterThan(0);
    expect(typeof p.price).toBe('number');
    expect(p.price).toBeGreaterThan(0);
    expect(Number.isInteger(p.stock)).toBe(true);
    expect(p.stock).toBeGreaterThanOrEqual(0);
  }
});`,
  hints:['Kiểm tra kiểu: <code>expect(typeof p.price).toBe(\'number\')</code>.','Số nguyên: <code>expect(Number.isInteger(p.stock)).toBe(true)</code>.','Lỗi (c) làm <code>p.name</code> là undefined: kiểm tra <code>typeof p.name</code> là <code>\'string\'</code>.'],
  lessons:[
    { k:'Schema validation', d:'Kiểm tra cấu trúc phản hồi: có đủ trường, đúng kiểu, đúng ràng buộc giá trị. Lỗi schema thường làm client crash dù status vẫn 200.', ex:"expect(typeof p.price).toBe('number');\nexpect(Number.isInteger(p.stock)).toBe(true);", n:'Trong dự án thật thường dùng JSON Schema (Postman: pm.response.to.have.jsonSchema, hoặc thư viện ajv) thay vì viết tay từng expect.' },
    { k:'Kiểm tra mọi phần tử', d:'Dùng vòng lặp để kiểm tra mọi phần tử của mảng, không chỉ phần tử đầu tiên.', ex:'for (const p of res.body.data) {\n  expect(p.price).toBeGreaterThan(0);\n}', n:'Bản lỗi (b) chỉ sai ở sản phẩm id 4: test chỉ kiểm tra data[0] sẽ không bắt được.' },
  ],
  qc:`<p>Lỗi kiểu dữ liệu (số thành chuỗi) hay xuất hiện sau khi đổi thư viện serialize hoặc đổi kiểu cột DB. Đặt test schema vào CI để bắt ngay khi build, trước khi tới tay QC.</p>` },

{ id:'C3', phase:'C', key:'Bài 12', type:'script', name:'Header & thời gian phản hồi', skills:['Content-Type','response time','phi chức năng'],
  title:'Kiểm tra header và hiệu năng cơ bản',
  context:`<p>Yêu cầu phi chức năng: <code>GET /products</code> phản hồi <b>dưới 500 ms</b>, và luôn trả <code>Content-Type: application/json</code>. Hai bản lỗi bí mật:</p><ul><li>(a) phản hồi chậm hơn 700 ms.</li><li>(b) Content-Type là <code>text/html</code>.</li></ul>`,
  task:`<p>Viết test kiểm tra <code>res.time</code> và header <code>content-type</code> (tên header viết thường trong <code>res.headers</code>).</p>`,
  expect:'Pass trên v1.1; bắt được cả 2 bản lỗi.',
  minTests:2, mutants:[['slow', 'Phản hồi chậm (> 700 ms)'], ['htmlType', 'Content-Type là text/html']],
  starter:`// Bài 12: header và thời gian phản hồi
const res = await api.get('/products');

test('Phản hồi dưới 500 ms', () => {
  // res.time là số mili giây
});

test('Content-Type là JSON', () => {
  // res.headers['content-type']
});
`,
  answer:`const res = await api.get('/products');

test('Phản hồi dưới 500 ms', () => {
  expect(res.time).toBeLessThan(500);
});

test('Content-Type là JSON', () => {
  expect(res.headers['content-type']).toContain('application/json');
});`,
  hints:['<code>expect(res.time).toBeLessThan(500)</code>.','Header có thể kèm charset: <code>application/json; charset=utf-8</code>, nên dùng <code>toContain</code> thay vì <code>toBe</code>.','<code>expect(res.headers[\'content-type\']).toContain(\'application/json\')</code>'],
  lessons:[
    { k:'Response headers', d:'Thông tin kèm phản hồi: Content-Type, Location, Cache-Control, các header bảo mật… Tên header không phân biệt hoa thường.', ex:"res.headers['content-type']  // 'application/json; charset=utf-8'\nres.headers['location']      // '/v1/orders/104'", n:'Header bảo mật nên kiểm tra thêm: Strict-Transport-Security, X-Content-Type-Options.' },
    { k:'Thời gian phản hồi', d:'Test chức năng có thể kèm ngưỡng thời gian đơn giản để phát hiện sớm vấn đề hiệu năng. Đây không thay cho kiểm thử tải (load test).', ex:'expect(res.time).toBeLessThan(500);', n:'Ngưỡng nên rộng hơn mục tiêu thực một chút để test không fail ngẫu nhiên do mạng (flaky test).' },
  ],
  qc:`<p>Đây là kiểm thử phi chức năng ở mức đơn giản (ISTQB chương 2). Content-Type sai khiến client không parse được JSON; lỗi này hay xuất hiện khi server trả trang lỗi HTML của proxy hoặc load balancer.</p>` },

{ id:'C4', phase:'C', key:'Bài 13', type:'script', name:'Chuỗi request (chaining)', skills:['chaining','biến','end-to-end'],
  title:'Đăng nhập → tạo đơn → đọc lại đơn',
  context:`<p>Luồng end-to-end qua API: đăng nhập, tạo đơn 2 "Mũ lưỡi trai" (product_id 6, 99.000đ), rồi đọc lại đơn vừa tạo. Hai bản lỗi bí mật ở bước đọc lại:</p><ul><li>(a) <code>total_amount</code> đọc lại bị sai.</li><li>(b) <code>status</code> đọc lại là <code>paid</code> dù chưa thanh toán.</li></ul>`,
  task:`<p>Viết script lấy token từ phản hồi login, dùng token tạo đơn, lấy <code>id</code> đơn mới, rồi <code>GET /orders/{id}</code> và kiểm tra dữ liệu đọc lại khớp với dữ liệu lúc tạo.</p>`,
  expect:'Pass trên v1.1; bắt được cả 2 bản lỗi.',
  minTests:2, mutants:[['wrongTotal', 'total_amount đọc lại sai'], ['statusPaid', 'status đọc lại sai']],
  starter:`// Bài 13: chuỗi request
const login = await api.post('/auth/login', { email: 'an.nguyen@shopdemo.test', password: 'Test@1234' });
const token = login.body.access_token;
const auth = { headers: { Authorization: 'Bearer ' + token } };

const created = await api.post('/orders', { items: [ { product_id: 6, qty: 2 } ] }, auth);

// Đọc lại đơn vừa tạo bằng created.body.id, rồi viết test
`,
  answer:`const login = await api.post('/auth/login', { email: 'an.nguyen@shopdemo.test', password: 'Test@1234' });
const token = login.body.access_token;
const auth = { headers: { Authorization: 'Bearer ' + token } };

const created = await api.post('/orders', { items: [ { product_id: 6, qty: 2 } ] }, auth);
const fetched = await api.get('/orders/' + created.body.id, auth);

test('Tạo đơn trả 201', () => {
  expect(created.status).toBe(201);
  expect(created.body.total_amount).toBe(198000);
});

test('Đọc lại đúng tổng tiền và trạng thái', () => {
  expect(fetched.status).toBe(200);
  expect(fetched.body.total_amount).toBe(198000);
  expect(fetched.body.status).toBe('pending_payment');
});`,
  hints:['<code>const fetched = await api.get(\'/orders/\' + created.body.id, auth);</code>','Tổng tiền mong đợi: 2 × 99.000 = 198.000.','Kiểm tra <code>fetched.body.status</code> là <code>\'pending_payment\'</code>.'],
  lessons:[
    { k:'Chaining', d:'Dùng dữ liệu của phản hồi trước (token, id) làm đầu vào cho request sau. Postman làm bằng biến môi trường (pm.environment.set), code thì dùng biến thường.', ex:"const token = login.body.access_token;\nconst id = created.body.id;\nawait api.get('/orders/' + id, auth);", n:'Không chép cứng token hay id vào test: token hết hạn, id thay đổi theo môi trường làm test fail ngẫu nhiên.' },
    { k:'Đọc lại sau khi ghi', d:'Sau POST/PUT, gọi GET để xác nhận dữ liệu thật sự được lưu đúng, không chỉ được trả về đúng.', ex:'POST trả total 198000 ✓\nGET đọc lại total 99000 ✗ → lỗi lưu hoặc lỗi đọc', n:'Có thể kiểm tra thêm ở tầng DB bằng SQL (bài luyện SQL).' },
  ],
  qc:`<p>Lỗi chỉ lộ ra ở bước đọc lại rất khó thấy nếu chỉ test từng endpoint riêng lẻ. Test chuỗi bắt được lỗi ở chỗ nối giữa các bước, đúng loại lỗi người dùng thật gặp.</p>` },

{ id:'D1', phase:'D', key:'Bài 14', type:'script', regression:true, name:'Regression cho bug đã sửa', skills:['regression','negative test','tổng hợp'],
  title:'Tự động hóa 3 bug đã tìm ở phần B',
  context:`<p>Dev đã sửa 3 bug ở build v1.1: <b>qty = 0 được chấp nhận</b> (bài 5), <b>thiếu token trả 403</b> (bài 7), <b>xem được đơn người khác</b> (bài 8). Bạn cần bộ regression để các bug này không quay lại.</p><p>Hệ thống chấm chạy bộ test trên v1.1 và trên 3 build, mỗi build chứa lại đúng một bug cũ.</p>`,

  answer:`public class ProductApiTest extends BaseApiTest {

    @Test
    public void getProductById_returnsProduct() {
        given()
            .baseUri(BASE_URL)
        .when()
            .get("/products/1")
        .then()
            .statusCode(200)
            .contentType(ContentType.JSON)
            .body("id", equalTo(1))
            .body("sku", equalTo("TS-001"))
            .body("name", notNullValue())
            .body("price", greaterThan(0));
    }

    @Test
    public void getProductById_matchesSchema() {
        given()
            .baseUri(BASE_URL)
        .when()
            .get("/products/1")
        .then()
            .statusCode(200)
            .body(matchesJsonSchemaInClasspath("schemas/product.json"));
    }
}`,
  hints:['Mỗi kiểm tra là một lời gọi sau <code>.then()</code>: <code>.body("sku", equalTo("TS-001"))</code>.','<code>greaterThan(0)</code> chỉ đúng khi giá trị là số: bản lỗi (c) trả chuỗi "149000" nên assertion fail.','Test schema: <code>.then().statusCode(200).body(matchesJsonSchemaInClasspath("schemas/product.json"));</code>'],
  lessons:[
    { k:'given / when / then', d:'given(): chuẩn bị request (header, body, query). when(): gửi request (get, post, put, patch, delete). then(): kiểm tra phản hồi. Mỗi assertion fail sẽ dừng method @Test đó, giống JUnit/TestNG.', ex:'given()\n    .baseUri(BASE_URL)\n    .header("Authorization", "Bearer " + token)\n    .queryParam("category", "ao")\n.when()\n    .get("/products")\n.then()\n    .statusCode(200)\n    .body("data.size()", greaterThan(0));', n:'Postman → REST Assured: pm.response.to.have.status(200) ↔ .statusCode(200); pm.expect(json.id).to.eql(1) ↔ .body("id", equalTo(1)).' },
    { k:'Hamcrest matcher & GPath', d:'body("đường dẫn", matcher): đường dẫn kiểu GPath. "data.price" lấy price của mọi phần tử trong data; "data[0].name" lấy phần tử đầu; "data.size()" đếm phần tử.', ex:'.body("data.price", everyItem(greaterThan(0)))\n.body("data[0].name", notNullValue())\n.body("error.code", equalTo("PRODUCT_NOT_FOUND"))', n:'Trang hỗ trợ: equalTo, is, not, notNullValue, nullValue, greaterThan, greaterThanOrEqualTo, lessThan, lessThanOrEqualTo, hasSize, hasItem, hasItems, hasKey, containsString, everyItem, matchesJsonSchemaInClasspath; cùng header(), contentType(), time(), extract().path(), extract().as().' },
    { k:'JSON Schema', d:'File schema mô tả kiểu và ràng buộc của từng trường. Một assertion schema thay cho hàng chục assertion kiểu dữ liệu viết tay.', ex:'// schemas/product.json (có sẵn trên trang)\n{\n  "type": "object",\n  "required": ["id","sku","name","category","price","stock"],\n  "properties": {\n    "id":    { "type": "integer" },\n    "name":  { "type": "string", "minLength": 1 },\n    "price": { "type": "number", "exclusiveMinimum": 0 },\n    "stock": { "type": "integer", "minimum": 0 }\n  }\n}', n:'Schema có sẵn: schemas/product.json, schemas/product-list.json, schemas/order.json. Trong project thật, đặt file trong src/test/resources/schemas và thêm thư viện json-schema-validator.' },
  ],
  qc:`<p>So với test Postman ở bài 10–11, test REST Assured nằm cùng project với test UI: dùng chung config môi trường, chạy bằng <code>mvn test</code> và cùng một pipeline CI. Đây là bài nộp chính của buổi 12 (package <code>api</code>, ít nhất 5 test).</p><p>Bản lỗi (c) cho thấy giá trị của kiểm tra kiểu: status vẫn 200, <code>notNullValue()</code> vẫn đúng, chỉ <code>greaterThan(0)</code> hoặc schema mới bắt được.</p>` },

const KW = new Set('const let var await async function return for of in if else new true false null undefined typeof test expect api request pm'.split(' '));
const JAVA_KW = new Set('public private protected class void static final new return import extends implements int long double boolean String var true false null given when then and extract try'.split(' '));
function highlight(src, kw){
  kw = kw || KW;
  let out = '', i = 0; const n = src.length;
  const span = (c, s) => '<span class="hl-' + c + '">' + esc(s) + '</span>';
  while (i < n){
    const c = src[i];
    if (c === '/' && src[i+1] === '/'){ let j = src.indexOf('\n', i); if (j < 0) j = n; out += span('c', src.slice(i, j)); i = j; continue; }
    if (c === "'" || c === '"'){ let j = i + 1; while (j < n && src[j] !== c && src[j] !== '\n'){ if (src[j] === '\\') j++; j++; } out += span('s', src.slice(i, Math.min(j+1, n))); i = j + 1; continue; }
    if (/[0-9]/.test(c) && !/[A-Za-z_$]/.test(src[i-1] || '')){ let j = i; while (j < n && /[0-9._]/.test(src[j])) j++; out += span('n', src.slice(i, j)); i = j; continue; }
    if (/[A-Za-z_$]/.test(c)){ let j = i; while (j < n && /[A-Za-z0-9_$]/.test(src[j])) j++; const w = src.slice(i, j); out += kw.has(w) ? span('k', w) : esc(w); i = j; continue; }
    out += esc(c); i++;
  }
  return out + '\n';
}

function readForm(){ S.forms[cur().id] = { method: $('rqMethod').value, url: $('rqUrl').value, headers: $('rqHeaders').value, body: $('rqBody').value }; save(); }

/* ===================== Gửi request ===================== */
const stCls = s => s < 300 ? 's2' : s < 500 ? 's4' : 's5';
const STATUS_TEXT = { 200:'OK', 201:'Created', 400:'Bad Request', 401:'Unauthorized', 403:'Forbidden', 404:'Not Found', 405:'Method Not Allowed', 409:'Conflict', 422:'Unprocessable Entity', 500:'Internal Server Error' };
async function send(){
  readForm();
  const f = formOf(cur().id), u = parseUrl(f.url);
  if (!f.url.trim()){ $('out-resp').innerHTML = '<p class="msg err">Chưa nhập URL. Ví dụ: /products</p>'; showTab('resp'); return; }
  const req = { method: f.method, path: u.path, query: u.query, headers: parseHeaders(f.headers), bodyText: f.method === 'GET' ? '' : f.body };
  let server = staging;
  if (cur().type === 'db'){
    try { server = (await ensureDbLab()).server; }
    catch(e){ $('out-resp').innerHTML = '<p class="msg err">Chưa tải được SQLite (sql.js) nên chưa gửi được request ở bài này. Kiểm tra kết nối mạng rồi bấm Gửi lại.</p>'; showTab('resp'); return; }
  }
  $('sendBtn').disabled = true;
  const res = await server(req);
  await new Promise(r => setTimeout(r, Math.min(res.time, 250)));
  $('sendBtn').disabled = false;
  const t = cur(); (S.hist[t.id] = S.hist[t.id] || []).push({ req, res, url: f.url, at: Date.now() });
  if (S.hist[t.id].length > 60) S.hist[t.id] = S.hist[t.id].slice(-60);
  save(); showResp(req, res); renderHist();
}
function showResp(req, res){
  const hdr = Object.entries(res.headers).map(([k, v]) => k + ': ' + v).join('\n');
  $('out-resp').innerHTML = '<div class="status"><span class="m ' + req.method + '">' + req.method + '</span><span style="font-family:var(--f-mono)">' + esc(req.path + (Object.keys(req.query).length ? '?' + Object.entries(req.query).map(([k, v]) => k + '=' + v).join('&') : '')) + '</span><span class="st ' + stCls(res.status) + '">' + res.status + ' ' + (STATUS_TEXT[res.status] || '') + '</span><span class="msg" style="margin:0">' + res.time + ' ms</span></div>' +
    '<div class="kw-label">Headers</div><pre class="hdrs">' + esc(hdr) + '</pre><div class="kw-label">Body</div><pre class="json">' + jsonHL(res.body) + '</pre>';
  showTab('resp');

/* ===================== Chạy test script ===================== */
function deepEq(a, b){ return JSON.stringify(a) === JSON.stringify(b); }
const show = v => { try { const s = JSON.stringify(v); return s === undefined ? String(v) : s; } catch(e){ return String(v); } };
const short = (s, n) => (s = String(s), s.length > (n || 80) ? s.slice(0, (n || 80) - 1) + '…' : s);
/* rec (tùy chọn): ghi nhận từng assertion thay vì dừng ở assertion sai đầu tiên, giống báo cáo của Newman. */
function makeExpect(rec){
  return function expect(actual){
    const mk = neg => {
      const chk = (ok, msg, m, e) => {
        const pass = neg ? !ok : !!ok, text = (neg ? 'Không mong đợi: ' : '') + msg;
        if (rec){ rec({ ok: pass, msg: text, m, e, a: actual, neg }); return; }
        if (!pass) throw new Error(text);
      };
      return {
        toBe: e => chk(Object.is(actual, e), 'mong đợi ' + show(e) + ', thực tế ' + show(actual), 'toBe', e),
        toEqual: e => chk(deepEq(actual, e), 'mong đợi ' + show(e) + ', thực tế ' + show(actual), 'toEqual', e),
        toBeGreaterThan: e => chk(actual > e, 'mong đợi > ' + show(e) + ', thực tế ' + show(actual), 'toBeGreaterThan', e),
        toBeGreaterThanOrEqual: e => chk(actual >= e, 'mong đợi ≥ ' + show(e) + ', thực tế ' + show(actual), 'toBeGreaterThanOrEqual', e),
        toBeLessThan: e => chk(actual < e, 'mong đợi < ' + show(e) + ', thực tế ' + show(actual), 'toBeLessThan', e),
        toBeLessThanOrEqual: e => chk(actual <= e, 'mong đợi ≤ ' + show(e) + ', thực tế ' + show(actual), 'toBeLessThanOrEqual', e),
        toContain: e => chk(actual != null && actual.includes && actual.includes(e), 'mong đợi chứa ' + show(e) + ', thực tế ' + show(actual), 'toContain', e),
        toHaveProperty: k => chk(actual != null && typeof actual === 'object' && k in actual, 'mong đợi có trường "' + k + '", thực tế ' + show(actual), 'toHaveProperty', k),
        toMatch: re => chk(typeof actual === 'string' && new RegExp(re).test(actual), 'mong đợi khớp ' + re + ', thực tế ' + show(actual), 'toMatch', String(re)),
        toBeDefined: () => chk(actual !== undefined, 'mong đợi có giá trị, thực tế undefined', 'toBeDefined'),
        toBeTruthy: () => chk(!!actual, 'mong đợi giá trị đúng, thực tế ' + show(actual), 'toBeTruthy'),
        toBeFalsy: () => chk(!actual, 'mong đợi giá trị sai, thực tế ' + show(actual), 'toBeFalsy'),
      };
    };
    const m = mk(false); m.not = mk(true); return m;
  };
}

/* ===================== Collection kiểu Postman, chạy như Newman ===================== */
function parseEnv(text){
  const env = {};
  String(text || '').split('\n').forEach(l => { const m = l.match(/^\s*([A-Za-z_][\w.-]*)\s*[=:]\s*(.*?)\s*$/); if (m) env[m[1]] = m[2]; });

}
const subst = (v, env) => typeof v === 'string' ? v.replace(/\{\{\s*([\w.-]+)\s*\}\}/g, (m, k) => (k in env && env[k] !== '') ? env[k] : m)

async function runCollection(code, envText, bugs){
  const server = makeServer(bugs), env = parseEnv(envText), reqs = [];
  const request = (name, spec) => { reqs.push({ name: String(name), spec: spec || {} }); };
  const pm = { environment: { get: k => env[k], set: (k, v) => { env[k] = v == null ? '' : String(v); }, unset: k => { delete env[k]; } } };
  let sink = null;
  const expect = makeExpect(a => { if (sink) sink.push(a); });
  const AsyncFn = Object.getPrototypeOf(async function(){}).constructor;
  let error = null;
  try { await new AsyncFn('request', 'pm', 'expect', code)(request, pm, expect); } catch(e){ error = e.message; }
  const runs = [];
  for (const r of reqs){
    const sp = r.spec, method = String(sp.method || 'GET').toUpperCase(), rawUrl = String(sp.url || '');
    const url = subst(rawUrl, env), headers = {};
    Object.entries(subst(sp.headers || {}, env)).forEach(([k, v]) => { headers[k.toLowerCase()] = String(v); });
    let bodyText = '';
    if (sp.body !== undefined && sp.body !== null){ bodyText = typeof sp.body === 'string' ? subst(sp.body, env) : JSON.stringify(subst(sp.body, env)); if (!headers['content-type']) headers['content-type'] = 'application/json'; }
    const unresolved = uniq((url + ' ' + Object.values(headers).join(' ') + ' ' + bodyText).match(/\{\{[^}]+\}\}/g) || []);
    const u = parseUrl(url);
    const res = await server({ method, path: u.path, query: u.query, headers, bodyText: method === 'GET' ? '' : bodyText });
    const asserts = []; let terr = null;
    sink = asserts;
    if (typeof sp.tests === 'function'){ try { await sp.tests({ status: res.status, headers: res.headers, body: res.body, time: res.time }, pm); } catch(e){ terr = e.message; } }
    sink = null;
    runs.push({ name: r.name, method, rawUrl, url, rawHeaders: sp.headers || {}, unresolved, res, asserts, terr });
