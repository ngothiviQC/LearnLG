<style>
/* Cùng bố cục với trang Luyện Selenium + TestNG: danh sách bài bên trái, đề bài ở giữa, khu làm bài bên phải.
   Thêm: Locator Lab mobile (page source UiAutomator2 + màn hình điện thoại mô phỏng), chấm code TypeScript / JavaScript. */
:root{
  --bg:#f3f7f6; --surface:#ffffff; --sunken:#e7efed; --ink:#14201e; --muted:#566663; --line:#d6e2df;
  --accent:#00796b; --accent-ink:#ffffff; --accent-soft:#dff2ef;
  --pass:#1d7a46; --pass-soft:#e1f3e7; --fail:#b3261e; --fail-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fbf0d6;
  --code-bg:#f8fbfa; --kw:#7b1fa2; --str:#9a4b00; --num:#1f5fae; --cmt:#7d8a87; --ann:#00796b;
  --f-display:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#161e1d; --sunken:#0b100f; --ink:#e4eeec; --muted:#93a6a2; --line:#283432;
  --accent:#4db6ac; --accent-ink:#06201d; --accent-soft:#16312e;
  --pass:#5fd08e; --pass-soft:#163322; --fail:#ff8a80; --fail-soft:#3a1a18; --warn:#f0c35a; --warn-soft:#352a12;
  --code-bg:#121918; --kw:#ce93d8; --str:#f0b070; --num:#8db8f2; --cmt:#73827f; --ann:#4db6ac; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#161e1d; --sunken:#0b100f; --ink:#e4eeec; --muted:#93a6a2; --line:#283432;
  --accent:#4db6ac; --accent-ink:#06201d; --accent-soft:#16312e;
  --pass:#5fd08e; --pass-soft:#163322; --fail:#ff8a80; --fail-soft:#3a1a18; --warn:#f0c35a; --warn-soft:#352a12;
  --code-bg:#121918; --kw:#ce93d8; --str:#f0b070; --num:#8db8f2; --cmt:#73827f; --ann:#4db6ac; color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;display:flex;flex-direction:column}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
code,pre,textarea,input,select{font-family:var(--f-mono)}
code{font-size:.9em;background:var(--sunken);padding:1px 5px;border-radius:4px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.bar{width:120px;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:4px 8px;font-size:12px}

.app{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1.25fr)}
.pane{min-height:0;overflow:auto}
.queue{border-right:1px solid var(--line);background:var(--surface);padding:12px 10px 24px}
.phase{margin-bottom:14px}
.phase h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 8px 6px;display:flex;justify-content:space-between;gap:6px}
.phase h2 span{font-family:var(--f-mono);letter-spacing:0}
.qitem{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:6px}
.qitem:hover{background:var(--sunken)}
.qitem[aria-current="true"]{background:var(--accent-soft)}
.qitem .dot{width:14px;height:14px;margin-top:3px;border-radius:50%;border:1.5px solid var(--line)}
.qitem.done .dot{background:var(--pass);border-color:var(--pass)}
.qitem .k{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-weight:500;display:block}
.qitem .t{font-size:12.5px;line-height:1.35;display:block;color:var(--ink)}

.ticket{padding:20px 24px 40px;border-right:1px solid var(--line)}
.tk-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.tk-key{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--pass-soft);color:var(--pass)}
.chip.cp{background:var(--warn-soft);color:var(--warn)}
.ticket h2.title{font-size:21px;font-weight:700;line-height:1.3;margin-bottom:10px}
.field{margin-bottom:18px;max-width:72ch}
.field h3{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field p,.field ul,.field ol{margin:0 0 8px}
.field ul,.field ol{padding-left:20px}
.field li{margin-bottom:3px}
.expect{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.lesson{display:flex;flex-direction:column;gap:8px}
.kw{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.kw summary{cursor:pointer;padding:8px 12px;font-weight:600}
.kw-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.kw-body p{margin:0}
.kw-body ul{margin:0;padding-left:20px}
.tbl{border-collapse:collapse;font-size:13px;width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--sunken);font-weight:600}
pre.syn{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;font-size:12.5px;line-height:1.55;white-space:pre}
.hl-k{color:var(--kw);font-weight:500}.hl-s{color:var(--str)}.hl-n{color:var(--num)}.hl-c{color:var(--cmt);font-style:italic}.hl-a{color:var(--ann)}
.hl-t{color:var(--kw)}.hl-at{color:var(--num)}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:13.5px}
.hint b{color:var(--warn);font-weight:600;margin-right:4px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:13px}
.linkbtn:disabled{color:var(--muted);cursor:default}
.donebox{border-radius:8px;padding:10px 14px;background:var(--pass-soft);color:var(--pass);font-weight:600;max-width:72ch;margin-bottom:16px}

.work{display:flex;flex-direction:column;min-height:0;overflow:auto;background:var(--surface)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.toolbar .ttl{font-weight:600;font-size:13px;margin-right:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;font-weight:500;font-size:13px}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:default}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.locrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:6px;align-items:center;font-family:var(--f-mono);font-size:13px}
.locrow select,.locrow input{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:13px;padding:6px 8px;min-width:0}
.locrow .pre{color:var(--muted);white-space:nowrap}
.locrow input{width:100%}
.editor{display:block;width:100%;min-height:340px;resize:vertical;border:0;border-bottom:1px solid var(--line);background:var(--code-bg);color:var(--ink);font-size:13px;line-height:1.6;padding:12px 14px;tab-size:4;white-space:pre;overflow:auto}
.editor:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.res{display:flex;flex-direction:column;gap:6px}
.chk{display:grid;grid-template-columns:20px 1fr;gap:6px;font-size:13.5px;align-items:start}
.chk .ic{font-weight:700;text-align:center}
.chk.ok .ic{color:var(--pass)}.chk.no .ic{color:var(--fail)}
.chk .why{display:block;color:var(--muted);font-size:12.5px}
.verdict{border-radius:8px;padding:8px 12px;font-weight:600;margin-bottom:4px}
.verdict.ok{background:var(--pass-soft);color:var(--pass)}
.verdict.no{background:var(--fail-soft);color:var(--fail)}
.msg{color:var(--muted);font-size:13px;margin:0}
.found{font-family:var(--f-mono);font-size:12.5px;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}

/* Trình duyệt mô phỏng */
.browser{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.bbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--sunken);border-bottom:1px solid var(--line)}
.bbar i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.bbar .url{flex:1;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface);border-radius:5px;padding:2px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.vtabs{display:flex;gap:2px;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--bg);width:max-content;margin-bottom:8px}
.vtabs button{border:0;background:transparent;border-radius:5px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.vtabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
pre.insp{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;font-size:12px;line-height:1.55;max-height:460px;white-space:pre}
pre.insp .hit{background:rgba(255,193,7,.35);outline:1px solid #f0a500;border-radius:2px}

.quiz{display:flex;flex-direction:column;gap:14px}
.qq{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.qq p.q{margin:0 0 8px;font-weight:600}
.opt{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px}
.opt:hover{background:var(--sunken)}
.opt input{margin-top:4px}
.opt.right{background:var(--pass-soft)}
.opt.wrong{background:var(--fail-soft)}
.expl{font-size:13px;color:var(--muted);margin:6px 0 0;padding-left:10px;border-left:3px solid var(--line)}
.rv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
.rv .seg{display:flex;gap:2px;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--bg)}
.rv .seg button{border:0;background:transparent;border-radius:5px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.rv .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rv.right{border-color:var(--pass);background:var(--pass-soft)}
.rv.wrong{border-color:var(--fail);background:var(--fail-soft)}
.rv .ex{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.selfck{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;cursor:pointer}
.selfck input{margin-top:4px}

@media (max-width:1100px){ .app{grid-template-columns:220px minmax(0,1fr);align-items:start;overflow:auto} .pane,.work{overflow:visible;min-height:auto} .work{grid-column:1/-1;border-top:1px solid var(--line)} .ticket{border-right:0} }
@media (max-width:720px){ .app{grid-template-columns:1fr} .queue{border-right:0;border-bottom:1px solid var(--line)} .ticket{border-right:0} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Màn hình điện thoại mô phỏng (Locator Lab mobile) */
.phone{width:290px;max-width:100%;margin:0 auto;border:10px solid #1d2422;border-radius:28px;background:#f6f8f7;color:#1b1b1b;overflow:hidden;font-family:var(--f-body)}
.phone .sb{height:20px;background:#e3e8e6;font-size:10px;color:#566663;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.ph-box{display:flex;flex-direction:column;gap:7px;padding:8px}
.ph-row{display:flex;align-items:center;gap:8px;padding:4px 2px 8px;border-bottom:1px solid #dde3e1}
.ph-row .ph-title{margin-right:auto}
.ph-card{border:1px solid #dde3e1;border-radius:8px;padding:8px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;background:#fff}
.ph-card .ph-btn{grid-column:2;grid-row:1/3;font-size:11px;padding:6px 8px}
.ph-text{font-size:13px}
.ph-title{font-size:16px;font-weight:700}
.ph-err{color:#b3261e;font-size:12.5px}
.ph-badge{background:#b3261e;color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
.ph-input{border:1px solid #b9c4c1;border-radius:6px;padding:8px;color:#3b4644;font-size:13px;background:#fff}
.ph-btn{background:#00796b;color:#fff;border-radius:6px;padding:8px;text-align:center;font-weight:600;font-size:12.5px}
.ph-icon{font-size:11.5px;color:#566663;border:1px dashed #b9c4c1;border-radius:6px;padding:4px 6px;text-align:center}
.ph-link{font-size:12.5px;color:#00796b;text-decoration:underline}
.sx-hit{outline:3px solid #f0a500!important;outline-offset:1px;background-color:rgba(255,193,7,.28)!important}
pre.insp .ln.hit{background:rgba(255,193,7,.35);outline:1px solid #f0a500;border-radius:2px}
pre.doc{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;font-size:12.5px;line-height:1.6;white-space:pre-wrap;font-family:var(--f-body)}
</style>

<script>
// Viết code mẫu trong template literal: § { (viết liền) = ${ ; ´ = dấu backtick (để code JavaScript/YAML có ${...} và `...`).
const C = (s, ...v) => String.raw(s, ...v).replace(/§\{/g, '${').replace(/´/g, '`').replace(/^\n/, '');

/* ===================== Ứng dụng Android mô phỏng: ShopDemo (page source kiểu UiAutomator2) ===================== */
const PKG = 'com.shopdemo.app', RID = n => PKG + ':id/' + n;
const N = (cls, a, kids) => ({ cls: cls.includes('.') ? cls : 'android.widget.' + cls, a: a || {}, kids: kids || [] });
const item = (name, price) => N('android.view.ViewGroup', { id:'item_container', clickable:'true' }, [N('TextView', { id:'item_name', text:name }), N('TextView', { id:'item_price', text:price }), N('Button', { id:'btn_add', text:'THÊM VÀO GIỎ', clickable:'true' })]);
const SCREENS = {
  login:{ name:'Đăng nhập', note:'sau khi bấm Đăng nhập với mật khẩu sai', act:'.LoginActivity', root: N('FrameLayout', {}, [N('LinearLayout', { id:'login_root' }, [
    N('ImageView', { id:'logo', desc:'Logo ShopDemo' }),
    N('EditText', { id:'input_username', desc:'input-username', text:'an_user', clickable:'true' }),
    N('EditText', { id:'input_password', desc:'input-password', text:'••••••••', clickable:'true', password:'true' }),
    N('Button', { id:'btn_login', text:'ĐĂNG NHẬP', clickable:'true' }),
    N('TextView', { id:'txt_error', text:'Sai tên đăng nhập hoặc mật khẩu' }),
    N('TextView', { text:'Quên mật khẩu?', clickable:'true' }),
  ])]) },
  products:{ name:'Sản phẩm', note:'đã có 2 sản phẩm trong giỏ', act:'.ProductsActivity', root: N('FrameLayout', {}, [N('LinearLayout', { id:'products_root' }, [
    N('LinearLayout', { id:'toolbar' }, [N('TextView', { id:'toolbar_title', text:'Sản phẩm' }), N('ImageButton', { id:'btn_cart', desc:'Giỏ hàng', clickable:'true' }), N('TextView', { id:'cart_badge', text:'2' })]),
    N('androidx.recyclerview.widget.RecyclerView', { id:'product_list', scrollable:'true' }, [item('Áo thun cotton', '149.000 ₫'), item('Quần jeans slim', '459.000 ₫'), item('Giày sneaker canvas', '690.000 ₫'), item('Mũ lưỡi trai', '99.000 ₫')]),
  ])]) },
};
const xesc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function toXml(n, idx){
  const a = n.a, at = { index:String(idx), package:PKG, class:n.cls, text:a.text || '', 'resource-id':a.id ? RID(a.id) : '', 'content-desc':a.desc || '', clickable:a.clickable || 'false', scrollable:a.scrollable || 'false', password:a.password || 'false', enabled:'true' };
  const s = Object.entries(at).map(([k, v]) => k + '="' + xesc(v) + '"').join(' ');
  return '<' + n.cls + ' ' + s + (n.kids.length ? '>' + n.kids.map((k, i) => toXml(k, i)).join('') + '</' + n.cls + '>' : '/>');

const docCache = {};
function screenDoc(key){
  if (!docCache[key]){
    const d = new DOMParser().parseFromString('<hierarchy rotation="0">' + toXml(SCREENS[key].root, 0) + '</hierarchy>', 'application/xml');
    let i = 0; [...d.getElementsByTagName('*')].forEach(el => { if (el.tagName !== 'hierarchy') el.setAttribute('data-sx', String(i++)); });
    docCache[key] = d;
  }
  return docCache[key];
}
const SHOWN = ['index', 'text', 'resource-id', 'content-desc'];
function sourceHtml(key){
  const lines = [];
  const walk = (el, d) => {
    const pad = '  '.repeat(d), sx = el.getAttribute('data-sx');
    const at = SHOWN.map(k => k + '="' + el.getAttribute(k) + '"').concat(['clickable', 'scrollable', 'password'].filter(k => el.getAttribute(k) === 'true').map(k => k + '="true"')).join(' ');
    const kids = [...el.children];
    lines.push('<span class="ln" data-sx="' + sx + '">' + esc(pad + '<' + el.tagName + ' ' + at + (kids.length ? '>' : '/>')) + '</span>');
    if (kids.length){ kids.forEach(k => walk(k, d + 1)); lines.push(esc(pad + '</' + el.tagName + '>')); }
  };
  const d = screenDoc(key); lines.push(esc('<hierarchy rotation="0">')); [...d.documentElement.children].forEach(k => walk(k, 1)); lines.push(esc('</hierarchy>'));
  return '<pre class="insp">' + lines.join('\n') + '</pre>';
}
function mock(el){

  mscreen:['Screen Object cho mobile (POM) và BaseScreen',
    '<p>Giống POM bên web: mỗi màn hình một class giữ <b>locator private</b> và <b>hành động</b>; test chỉ gọi hành động và assert. <code>BaseScreen</code> giữ <code>AndroidDriver</code>, <code>WebDriverWait</code> và các hàm <code>tap</code>, <code>type</code>, <code>textOf</code> đã có explicit wait.</p>',
    C`public abstract class BaseScreen {
    protected final AndroidDriver driver;
    protected final WebDriverWait wait;

    protected BaseScreen(AndroidDriver driver) {
        this.driver = driver;
        this.wait = new WebDriverWait(driver, Duration.ofSeconds(10));
    }

    protected void tap(By by) {
        wait.until(ExpectedConditions.elementToBeClickable(by)).click();
    }

    protected void type(By by, String text) {
        WebElement el = wait.until(ExpectedConditions.visibilityOfElementLocated(by));
        el.clear();
        el.sendKeys(text);
    }

    protected String textOf(By by) {
        return wait.until(ExpectedConditions.visibilityOfElementLocated(by)).getText();
    }
}`, 'java'],

  async:['Promise và async/await',

  pwassert:['Web-first assertion',

  answer:C`import io.appium.java_client.AppiumBy;
import io.appium.java_client.android.AndroidDriver;
import org.openqa.selenium.By;

public class LoginScreen extends BaseScreen {
    private final By username = AppiumBy.accessibilityId("input-username");
    private final By password = AppiumBy.accessibilityId("input-password");
    private final By loginButton = AppiumBy.id("com.shopdemo.app:id/btn_login");
    private final By error = AppiumBy.id("com.shopdemo.app:id/txt_error");

    public LoginScreen(AndroidDriver driver) {
        super(driver);
    }

    public ProductsScreen login(String user, String pass) {
        type(username, user);
        type(password, pass);
        driver.hideKeyboard();
        tap(loginButton);
        return new ProductsScreen(driver);
    }

    public String getErrorText() {
        return textOf(error);
    }
}

  answer:C`public abstract class BaseMobileTest {
    protected AndroidDriver driver;

    @BeforeMethod(alwaysRun = true)
    public void setUp() throws Exception {
        driver = MobileDriverFactory.createDriver();
    }

    @AfterMethod(alwaysRun = true)
    public void tearDown(ITestResult result) throws IOException {
        if (driver == null) return;
        try {
            if (result.getStatus() == ITestResult.FAILURE) {
                File src = driver.getScreenshotAs(OutputType.FILE);
                Path dest = Paths.get("target/screenshots", result.getName() + ".png");
                Files.createDirectories(dest.getParent());
                Files.copy(src.toPath(), dest, StandardCopyOption.REPLACE_EXISTING);
            }
        } finally {
            if (driver != null) driver.quit();
        }
    }
}

{ id:'AI3', ph:'AI', kind:'review', lang:'ts', files:'Test do Generator agent sinh: checkout.spec.ts', okMsg:'Đạt — bạn review test do AI sinh như review code của đồng nghiệp.', t:'Review test Playwright do agent sinh', learn:['agents','pwloc','pwassert'],
  need:['Đọc test bên phải do agent sinh và đánh giá từng mục: <b>Đạt</b> hay <b>Vi phạm</b>.'],
  code:C`test('checkout', async ({ page }) => {
  await page.goto('https://qa.shopdemo.test/login');
  await page.locator('#user-name').fill('an_user');
  await page.locator('#password').fill('Demo@123');
  await page.locator('#ember-1482').click();
  await page.waitForTimeout(2000);
  await page.getByRole('button', { name: 'Thêm Áo thun cotton vào giỏ' }).click();
  await page.getByTestId('cart-link').click();
  await page.getByRole('button', { name: 'Thanh toán' }).click();
  await page.getByLabel('Họ').fill('Nguyễn');
  await page.getByLabel('Tên').fill('An');
  await page.getByLabel('Mã bưu chính').fill('700000');
  await page.getByRole('button', { name: 'Hoàn tất' }).click();
  expect(await page.getByRole('heading').textContent()).toContain('Cảm ơn');
});
`,
  items:[

    ['Không chờ cố định', 1, 'Vi phạm: <code>waitForTimeout(2000)</code> — Playwright đã auto-wait; cần chờ trang thì dùng <code>await expect(page).toHaveURL(...)</code>.'],
    ['Assertion là web-first (await expect(locator)…)', 1, 'Vi phạm: <code>expect(await ….textContent())</code> chỉ đọc một lần. Viết <code>await expect(page.getByRole(\'heading\', { name: /Cảm ơn/ })).toBeVisible()</code>.'],

/* ===================== Chấm Locator Lab mobile ===================== */
const STRATS = [['accessibilityId','AppiumBy.accessibilityId'],['id','AppiumBy.id'],['uiautomator','AppiumBy.androidUIAutomator'],['className','AppiumBy.className'],['xpath','AppiumBy.xpath']];
const stratName = k => (STRATS.find(x => x[0] === k) || [k, k])[1];
const allEls = doc => [...doc.getElementsByTagName('*')].filter(e => e.tagName !== 'hierarchy');
function uiSelector(doc, v){
  const src = v.trim().replace(/;$/, '');
  const m = src.match(/^new\s+UiSelector\s*\(\s*\)((?:\s*\.\s*\w+\s*\(\s*(?:"[^"]*"|'[^']*'|true|false|\d+)\s*\))+)$/);
  if (!m) return { err:'Biểu thức UiSelector không hợp lệ — phải có dạng new UiSelector().hàm("giá trị")...' };
  const calls = [...m[1].matchAll(/\.\s*(\w+)\s*\(\s*(?:"([^"]*)"|'([^']*)'|(true|false|\d+))\s*\)/g)].map(x => [x[1], x[2] != null ? x[2] : x[3] != null ? x[3] : x[4]]);
  let els = allEls(doc), inst = null;
  const A = (e, k) => e.getAttribute(k) || '';
  for (const [fn, a] of calls){
    switch (fn){
      case 'text': els = els.filter(e => A(e, 'text') === a); break;
      case 'textContains': els = els.filter(e => A(e, 'text').includes(a)); break;
      case 'textStartsWith': els = els.filter(e => A(e, 'text').startsWith(a)); break;
      case 'textMatches': { let r; try { r = new RegExp('^(?:' + a + ')$'); } catch(e){ return { err:'textMatches: biểu thức chính quy không hợp lệ.' }; } els = els.filter(e => r.test(A(e, 'text'))); break; }
      case 'resourceId': els = els.filter(e => A(e, 'resource-id') === a); break;
      case 'description': els = els.filter(e => A(e, 'content-desc') === a); break;
      case 'descriptionContains': els = els.filter(e => A(e, 'content-desc').includes(a)); break;
      case 'className': els = els.filter(e => A(e, 'class') === a); break;
      case 'clickable': case 'scrollable': case 'enabled': els = els.filter(e => A(e, fn) === a); break;
      case 'index': els = els.filter(e => A(e, 'index') === a); break;
      case 'instance': inst = +a; break;
      default: return { err:'UiSelector không có hàm ' + fn + '().' };
    }
  }
  if (inst != null) els = els[inst] ? [els[inst]] : [];
  return { els };
}
function findMobile(doc, strat, v){
  if (!v.trim()) return { err:'Giá trị locator đang trống.' };
  const A = (e, k) => e.getAttribute(k) || '';
  switch (strat){
    case 'accessibilityId': return { els:allEls(doc).filter(e => A(e, 'content-desc') === v) };
    case 'id': {
      if (/:id\//.test(v)) return { els:allEls(doc).filter(e => A(e, 'resource-id') === v) };
      if (/[:\/]/.test(v)) return { els:[] };
      return { els:allEls(doc).filter(e => A(e, 'resource-id') === PKG + ':id/' + v) };
    }
    case 'className': return { els:allEls(doc).filter(e => A(e, 'class') === v.trim()) };
    case 'uiautomator': return uiSelector(doc, v);
    case 'xpath': {
      try {
        const r = doc.evaluate(v, doc, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null), els = [];
        for (let i = 0; i < r.snapshotLength; i++){ const n = r.snapshotItem(i); if (n.nodeType !== 1) return { err:'InvalidSelectorException: XPath phải trả về phần tử, không phải chữ hay thuộc tính.' }; els.push(n); }
        return { els };
      } catch(e){ return { err:'InvalidSelectorException: XPath không hợp lệ — kiểm tra dấu ngoặc và dấu nháy.' }; }
    }
  }
  return { err:'Chiến lược không hỗ trợ.' };
}
function gradeMloc(t, strat, v){
  const doc = screenDoc(t.screen), r = findMobile(doc, strat, v), checks = [];
  checks.push({ t:'Locator hợp lệ', ok:!r.err, why:r.err });
  if (r.err) return { pass:false, checks, els:[] };
  const els = r.els, tr = doc.evaluate(t.target, doc, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null), target = [];
  for (let i = 0; i < tr.snapshotLength; i++) target.push(tr.snapshotItem(i));
  checks.push({ t:'Khớp duy nhất 1 phần tử', ok:els.length === 1, why:els.length ? 'Đang khớp ' + els.length + ' phần tử — findElement lấy phần tử đầu tiên, dễ bấm nhầm.' : 'Không khớp phần tử nào → NoSuchElementException.' });
  checks.push({ t:'Đúng phần tử cần tìm', ok:els.length > 0 && els.length === target.length && els.every(e => target.includes(e)), why:'Phần tử khớp (tô vàng) không phải phần tử đề bài yêu cầu.' });
  if (t.only) checks.push({ t:'Dùng ' + t.only.map(stratName).join(' hoặc '), ok:t.only.includes(strat), why:'Đề bài yêu cầu chiến lược này.' });
  if (strat === 'xpath'){
    checks.push({ t:'Không dùng XPath tuyệt đối', ok:!/^\s*\(?\s*\/(?!\/)/.test(v), why:'Bắt đầu bằng một dấu / là đi từ gốc cây — thêm một view là hỏng.' });
    checks.push({ t:'Không dựa vào chỉ số vị trí', ok:!/\[\s*\d+\s*\]|position\s*\(/.test(v), why:'[3] đổi nghĩa khi danh sách được sắp xếp lại hoặc thêm phần tử.' });
  }
  if (strat === 'uiautomator') checks.push({ t:'Không chọn theo vị trí (.index / .instance)', ok:!/\.(index|instance)\s*\(/.test(v), why:'Vị trí đổi khi giao diện thêm/bớt view.' });
  return { pass:checks.every(c => c.ok), checks, els };
}

/* ===================== Chấm code (Java / TypeScript / JavaScript / YAML) ===================== */
const CLIKE = { java:1, ts:1, js:1 };
function stripC(src){
  let out = '', i = 0; const n = src.length;
  while (i < n){
    const c = src[i], d = src[i + 1];
    if (c === '/' && d === '/'){ while (i < n && src[i] !== '\n') i++; continue; }
    if (c === '/' && d === '*'){ i += 2; while (i < n && !(src[i] === '*' && src[i + 1] === '/')){ if (src[i] === '\n') out += '\n'; i++; } i += 2; out += ' '; continue; }
    if (c === '"' || c === "'" || c === '`'){ out += c; i++; while (i < n && src[i] !== c && (c === '`' || src[i] !== '\n')){ if (src[i] === '\\'){ out += src[i] + (src[i + 1] || ''); i += 2; continue; } out += src[i++]; } if (i < n && src[i] === c) out += src[i++]; continue; }
    out += c; i++;
  }
  return out;
}
const STR_RE = /"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`/g;
const maskStr = s => s.replace(STR_RE, m => m[0] + m.slice(1, -1).replace(/[^\n]/g, ' ') + m[0]);
function balance(s){
  const m = maskStr(s), st = [], pair = { ')':'(', ']':'[', '}':'{' }; let line = 1;
  for (const ch of m){
    if (ch === '\n') line++;
    if ('([{'.includes(ch)) st.push([ch, line]);
    else if (pair[ch]){ if (!st.length || st[st.length - 1][0] !== pair[ch]) return 'Dấu ' + ch + ' ở dòng ' + line + ' không khớp với dấu mở nào.'; st.pop(); }
  }
  if (/["`]/.test(s.replace(STR_RE, ''))) return 'Có chuỗi chưa đóng dấu nháy.';
  return st.length ? 'Thiếu dấu đóng cho “' + st[st.length - 1][0] + '” mở ở dòng ' + st[st.length - 1][1] + '.' : '';
}
function matchBrace(m, open){ let d = 0; for (let i = open; i < m.length; i++){ if (m[i] === '{') d++; else if (m[i] === '}'){ d--; if (!d) return i; } } return -1; }
function bodyFrom(s, m, from){
  let i = from;
  while (i < m.length && /\s/.test(m[i])) i++;
  if (m[i] === '('){ let d = 0; for (; i < m.length; i++){ if (m[i] === '(') d++; else if (m[i] === ')'){ d--; if (!d){ i++; break; } } } }
  const o = m.indexOf('{', i); if (o < 0) return null;
  const c = matchBrace(m, o); return c < 0 ? null : s.slice(o, c + 1);
}
function annotatedBodies(s, re){
  const m = maskStr(s), g = new RegExp(re.source, 'g'), out = []; let x;
  while ((x = g.exec(m))){ const b = bodyFrom(s, m, x.index + x[0].length); if (b != null) out.push(b); }
  return out;
}
function yamlCheck(src){
  const lines = src.split('\n');
  for (let i = 0; i < lines.length; i++){
    if (/\t/.test(lines[i])) return 'Dòng ' + (i + 1) + ' có ký tự tab — YAML chỉ thụt lề bằng dấu cách.';
    const ind = lines[i].match(/^( *)\S/); if (ind && ind[1].length % 2) return 'Dòng ' + (i + 1) + ' thụt lề ' + ind[1].length + ' dấu cách — dùng bội số của 2 cho thẳng hàng.';
  }
  return '';
}
function stripCode(src, lang){
  if (lang === 'yaml') return src.split('\n').map(l => l.replace(/(^|\s)#.*$/, '')).join('\n');
  return stripC(src);
}
function evalRule(r, s){
  if (r.each){ const bodies = annotatedBodies(s, r.each); return bodies.length > 0 && bodies.every(b => r.re.test(b)); }
  if (r.fn){ const ok = !!r.fn(s); return r.not ? !ok : ok; }
  if (r.min){ const g = new RegExp(r.re.source, r.re.flags.includes('g') ? r.re.flags : r.re.flags + 'g'); return (s.match(g) || []).length >= r.min; }
  const hit = r.re.test(s);
  return r.not ? !hit : hit;
}
function gradeCode(t, src){
  const s = stripCode(src, t.lang), checks = [];
  const syn = t.lang === 'yaml' ? yamlCheck(src) : balance(s);
  checks.push({ t:t.lang === 'yaml' ? 'YAML thụt lề hợp lệ' : 'Cú pháp: ngoặc và dấu nháy cân bằng', ok:!syn, why:syn });
  t.rules.forEach(r => { let ok; try { ok = evalRule(r, s); } catch(e){ ok = false; } checks.push({ t:r.t, ok, why:r.why }); });
  return { pass:checks.every(c => c.ok), checks };
}

const STORE = 'advqc.v1';
let S = { done:{}, current:'I1', code:{}, loc:{}, quiz:{}, rev:{}, self:{}, tries:{} };

const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch(e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const cur = () => TICKETS.find(t => t.id === S.current) || TICKETS[0];
const phaseOf = t => PHASES.find(p => p.k === t.ph);

/* ===================== Tô màu ===================== */
const KW = {
  java:new Set('abstract boolean break case catch class default do double else extends final finally for if implements import int interface long new null package private protected public return static super switch this throw throws true false try void while var byte char float short'.split(' ')),
  ts:new Set('abstract as async await break case catch class const continue default delete do else enum export extends false finally for from function if implements import in instanceof interface let new null of private protected public readonly return static super switch this throw true try type typeof undefined var void while'.split(' ')),
};
function hlC(src, lang){
  const kw = KW[lang === 'java' ? 'java' : 'ts'];
  let out = '', i = 0; const n = src.length, span = (c, s) => '<span class="hl-' + c + '">' + esc(s) + '</span>';
  while (i < n){
    const c = src[i];
    if (c === '/' && src[i + 1] === '/'){ let j = src.indexOf('\n', i); if (j < 0) j = n; out += span('c', src.slice(i, j)); i = j; continue; }
    if (c === '/' && src[i + 1] === '*'){ let j = src.indexOf('*/', i + 2); j = j < 0 ? n : j + 2; out += span('c', src.slice(i, j)); i = j; continue; }
    if (c === '"' || c === "'" || c === '`'){ let j = i + 1; while (j < n && src[j] !== c && (c === '`' || src[j] !== '\n')){ if (src[j] === '\\') j++; j++; } out += span('s', src.slice(i, Math.min(j + 1, n))); i = j + 1; continue; }
    if (lang === 'java' && c === '@' && /[A-Za-z]/.test(src[i + 1] || '')){ let j = i + 1; while (j < n && /\w/.test(src[j])) j++; out += span('a', src.slice(i, j)); i = j; continue; }
    if (/[0-9]/.test(c) && !/[\w$]/.test(src[i - 1] || '')){ let j = i; while (j < n && /[0-9._]/.test(src[j])) j++; out += span('n', src.slice(i, j)); i = j; continue; }
    if (/[A-Za-z_$]/.test(c)){ let j = i; while (j < n && /[\w$]/.test(src[j])) j++; const w = src.slice(i, j); out += kw.has(w) ? span('k', w) : esc(w); i = j; continue; }
    out += esc(c); i++;
  }
  return out;
}
function hlYaml(src){
  return src.split('\n').map(l => {
    const ci = l.search(/(^|\s)#/), code = ci >= 0 ? l.slice(0, ci) : l, cm = ci >= 0 ? l.slice(ci) : '';
    const c = esc(code).replace(/^(\s*-?\s*)([\w.\/-]+)(:)/, '$1<span class="hl-at">$2</span>$3').replace(/('[^']*')/g, '<span class="hl-s">$1</span>');
    return c + (cm ? '<span class="hl-c">' + esc(cm) + '</span>' : '');
  }).join('\n');
}
function hlSh(src){ return src.split('\n').map(l => { const ci = l.search(/(^|\s)#/); return ci >= 0 ? esc(l.slice(0, ci)) + '<span class="hl-c">' + esc(l.slice(ci)) + '</span>' : esc(l); }).join('\n'); }
const hl = (src, lang) => lang === 'yaml' ? hlYaml(src) : lang === 'sh' ? hlSh(src) : lang === 'text' ? esc(src) : hlC(src, lang);

function renderQueue(){
  let lastGd = '';
  $('queue').innerHTML = PHASES.map(p => {
    const ts = TICKETS.filter(t => t.ph === p.k), d = ts.filter(t => S.done[t.id]).length;
    const gdh = p.gd !== lastGd ? '<div class="phase"><h2 style="color:var(--accent)">' + esc(GD[p.gd]) + '</h2></div>' : ''; lastGd = p.gd;
    return gdh + '<div class="phase"><h2>' + esc(p.name) + '<span>' + d + '/' + ts.length + '</span></h2>' + ts.map(t =>
      '<button type="button" class="qitem' + (S.done[t.id] ? ' done' : '') + '" data-id="' + t.id + '"' + (t.id === S.current ? ' aria-current="true"' : '') + '><span class="dot"></span><span><span class="k">' + t.id + ' · ' + KIND[t.kind] + '</span><span class="t">' + esc(t.t) + '</span></span></button>').join('') + '</div>';
  }).join('');
  $('queue').querySelectorAll('.qitem').forEach(b => b.onclick = () => openTicket(b.dataset.id));
  const n = TICKETS.filter(t => S.done[t.id]).length;
  $('progText').textContent = n + '/' + TICKETS.length + ' bài';
  $('progBar').style.width = (n / TICKETS.length * 100) + '%';
}

/* ===================== Đề bài ===================== */
function renderTicket(){

  let h = '<div class="tk-head"><span class="tk-key">' + t.id + '</span><span class="chip acc">' + KIND[t.kind] + '</span><span class="chip">Buổi ' + p.bus + '</span>' +
    (t.cp ? '<span class="chip cp">' + esc(t.cp) + '</span>' : '') + (S.done[t.id] ? '<span class="chip ok">Đã xong</span>' : '') + '</div>' +
    '<h2 class="title">' + esc(t.t) + '</h2>' +
    (S.done[t.id] ? '<div class="donebox">✓ Bạn đã hoàn thành bài này. Có thể làm lại để ôn.</div>' : '') +
    '<div class="field"><h3>Yêu cầu</h3><div class="expect"><ul>' + t.need.map(x => '<li>' + x + '</li>').join('') + '</ul></div></div>';
  if (t.learn && t.learn.length){
    h += '<div class="field"><h3>Kiến thức cần dùng</h3><div class="lesson">' + t.learn.map((k, i) => { const L = LESSONS[k];
      return '<details class="kw"' + (i === 0 && !S.done[t.id] ? ' open' : '') + '><summary>' + esc(L[0]) + '</summary><div class="kw-body">' + L[1] + (L[2] ? '<pre class="syn">' + hl(L[2], L[3]) + '</pre>' : '') + '</div></details>'; }).join('') + '</div></div>';
  }
  if (t.hints && t.hints.length){
    h += '<div class="field"><h3>Gợi ý</h3><div class="hints">' + t.hints.slice(0, sh).map((x, i) => '<div class="hint"><b>Gợi ý ' + (i + 1) + '</b>' + x + '</div>').join('') + '</div>' +
      (sh < t.hints.length ? '<button type="button" class="linkbtn" id="moreHint">Xem gợi ý ' + (sh + 1) + '/' + t.hints.length + '</button>' : '') + '</div>';
  }
  h += '<div class="field" style="display:flex;gap:8px">' + (idx > 0 ? '<button type="button" class="btn" id="prevT">← ' + TICKETS[idx - 1].id + '</button>' : '') + (idx < TICKETS.length - 1 ? '<button type="button" class="btn" id="nextT">' + TICKETS[idx + 1].id + ' →</button>' : '') + '</div>';
  $('ticket').innerHTML = h;
  if ($('moreHint')) $('moreHint').onclick = () => { hintsShown[t.id] = sh + 1; renderTicket(); };
  if ($('prevT')) $('prevT').onclick = () => openTicket(TICKETS[idx - 1].id);
  if ($('nextT')) $('nextT').onclick = () => openTicket(TICKETS[idx + 1].id);
}
function markDone(t){
  if (!S.done[t.id]){ S.done[t.id] = true; save(); renderQueue(); renderTicket(); }
}
const nextBtn = t => { const i = TICKETS.indexOf(t); return i < TICKETS.length - 1 ? ' <button type="button" class="btn" data-next="' + TICKETS[i + 1].id + '">Bài tiếp theo: ' + TICKETS[i + 1].id + ' →</button>' : ''; };
function checksHtml(g, okMsg){
  return '<div class="res"><div class="verdict ' + (g.pass ? 'ok' : 'no') + '">' + (g.pass ? okMsg : 'Chưa đạt: ' + g.checks.filter(c => !c.ok).length + ' tiêu chí cần sửa') + '</div>' +
    g.checks.map(c => '<div class="chk ' + (c.ok ? 'ok' : 'no') + '"><span class="ic">' + (c.ok ? '✓' : '✗') + '</span><span>' + esc(c.t) + (!c.ok && c.why ? '<span class="why">' + esc(c.why) + '</span>' : '') + '</span></div>').join('') + '</div>';
}
function wireNext(root){ root.querySelectorAll('[data-next]').forEach(b => b.onclick = () => openTicket(b.dataset.next)); }

/* ===================== Khu làm bài ===================== */
function renderWork(){
  const t = cur(), w = $('work');
  ({ mloc:workMloc, code:workCode, quiz:workQuiz, review:workReview, self:workSelf })[t.kind](t, w);
  wireNext(w);
}
let locView = 'screen';
function workMloc(t, w){
  const st = S.loc[t.id] || { s:(t.only || ['accessibilityId'])[0], v:'' }, sc = SCREENS[t.screen];
  w.innerHTML = '<div class="toolbar"><span class="ttl">Locator Lab mobile · ' + esc(sc.name) + '</span><button type="button" class="btn primary" id="findBtn">findElement (Enter)</button></div>' +
    '<div class="sec"><h4>Locator</h4><div class="locrow"><span class="pre">driver.findElement(</span><select id="strat" aria-label="Chiến lược tìm">' + STRATS.map(s => '<option value="' + s[0] + '"' + (s[0] === st.s ? ' selected' : '') + '>' + s[1] + '</option>').join('') + '</select><input id="locv" aria-label="Giá trị locator" placeholder="giá trị locator" value="' + esc(st.v) + '" spellcheck="false" autocomplete="off"><span class="pre">)</span></div></div>' +
    '<div class="sec" id="locres"><p class="msg">Nhập locator rồi bấm <b>findElement</b>. Phần tử khớp được tô vàng trên màn hình và trong page source.</p></div>' +
    '<div class="sec"><div class="vtabs" role="tablist"><button type="button" role="tab" data-v="screen" aria-selected="' + (locView === 'screen') + '">Màn hình</button><button type="button" role="tab" data-v="src" aria-selected="' + (locView === 'src') + '">Page source (Inspector)</button></div>' +
    '<div id="vScreen"' + (locView === 'screen' ? '' : ' hidden') + '><p class="msg" style="margin-bottom:8px">' + esc(PKG + sc.act) + ' · ' + esc(sc.note) + '</p><div class="phone" id="phone"><div class="sb"><span>9:41</span><span>ShopDemo</span></div>' + mock(screenDoc(t.screen).documentElement.firstElementChild) + '</div></div>' +
    '<div id="vSrc"' + (locView === 'src' ? '' : ' hidden') + '>' + sourceHtml(t.screen) + '</div></div>';
  w.querySelectorAll('.vtabs button').forEach(b => b.onclick = () => { locView = b.dataset.v; w.querySelectorAll('.vtabs button').forEach(x => x.setAttribute('aria-selected', String(x === b))); $('vScreen').hidden = locView !== 'screen'; $('vSrc').hidden = locView !== 'src'; });
  const run = () => {
    const s = $('strat').value, v = $('locv').value; S.loc[t.id] = { s, v, ran:true }; save();
    const g = gradeMloc(t, s, v);
    w.querySelectorAll('.sx-hit, .ln.hit').forEach(e => e.classList.remove('sx-hit', 'hit'));
    g.els.forEach(e => { const k = e.getAttribute('data-sx'); w.querySelectorAll('#phone [data-sx="' + k + '"]').forEach(x => x.classList.add('sx-hit')); w.querySelectorAll('.ln[data-sx="' + k + '"]').forEach(x => x.classList.add('hit')); });
    const tags = g.els.slice(0, 8).map(e => '<' + e.tagName + ' text="' + e.getAttribute('text') + '" resource-id="' + e.getAttribute('resource-id') + '" content-desc="' + e.getAttribute('content-desc') + '">');
    const code = 'driver.findElement(' + stratName(s) + '("' + v.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"))';
    $('locres').innerHTML = '<p class="found">' + esc(code) + '</p>' + (g.els.length ? '<p class="msg" style="margin:6px 0">Khớp ' + g.els.length + ' phần tử:</p><div class="found">' + tags.map(esc).join('\n') + (g.els.length > 8 ? '\n…' : '') + '</div>' : '') +
      '<div style="margin-top:8px">' + checksHtml(g, 'Đạt — locator ổn định và trỏ đúng phần tử.' + nextBtn(t)) + '</div>';
    wireNext($('locres'));
    if (g.pass) markDone(t);
  };
  $('findBtn').onclick = run;
  $('locv').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); run(); } });
  if (st.ran) run();
}
const FILE = { java:'Java', ts:'TypeScript', js:'JavaScript (k6)', yaml:'YAML' };
function workCode(t, w){
  const src = S.code[t.id] != null ? S.code[t.id] : t.starter, tries = S.tries[t.id] || 0;
  w.innerHTML = '<div class="toolbar"><span class="ttl">' + FILE[t.lang] + (t.snippet ? ' · đoạn code trong class test' : '') + '</span><button type="button" class="btn" id="resetBtn">Đặt lại</button><button type="button" class="btn" id="ansBtn"' + (tries || S.done[t.id] ? '' : ' disabled title="Mở sau lần chấm đầu tiên"') + '>Đáp án mẫu</button><button type="button" class="btn primary" id="gradeBtn">Chấm bài (Ctrl+Enter)</button></div>' +
    '<textarea class="editor" id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Trình soạn code"></textarea>' +
    '<div class="sec" id="coderes">' + (lastRes[t.id] || '<p class="msg">Viết code rồi bấm <b>Chấm bài</b>. Bài được chấm theo tiêu chí của buổi học bằng cách đọc cấu trúc code (không chạy thiết bị hay trình duyệt thật).</p>') + '</div>' +
    '<div class="sec" id="ansBox" hidden></div>';
  const ed = $('ed'); ed.value = src;
  let tm; ed.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { S.code[t.id] = ed.value; save(); }, 300); });
  const grade = () => {
    S.code[t.id] = ed.value; S.tries[t.id] = (S.tries[t.id] || 0) + 1; save();
    const g = gradeCode(t, ed.value);
    const html = checksHtml(g, 'Đạt tất cả tiêu chí.' + nextBtn(t));
    lastRes[t.id] = html; $('coderes').innerHTML = html; wireNext($('coderes'));
    $('ansBtn').disabled = false; $('ansBtn').removeAttribute('title');
    if (g.pass) markDone(t);
  };
  ed.addEventListener('keydown', e => {
    if (e.key === 'Tab' && !e.shiftKey){ e.preventDefault(); ed.setRangeText(t.lang === 'java' ? '    ' : '  ', ed.selectionStart, ed.selectionEnd, 'end'); ed.dispatchEvent(new Event('input')); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); grade(); }
  });
  $('gradeBtn').onclick = grade;
  $('resetBtn').onclick = () => { if (ed.value !== t.starter && !confirm('Xóa code đang viết và quay về code ban đầu?')) return; ed.value = t.starter; S.code[t.id] = t.starter; save(); };
  $('ansBtn').onclick = () => { const b = $('ansBox'); b.hidden = !b.hidden; b.innerHTML = '<h4>Đáp án mẫu — đọc, so sánh, rồi tự gõ lại theo cách hiểu của bạn</h4><pre class="syn">' + hl(t.answer, t.lang) + '</pre>'; };
}
function workQuiz(t, w){
  const ans = S.quiz[t.id] || {}, sub = ans.sub;
  w.innerHTML = '<div class="toolbar"><span class="ttl">' + t.qs.length + ' câu hỏi</span><button type="button" class="btn primary" id="qSubmit">Nộp bài</button></div><div class="sec quiz">' +
    t.qs.map((q, i) => '<div class="qq"><p class="q">Câu ' + (i + 1) + '. ' + q.q + '</p>' + q.o.map((o, j) => {
      const sel = ans.a && ans.a[i] === j, cls = sub ? (j === q.a && sel ? ' right' : sel ? ' wrong' : '') : '';
      return '<label class="opt' + cls + '"><input type="radio" name="q' + i + '" value="' + j + '"' + (sel ? ' checked' : '') + '><span>' + esc(o) + '</span></label>'; }).join('') +
      (sub ? '<p class="expl">' + (ans.a && ans.a[i] === q.a ? '✓ Đúng. ' : '✗ Chưa đúng. ') + esc(q.w) + '</p>' : '') + '</div>').join('') +
    '<div id="qRes"></div></div>';
  w.querySelectorAll('input[type=radio]').forEach(r => r.onchange = () => { const a = (S.quiz[t.id] && S.quiz[t.id].a) || []; a[+r.name.slice(1)] = +r.value; S.quiz[t.id] = { a, sub:false }; save(); });
  if (sub){ const right = t.qs.filter((q, i) => ans.a[i] === q.a).length; showQuizRes(t, right); }
  $('qSubmit').onclick = () => {
    const a = (S.quiz[t.id] && S.quiz[t.id].a) || [];
    if (t.qs.some((q, i) => a[i] == null)){ $('qRes').innerHTML = '<p class="msg">Còn câu chưa chọn đáp án.</p>'; return; }
    S.quiz[t.id] = { a, sub:true }; save();
    if (t.qs.every((q, i) => a[i] === q.a)) markDone(t);
    workQuiz(t, w);
  };
}
function showQuizRes(t, right){
  const ok = right === t.qs.length;
  $('qRes').innerHTML = '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + right + '/' + t.qs.length + ' câu đúng' + (ok ? ' — đạt.' + nextBtn(t) : ' — đọc giải thích ở câu tô đỏ, chọn lại rồi nộp lần nữa.') + '</div>';
  wireNext($('qRes'));
}
function workReview(t, w){
  const st = S.rev[t.id] || { a:[], sub:false }, L = t.labels || ['Đạt', 'Vi phạm'], n = t.items.length;
  w.innerHTML = '<div class="toolbar"><span class="ttl">' + esc(t.files) + '</span><button type="button" class="btn primary" id="rvSubmit">Nộp đánh giá</button></div>' +
    '<div class="sec"><pre class="' + (t.lang === 'text' ? 'doc' : 'syn') + '">' + hl(t.code, t.lang) + '</pre></div><div class="sec"><h4>Checklist ' + n + ' mục</h4><div class="res">' +
    t.items.map((it, i) => { const v = st.a[i], cls = st.sub ? (v === it[1] ? ' right' : ' wrong') : '';
      return '<div class="rv' + cls + '"><span>' + (i + 1) + '. ' + esc(it[0]) + '</span><span class="seg"><button type="button" data-i="' + i + '" data-v="0" aria-pressed="' + (v === 0) + '">' + L[0] + '</button><button type="button" data-i="' + i + '" data-v="1" aria-pressed="' + (v === 1) + '">' + L[1] + '</button></span>' +
        (st.sub && (v !== it[1] || st.all) ? '<span class="ex">' + it[2] + '</span>' : '') + '</div>'; }).join('') + '</div><div id="rvRes" style="margin-top:10px"></div></div>';
  w.querySelectorAll('.seg button').forEach(b => b.onclick = () => { st.a[+b.dataset.i] = +b.dataset.v; st.sub = false; S.rev[t.id] = st; save(); workReview(t, w); });
  if (st.sub){ const right = t.items.filter((it, i) => st.a[i] === it[1]).length;
    $('rvRes').innerHTML = '<div class="verdict ' + (st.all ? 'ok' : 'no') + '">' + right + '/' + n + ' mục đánh giá đúng' + (st.all ? ' — ' + esc(t.okMsg || 'đạt.') + nextBtn(t) : ' — đọc giải thích ở các mục tô đỏ rồi đánh giá lại.') + '</div>'; wireNext($('rvRes')); }
  $('rvSubmit').onclick = () => {
    if (t.items.some((it, i) => st.a[i] == null)){ $('rvRes').innerHTML = '<p class="msg">Còn mục chưa đánh giá.</p>'; return; }
    st.sub = true; st.all = t.items.every((it, i) => st.a[i] === it[1]); S.rev[t.id] = st; save();
    if (st.all) markDone(t);
    workReview(t, w);
  };
}
function workSelf(t, w){
  const st = S.self[t.id] || [], bus = phaseOf(t).bus;
  w.innerHTML = '<div class="toolbar"><span class="ttl">Tự kiểm tra bài nộp</span></div><div class="sec res">' +
    t.items.map((x, i) => '<label class="selfck"><input type="checkbox" data-i="' + i + '"' + (st[i] ? ' checked' : '') + '><span>' + esc(x) + '</span></label>').join('') + '<div id="selfRes"></div></div>';
  const upd = () => { const all = t.items.every((x, i) => st[i]);
    $('selfRes').innerHTML = all ? '<div class="verdict ok">Đã đủ các mục của bài nộp buổi ' + bus + '.' + nextBtn(t) + '</div>' : '<p class="msg">' + t.items.filter((x, i) => st[i]).length + '/' + t.items.length + ' mục đã xong.</p>';
    wireNext($('selfRes'));
    if (all) markDone(t); else if (S.done[t.id]){ delete S.done[t.id]; save(); renderQueue(); renderTicket(); } };
  w.querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = () => { st[+c.dataset.i] = c.checked; S.self[t.id] = st; save(); upd(); });
  upd();
}

/* ===================== Tự kiểm tra dữ liệu bài (gọi advSelfTest() trong console) ===================== */
function advSelfTest(){
  const bad = [], seen = {};
  TICKETS.forEach(t => {
    if (seen[t.id]) bad.push(t.id + ': trùng id'); seen[t.id] = 1;
    if (!PHASES.some(p => p.k === t.ph)) bad.push(t.id + ': ph không tồn tại');
    if (t.kind === 'mloc'){
      const d = screenDoc(t.screen), r = d.evaluate(t.target, d, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null);
      if (r.snapshotLength !== 1) bad.push(t.id + ': target khớp ' + r.snapshotLength + ' phần tử');
      (t.ans || []).forEach(a => { const g = gradeMloc(t, a[0], a[1]); if (!g.pass) bad.push(t.id + ' ans ' + a.join(' ') + ' → ' + g.checks.filter(c => !c.ok).map(c => c.t).join('; ')); });
      (t.bad || []).forEach(a => { if (gradeMloc(t, a[0], a[1]).pass) bad.push(t.id + ' bad passes: ' + a.join(' ')); });
    }
    if (t.kind === 'code'){
      const g = gradeCode(t, t.answer); if (!g.pass) bad.push(t.id + ' answer fails: ' + g.checks.filter(c => !c.ok).map(c => c.t + (c.why ? ' (' + c.why + ')' : '')).join('; '));
      if (gradeCode(t, t.starter).pass) bad.push(t.id + ' starter passes');
      (t.wrong || []).forEach((x, i) => { if (gradeCode(t, x).pass) bad.push(t.id + ' wrong#' + i + ' passes'); });
    }
    if (t.kind === 'quiz') t.qs.forEach((q, i) => { if (q.a == null || q.a >= q.o.length) bad.push(t.id + ' q' + i + ' đáp án sai chỉ số'); });
    if (t.kind === 'review') t.items.forEach((it, i) => { if (it[1] !== 0 && it[1] !== 1) bad.push(t.id + ' item' + i); });
    (t.learn || []).forEach(k => { if (!LESSONS[k]) bad.push(t.id + ': thiếu bài học ' + k); });
  });
  return bad.length ? bad : 'all ok (' + TICKETS.length + ' bài)';
}

/* ===================== Điều khiển chung ===================== */
function openTicket(id){
  if (!TICKETS.some(t => t.id === id)) id = TICKETS[0].id;
  S.current = id; save();
  renderQueue(); renderTicket(); renderWork();
  $('ticket').scrollTop = 0; $('work').scrollTop = 0;
  const q = $('queue').querySelector('[aria-current="true"]'); if (q && q.scrollIntoView) q.scrollIntoView({ block:'nearest' });
  try { if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id); } catch(e) {}
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TICKETS.some(t => t.id === h) && h !== S.current) openTicket(h); });
$('themeBtn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('advqc.theme', root.dataset.theme); } catch(e) {}
};
try { const th = localStorage.getItem('advqc.theme'); if (th) document.documentElement.dataset.theme = th; } catch(e) {}
openTicket(TICKETS.some(t => t.id === location.hash.slice(1)) ? location.hash.slice(1) : S.current);
</script>
